ngle-objective plots): <AC58>Figures 1, 6-10 are there just to aid in terms of intuition<\/AC58>, so <AC59>we opted for the simple choice of single objective.<\/AC59> <AC60>We agree this intuition should be used with caution in the multi-objective case<\/AC60>, but <AC61>we still believe that the plots can be useful to illustrate some differences between MES, PES, and JES.<\/AC61>\n\n- Q10 (several metrics): We completely agree and <AC62>this was our motivation for including additional visualizations of the Pareto front and performance results over the different regions of the objective space (Appendix J5 and J6).<\/AC62>\n\nTypos:\n\n<AC63>All typos have been corrected<\/AC63>, many thanks for spotting.\n Global/general Response:\n```\nWe thank all the reviewers for their comments and the effort to assess our paper. <AC64>In our revised manuscript, we have addressed the most common and important points<\/AC64>:\n\n- <AC65>We have clarified that the modification to the noiseless conditional entropy estimate was meant as an ad hoc adjustment to account for the amount of exploration when there is observation noise.<\/AC65> As <AC66>this result caused some confusion<\/AC66>, <AC67>we have relegated it to Appendix D in favour of emphasizing our main result in Prop. 2 (previously Prop. 3), which gives a more principled and better performing estimate.<\/AC67>\n\n- <AC68>We have further emphasised the connection to existing work in the main text.<\/AC68>\n\n- <AC69>We have provided error bars in the plots.<\/AC69>\n\n- <AC70>We have added an in-sample standard hypervolume comparison (Appendix J.4) as requested by one of the reviewers.<\/AC70>\n\n- <AC71>We have augmented the discussion of the experiments with additional points raised by the reviewers.<\/AC71>\n\n- <AC72>We have sorted all typos and minor errors.<\/AC72>\n\nBelow we provide a point-by-point response to each reviewer separately.\n```"}, {"message_id": "Reviewer_ucDe · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Response\nThank you for the detailed response.\n\n<AC1>Most of my concerns were addressed, especially from a presentation perspective.<\/AC1>\n\nThe parts that I still disagree with/were not addressed are the following:\n\n* <AC2>The acronyms of different algorithm names would not be problematic in the general case<\/AC2>; however, <AC3>in this specific case, PES and MES actually refer to two famous acquisition functions for single objective optimization<\/AC3>, so <AC4>I still think this should be changed across the paper.<\/AC4> <AC5>Adding two letters for each acronym will not complicate anything and will serve the context.<\/AC5> <AC6>This is especially true for this paper, where there are plots involving single objective experiments.<\/AC6>\n\n* <AC7>DGEMO was compared to qNEHVI only in the noisy setting while it was not built to support the noisy setting.<\/AC7> <AC8>This means that it is not expected to perform well.<\/AC8> <AC9>This does not mean that it will not outperform other algorithms in the non-noisy setting.<\/AC9> <AC10>DGEMO is a very strong baseline, recent and relevant.<\/AC10> <AC11>I believe it is very common to compare methods that are not necessarily built with the same library<\/AC11>, <AC12>most papers do not reimplement other baselines from scratch.<\/AC12>\n\n > The algorithm is valid for both the single-objective and multi-objective setting as can be a random vector-valued function with M components. This is registered at the beginning of Section 2.\n\n* <AC13>I totally disagree with this statement.<\/AC13> <AC14>The inequality relationship in the case of a single objective and multi-objective are totally different.<\/AC14> <AC15>This has been already shown and discussed in the extension of MES to MESMO and PFES and also PES to PESMO.<\/AC15> So <AC16>assuming that this is straightforward is concerning.<\/AC16>"}, {"message_id": "Reviewer_ucDe · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Response\nThank you for your reply. <AC1>We will further clarify the difference between the single-objective and multi-objective problem in the paper.<\/AC1> <AC2>As pointed out by the reviewer, we use the Pareto partial ordering in the multi-objective setting and the standard total ordering in the single-objective setting.<\/AC2> <AC3>Computationally, the main difference occurs when computing the region of integration.<\/AC3> <AC4>Specifically, in the single-objective setting, the box-decomposition of the dominated region (Step 4 of Alg 1) is (-infty, y*], where y* is the maximum.<\/AC4>"}, {"message_id": "Reviewer_ucDe · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I appreciate the fruitful discussion with the author, <AC1>which has positively impacted the strength of this work.<\/AC1>"}]}]}, {"paper_id": "kHeotl7q9dU", "decision": "Accept", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>The paper studies the problem of retrieving code snippets given textual queries (NS3, Neuro-Symbolic Semantic Code Search).<\/AC1> <AC2>The work is motivated by language models’ limitations on encoding longer and not providing a faithful explanation of their reasoning on compositional queries.<\/AC2> <AC3>NS3 supplements the query sentence with a layout of its semantic structure, which is then used to break down the final reasoning decision into a series of lower-level decisions.<\/AC3> <AC4>NS3 outperforms baselines on CodeSearchNet and CoSQA.<\/AC4>\n\nOverall, <AC5>the reviewers liked the motivation of the work.<\/AC5> <AC6>A lot of concerns have been raised with extensive responses from the authors.<\/AC6> <AC7>Some of these concerns remain<\/AC7> and <AC8>have to be acknowledged and clarified in the modified document.<\/AC8> **<AC9>Despite the limitations of the work, I think \"accepting\" this work outweighs \"rejecting\" it, assuming that the authors will put due diligence into improving their drafts based on their latest experiments (outlined in the author's response), along with a clear discussion of their limitations.<\/AC9>**\n\nLet me start with the strengths:\n\n - <AC10>All reviewers have found the work interesting.<\/AC10>\n\n - Strong empirical results: <AC11>NS3 is evaluated on two well-established benchmarks, CodeSearchNet and CoSQA.<\/AC11> <AC12>The empirical result is very strong.<\/AC12> <AC13>The proposed method, NS3, outperforms state-of-the-art by a large margin.<\/AC13>\n\n - <AC14>The paper includes detailed experiments on reduced dataset settings and ablation studies.<\/AC14>\n\nHere are several points of concern that came up in the reviews:\n\n - <AC15>NS3 requires rule-based parsing of natural languages (unlike other LM-based baselines such as CodeBERT).<\/AC15> <AC16>The difficulty of this construction (\"roughly two weeks\") brings up several concerns<\/AC16>:\n  - <AC17>These rules might not generalize to different programming languages (e.g. Python to C++)<\/AC17>: <AC18>on this point, the authors have reported some evidence of generalization though the reviewer \"kn2F\" has viewed it as \"low (<=41%)\" and not convinced.<\/AC18> <AC19>I suggest the authors report these analyses in their main draft.<\/AC19> <AC20>I suspect these numbers need to be compared with the corresponding numbers of their end-to-end baselines.<\/AC20>\n  - <AC21>These rules might not transferrable to different **natural** languages.<\/AC21> <AC22>The authors have acknowledged this limitation.<\/AC22> <AC23>I suggest the authors be explicit about such limitations in their work.<\/AC23>\n  - <AC24>These rules might not generalize to longer queries<\/AC24>; <AC25>this is acknowledged in the author's response.<\/AC25> <AC26>I suggest the authors be upfront about these issues in their draft.<\/AC26>\n\nconfidence: Less certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_FqUC", "rating": [5, 5], "messages": [{"message_id": "Reviewer_FqUC · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper studies the problem of retrieving code snippets given textual queries (called semantic code search).<\/AC1> <AC2>The work is motivated by language models’ limitations on encoding longer and compositional text<\/AC2> (<AC3>which I question a bit about<\/AC3>, see my comments below). <AC4>The authors propose a neural module network (called NS3)<\/AC4> and <AC5>introduce a modular workflow according to the semantic structure of the query.<\/AC5> <AC6>More specifically, NS3 contains two types of neural modules, entity discovery module, and action module, to estimate the semantic relatedness of code tokens and entity mentions and actions in a query separately.<\/AC6> <AC7>It decomposes the task into multiple steps of matching each data entity and action in the query.<\/AC7> <AC8>The authors demonstrate the effectiveness of the proposed method on several code search benchmarks<\/AC8> and <AC9>show that their method outperforms some strong baselines in some settings<\/AC9> (<AC10>on which I’m a bit confused<\/AC10>).\n\nstrengths_and_weaknesses: Strengths:\n\n<AC11>The problem of semantic code search is very interesting.<\/AC11> <AC12>It is easy to follow the writing of the paper.<\/AC12> <AC13>The authors compare the proposed methods with other works and show strong performance on multiple code search benchmarks.<\/AC13>\n\nWeaknesses:\n\n<AC14>The authors mention that one of the main motivations of the work is because language models struggle with encoding long and compositional text.<\/AC14> <AC15>I’m a bit suspicious.<\/AC15> <AC16>Text queries as examples shown in the paper (but not just these examples, generally speaking) are not very long and complicated.<\/AC16> <AC17>Some of them are even too simple and ignore some details<\/AC17>, <AC18>which leads to mismatching between the query and code (which could be the real challenge).<\/AC18> <AC19>Language models are able to encode much more complex and longer texts than these examples in the paper….<\/AC19>\n\n<AC20>According to what the authors say in lines 265-266, CodeBERT and many other simpler approaches can be fed examples in batches<\/AC20>, <AC21>which make them much faster in retrieval settings.<\/AC21> <AC22>In real-world retrieval settings, efficiency is also a very important consideration.<\/AC22> <AC23>In this case, the proposed method NS3 is less attractive (also depending on other methods such as CodeBERT).<\/AC23> <AC24>This makes NS3 look more like a re-ranking model instead of a fully actionable code retrieval model.<\/AC24>\n\n<AC25>The query parser implementation seems to be a lot of human work (e.g., building a vocab of action and entity words).<\/AC25>\n\nquestions: Line 246-248: <AC26>I’m confused about the evaluation data statistics.<\/AC26> <AC27>Is it a common practice to exclude unparsable examples for evaluation?<\/AC27> <AC28>It looks like that the authors did that only because of the limitations of their method (only taking parsable queries).<\/AC28> <AC29>It would be helpful to provide data statistics both before (original) and after parsing in Appendix A.2 (Table 3).<\/AC29>\n\nLine 254: <AC30>Did you randomly select 5k and 10k examples?<\/AC30> <AC31>If they are randomly chosen did you report results on multiple randomly selected examples?<\/AC31>\n\nLine 264-266: <AC32>Why did you focus on the two-step evaluation?<\/AC32> Again, <AC33>do CodeBERT/GraphCodeBERT themselves (not by yourselves) also report results in this setting?<\/AC33> <AC34>It seems that they can be applied in a single-step setting.<\/AC34> <AC35>Why not evaluate your method in that setting too without depending on CodeBERT’s first step predictions (then only applying your method to rerank the top 10 CodeBERT predictions)?<\/AC35> <AC36>As you mentioned in Line 303-305, the highest possible results you could get with this evaluation strategy is kind of low (74% on CoSQA…)...<\/AC36>\n\nLine 307- Fig. 5: <AC37>Do you have any explanations about why GraphCodeBERT performs much worse than CodeBERT in many cases?<\/AC37> <AC38>Is it the strongest baseline you compare with?<\/AC38>\n\nlimitations: N/A"}, {"message_id": "Reviewer_FqUC · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Part 2: parser and more questions about evaluation, Inaccurate claim; clarifications about runtime and evaluation, Follow up to our Response, Additional Questions?\n### **<AC1>The query parser implementation seems to be a lot of human work<\/AC1> (Weakness 3)**\n\n<AC2>The parser rules were developed by us without any prior experience with CCG parsing.<\/AC2> <AC3>It was performed through a few iterations of manual assessment of the parsing results obtained on the CodeSearchNet dataset’s training set, and adjusting the parsing rules accordingly.<\/AC3> <AC4>The majority of the process took roughly two weeks.<\/AC4> <AC5>We want to note that we did not perform further changes to the parser depending on the performance of the NS3 model on the development or testing sets of either dataset.<\/AC5> <AC6>The resulting parser was robust enough to be applicable to CoSQA dataset without modifications.<\/AC6> In addition, <AC7>we have performed more experiments evaluating the parser on both queries concerning Python code, as well as code in five other programming languages (Go, Java, Javascript, PHP, Ruby).<\/AC7> <AC8>As it can be seen, the parser can parse 62% of the queries about Python, and at least 32% of queries about other languages, with PHP being the highest at 42%.<\/AC8> Please refer to our comment to all reviewers for a broader discussion on the generality of the parser.\n\n|Language | Dataset | Parser Success Rate|\n|------------|----------|-------------------------|\n|Python| CoNaLa auto-mined | 0.62 |\n|Python| CoNaLa manual (train) | 0.65 |\n|Python| CoNaLa manual (test) | 0.63 |\n|Go| CodeSearchNet | 0.32 |\n|Java| CodeSearchNet | 0.33 |\n|Javascript| CodeSearchNet | 0.41 |\n|PHP| CodeSearchNet | 0.43 |\n|Ruby| CodeSearchNet | 0.35 |\n\n### **<AC9>Did you randomly select 5k and 10k examples?<\/AC9> (Q2)**\n\n<AC10>5K and 10K sample scenarios were sampled randomly<\/AC10>, and <AC11>for those experiments, we do not report the average over multiple subsamples.<\/AC11>\n\n### **<AC12>Why did you focus on the two-step evaluation?<\/AC12> (Q3)**\n\n<AC13>Regarding us performing two-stage retrieval for evaluation, we want to mention that two-stage retrieval is not uncommon in information retrieval with a less precise, but faster method filtering a large number of examples, and a second, slower but more precise, method re-evaluating most likely candidates to make the final decision.<\/AC13> <AC14>You are correct in your understanding that both CodeBERT and GraphCodeBERT can be used in just 1 step.<\/AC14> But <AC15>as we see from our results in Tables 1 and 2, there is an improvement that can be obtained by applying NS3 as a second stage.<\/AC15> <AC16>The reason we did not run our model in just 1 stage is resource efficiency.<\/AC16> <AC17>Our model uses dynamic architecture (LL142-163)<\/AC17>, <AC18>which makes it harder to batch examples together and process multiple examples at once<\/AC18> because <AC19>from one example to another we end up with a different model architecture.<\/AC19>\n\n### **<AC20>Why does GraphCodeBERT perform much worse than CodeBERT in Figure 5?<\/AC20> (Q4)**\n\n<AC21>From our results there is no way to conclusively decide whether GraphCodeBERT is a stronger baseline than CodeBERT<\/AC21>; <AC22>in particular, in Figure 5 that you mention, GraphCodeBERT is stronger on CoSQA.<\/AC22>\n\nWe want to thank you for your insightful comments and suggestions. We have attempted to address a number of concerns that you have expressed in the general comments to all reviewers, and hope that you find our answers satisfying. Additionally, <AC23>we have updated the paper to address the issue with regards to the correctness of our claim of the model performance on long and compositional text<\/AC23>, <AC24>we have rephrased the claim to focus more on the faithful representation of the details in the query.<\/AC24>\n\n### **<AC25>Inaccurate claim on the advantage of the proposed method<\/AC25> (Weakness 1)**\n\n<AC26>As you have correctly pointed out, one of the main claims in the paper, regarding encoding longer queries, was not backed by the experimental results.<\/AC26> <AC27>We have updated the paper to make the claim more true and correct, by specifying that we are interested in a representation of the query that is faithful to the details and its semantics.<\/AC27> In other words, <AC28>details or parts of the query are not misrepresented or omitted.<\/AC28> <AC29>We believe that from our experiments in Figure 7, it can be observed that NS3 is in fact obtaining a more faithful representation<\/AC29> since <AC30>it is more sensitive to small, but semantically important changes to the query.<\/AC30> We discuss this more broadly in our general comment on the topic.\n<AC31>We are also working to include longer and more compositional examples in the paper and will update the draft accordingly in the next couple of days.<\/AC31>\n\n### **Runtime and best usage scenarios (Weakness 2)**\n\n<AC32>There is some tradeoff of efficiency for performance during inference<\/AC32>, but <AC33>we believe it is not prohibitively large for real-world retrieval scenarios.<\/AC33> <AC34>We have performed a small benchmarking experiment, and on an NVIDIA Tesla V100 GPU CodeBERT takes 0.25 seconds to process 1000 samples, and NS3 then takes 0.45 seconds to perform the re-ranking of the top 10 samples.<\/AC34> <AC35>The overhead of training a new neural model is a one-time effort<\/AC35>, and <AC36>we spent between 10 and 15 hours training the model on an NVIDIA Tesla V100 GPU.<\/AC36>\n<AC37>Your comment about NS3 being used as a re-ranker is on-point<\/AC37>, <AC38>it is indeed the use case we have in mind for our model (LL237-242; LL263-267).<\/AC38> <AC39>For that reason we have also included a similarly evaluated re-ranking baseline with a different model in the second stage, these results are referred to as “GraphCodeBERT*” in Tables 1 and 2.<\/AC39>\nFinally, <AC40>we wanted to bring your attention to the fact that NS3 can be used on top of any base retrieval method for filtering the pool of candidates, not necessarily just CodeBERT.<\/AC40>\n\n### **Evaluation setup and results on the full test set (Q1)**\n\n<AC41>We have excluded portions of the data that we could not parse<\/AC41> because <AC42>it is always possible to fall back to an end-to-end model, such as CodeBERT, in cases when the parser fails.<\/AC42> <AC43>Our parser can successfully parse a measurable portion of both datasets, about 40% of CSN and 70% of CoSQA<\/AC43>, and <AC44>NS3 shows a non-trivial improvement on the parsed portion, about 0.05 MRR on CSN and 0.2 MRR on CoSQA<\/AC44>, so <AC45>overall its application will be beneficial.<\/AC45> <AC46>We have also updated Appendix A.2, Table 3, to include the full dataset statistics before parsing.<\/AC46>\n\n|Dataset|Train|Valid|Test|Full Train|Full Valid|Full Test|\n|-|-|-|-|-|-|-------------|\n|CodeSearchNet|162801| 8841| 8905| 412178| 23107| 22176|\n|CoSQA|14210 |-| -| 20,604 |-| -|\n|WebQueryTest|- |- |662| - |- |1046|\n\nIn addition, <AC47>we have performed experiments on the full CoSQA test set, i.e. including both parsable and unparsable examples.<\/AC47> <AC48>As it can be seen from the results table below, while there is a shift in performance, the overall trends of the performance remain the same<\/AC48>, and <AC49>NS3 still offers improvement when used on top of CodeBERT.<\/AC49> <AC50>We have also updated Appendix C.3 accordingly, to include this experiment.<\/AC50>\n\n|Method|MRR|P@1| P@3|P@5|\n|---------|------|-----|-----|-----|\n|CodeBERT| 0.29 | 0.152| 0.312 | 0.444 |\n|GraphCodeBERT| 0.367 | 0.2 | 0.447 | 0.561 |\n|NS3| 0.412 | 0.298 | 0.452 | 0.535 |\n\nDear Reviewer,\n\nWe wanted to follow up to check whether our responses below have addressed the concerns you have specified in your review. To briefly summarize the points covered in our response:\n\n- <AC51>We have addressed your concern about the mismatch between our claim and experimental results, clarified the corresponding claim, and updated the paper.<\/AC51>\n- <AC52>We have answered your questions about the evaluation setup, and the rationale behind our setup.<\/AC52>\n- <AC53>We have provided experimentation on the full dataset to demonstrate the performance of the models without additional sample selection biases.<\/AC53>\n- <AC54>We have answered your questions about the parser<\/AC54> and <AC55>provided additional experimentation that shows how our parser can successfully generalize to new scenarios.<\/AC55>\n- <AC56>Following your suggestions, we have made some other changes to the paper, such as providing additional statistics you had requested.<\/AC56>\n\nDo not hesitate to let us know if you have any follow-up questions that we could further answer.\n\nBest regards,\n\nAuthors\nDear Reviewer,\n\nWith the nearing end of the discussion period, we wanted to reach out again and check if you were satisfied with our answers below, as well as see if there are any additional questions or concerns we could address for you.\n\nBest Regards,\n\nAuthors\n\n Global/general Response:\n```\n<AC57>Rules for the parser were created manually.<\/AC57> <AC58>In the process of rule-creation, we used the training portion of the CodeSearchNet dataset.<\/AC58> <AC59>This process was guided by a qualitative assessment of the output parses on the training portion of the CodeSearchNet dataset.<\/AC59>\n<AC60>We want to highlight, however, that we did not perform additional changes to the parser based on the performance of the full NS3 model on either development or test sets<\/AC60>, and <AC61>neither did we make changes to the parser to parse the CoSQA dataset in addition to CodeSearchNet later.<\/AC61> In other words, <AC62>the parser that was created for CodeSearchNet was robust enough to be applied to another dataset without significant modifications.<\/AC62>\n\nIn addition, <AC63>we have performed a study on new datasets (Appendix A.4), to evaluate the performance of the parser on a) an unseen dataset of English text and Python code, and b) unseen datasets of English text and code in other programming languages (Go, Java, JavaScript, PHP, Ruby).<\/AC63> <AC64>According to this experiment, we were able to parse at least 62% of English queries on Python data, and at least 32% of queries for other languages, with PHP being the highest at 43%.<\/AC64> Full results are presented in the Appendix, below is the summary:\n\n|Language | Dataset | Parser Success Rate|\n|------------|----------|-------------------------|\n|Python| CoNaLa auto-mined | 0.62 |\n|Python| CoNaLa manual (train) | 0.65 |\n|Python| CoNaLa manual (test) | 0.63 |\n|Go| CodeSearchNet | 0.32 |\n|Java| CodeSearchNet | 0.33 |\n|Javascript| CodeSearchNet | 0.41 |\n|PHP| CodeSearchNet | 0.43 |\n|Ruby| CodeSearchNet | 0.35 |\n\nWe also want to note, that <AC65>while undeniably the parser can be improved, our manual assessment of failed parses shows that a lot of those sentences do not in fact represent proper queries, and are noisy instances in the datasets.<\/AC65> <AC66>Among such instances we have discovered URLs, function signatures, unrelated comments to the semantics of the function, and others.<\/AC66> <AC67>We discuss this and provide specific examples in Appendix A.3, Table 4.<\/AC67>\n\nAnd finally, <AC68>we performed an evaluation on the full testing portion of the CoSQA dataset, to demonstrate that NS3 still improves the performance when compared to CodeBERT and GraphCodeBERT baselines.<\/AC68> <AC69>This experiment is discussed in Appendix, Section C.3 and Table 6.<\/AC69> Below we present a summary of the table.\n|Method|MRR|P@1| P@3|P@5|\n|---------|------|-----|-----|-----|\n|CodeBERT| 0.29 | 0.152| 0.312 | 0.444 |\n|GraphCodeBERT| 0.367 | 0.2 | 0.447 | 0.561 |\n|NS3| 0.412 | 0.298 | 0.452 | 0.535 |\n```\n\n Global/general Response:\n```\n<AC70>We are very grateful to the reviewers for pointing out that one of our claims, which was formulated as the ability to encode longer texts in contrast to existing models (L58), was inaccurate and inconsistent with the results.<\/AC70> <AC71>More precisely, and we have updated the wording in the paper to reflect this, our concern is about the inability of existing models to obtain a representation of the text that remains faithful to the details and query’s semantics.<\/AC71> <AC72>We demonstrate that NS3 achieves such faithfulness in the study in Figure 7, where we replace a single entity or a single action in samples and show that NS3 is more sensitive to this small change in semantics.<\/AC72> <AC73>We also have included additional experiments in the Appendix (Figures 9 and 10), which show that CodeBERT’s performance is roughly the same even when dealing with unseen actions and unseen entities<\/AC73>, <AC74>which confirms again that an individual unknown action or entity have low importance in the CodeBERT model while making a prediction, thus violating the faithfulness of the representation.<\/AC74>\n<AC75>We have updated the corresponding claims in the Introduction, when discussing the advantages and evaluation results, as well as in Limitation in Section 2.2<\/AC75>, and <AC76>hope it makes the paper more clear and sound.<\/AC76>\n\n```\n\n Global/general Response:\n```\nDear Reviewers,\n\nWe want to thank you for your careful comments and valuable suggestions. We were pleased to hear that the **following strengths** of our work have caught your eye:\n- **kn2F**: <AC77>very strong empirical results, including detailed evaluations and ablation studies.<\/AC77>\n- **FqUC**: <AC78>strong performance on an interesting problem<\/AC78>\n- **dTG5**: <AC79>strong performance achieved with an interesting solution using a combination of symbolic information from CCG parse and neural approach based on Transformer<\/AC79>\n- **SyPM**: <AC80>strong performance achieved on an interesting and novel application of neural module networks to a novel problem.<\/AC80>\n\nWe also are very grateful for constructive criticisms - we have received a number of great questions and suggestions for improvement of the paper. We hope that **our answers will clear your concerns** that we have outlined below, and <AC81>you will find that the overall quality of our submission has improved after making the following changes<\/AC81>:\n- **kn2F, FqUC, dTG5**: performance of the parser as well as its generalization capacity. <AC82>We have updated Appendix Section A.4 to include additional evaluations of the parser on a number of new code-search datasets.<\/AC82> <AC83>The datasets are comprised of English text and code in Python, as well as 5 other programming languages (Go, Java, Javascript, PHP, Ruby).<\/AC83>\n- **FqUC, dTG5**: how parsable vs un-parsable examples skew the performance of the models. <AC84>We have updated Appendix Section C.3 to include the performance evaluation for our model, CodeBERT, and GraphCodeBERT, when evaluated on the entire dataset, as opposed to just its parsable portion.<\/AC84> <AC85>We have also updated Appendix Section A.2, Table 3, to include original data statistics before parsing<\/AC85>\n- **dTG5, FqUC**: the correctness of the claim about the advantage of the proposed method for longer texts. <AC86>We have rephrased the corresponding claim to specify our model focuses on the faithful representation of details of the query<\/AC86>, and <AC87>walk through experiments that evidence this.<\/AC87>\n- **SyPM**: Clarity issues in the introduction and Section 3.3. <AC88>We have updated those sections to improve the clarity of the writing<\/AC88> and <AC89>added more details about implementation to avoid confusion by the reader.<\/AC89> <AC90>We have also fixed some typos.<\/AC90>\n\nFor your convenience, **the changes to the revised paper** and supplementary material (appendix) **are emphasized with blue text**. To make it more convenient to check our appendix, we only uploaded the appendix pdf file as the supplementary material. Our previous zip file with code is still accessible in the revision history.\n\nWe thank you again for taking the time to review our paper and engage in the discussion.\n\nAuthors\n```"}, {"message_id": "Reviewer_FqUC · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thanks for your clarifications\nThank you for your responses and clarifications! <AC1>They clarify some of my questions.<\/AC1> <AC2>Based on a clearer understanding of the paper, I decided to keep my score at 5.<\/AC2>"}]}, {"i": 2, "name": "Reviewer_SyPM", "rating": [null, 7], "messages": [{"message_id": "Reviewer_SyPM · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper introduces a novel method for semantic code search using neural module\nnetworks.<\/AC1> <AC2>The layout of the network is produced from a semantic parse of the\nquery.<\/AC2> <AC3>There are two types of modules: entity discovery modules and action\nmodules.<\/AC3> <AC4>Entity discovery modules correspond to the nouns in the semantic parse<\/AC4>\nand <AC5>each such module tries to discover the given entity (noun) of the query in\nthe code (they assign a relevance score to each code token).<\/AC5>\n\n<AC6>Action modules correspond to the verbs in the query.<\/AC6> <AC7>Each action module receives\nonly part of the full query with the last entity argument masked, and tries to\ndiscover the masked entity (estimate its relevance scores).<\/AC7> <AC8>The intuition is\nthat if the code snippet indeed corresponds to the query, then the action module\nshould be able to estimate the relavence scores of the masked entity based on\nthe code and the rest of the query.<\/AC8> <AC9>Nested action modules are flattened<\/AC9> and\n<AC10>their scores are multiplied together.<\/AC10>\n\n<AC11>The final score which measures the relatedness of the code snippet to the query\nis computed by taking the normalized dot product of the relevance scores of an\nentity computed by its entity discovery module and by the action module in which\nit was masked.<\/AC11> <AC12>If there are multiple such scores (because there are multiple\naction modules) they are multiplied together.<\/AC12>\n\nstrengths_and_weaknesses: ## Strengths\n\n<AC13>The paper is an interesting and novel application of neural module networks to\nsemantic code search<\/AC13> and <AC14>improves the state-of-the-art results.<\/AC14>\n\n## Weaknesses\n\n<AC15>I think the main problem with the paper is that some parts are hard to\nunderstand in their current form.<\/AC15> <AC16>The introduction could be more concrete with\ninformation incorporated from the caption of Figure 2 and Section 3.<\/AC16> For\nexample, <AC17>I think that the introduction should mention the intuition behind\naction and entity discovery modules, and how that is used to compute the\nrelatedness score.<\/AC17>\n\n<AC18>I found the second paragraph of Section 3.3 especially hard to understand<\/AC18>, <AC19>I\nthink it should be elaborated.<\/AC19> <AC20>One reason for my confusion was the dual role of\nprepositions: they belong to the entities, but we embed them with the verbs.<\/AC20> <AC21>I\nstill don't understand what happens when we have multiple entities as the input\ndimension of the transformer would change depending on the number of entities.<\/AC21>\nAlso, <AC22>the dimensions, and what is concatenated to what and in which direction is\nnot clear.<\/AC22>\n\nLine 208: <AC23>the code token embedding should be $c^j_k$ and not $t_k$.<\/AC23>\n\nLine 246: <AC24>\", Section 4.1,\" is somewhat confusing<\/AC24>, <AC25>\"later in this Section\" would be better<\/AC25>\n\nLines 268-277: <AC26>some of the methods are not cited.<\/AC26>\n\n<AC27>I find it odd that there is a \"Background\" and a \"Related work\" section<\/AC27>, as\n<AC28>the Background already discusses the limitations of related work.<\/AC28>\n\nquestions: <AC29>Why is batching hard for the model?<\/AC29> (it was mentioned in line 237)\n\n<AC30>It was mentioned that the performance of the model peaks at depth=1.<\/AC30> <AC31>Could that\nbe because of how compositional queries are handled (as described in lines\n219-228)?<\/AC31>\n\n<AC32>I found Figure 4 confusing.<\/AC32> <AC33>Why are both \"Load 0\" and \"Load from\" present in the\nfigure?<\/AC33> <AC34>On Figure 2 we just have \"Load from\" for the same action module and\nquery.<\/AC34> Also, <AC35>there is just one unmasked entity and it's without a preposition<\/AC35>, so <AC36>maybe\n\"Load 0\" would be appropriate?<\/AC36>\n\nlimitations: <AC37>I cannot think of any limitations which are not addressed.<\/AC37>"}, {"message_id": "Reviewer_SyPM · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Clarity and Details of the Method Follow-up\n\nWe are grateful for your positive comments and thoughtful suggestions. We are pleased to hear that you think the proposed method is interesting and novel. <AC1>We understand the concerns you raised about the clarity of the writing.<\/AC1> <AC2>We have fixed typos, added citations, and revised the paper to expand on method ideas in the introduction, and improve the clarity of Section 3.3.<\/AC2> <AC3>We include more discussion about the intuition behind the two modules and the high-level ideas of how the module's outputs are used to compute relatedness scores.<\/AC3> <AC4>Sec 3.3 is revised to elaborate more on the module’s implementation details.<\/AC4> Please see our general response for the detailed list of changes made to the paper. We hope that you find the overall quality of the paper has improved with this revision.\n\nIn this response, we clarify implementation details about the action module (Sec 3.3) and address questions about batching and performance at different depths.\n\n### **Clarification of the details of the action module (Sec 3.3) (Weakness 2 & Q3)**\n\n- __Modeling “preposition”:__ <AC5>For each entity, there can be zero or one preposition<\/AC5>, but <AC6>each verb may have multiple entities with prepositions.<\/AC6> <AC7>Here, Load 0 indicates that there is no preposition associated with “all tables”.<\/AC7> <AC8>This design decision becomes more clear in a scenario where both entities have an associated preposition, e.g. “Load from table to file.”, In that case, the entity “table” would be matched with “load from”, and entity “file” would be masked, and the input would only contain the embedding for “load to”.<\/AC8> We are sorry for causing confusion about this, <AC9>in Figure 2 we truncated that part for brevity, and also to avoid overloading the figure with too much detail.<\/AC9>\n- __Handling multiple entities & confusion in Figure 4:__ <AC10>We handle multiple entities by having distinct copies of the module with the corresponding dimensionality for different numbers of input entities (LL202-204 in the revised version of the paper).<\/AC10> <AC11>In our current implementation, these modules do not share weights<\/AC11>, but <AC12>in a future implementation, we believe it might be beneficial to change that.<\/AC12> <AC13>To form the input vector for the Action module, we concatenate the code token embedding (dim=768), and, depending on the number of inputs one or more join embeddings of verb and preposition (dim=7) with the corresponding output score of the entity discovery module (dim=1).<\/AC13> So, <AC14>the final dimensionality of the input vector to the action module is 768 + 8*num_inputs.<\/AC14>\n- __Updates to the Method description in Section 3.3:__ <AC15>The details you queried about were missing from the paper<\/AC15>, so <AC16>we have updated Section 3.3 to include information about handling multiple inputs to the action module, and provide a clearer explanation behind our handling of prepositions.<\/AC16>\n\n### **<AC17>Why is batching hard for the model?<\/AC17> (Q1)**\n\nThis is because <AC18>our model has dynamic architecture on different query-candidate pairs<\/AC18> since <AC19>we use the semantic parse of the query to construct the layout of the network.<\/AC19> As a result, <AC20>we have a different network architecture from one query to another<\/AC20>, Thefore, <AC21>the computations for both forward and backward passes for every example are different.<\/AC21>\n\n### **Performance of our method at different query depths (Q2)**\n\nThank you for raising this great question! <AC22>We agree that it is interesting to investigate why our method performs worse on queries of larger depths (e.g., depth=2/3).<\/AC22> <AC23>A related observation is that the baselines perform similarly on all depths<\/AC23>, <AC24>which shows that there is no significant difference in terms of difficulty on these different subsets of queries.<\/AC24> <AC25>One hypothesis is that more compositional queries are also harder to parse for the parser, having a higher chance of ending up with a noisy or incorrect parse among longer queries.<\/AC25> <AC26>This in turn affects our model both during learning and inference.<\/AC26> <AC27>We didn’t validate this hypothesis via experiments<\/AC27> and <AC28>plan to do this in the final version.<\/AC28>\n\n### **<AC29>The \"Background\" section makes the \"Related work\" section redundant<\/AC29> (Weakness 3)**\n\n<AC30>Our intention for the background section was to provide preliminary information and formal details, not just limitations.<\/AC30> We are grateful for pointing out this inconsistency and <AC31>will work to remove the redundancy between the two sections in the paper.<\/AC31>\n\nDear Reviewer,\n\nWe wanted to follow up to check whether our responses below have addressed the concerns you have specified in your review. To briefly summarize the points covered in our response:\n\n- <AC32>We have addressed your questions about the model, and implementation.<\/AC32>\n- <AC33>We have followed your suggestions for making the paper clear and have revised the Introduction and Section 3.3. for that purpose.<\/AC33>\n- <AC34>We have addressed your questions about the model performance behavior on queries of larger depth.<\/AC34>\n\nDo not hesitate to let us know if you have any follow-up questions that we could further answer.\n\nBest regards,\n\nAuthors\n\n Global/general Response:\n```\n<AC35>Rules for the parser were created manually.<\/AC35> <AC36>In the process of rule-creation, we used the training portion of the CodeSearchNet dataset.<\/AC36> <AC37>This process was guided by a qualitative assessment of the output parses on the training portion of the CodeSearchNet dataset.<\/AC37>\n<AC38>We want to highlight, however, that we did not perform additional changes to the parser based on the performance of the full NS3 model on either development or test sets<\/AC38>, and <AC39>neither did we make changes to the parser to parse the CoSQA dataset in addition to CodeSearchNet later.<\/AC39> In other words, <AC40>the parser that was created for CodeSearchNet was robust enough to be applied to another dataset without significant modifications.<\/AC40>\n\nIn addition, <AC41>we have performed a study on new datasets (Appendix A.4), to evaluate the performance of the parser on a) an unseen dataset of English text and Python code, and b) unseen datasets of English text and code in other programming languages (Go, Java, JavaScript, PHP, Ruby).<\/AC41> <AC42>According to this experiment, we were able to parse at least 62% of English queries on Python data, and at least 32% of queries for other languages, with PHP being the highest at 43%.<\/AC42> Full results are presented in the Appendix, below is the summary:\n\n|Language | Dataset | Parser Success Rate|\n|------------|----------|-------------------------|\n|Python| CoNaLa auto-mined | 0.62 |\n|Python| CoNaLa manual (train) | 0.65 |\n|Python| CoNaLa manual (test) | 0.63 |\n|Go| CodeSearchNet | 0.32 |\n|Java| CodeSearchNet | 0.33 |\n|Javascript| CodeSearchNet | 0.41 |\n|PHP| CodeSearchNet | 0.43 |\n|Ruby| CodeSearchNet | 0.35 |\n\nWe also want to note, that <AC43>while undeniably the parser can be improved, our manual assessment of failed parses shows that a lot of those sentences do not in fact represent proper queries, and are noisy instances in the datasets.<\/AC43> <AC44>Among such instances we have discovered URLs, function signatures, unrelated comments to the semantics of the function, and others.<\/AC44> <AC45>We discuss this and provide specific examples in Appendix A.3, Table 4.<\/AC45>\n\nAnd finally, <AC46>we performed an evaluation on the full testing portion of the CoSQA dataset, to demonstrate that NS3 still improves the performance when compared to CodeBERT and GraphCodeBERT baselines.<\/AC46> <AC47>This experiment is discussed in Appendix, Section C.3 and Table 6.<\/AC47> Below we present a summary of the table.\n|Method|MRR|P@1| P@3|P@5|\n|---------|------|-----|-----|-----|\n|CodeBERT| 0.29 | 0.152| 0.312 | 0.444 |\n|GraphCodeBERT| 0.367 | 0.2 | 0.447 | 0.561 |\n|NS3| 0.412 | 0.298 | 0.452 | 0.535 |\n```\n\n Global/general Response:\n```\n<AC48>We are very grateful to the reviewers for pointing out that one of our claims, which was formulated as the ability to encode longer texts in contrast to existing models (L58), was inaccurate and inconsistent with the results.<\/AC48> <AC49>More precisely, and we have updated the wording in the paper to reflect this, our concern is about the inability of existing models to obtain a representation of the text that remains faithful to the details and query’s semantics.<\/AC49> <AC50>We demonstrate that NS3 achieves such faithfulness in the study in Figure 7, where we replace a single entity or a single action in samples and show that NS3 is more sensitive to this small change in semantics.<\/AC50> <AC51>We also have included additional experiments in the Appendix (Figures 9 and 10), which show that CodeBERT’s performance is roughly the same even when dealing with unseen actions and unseen entities<\/AC51>, <AC52>which confirms again that an individual unknown action or entity have low importance in the CodeBERT model while making a prediction, thus violating the faithfulness of the representation.<\/AC52>\n<AC53>We have updated the corresponding claims in the Introduction, when discussing the advantages and evaluation results, as well as in Limitation in Section 2.2<\/AC53>, and <AC54>hope it makes the paper more clear and sound.<\/AC54>\n\n```\n\n Global/general Response:\n```\nDear Reviewers,\n\nWe want to thank you for your careful comments and valuable suggestions. We were pleased to hear that the **following strengths** of our work have caught your eye:\n- **kn2F**: <AC55>very strong empirical results, including detailed evaluations and ablation studies.<\/AC55>\n- **FqUC**: <AC56>strong performance on an interesting problem<\/AC56>\n- **dTG5**: <AC57>strong performance achieved with an interesting solution using a combination of symbolic information from CCG parse and neural approach based on Transformer<\/AC57>\n- **SyPM**: <AC58>strong performance achieved on an interesting and novel application of neural module networks to a novel problem.<\/AC58>\n\nWe also are very grateful for constructive criticisms - we have received a number of great questions and suggestions for improvement of the paper. We hope that **our answers will clear your concerns** that we have outlined below, and <AC59>you will find that the overall quality of our submission has improved after making the following changes<\/AC59>:\n- **kn2F, FqUC, dTG5**: performance of the parser as well as its generalization capacity. <AC60>We have updated Appendix Section A.4 to include additional evaluations of the parser on a number of new code-search datasets.<\/AC60> <AC61>The datasets are comprised of English text and code in Python, as well as 5 other programming languages (Go, Java, Javascript, PHP, Ruby).<\/AC61>\n- **FqUC, dTG5**: how parsable vs un-parsable examples skew the performance of the models. <AC62>We have updated Appendix Section C.3 to include the performance evaluation for our model, CodeBERT, and GraphCodeBERT, when evaluated on the entire dataset, as opposed to just its parsable portion.<\/AC62> <AC63>We have also updated Appendix Section A.2, Table 3, to include original data statistics before parsing<\/AC63>\n- **dTG5, FqUC**: the correctness of the claim about the advantage of the proposed method for longer texts. <AC64>We have rephrased the corresponding claim to specify our model focuses on the faithful representation of details of the query<\/AC64>, and <AC65>walk through experiments that evidence this.<\/AC65>\n- **SyPM**: Clarity issues in the introduction and Section 3.3. <AC66>We have updated those sections to improve the clarity of the writing<\/AC66> and <AC67>added more details about implementation to avoid confusion by the reader.<\/AC67> <AC68>We have also fixed some typos.<\/AC68>\n\nFor your convenience, **the changes to the revised paper** and supplementary material (appendix) **are emphasized with blue text**. To make it more convenient to check our appendix, we only uploaded the appendix pdf file as the supplementary material. Our previous zip file with code is still accessible in the revision history.\n\nWe thank you again for taking the time to review our paper and engage in the discussion.\n\nAuthors\n```"}, {"message_id": "Reviewer_SyPM · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thank you for your thoughtful answers\nThank you for your clarifications, especially that the modifications of the paper were easy to see in blue.\n\n<AC1>I also think that the evaluations got much better with the additional experiments and information.<\/AC1> <AC2>What could make the paper even better would be to figure out why the method performs worse with deeper queries and maybe improve the method.<\/AC2>\n\nTwo small observations:\n- <AC3>maybe it would be helpful to mention explicitly in Section 3.3 that for masked tokens, only the verb-preposition embedding is included, and the entity discovery module embedding is not.<\/AC3> <AC4>It can of course be deduced<\/AC4>, but <AC5>I think it could be helpful.<\/AC5>\n- <AC6>there is a new typo on line 32: loosing => losing<\/AC6>\n\n<AC7>I increased my score to Accept.<\/AC7>"}]}, {"i": 3, "name": "Reviewer_dTG5", "rating": [null, 5], "messages": [{"message_id": "Reviewer_dTG5 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper proposes the NS3 (Neuro-Symbolic Semantic Search) model, which breaks down the query into small phrases using the Categorial Grammar-based semantic parse module<\/AC1>, <AC2>which can better understand the compositional and longer queries.<\/AC2>\n\n<AC3>To identify the similarity of each query and code snippet, the NS3 model uses two types of neural models, the entity discovery module and the action module.<\/AC3> <AC4>The entity discovery module uses a transformer encoder model and a two-layer MLP to identify the entities and their relevances.<\/AC4> <AC5>RoBERTa model initialization and noisy supervision training are applied in its self-supervised pretraining phase.<\/AC5> <AC6>The Action module architecture is similar to the entity discovery module.<\/AC6> <AC7>It estimates the action similarity through the prediction of the masked entity embedding.<\/AC7> <AC8>The module can be pre-trained with a mask-predict process for the masked entity.<\/AC8> <AC9>After pretraining, the model performs end-to-end fine-tuning for two modules.<\/AC9>\n\n<AC10>The experiments on the CSN and CoSQA datasets show the superiority of the proposed model over the baseline methods on the parsable samples.<\/AC10> Furthermore, <AC11>the ablation study validates the effectiveness of the pretraining<\/AC11> and <AC12>investigates different score normalization methods and similarity metrics.<\/AC12>\n\nstrengths_and_weaknesses: **Strengths**:\n\n1. <AC13>The proposed NS3 model utilizes the Categorial Grammar-based(CCG) semantic parser to comprehend the semantic structure of the query better and combines the Transformer-based neural model to capture semantic information of the query text<\/AC13>, <AC14>which is an interesting idea.<\/AC14>\n\n2. <AC15>The experiment validates the effectiveness of the proposed modules and the pretraining strategy.<\/AC15> Furthermore, <AC16>the proposed model achieves noticeable improvements over the baseline models in the parsable samples.<\/AC16>\n\n**Weakness**:\n\n1. <AC17>The proposed model could not operate properly in arbitrary natural language scenarios that 60% of the CSN dataset and 30% of the CoSQA dataset records are not parsable.<\/AC17>\n\n2. <AC18>According to Line 58, the author claims the model mitigates the challenges of encoding long texts and mimics the staged reasoning for SCS.<\/AC18> However, <AC19>according to Figure 5(a), the NS3 model is not significantly improved in the deeper query situation (D=3+).<\/AC19> <AC20>The model performs better on the query with a simple semantic structure (D=1)<\/AC20>, <AC21>which is inconsistent with the initial claim.<\/AC21>\n\n3. <AC22>The unparsable issue restricts the quantity and quality of the experimental data.<\/AC22> <AC23>According to Table 1 and [1], the MRR of the GraphCodeBert model is higher on the parsable dataset (0.812 vs. 0.692).<\/AC23> <AC24>The parsable data may be easier to comprehend through the NS3 model<\/AC24>, <AC25>making the experiment comparison unfair.<\/AC25>\nReference:\n\n[1] Guo, D., Ren, S., Lu, S., Feng, Z., Tang, D., Liu, S., ... & Zhou, M. (2020). Graphcodebert: Pre-training code representations with data flow. arXiv preprint arXiv:2009.08366.\n\nquestions: 1. <AC26>Could you elaborate on the influence of the parsable sample selection on the dataset?<\/AC26> For example, <AC27>are the long sentences and samples hard-to-understand remained?<\/AC27>\n\n2. <AC28>Is there any sample that can validate the NS3 model mimics the staged reasoning for SCS?<\/AC28>\n\nlimitations: <AC29>In the experiments, according to my understanding, only parsable data are used in the evaluation.<\/AC29> <AC30>I would suggest using all the data in the experiments to verify if the proposed method still helps in improving the SCS performance.<\/AC30> In other words, <AC31>it is not fair to compare with other baselines and models using only the dataset bias towards your method.<\/AC31>"}, {"message_id": "Reviewer_dTG5 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Part 2: Inconsistent claim, and staged reasoning examples; Parser, and potential biases introduced by evaluation on parsable examples; Follow up to our Response; Last Check-In\n### **<AC1>Inconsistent claim in the paper, as the model’s performance does not improve on deeper queries<\/AC1> (Weakness 2)**\n\nThank you so much for raising this crucial point. <AC2>After careful consideration, we have updated the wording in the paper so that the claims reflect more precisely the strengths of our approach.<\/AC2> We hope that you find our changes have made our submission better. <AC3>Specifically, our concern is about the inability of existing models to obtain a representation of text that remains faithful to the details and query’s semantics.<\/AC3> <AC4>We demonstrate that NS3 achieves such faithfulness to details in the study in Figure 7, where we replace a single entity or a single action in samples and show that NS3 is more sensitive to this small change in semantics.<\/AC4> <AC5>We also have included additional experiments in the Appendix (Figures 9 and 10), which show that CodeBERT’s performance is roughly the same even when dealing, with unseen actions and unseen entities<\/AC5>, <AC6>which confirms again that individual unknown actions or entities have low importance in the CodeBERT model while making a prediction, thus violating the faithfulness of the representation.<\/AC6>\n\n<AC7>We suspect that the performance drop in longer queries could be due to the fact that more compositional queries are also harder to parse for the parser, having a higher chance of ending up with a noisy or incorrect parse among longer queries.<\/AC7> <AC8>This in turn affects our model both during learning and inference.<\/AC8>\n\nPlease take a look at our general comment on the claim about handling longer texts for additional information and broader discussion.\n\n### **<AC9>Is there any sample validating that the NS3 model mimics the staged reasoning for SCS?<\/AC9> (Q2)**\n\nThank you for raising this important point, <AC10>we agree that including more evidence of NS3’s reasoning steps will help improve the paper.<\/AC10> <AC11>We have updated Appendix, Section D with a demonstration of performance on an example with multiple steps.<\/AC11>\nThank you so much for providing a careful assessment of our paper. We are happy to hear that you found our approach of combining Transformers with semantic structure from the CCG parser interesting. We hope to have addressed some of your concerns in the general comment to all reviewers, as well as in the comments below.\n\n### **Performance comparison on the full test set (i.e., including the unparsable instances) (Limitation 1 & Weakness 3)**\n\nThank you for this thoughtful suggestion! <AC12>We agree that reporting results on the full test set (i.e., including unparsable instances) is helpful and important.<\/AC12> <AC13>For the CoSQA dataset, we have performed experiments evaluating the model performances on both parsable and unparsable parts of the test portion of the dataset.<\/AC13> The results are shown in the Table below. <AC14>As you can see, while there is some shift in performance on the full dataset, we still see improvement in the application of NS3.<\/AC14> <AC15>This table has also been added to Appendix, section C.3.<\/AC15>\n\n|Method|MRR|P@1| P@3|P@5|\n|---------|------|-----|-----|-----|\n|CodeBERT| 0.29 | 0.152| 0.312 | 0.444 |\n|GraphCodeBERT| 0.367 | 0.2 | 0.447 | 0.561 |\n|NS3| 0.412 | 0.298 | 0.452 | 0.535 |\n\nFurthermore, <AC16>we want to clarify what we believe to be a misunderstanding of the experimental setups in our Table 1 and GraphCodeBERT paper.<\/AC16> <AC17>In our work, we follow the setup used in CodeBERT, which includes ranking the correct code snippet among 999 distractors (LL263-267).<\/AC17> However, <AC18>in GraphCodeBERT both the dataset, and the experimental setup are a little different.<\/AC18> Firstly, <AC19>they remove what they consider to be noise from the dataset<\/AC19>, so <AC20>they operate on a slightly different set of queries.<\/AC20> Next, <AC21>instead of using 999 distractors, they evaluate against a larger number of distractors<\/AC21>, <AC22>which explains why the MRR scores reported in their paper are generally lower (0.692) than those that are reported by CodeBERT and us (0.812).<\/AC22> But <AC23>the scores that we have obtained for CodeBERT on just the parsable data in CodeSearchNet are comparable to those reported in the CodeBERT paper (0.873 vs 0.868)<\/AC23>, <AC24>which suggests that the parsable examples are not significantly easier for the models.<\/AC24>\n\n### **Applicability of the method (parser) in arbitrary natural language scenarios (Weakness 1)**\n\n<AC25>While we agree that the parser poses a limitation to the applicability of our method, we want to stress that even the current implementation of the parser has demonstrated the ability to generalize outside of the dataset and the programming language for which it was created.<\/AC25> <AC26>In the paper we were able to apply the parser to CoSQA dataset without modifications, having developed it using only the training portion of the CodeSearchNet dataset.<\/AC26> Additionally, <AC27>in the table below we demonstrate the evaluation of the parser on a new dataset of Python code and English queries, as well as other datasets of 5 different programming languages and their corresponding English queries.<\/AC27> <AC28>As it can be seen from the results below, in all these cases the parsable portion of the queries is non-trivial<\/AC28>, and <AC29>our model has the potential of offering a measurable improvement on those queries.<\/AC29> We invite you to refer to our general comment on the topic of parser for a broader discussion of the matter.\n\nFinally, <AC30>we want to highlight, that it is always possible to output the results of the first-stage ranking model, CodeBERT in our case, if the query could not be parsed, still getting the boost in performance on the queries that can be parsed.<\/AC30> <AC31>This analysis has been added to Appendix, Section A.4<\/AC31>, we also include the summary of the evaluation results table below for your convenience.\n\n|Language | Dataset | Parser Success Rate|\n|------------|----------|-------------------------|\n|Python| CoNaLa auto-mined | 0.62 |\n|Python| CoNaLa manual (train) | 0.65 |\n|Python| CoNaLa manual (test) | 0.63 |\n|Go| CodeSearchNet | 0.32 |\n|Java| CodeSearchNet | 0.33 |\n|Javascript| CodeSearchNet | 0.41 |\n|PHP| CodeSearchNet | 0.43 |\n|Ruby| CodeSearchNet | 0.35 |\n\n### **<AC32>Elaboration on the influence of the parsable sample selection on the dataset?<\/AC32> (Q1)**\n\nFirst of all, <AC33>we would like to highlight the point from above, that the trends of model performances remain the same when evaluating on all examples.<\/AC33> In addition, <AC34>Appendix Section A.3 and Table 4 have a discussion on noisy samples in the datasets.<\/AC34> To summarize briefly, <AC35>during manual observations of failed parses we have found that a lot of the sentences that could not be parsed were not in fact queries of code, but rather things like URLs, signatures of functions, or comments unrelated to the semantics of the functions.<\/AC35> And finally, <AC36>we want to stress again that for the large portions of the dataset that we could parse we improve the performance by a significant margin<\/AC36>, so <AC37>combining our method as a second step on top of another base method, e.g. CodeBERT, whenever parses are available is a simple way to garner that improvement.<\/AC37>\nDear Reviewer,\n\nWe wanted to follow up to check whether our responses below have addressed the concerns you have specified in your review. To briefly summarize the points covered in our response:\n\n- <AC38>We have addressed your concern about the mismatch between our claim and experimental results, clarified the corresponding claim, and updated the paper.<\/AC38>\n- <AC39>We have pointed out a small misunderstanding of the experimental setup in one of our baselines which led to an incorrect conclusion about the prevalence of the sample selection biases in our evaluation.<\/AC39> Additionally, <AC40>by your suggestion, we have provided experimentation results on the full dataset to demonstrate the performance gain is maintained in the scenario without any biases.<\/AC40>\n- <AC41>We have answered your questions about the parser<\/AC41> and <AC42>provided additional experimentation that shows how our parser can successfully generalize to new scenarios.<\/AC42>\n\nDo not hesitate to let us know if you have any follow-up questions that we could further answer.\n\nBest regards,\n\nAuthors\n\nDear Reviewer,\n\nWe wanted to use this last chance to check in and see whether you found our following clarifications and updates satisfactory:\n\n- <AC43>In response to your concern about the mismatch between one of our claims and the experimental results, we have clarified the corresponding claim according to the results and updated the paper.<\/AC43> Please see our previous comment to you, as well as the general comment on this matter for details.\n- <AC44>In response to your conclusion about the sample selection bias in our evaluations, we have pointed out a misunderstanding of the experimental setup in one of our baselines which led to the incorrect conclusion.<\/AC44>\n- Additionally, <AC45>following your suggestion, we have provided experimentation results on the full dataset to demonstrate the performance gain is maintained in the absence of sample selection.<\/AC45>\n- <AC46>We have answered your questions about the parser<\/AC46> and <AC47>provided additional experimentation that shows how our parser can successfully generalize to new datasets and new programming languages.<\/AC47>\n\nWe encourage you to refer to our previous comments for details on these points.\n\nBest regards,\n\nAuthors\n\n Global/general Response:\n```\n<AC48>Rules for the parser were created manually.<\/AC48> <AC49>In the process of rule-creation, we used the training portion of the CodeSearchNet dataset.<\/AC49> <AC50>This process was guided by a qualitative assessment of the output parses on the training portion of the CodeSearchNet dataset.<\/AC50>\n<AC51>We want to highlight, however, that we did not perform additional changes to the parser based on the performance of the full NS3 model on either development or test sets<\/AC51>, and <AC52>neither did we make changes to the parser to parse the CoSQA dataset in addition to CodeSearchNet later.<\/AC52> In other words, <AC53>the parser that was created for CodeSearchNet was robust enough to be applied to another dataset without significant modifications.<\/AC53>\n\nIn addition, <AC54>we have performed a study on new datasets (Appendix A.4), to evaluate the performance of the parser on a) an unseen dataset of English text and Python code, and b) unseen datasets of English text and code in other programming languages (Go, Java, JavaScript, PHP, Ruby).<\/AC54> <AC55>According to this experiment, we were able to parse at least 62% of English queries on Python data, and at least 32% of queries for other languages, with PHP being the highest at 43%.<\/AC55> Full results are presented in the Appendix, below is the summary:\n\n|Language | Dataset | Parser Success Rate|\n|------------|----------|-------------------------|\n|Python| CoNaLa auto-mined | 0.62 |\n|Python| CoNaLa manual (train) | 0.65 |\n|Python| CoNaLa manual (test) | 0.63 |\n|Go| CodeSearchNet | 0.32 |\n|Java| CodeSearchNet | 0.33 |\n|Javascript| CodeSearchNet | 0.41 |\n|PHP| CodeSearchNet | 0.43 |\n|Ruby| CodeSearchNet | 0.35 |\n\nWe also want to note, that <AC56>while undeniably the parser can be improved, our manual assessment of failed parses shows that a lot of those sentences do not in fact represent proper queries, and are noisy instances in the datasets.<\/AC56> <AC57>Among such instances we have discovered URLs, function signatures, unrelated comments to the semantics of the function, and others.<\/AC57> <AC58>We discuss this and provide specific examples in Appendix A.3, Table 4.<\/AC58>\n\nAnd finally, <AC59>we performed an evaluation on the full testing portion of the CoSQA dataset, to demonstrate that NS3 still improves the performance when compared to CodeBERT and GraphCodeBERT baselines.<\/AC59> <AC60>This experiment is discussed in Appendix, Section C.3 and Table 6.<\/AC60> Below we present a summary of the table.\n|Method|MRR|P@1| P@3|P@5|\n|---------|------|-----|-----|-----|\n|CodeBERT| 0.29 | 0.152| 0.312 | 0.444 |\n|GraphCodeBERT| 0.367 | 0.2 | 0.447 | 0.561 |\n|NS3| 0.412 | 0.298 | 0.452 | 0.535 |\n```\n\n Global/general Response:\n```\n<AC61>We are very grateful to the reviewers for pointing out that one of our claims, which was formulated as the ability to encode longer texts in contrast to existing models (L58), was inaccurate and inconsistent with the results.<\/AC61> <AC62>More precisely, and we have updated the wording in the paper to reflect this, our concern is about the inability of existing models to obtain a representation of the text that remains faithful to the details and query’s semantics.<\/AC62> <AC63>We demonstrate that NS3 achieves such faithfulness in the study in Figure 7, where we replace a single entity or a single action in samples and show that NS3 is more sensitive to this small change in semantics.<\/AC63> <AC64>We also have included additional experiments in the Appendix (Figures 9 and 10), which show that CodeBERT’s performance is roughly the same even when dealing with unseen actions and unseen entities<\/AC64>, <AC65>which confirms again that an individual unknown action or entity have low importance in the CodeBERT model while making a prediction, thus violating the faithfulness of the representation.<\/AC65>\n<AC66>We have updated the corresponding claims in the Introduction, when discussing the advantages and evaluation results, as well as in Limitation in Section 2.2<\/AC66>, and <AC67>hope it makes the paper more clear and sound.<\/AC67>\n\n```\n\n Global/general Response:\n```\nDear Reviewers,\n\nWe want to thank you for your careful comments and valuable suggestions. We were pleased to hear that the **following strengths** of our work have caught your eye:\n- **kn2F**: <AC68>very strong empirical results, including detailed evaluations and ablation studies.<\/AC68>\n- **FqUC**: <AC69>strong performance on an interesting problem<\/AC69>\n- **dTG5**: <AC70>strong performance achieved with an interesting solution using a combination of symbolic information from CCG parse and neural approach based on Transformer<\/AC70>\n- **SyPM**: <AC71>strong performance achieved on an interesting and novel application of neural module networks to a novel problem.<\/AC71>\n\nWe also are very grateful for constructive criticisms - we have received a number of great questions and suggestions for improvement of the paper. We hope that **our answers will clear your concerns** that we have outlined below, and <AC72>you will find that the overall quality of our submission has improved after making the following changes<\/AC72>:\n- **kn2F, FqUC, dTG5**: performance of the parser as well as its generalization capacity. <AC73>We have updated Appendix Section A.4 to include additional evaluations of the parser on a number of new code-search datasets.<\/AC73> <AC74>The datasets are comprised of English text and code in Python, as well as 5 other programming languages (Go, Java, Javascript, PHP, Ruby).<\/AC74>\n- **FqUC, dTG5**: how parsable vs un-parsable examples skew the performance of the models. <AC75>We have updated Appendix Section C.3 to include the performance evaluation for our model, CodeBERT, and GraphCodeBERT, when evaluated on the entire dataset, as opposed to just its parsable portion.<\/AC75> <AC76>We have also updated Appendix Section A.2, Table 3, to include original data statistics before parsing<\/AC76>\n- **dTG5, FqUC**: the correctness of the claim about the advantage of the proposed method for longer texts. <AC77>We have rephrased the corresponding claim to specify our model focuses on the faithful representation of details of the query<\/AC77>, and <AC78>walk through experiments that evidence this.<\/AC78>\n- **SyPM**: Clarity issues in the introduction and Section 3.3. <AC79>We have updated those sections to improve the clarity of the writing<\/AC79> and <AC80>added more details about implementation to avoid confusion by the reader.<\/AC80> <AC81>We have also fixed some typos.<\/AC81>\n\nFor your convenience, **the changes to the revised paper** and supplementary material (appendix) **are emphasized with blue text**. To make it more convenient to check our appendix, we only uploaded the appendix pdf file as the supplementary material. Our previous zip file with code is still accessible in the revision history.\n\nWe thank you again for taking the time to review our paper and engage in the discussion.\n\nAuthors\n```"}, {"message_id": "Reviewer_dTG5 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thanks for clarifications\nThank you for the explanations and the additional experiments to resolve my major concerns. <AC1>The paper now is much better with details to support the claim.<\/AC1> <AC2>I increased my score to 5.<\/AC2>"}]}, {"i": 4, "name": "Reviewer_kn2F", "rating": [5, 5], "messages": [{"message_id": "Reviewer_kn2F · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes NS3, Neuro-Symbolic Semantic Code Search.<\/AC1> <AC2>NS3 supplements the query sentence with a layout of its semantic structure, which is then used to break down the final reasoning decision into a series of lower-level decisions.<\/AC2> <AC3>NS3 outperforms baselines on CodeSearchNet and CoSQA.<\/AC3>\nstrengths_and_weaknesses: Strengths:\n1. <AC4>NS3 is evaluated in two well-established benchmarks, CodeSearchNet and CoSQA, and compared against strong baselines.<\/AC4>\n2. <AC5>The empirical result is very strong.<\/AC5> <AC6>The proposed method, NS3, outperforms state-of-the-art by a large margin.<\/AC6>\n3. <AC7>The paper includes detailed experiments on reduced dataset settings and ablation studies.<\/AC7>\n\nWeaknesses:\n1. <AC8>NS3 requires rule-based parsing of natural languages<\/AC8>, while <AC9>other baselines, such as CodeBERT, only involve natural language models.<\/AC9> <AC10>Rule-based parsing of natural languages is complicated, language-dependent, and less scalable than language models.<\/AC10> <AC11>In `parser_dict.py` of the released parser, there are hundreds of task-specific parsing/synonym rules for natural languages.<\/AC11> <AC12>These rules are not transferrable to different natural languages (e.g. English to Chinese)<\/AC12>, and <AC13>they even cannot generalize to different programming languages (e.g. Python to C++).<\/AC13>\nquestions: <AC14>What are the process of engineering parsing rules and NL-action mappings?<\/AC14> <AC15>Are they engineered according to the performance on the dev set or the test set?<\/AC15>\nlimitations: N/A"}, {"message_id": "Reviewer_kn2F · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Parser\nThank you so much for bringing up many important points, and appreciating the care we put into designing our experimental setting and ablation studies. <AC1>We agree with your concerns regarding the parser<\/AC1> and hope to have addressed most of them below, as well as in the general comment to all reviewers.\n\n### **Potential of the parser to generalize to new datasets and other programming languages (Weakness 1)**\n<AC2>After developing the parser on the CodeSearchNet dataset’s training portion, we did not perform additional changes to parse the CoSQA dataset.<\/AC2> In other words, <AC3>the parser that was created for CodeSearchNet was robust enough to be applied to another dataset without significant modifications.<\/AC3> In addition, <AC4>we have performed a study on new datasets (Appendix A.4), to evaluate the performance of the parser on a) an unseen dataset of English queries on Python code, and b) unseen datasets of English queries for code in other programming languages (Go, Java, JavaScript, PHP, Ruby).<\/AC4> <AC5>According to this experiment, we were able to parse at least 62% of Python code queries, and at least 32% of queries for other languages, with PHP being the highest at 43%.<\/AC5>\n\n|Language | Dataset | Parser Success Rate|\n|------------|----------|-------------------------|\n|Python| CoNaLa auto-mined | 0.62 |\n|Python| CoNaLa manual (train) | 0.65 |\n|Python| CoNaLa manual (test) | 0.63 |\n|Go| CodeSearchNet | 0.32 |\n|Java| CodeSearchNet | 0.33 |\n|Javascript| CodeSearchNet | 0.41 |\n|PHP| CodeSearchNet | 0.43 |\n|Ruby| CodeSearchNet | 0.35 |\n\n<AC6>In future work, it is possible to alleviate the need for the parser altogether, by asking the users of code search to formulate their semantic queries in some formal way instead, for example, following the syntax of SQL or CodeQL queries.<\/AC6>\n\n### **Potential of the parser to generalize to new natural languages, e.g. English->Chinese (Weakness 1)**\n\n<AC7>As you have correctly noted, generalizing to a new language, such as Chinese instead of English is infeasible for the current implementation of our semantic parser.<\/AC7> However, <AC8>most models, including CodeBERT or GraphCodeBERT would have to be retrained from scratch for that scenario, requiring a lot of additional work<\/AC8>, so <AC9>we do not believe such a scenario imposes a limitation unique to just our approach.<\/AC9>\n\n### **Engineering and selection of parsing rules (Q1)**\n\n<AC10>Rules for the parser were indeed created manually.<\/AC10> <AC11>In the process of rule-creation, we used the training portion of the CodeSearchNet dataset.<\/AC11> <AC12>This process was guided by a qualitative assessment of the output parses on the training portion of the CodeSearchNet dataset.<\/AC12> <AC13>We want to highlight, however, that we did not perform additional changes to the parser based on the performance of the full NS3 model on either development or test sets.<\/AC13>\nDear Reviewer,\n\nWe wanted to follow up to check whether our responses below have addressed the concerns you have specified in your review. To briefly summarize the points covered in our response:\n\n- <AC14>We have answered your questions about the process that went into the implementation of the parser.<\/AC14>\n- <AC15>We have provided additional experimentation that shows how our parser can successfully generalize to new scenarios.<\/AC15>\n\nDo not hesitate to let us know if you have any follow-up questions that we could further answer.\n\nBest regards,\n\nAuthors\n\nDear Reviewer,\n\nWith the nearing end of the discussion period, we wanted to reach out again and check if you were satisfied with our answers below, as well as see if there are any additional questions or concerns we could address for you.\n\nBest Regards,\n\nAuthors\n\nDear Reviewer,\n\nWe wanted to use this last chance to check in and see whether you found our following clarifications and updates satisfactory:\n\n- <AC16>We have answered your questions about the parser<\/AC16> and <AC17>provided additional experimentation that shows how our parser can successfully generalize to new datasets and new programming languages.<\/AC17>\n\nWe encourage you to refer to our previous comments for details on these.\n\nBest regards,\n\nAuthors\n\n Global/general Response:\n```\n<AC18>Rules for the parser were created manually.<\/AC18> <AC19>In the process of rule-creation, we used the training portion of the CodeSearchNet dataset.<\/AC19> <AC20>This process was guided by a qualitative assessment of the output parses on the training portion of the CodeSearchNet dataset.<\/AC20>\n<AC21>We want to highlight, however, that we did not perform additional changes to the parser based on the performance of the full NS3 model on either development or test sets<\/AC21>, and <AC22>neither did we make changes to the parser to parse the CoSQA dataset in addition to CodeSearchNet later.<\/AC22> In other words, <AC23>the parser that was created for CodeSearchNet was robust enough to be applied to another dataset without significant modifications.<\/AC23>\n\nIn addition, <AC24>we have performed a study on new datasets (Appendix A.4), to evaluate the performance of the parser on a) an unseen dataset of English text and Python code, and b) unseen datasets of English text and code in other programming languages (Go, Java, JavaScript, PHP, Ruby).<\/AC24> <AC25>According to this experiment, we were able to parse at least 62% of English queries on Python data, and at least 32% of queries for other languages, with PHP being the highest at 43%.<\/AC25> Full results are presented in the Appendix, below is the summary:\n\n|Language | Dataset | Parser Success Rate|\n|------------|----------|-------------------------|\n|Python| CoNaLa auto-mined | 0.62 |\n|Python| CoNaLa manual (train) | 0.65 |\n|Python| CoNaLa manual (test) | 0.63 |\n|Go| CodeSearchNet | 0.32 |\n|Java| CodeSearchNet | 0.33 |\n|Javascript| CodeSearchNet | 0.41 |\n|PHP| CodeSearchNet | 0.43 |\n|Ruby| CodeSearchNet | 0.35 |\n\nWe also want to note, that <AC26>while undeniably the parser can be improved, our manual assessment of failed parses shows that a lot of those sentences do not in fact represent proper queries, and are noisy instances in the datasets.<\/AC26> <AC27>Among such instances we have discovered URLs, function signatures, unrelated comments to the semantics of the function, and others.<\/AC27> <AC28>We discuss this and provide specific examples in Appendix A.3, Table 4.<\/AC28>\n\nAnd finally, <AC29>we performed an evaluation on the full testing portion of the CoSQA dataset, to demonstrate that NS3 still improves the performance when compared to CodeBERT and GraphCodeBERT baselines.<\/AC29> <AC30>This experiment is discussed in Appendix, Section C.3 and Table 6.<\/AC30> Below we present a summary of the table.\n|Method|MRR|P@1| P@3|P@5|\n|---------|------|-----|-----|-----|\n|CodeBERT| 0.29 | 0.152| 0.312 | 0.444 |\n|GraphCodeBERT| 0.367 | 0.2 | 0.447 | 0.561 |\n|NS3| 0.412 | 0.298 | 0.452 | 0.535 |\n```\n\n Global/general Response:\n```\n<AC31>We are very grateful to the reviewers for pointing out that one of our claims, which was formulated as the ability to encode longer texts in contrast to existing models (L58), was inaccurate and inconsistent with the results.<\/AC31> <AC32>More precisely, and we have updated the wording in the paper to reflect this, our concern is about the inability of existing models to obtain a representation of the text that remains faithful to the details and query’s semantics.<\/AC32> <AC33>We demonstrate that NS3 achieves such faithfulness in the study in Figure 7, where we replace a single entity or a single action in samples and show that NS3 is more sensitive to this small change in semantics.<\/AC33> <AC34>We also have included additional experiments in the Appendix (Figures 9 and 10), which show that CodeBERT’s performance is roughly the same even when dealing with unseen actions and unseen entities<\/AC34>, <AC35>which confirms again that an individual unknown action or entity have low importance in the CodeBERT model while making a prediction, thus violating the faithfulness of the representation.<\/AC35>\n<AC36>We have updated the corresponding claims in the Introduction, when discussing the advantages and evaluation results, as well as in Limitation in Section 2.2<\/AC36>, and <AC37>hope it makes the paper more clear and sound.<\/AC37>\n\n```\n\n Global/general Response:\n```\nDear Reviewers,\n\nWe want to thank you for your careful comments and valuable suggestions. We were pleased to hear that the **following strengths** of our work have caught your eye:\n- **kn2F**: <AC38>very strong empirical results, including detailed evaluations and ablation studies.<\/AC38>\n- **FqUC**: <AC39>strong performance on an interesting problem<\/AC39>\n- **dTG5**: <AC40>strong performance achieved with an interesting solution using a combination of symbolic information from CCG parse and neural approach based on Transformer<\/AC40>\n- **SyPM**: <AC41>strong performance achieved on an interesting and novel application of neural module networks to a novel problem.<\/AC41>\n\nWe also are very grateful for constructive criticisms - we have received a number of great questions and suggestions for improvement of the paper. We hope that **our answers will clear your concerns** that we have outlined below, and <AC42>you will find that the overall quality of our submission has improved after making the following changes<\/AC42>:\n- **kn2F, FqUC, dTG5**: performance of the parser as well as its generalization capacity. <AC43>We have updated Appendix Section A.4 to include additional evaluations of the parser on a number of new code-search datasets.<\/AC43> <AC44>The datasets are comprised of English text and code in Python, as well
