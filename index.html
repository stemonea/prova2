 1.<\/AC22>\n\n[1]Rubner Y, Tomasi C, Guibas L J. The earth mover's distance as a metric for image retrieval[J]. International journal of computer vision, 2000, 40(2): 99-121.\n\n[2]Frogner C, Mirzazadeh F, Solomon J. Learning Embeddings into Entropic Wasserstein Spaces[C]//International Conference on Learning Representations. 2019.\n\n>**Q2**: \"It seems that this work is just an application work on a specific model and a specific task, which limits the contribution.\"\n\n**A2**: <AC23>Recently, large-scale pre-trained models have achieved great success and attracted a lot of attention.<\/AC23> <AC24>As a parallel paradigm with “pretraining-finetuning”, prompt learning shows the great potential to efficiently adopt pre-trained knowledge into downstream tasks.<\/AC24> <AC25>In this paper, we propose learning multiple comprehensive prompts for a more representative prompt learning.<\/AC25> <AC26>It is a plug-and-play module that can be easily extended to any baseline prompt learning method such as CoOp[3] or Tip-adapter[5].<\/AC26> <AC27>It can achieve orthogonal and complementary improvement over the baseline methods as shown in Table 2 and Table 3.<\/AC27>\n\n<AC28>Most existing methods[3,4,5] exploring how to adapt the pre-trained vision-language knowledge apply the few-shot recognization as the evaluation metric.<\/AC28> It is because that <AC29>few-shot recognization can effectively evaluate the adaptation ability of the method when only few-shot downstream data is available.<\/AC29> Besides, <AC30>the same few-shot recognization setting can provide a fair comparison with existing methods, such as CoOp[3].<\/AC30> <AC31>Some recent progress shows that the pre-trained vision-language knowledge can also be applied to other tasks, e.g. DenseCLIP[6] applies the pre-trained model to visual detection and segmentation.<\/AC31> <AC32>Our method also has potential for these applications.<\/AC32>\n\n[3]Zhou K, Yang J, Loy C C, et al. Learning to prompt for vision-language models[J]. arXiv preprint arXiv:2109.01134, 2021.\n\n[4]Gao P, Geng S, Zhang R, et al. Clip-adapter: Better vision-language models with feature adapters[J]. arXiv preprint arXiv:2110.04544, 2021.\n\n[5]Zhang R, Fang R, Gao P, et al. Tip-adapter: Training-free clip-adapter for better vision-language modeling[J]. arXiv preprint arXiv:2111.03930, 2021.\n\n[6]Rao Y, Zhao W, Chen G, et al. Denseclip: Language-guided dense prediction with context-aware prompting[C]//Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition. 2022: 18082-18091.\n\n>**Q3**: \"The recent related work CoCoOp is not compared in the experiments. \"\n\n**A3**: Thanks very much for this suggestion! <AC33>We have added the performance comparison in the experiments of the revised paper.<\/AC33> Please see updated Figure 3 for the details. <AC34>In the original submission, we didn’t add CoCoOp[7] in the experiments<\/AC34> because <AC35>the experimental settings of CoCoOp and our method were different: CoOp[3] and our method focus on the few-shot recognition task, while CoCoOp focuses on the generalization for the unseen new classes.<\/AC35> <AC36>For a fair comparison, we re-run CoCoOp in our experimental settings with the same backbone network.<\/AC36> The performance on all 11 datasets is shown in the updated Figure 3. <AC37>We found that in most datasets, our method achieved better performance than CoCoOp.<\/AC37> Besides, since <AC38>CoCoOp focuses on \"from base to new\" setting<\/AC38>, <AC39>its performance is even lightly slower than CoOp.<\/AC39>\n\n[7]Zhou K, Yang J, Loy C C, et al. Conditional prompt learning for vision-language models[C]//Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition. 2022: 16816-16825.\n\n>**Q4**: \"In the approach method, there lacks a separate part or subsection to introduce the inference strategy.\"\n\n**A4**: We appreciate this suggestion to help improve our paper. <AC40>We have added a subsection of inference strategy on page 5 of the updated version.<\/AC40> Below we give a more detailed introduction of the inference strategy.\n\n<AC41>During inference, the goal of the method is to classify the query images given the learned prompt and the pre-trained model.<\/AC41> <AC42>Given one image, we first feed it into the image encoder to obtain a set of local visual features.<\/AC42> Then, <AC43>we combine the learned prompts and the names of classes to get a set of prompt features.<\/AC43> <AC44>Specifically, the visual feature set contains M=HxW, which is 7x7, feature vectors, while the prompt feature set contains NxC feature vectors, where N is the number of local prompts and C is the number of classes (C=1000 in Imagenet).<\/AC44> Then, <AC45>we calculate the distance between the visual feature set and the prompt feature set of each class.<\/AC45> <AC46>To calculate the distance, we optimize the transport T to reweight the distance matrix.<\/AC46> <AC47>This transport T helps align the local visual features and multiple prompts for a fine-grained cross-modal matching.<\/AC47> <AC48>After obtaining the OT distance for each class, we sort the distance and classify the image into the class with minimal OT distance.<\/AC48>\n\n>**Q5**: \"It would be great if Table 2 can be split into several tables according to the analyzed component.\" & \"The visualization in Figure 4 is not clear.\"\n\n**A5**: Thank you! <AC49>This suggestion helped a lot to improve the readability of the paper.<\/AC49> <AC50>We split Table 2 into 2 tables for ablation studies and parameters analysis respectively.<\/AC50> Then <AC51>we darkened the color of the attention map in Figure 4 for clarity.<\/AC51> Please kindly see pages 7 and 9 in the revised paper for details.\n\n Global/general Response:\n```\nWe thank all reviewers for their thoughtful and constructive review of our manuscript. <AC52>We were encouraged to hear the reviewers think PLOT is “effective”(Reviewer fGe6), “reasonable”(Reviewer c3r2), and “well-motivated” (Reviewers bMB5 and c3r2), and that the effectiveness can be demonstrated with “comprehensive experimental analysis”(Reviewers fGe6, bMB5, and c3r2).<\/AC52> We provide a general response here to summarize the modifications of the manuscript.\n\n- To reviewer fGe6: <AC53>We have clarified the motivation and advantage of using Optimal Transport on page 2.<\/AC53>\n- To reviewer fGe6: <AC54>We have added the experimental comparison with CoCoOp in Figure 3.<\/AC54>\n- To reviewer fGe6: <AC55>We have added a subsection on page 5 to introduce the inference strategy of PLOT.<\/AC55>\n- To reviewer fGe6: <AC56>We have split Table 2 into 2 tables for ablation studies and parameters analysis respectively.<\/AC56>\n- To reviewer fGe6: <AC57>We have refined Figure 4 for clarity.<\/AC57>\n- To reviewer bMB5: <AC58>We have clarified our optimization strategy on page 5.<\/AC58>\n- To reviewer bMB5: <AC59>We have highlighted the capability of optimal transport for misalignment on page 2.<\/AC59>\n- To reviewer bMB5: <AC60>We have corrected the typos accordingly.<\/AC60>\n- To reviewer c3r2: <AC61>We have updated the explanation for the failure cases on page 7 and included more visualization results of the failure cases in Section F of the supplementary materials.<\/AC61>\n- To reviewer c3r2: <AC62>We have explicitly included the limitations in Section 4.4 based on previous discussions.<\/AC62>\n```"}, {"message_id": "Reviewer_fGe6 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Author Rebuttal Acknowledgement\nThank the authors for the comprehensive response and updated paper! <AC1>The detailed response addressed my concern<\/AC1>, and <AC2>I am happy to raise my rating.<\/AC2>"}, {"message_id": "Reviewer_fGe6 · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Thanks for raising the rating score\nThanks a lot for checking our response and the updated paper. <AC1>We are glad that our response and updated presentation have resolved your concerns regarding the motivation, contribution, and clarity of the paper.<\/AC1> <AC2>Your valuable comments have improved our presentation a lot and made the paper more readable.<\/AC2> Thank you very much!"}, {"message_id": "Reviewer_fGe6 · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I am very happy to have the above discussion with the author, <AC1>which has certainly made the work more robust.<\/AC1>"}]}]}, {"paper_id": "jAL8Rt7HqB", "decision": "Reject", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: Four reviewers provided detailed feedback on this paper. The authors responded to the reviews and I appreciate the authors' comments and clarifications, specifically that each question/comment is addressed in detail. <AC1>Additional experiments were also performed.<\/AC1> <AC2>The authors also uploaded a revised version of the paper.<\/AC2>\n\n<AC3>After the two discussion periods, one of the four reviewers suggest to reject the paper while three reviewers rate the paper as \"weak accept\"<\/AC3>, so <AC4>no reviewer strongly advocates for acceptance.<\/AC4> I considered the reviewers' and authors' comments and also tried to assess the paper directly. <AC5>I believe that the paper should not be accepted to NeurIPS in its current form.<\/AC5>\n\nWeaknesses include:\n* Readability: <AC6>While at least one reviewer describes part of the paper as \"clear and easy to follow\" one other reviewer mentions clarity as the main weakness<\/AC6> and <AC7>one other reviewer also comments in this direction.<\/AC7> <AC8>I personally found the paper hard to read as well (even after the improvements made in the revision)<\/AC8>, and <AC9>I found some of the claims to be fairly generic and partially not well supported.<\/AC9> E.g. \"resolve the issues of overfitting and lengthy training time of ViT\", or \"The proposed scheme preserves the original architecture of ViT, which results in its general employment regardless of the architecture of ViT.\"\n* Experimental Results: <AC10>Several questions have been raised regarding the experimental results (e.g. influence of the attention link, choice of hyperparameters).<\/AC10> <AC11>These have been addressed in the discussion<\/AC11>, but <AC12>it seems to me that they were at best partially resolved.<\/AC12>\n* Relation to distillation: <AC13>The results in the low-data regime rely on learning from a teacher model.<\/AC13> <AC14>This relation to distillation is recognized but somewhat under-explored.<\/AC14> <AC15>This could be a confounding factor in the analysis of the approach.<\/AC15> For example, <AC16>in one response, the authors argue that \"However, we believe our source of performance gain is due to transferring CNN's inductive bias with attention\".<\/AC16> <AC17>It remained somewhat unclear, whether this transfer would also hold when the CNN is not a more powerful teacher model.<\/AC17>\n\nStrengths include:\n* <AC18>The idea of regularizing the global token’s attention maps with the CNN activation maps is novel and interesting.<\/AC18>\n* <AC19>The reported experimental improvements in the low-data regime are interesting.<\/AC19>\n\n<AC20>Despite recommending the paper for rejection in its current form, I would like to encourage the authors to continue this line of work and present it again to the community with more focused discussions, insights (and possibly experiments).<\/AC20> <AC21>This is an interesting paper<\/AC21> and <AC22>it was evaluated to be close to (but below) the acceptance threshold.<\/AC22>\nconfidence: Less certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_DJ1i", "rating": [null, 6], "messages": [{"message_id": "Reviewer_DJ1i · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes a new knowledge distillation method to improve the training efficiency of ViT.<\/AC1> <AC2>More concretely, the weighted average of the attention maps in the student ViT model is regularized to approach the activation maps of the CNN teacher model, which is the so-called attention link.<\/AC2> <AC3>Based on the empirical observations, the paper further makes the link selective by only building relations between CNN activation maps and ViT attention maps at similar levels and excluding the attention maps at the high levels.<\/AC3> <AC4>Empirically, the proposed method is compared with DeiT, ConViT and other knowledge distillation methods on ImageNet or CIFAR10.<\/AC4> <AC5>In the setting of small-sized data, the attention link is shown to improve the test accuracy with shorter training time and less computation cost.<\/AC5>\nstrengths_and_weaknesses: Strengths:\n1. <AC6>The writing of Sections 1-3 is clear and easy to follow.<\/AC6>\n2. <AC7>The idea of regularizing the global token’s attention maps with the CNN activation maps is novel.<\/AC7>\n3. <AC8>In the setting of small-sized data, the improvements in accuracy and training time are impressive.<\/AC8>\n\nWeaknesses:\n(Please refer to the Questions section for more details.)\n1. <AC9>Some of the tables and figures lack elaboration in the caption.<\/AC9>\n2. <AC10>More empirical evidence is needed to support the superiority of the attention link.<\/AC10>\n\nquestions: 1. <AC11>In Natural Language Processing, knowledge distillation has also been widely adopted in transformer-based models to enhance training efficiency.<\/AC11> In particular, <AC12>MiniLM (Wang et al., 2020) and TinyBert (Jiao et al., 2019) also focus on the regularization of attention maps.<\/AC12> <AC13>I think it’s worth including this line of literature in Related Work.<\/AC13>\n2. <AC14>In Table 1, each CNN block level is associated with different numbers of ViT layer level.<\/AC14> And <AC15>beside the ViT layers at high level, the way how others are assigned to CNN block levels is also different between the alpha-link and the beta-link.<\/AC15> <AC16>I would appreciate it if there is any ablation study or verbal explanation on such a “non-intuitive” design.<\/AC16>\n3. <AC17>In Table 2, could you please explain what the two numbers in each cell stand for?<\/AC17> (<AC18>as it’s not clearly written in the caption or the main text.<\/AC18>)\n4. <AC19>In Figure 2, if my guess about the x-axis corresponding to the ViT layers is correct, I’m wondering how the weights of different heads within each layer are aggregated to produce the plot.<\/AC19> Besides, <AC20>as it’s hard to tell that the block diagonal is generally darker than the side in Figure 2(b) and (c), would you mind elaborating more on how to reach the conclusion that “the ViT attention maps are highly related to the CNN activation maps located at a similar level”?<\/AC20>\n5. <AC21>I would appreciate it if the authors could explain more about the argument in line 239 - “the inductive bias is hard to be trained without a large dataset”.<\/AC21>\n6. <AC22>As stated in Question 1, there are other knowledge distillations methods.<\/AC22> For example, <AC23>they may use a transformer as the teacher model instead of a CNN and also utilize the attention map regularization.<\/AC23> <AC24>I’m wondering whether it would be better to add the empirical comparison with these methods.<\/AC24>\nlimitations: Please refer to the Weakness and Questions section for details."}, {"message_id": "Reviewer_DJ1i · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: More empirical evidence to support the superiority of the attention link and explanation on selective-link design\nWe appreciate the reviewer found our work easy to follow, the idea is novel, with impressive results.\nWe answered the reviewer's comments as follows.\n\nW1. <AC1>Some of the tables and figures lack elaboration in the caption.<\/AC1>\n\n<AC2>We add the captions to tables and figures for readability<\/AC2>, and <AC3>all the boldfaced captions are entirely removed.<\/AC3>\n<AC4>If we have a chance to submit the camera-ready version, we are planning to hire professional proofreaders to improve the writing quality further.<\/AC4>\n\nW2. <AC5>More empirical evidence is needed to support the superiority of the attention link.<\/AC5>\n\n<AC6>As the empirical evidence to show the superiority of the proposed attention link, we perform three additional experiments.<\/AC6>\nFirst, <AC7>we empirically validate the effectiveness of the selective links including $\\alpha$-link and $\\beta$-link in the various scenarios with the comparison of the full link.<\/AC7> <AC8>$\\alpha$-link showed 1.5% better Top-1 accuracy than $\\beta$-link on ImageNet 5%.<\/AC8> <AC9>From the Figure 4 of supplementary materials, When the entire ImageNet dataset is used for training, $\\beta$-link shows faster convergence than Full-link while their final accuracy becomes similar to each other.<\/AC9> <AC10>This result is reasonable<\/AC10> because <AC11>the connection to the high-level heads in Full-link can be disconnected through the update.<\/AC11> <AC12>These empirical results can verify the hypothesis<\/AC12> since <AC13>$\\alpha$-link and $\\beta$-link are based on the two hypotheses.<\/AC13>\n\nSecond, <AC14>we additionally evaluate our framework through Weakly Supervised Object Localization (WSOL), which is frequently used to show space awareness~[1, 2].<\/AC14> <AC15>WSOL trains the network model to classify the input image and evaluates the localization of target objects.<\/AC15> <AC16>We determine the position of the target objects by averaging the entire attention maps of Eq.3.<\/AC16> <AC17>We measure the localization performance by using the Intersection of Union (IoU) in CUB-200-2011<\/AC17>, and the results are given in Table 10 in supplementary materials. We refer [2] for the evaluation method of WSOL. <AC18>Compared to DeiT, although the proposed algorithm shows only 1% performance improvement in Table 9 in supplementary materials, its localization accuracy is 53% higher than that of DeiT with IoU threshold 0.5 in Table 10 in supplementary materials<\/AC18>, <AC19>which validates the superiority of the attention link for space awareness.<\/AC19>\n\nThird, <AC20>in Figure 4 of supplementary material, we compare the learning curve of our approach with those of DeiT and ConViT.<\/AC20> <AC21>We can see that our knowledge distillation achieves 70% accuracy at about 50 epochs while the DeiT needs 120 epochs to reach the same accuracy.<\/AC21> <AC22>This result validates the rapid convergence of our approach, which comes from the correlation of the attention links in our hypothesis.<\/AC22>\n\nFinally, <AC23>we enumerate the attention weight changes according to the training epochs.<\/AC23> <AC24>As shown in Figure 5 of supplementary material, the initial attention weight spread out randomly goes to become correlated by the similar depth levels of ViT and CNN models.<\/AC24> Furthermore, <AC25>after 300 epochs of training, the attention weights connecting the CNN models with the heads of last depth levels in ViT models become decreased<\/AC25>, <AC26>which represents the reduced influence of CNN activation maps on the high-level ViT attention maps.<\/AC26> <AC27>We added the visualization and the discussions in the revised manuscript and the supplementary material.<\/AC27>\n\n[1] \"Learning Deep Features for Discriminative Localization\", Zhou et al. [2] \"Evaluating Weakly Supervised Object Localization Methods Right\", Choe et al.\n\nQ1. <AC28>In Natural Language Processing, knowledge distillation has also been widely adopted in transformer-based models to enhance training efficiency.<\/AC28> In particular, <AC29>MiniLM (Wang et al., 2020) and TinyBert (Jiao et al., 2019) also focus on the regularization of attention maps.<\/AC29> <AC30>I think it’s worth including this line of literature in Related Work.<\/AC30>\n\nWe appreciate the reviewer's recommendation, and <AC31>we add the previous studies to the related work section accordingly on lines 100-102.<\/AC31> <AC32>As the reviewer commented, the previous studies focus on the employment of knowledge distillation in natural language processing<\/AC32>, so <AC33>the target objectives are different from our proposed model.<\/AC33>\n\nQ2. <AC34>In Table 1, each CNN block level is associated with different numbers of ViT layer levels.<\/AC34> <AC35>Besides the ViT layers at a high level, the way how others are assigned to CNN block levels is also different between the alpha-link and the beta-link.<\/AC35> <AC36>I would appreciate it if there is any ablation study or verbal explanation on such a “non-intuitive” design.<\/AC36>\n\n<AC37>The weights of a full link are initialized by random values<\/AC37>, so <AC38>the training needs the initial computations to align the noisy weights letting the augmented attention maps be similar to the CNN activation map.<\/AC38>\nIn contrast, <AC39>when we utilize the selective attention link, the noisy links can be ignored at the initial training phase<\/AC39>, <AC40>which results in reduced computation and stable training.<\/AC40>\n<AC41>This leads to the improved performance of the selective attention link<\/AC41>, <AC42>which also validates the analyzed correlation between the CNN activation map and the ViT attention map.<\/AC42>\n\nIn addition, <AC43>we write down the pseudo-code for the selective attention link in the supplementary material.<\/AC43>\n\nQ3. <AC44>In Table 2, could you please explain what the two numbers in each cell stand for?<\/AC44> (<AC45>as it’s not clearly written in the caption or the main text.<\/AC45>)\n\n<AC46>To improve the readability, we entirely reorganize the tables and add captions to describe the values.<\/AC46>\n\nQ4. <AC47>In Figure 2, if my guess about the x-axis corresponding to the ViT layers is correct, I’m wondering how the weights of different heads within each layer are aggregated to produce the plot.<\/AC47> Besides, <AC48>as it’s hard to tell that the block diagonal is generally darker than the side in Figures 2(b) and (c), would you mind elaborating more on how to reach the conclusion that “the ViT attention maps are highly related to the CNN activation maps located at a similar level”?<\/AC48>\n\n<AC49>Yes. In figure 2, the x-axis corresponds to the ViT layers.<\/AC49> <AC50>To analyze the relations of two different architectures across layer depth, we head-wise averaged the absolute scale of link weights.<\/AC50> <AC51>We agree that those heatmaps are not strictly diagonal<\/AC51> but <AC52>show correlation along relative layer depth.<\/AC52> <AC53>This accords with previous work [*], which used cross-model Centered Kernel Alignment to check representation similarity between ViT and ResNet across layers.<\/AC53> <AC54>We add the captions to describe the plots.<\/AC54>\n\n[*] Maithra Raghu, Thomas Unterthiner, Simon Kornblith, Chiyuan Zhang, and Alexey Dosovitskiy. Do Vision transformers see like convolutional neural networks? ArXiv, abs/2108.08810, 2021.691\n\nQ5. <AC55>I would appreciate it if the authors could explain more about the argument in line 239 - “the inductive bias is hard to be trained without a large dataset”.<\/AC55>\n\n<AC56>From the sentence, we tried to emphasize the need for a large dataset for Vision Transformer without the inductive bias.<\/AC56> <AC57>A similar statement was mentioned in L21-L24.<\/AC57> <AC58>To clear out the misunderstanding, we revised the argument as 'semantic information that ignores the inductive bias is hard to be trained without a large dataset'.<\/AC58>\n\nQ6. <AC59>As stated in Question 1, there are other knowledge distillations methods.<\/AC59> For example, <AC60>they may use a transformer as the teacher model instead of a CNN and also utilize the attention map regularization.<\/AC60> <AC61>I’m wondering whether it would be better to add the empirical comparison with these methods.<\/AC61>\n\n<AC62>We agree that it is a probable approach.<\/AC62> However, <AC63>we believe our source of performance gain is due to transferring CNN's inductive bias with attention.<\/AC63> Also, <AC64>while one of our contributions is to reduce ViT's lengthy training time, using transformers as a teacher model would require more FLOPs and longer runtime.<\/AC64>"}, {"message_id": "Reviewer_DJ1i · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thank you for the response.\nI appreciate the authors' detailed responses. <AC1>My doubts / confusions have been cleared up.<\/AC1>"}, {"message_id": "Reviewer_DJ1i · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Dear reviewer DJ1i\nWe appreciate your feedback, and we are happy that our response was helpful to resolve your concerns and questions.\n\nBest regards,\nAuthors"}, {"message_id": "Reviewer_DJ1i · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I am pleased to have had the opportunity to discuss the points above with the author, <AC1>which has made the paper much stronger.<\/AC1>"}]}, {"i": 2, "name": "Reviewer_Fq3N", "rating": [6, 6], "messages": [{"message_id": "Reviewer_Fq3N · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper introduces a novel regularisation method to train ViT.<\/AC1> <AC2>Specifically, they rely on the activation features from a convolutional neural network to transfer the knowledge and augment the training of the vision transformer.<\/AC2> Furthermore, <AC3>they discuss how to select which links to keep during training in order to make the learning more efficient.<\/AC3> Finally, <AC4>they ablate and evaluate the approach on image datasets such as ImageNet and CIFAR.<\/AC4>\nstrengths_and_weaknesses: **Strengths**:\n\n- S1. <AC5>The approach is simple and effective.<\/AC5> <AC6>Authors join the advantages of CNNs and ViT with their augmentation procedure in order to make learning more efficient.<\/AC6> <AC7>I really like the simplicity of the approach<\/AC7>, <AC8>which also would make it more likely to be used by the community.<\/AC8>\n\n- S2. <AC9>Analysing the most important links is also one extra step in terms of efficiency.<\/AC9> <AC10>The paper does a good job introducing the overall intuition and the general method and then going into link selection.<\/AC10>\n\n- S3. <AC11>The results show how the approach can be specially useful for low data regimes.<\/AC11>\n\n- S4. <AC12>Most of previous works using transformers specially rely on very large datasets<\/AC12> while <AC13>this paper tackles the problem of training in a low data regime.<\/AC13>\n\n- S5. <AC14>Authors provide sufficient experimental evidence to answer the main questions in the paper.<\/AC14> <AC15>The ablation study is complete and useful for the reader.<\/AC15>\n\n**Weaknesses**\n- W1. <AC16>In my opinion the paper avoid the issue of the additional overhead of running the CNN alongside the transformer training.<\/AC16> <AC17>I think the comparison table should take that into account and report FLOPS or runtime for a complete picture.<\/AC17>\n\n- W2. <AC18>The methodology has only been used for classification.<\/AC18> However, <AC19>it seems like other task which require for awarness of the space would be a better fit for such a paper.<\/AC19> <AC20>I wonder if authors have considered evaluating on additional task.<\/AC20>\n\n- W3. <AC21>Authors evaluate on CIFAR and ImageNet, which are very saturated dataset at this point.<\/AC21> <AC22>Although I think the point of the paper is valid, I would appreciate additional evaluations.<\/AC22>\n\n- W4. <AC23>I am missing some qualitative comparison on *why* the techniques improve data efficiency.<\/AC23> <AC24>What is different in the learning curves?<\/AC24> <AC25>How do the attention weights change?<\/AC25>\n\n- W5. <AC26>Have the authors played a bit with the CNN architecture?<\/AC26> <AC27>I wonder if they could safe computation by running a very basic model.<\/AC27>\nquestions: My concerns are listed in the weaknesses section. I would expect authors to discuss:\n\n- <AC28>Include additional metrics in the table for a fair comparison with the baselines.<\/AC28> <AC29>What is the effect of the cost of running the CNN?<\/AC29>\n\n- <AC30>Have the authors considered other task beyond classification?<\/AC30>\n\n- <AC31>Have the authors considered using other datasets?<\/AC31>\n\n- <AC32>Have the authors considered including more qualitative analysis of the learned model compared to the baseline?<\/AC32>\nlimitations: <AC33>Although in the form authors claim that Section 6 discussed limitations, I do think it would be necessary to extend this discussion for the paper to be accepted.<\/AC33> <AC34>I see Section 6 as a conclusion but no specific mention to the limitation is done.<\/AC34>"}, {"message_id": "Reviewer_Fq3N · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Comparison table with additional task and additional evaluations\nWe appreciate your comments that our approach is simple but effective. <AC1>As the reviewer mentioned, we are expecting that the community can employ our approach to improve the training stability and efficiency of the ViT-based models.<\/AC1> Furthermore, the positive responses to our analysis and results have encouraged us to perform additional experiments with passion. <AC2>As the reviewer commented, we focus on the problem of ViT-based models in a low data regime<\/AC2>, and <AC3>we show reasonable results to solve the issue by using the attention maps of CNN models.<\/AC3> <AC4>We will add the discussion about limitations in the camera-ready version.<\/AC4>\n\nW1. <AC5>I think the comparison table should take that into account and report FLOPS or runtime for a complete picture.<\/AC5>\n\n| | DeiT-S | ConViT-S | AAL |\n|---|---|---|---|\n| Params | 22.4M | 27.8M | 22.5M |\n| FLOPs | 4.27G | 5.35G | 4.27G |\n| Runtime | 0.40 | 1.23 | 0.36 |\n| Teacher | RegNetY_160 | - | EfficientNet_B3 |\n| Params | 83.6 M | - | 12.2 M |\n| FLOPs | 15.9G | - | 0.98 G |\n\n<AC6>According to the reviewer's comment, we observed the training runtime and inference FLOPS.<\/AC6>\n<AC7>We measure the runtime by measuring the time for processing a batch with batch size 128 at the training phase.<\/AC7>\n<AC8>DeiT-S and AAL shares similar value in the number of parameters and FLOPs due to the minimal design of the attention augmentation module.<\/AC8>\n<AC9>As shown in table above, our framework shows the fastest runtime among the three comparisons including DeiT and ConViT<\/AC9>, <AC10>which validates the training efficiency of our framework.<\/AC10>\nFurthermore, <AC11>our approach needs 20.2\\% fewer inference FLOPS than ConViT even though they have similar performance.<\/AC11>\n\nW2. <AC12>I wonder if authors have considered evaluating on additional task.<\/AC12>\n\n<AC13>According to the reviewer's comment, we additionally evaluated our framework through Weakly Supervised Object Localization (WSOL), which is frequently used to show space awareness~[1].<\/AC13> <AC14>WSOL trains the network model to classify the input image and evaluates the localization of target objects.<\/AC14>\n<AC15>We determine the position of the target objects by averaging the entire attention maps of Eq.3.<\/AC15>\n<AC16>We measure the localization performance by using the Intersection of Union (IoU) in CUB-200-2011.<\/AC16> The results is shown in Table 10 of supplementary materials.\nWe refer [2] for the evaluation method of WSOL.\n<AC17>Compared to DeiT, although the proposed algorithm shows only 1\\% performance improvement, its localization accuracy is 53% higher than that of DeiT with IoU threshold 0.5<\/AC17>, <AC18>which validates the space awareness of our knowledge distillation scheme.<\/AC18>\n\n[1] \"Learning Deep Features for Discriminative Localization\", Zhou et al.\n[2] \"Evaluating Weakly Supervised Object Localization Methods Right\", Choe et al.\nW3. <AC19>I would appreciate additional evaluations.<\/AC19>\n\n<AC20>We perform the additional experiments by using CUB-200-2011 and Oxford Flowers 102 datasets<\/AC20>, <AC21>which are challenging due to their enormous categories and the lack of class-wise training data.<\/AC21>\n<AC22>As shown in Table 9 in supplementary material, the proposed framework shows much better performance than the previous studies<\/AC22>, <AC23>which validates its generality across various scenarios.<\/AC23>\nEspecially, <AC24>our approach shows an enlarged performance gap of 92.7\\% when the ViT model is randomly initialized<\/AC24>, <AC25>which shows its robustness in the absence of a well-trained model.<\/AC25>\n\nW4. <AC26>I am missing some qualitative comparisons on why the techniques improve data efficiency.<\/AC26>\n\n<AC27>As recommended by the reviewer, we qualitatively visualize the learning curve and the attention weights change to show the data efficiency.<\/AC27>\n<AC28>In Figure 4 of supplementary material, we compare the learning curve of our approach with those of DeiT and ConViT.<\/AC28> <AC29>We can see that our knowledge distillation achieves 70\\% accuracy at about 50 epochs while the two comparisons need at most 120 epochs for the same accuracy.<\/AC29>\nIn addition, <AC30>we enumerate the attention weight changes according to the training epochs.<\/AC30>\n<AC31>As shown in Figure 5 of supplementary material, the initial attention weight spread out randomly goes to become correlated by the similar depth levels of ViT and CNN models.<\/AC31>\nFurthermore, <AC32>after 300 epochs, the attention weights connecting the CNN models with the heads of last depth levels in ViT models become decreased<\/AC32>, <AC33>which represents the reduced influence of CNN activation maps on the high-level ViT attention maps.<\/AC33>\n<AC34>We added the visualization and the discussions in the revised manuscript and the supplementary material.<\/AC34>\n\nW5. <AC35>Have the authors played a bit with the CNN architecture?<\/AC35>\n\n<AC36>We use EfficientNet-b3 and ResNet34 as our teacher models, which are much smaller models than RegNetY-160 which is a teacher model of DeiT.<\/AC36>\n<AC37>Even though EfficientNet-b3 needs only 14.63\\% parameters compared with RegNetY-160, our model achieves better performance than DeiT<\/AC37>, <AC38>which validates its impressive training efficiency.<\/AC38>\nHowever, <AC39>to resolve the reviewer's concern, we perform the additional experiments where the teacher model of our approach is replaced by ResNet-18.<\/AC39>\n<AC40>For ImageNet 5\\%, the variant results in 55.0\\% and 78.9\\% for top-1 and top-5 accuracy, respectively.<\/AC40>\nThus, <AC41>even though ResNet-18 needs only 13.98\\% parameters compared with RegNetY-160, our approach still suppresses the performance of DeiT (34.8\\%\\&57.8\\%) by showing the performance gaps of 58\\% and 37\\%.<\/AC41>\n\nLimitations: <AC42>Lacking discussion of the potential limitations<\/AC42>;\n\n<AC43>Even with its training efficiency, the loss term of $L_{att}$ could feed the inductive bias of CNN models into the ViT models<\/AC43>, <AC44>which results in unnecessary regularization when sufficient training data is given.<\/AC44>\n<AC45>We ensure that our approach shows slightly less performance than ConViT because of this issue when the full ImageNet dataset is considered.<\/AC45>\n<AC46>Even though we relieve the issue by employing the decay rate of $\\lambda$, additional adaptation is required to effectively control the power of inductive bias from the CNN models.<\/AC46>\n<AC47>We are planning to solve the problem in our future work.<\/AC47>\n\n<AC48>The current framework can only handle one teacher model that is limited by one of the CNN models.<\/AC48>\nIn contrast, <AC49>when we can integrate multiple teacher models trained by various datasets, the performance generalization would be further improved.<\/AC49>\nIn addition, <AC50>the current model cannot consider the ViT-based teacher model<\/AC50>, <AC51>which limits the variety of the teacher model.<\/AC51>\n<AC52>Due to the simplicity of this work, we guess that employing the multiple teacher models is a reasonable approach<\/AC52>, so <AC53>we will extend this algorithm for the multiple teacher models even including the transformer-based models.<\/AC53>\n<AC54>If we have a chance to submit the camera-ready version, we will add these limitations to the paper.<\/AC54>"}, {"message_id": "Reviewer_Fq3N · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Rebuttal Response\nDear Reviewer,\n\ncould you please indicate that you have considered the authors' rebuttal? (E.g. by replying to the rebuttal or at least by using the \"Author Rebuttal Acknowledgement\".)\n\nThe [reviewer guidelines](https://nips.cc/Conferences/2022/ReviewerGuidelines) ask: \"Even if the author response didn’t change your opinion about the paper, please acknowledge that you have read and considered it.\"\n\nThank you!"}, {"message_id": "Reviewer_Fq3N · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Thanks!\nDear Authors,\n\n<AC1>After having read the rebuttal in detail, my concerns have been addressed<\/AC1> and <AC2>I recommend the acceptance of the paper.<\/AC2>\n\nBest wishes."}, {"message_id": "Reviewer_Fq3N · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "Title: Dear reviewer Fq3N\nThe authors appreciate the reviewer for their detailed review of our manuscript and positive feedback. <AC1>We are happy that our response has addressed your concerns.<\/AC1>\n\nBest regards,\n\nAuthors"}]}, {"i": 3, "name": "Reviewer_StQc", "rating": [6, 6], "messages": [{"message_id": "Reviewer_StQc · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper introduces a new method to increase data efficiency for Vision Transformers (VTs).<\/AC1> <AC2>The idea of the method is that Adaptive Attention Links (AAL) between the convolutional filters of a CNN and between the attention heads of the VT are trainable parameters which connect these feature maps between the teacher CNN and the student VT, with only a small parameter increase.<\/AC2> This way, <AC3>the locality inductive bias can be learned from the teacher model, decreasing training time.<\/AC3> <AC4>The paper confirms previous results that higher layer attention maps in a VT contain more high-level semantic information than a CNN, but that other layers roughly correspond to the same type of hierarchical information.<\/AC4> <AC5>Extensive experiments show that the method improves on previous distillation approaches between a CNN and a VT.<\/AC5>\nstrengths_and_weaknesses: S1: <AC6>The idea of the paper is novel, to the best of my knowledge.<\/AC6>\nS2: <AC7>The idea is clear and conceptually appealing.<\/AC7>\nS3: <AC8>The paper presents extensive experimentation to support its conclusions (a number of different datasets and variants of models).<\/AC8>\nS4: <AC9>The paper promotes better data efficiency for VTs, which is a well-known issue.<\/AC9>\nS5: <AC10>The paper presents ablations and one example of repeated runs which show stable results (this seems reasonable in order to save computation).<\/AC10>\nS6: <AC11>the method is flexible with regards to the VT student architecture, any model containing hierarchical attention maps can be used, as well as wrt the teacher model: any CNN containing hierarchical feature maps can be used.<\/AC11> <AC12>The down-stream task of the teacher model does not matter.<\/AC12>\n\nW1 <AC13>The main weakness of the paper, in my view, is its clarity.<\/AC13> <AC14>This can be straightforwardly fixed by doing a more thorough language check, for example by using Grammarly or similar.<\/AC14> <AC15>Many sentences are hard to parse, eg lines 320-321, 234-239.<\/AC15> Furthermore, <AC16>the captions to tables and figures should be more informative which would help the reading a lot<\/AC16>, <AC17>right now they are not possible to get the gist from without finding their reference in the text.<\/AC17> Also, <AC18>captions should not be boldfaced<\/AC18>, but that is a detail of course.\n\nW2, W3: <AC19>Other weaknesses are lacking mention of how the hyper parameters lambda were chosen, and a lacking discussion of the potential weaknesses of the method<\/AC19>— <AC20>this should be easily amendable.<\/AC20>\n\nW4: <AC21>No code is released.<\/AC21>\nquestions: 1. <AC22>How was lambda = 0.99 and 0.98 chosen? (L288)<\/AC22>\n2. <AC23>In lines 37-43, do you mean source dataset instead of target dataset?<\/AC23>\n3. <AC24>L175-176, did you find an improvement when using channel-wise attention maps compared to some aggregate version of attention maps?<\/AC24>\n4. <AC25>What is your interpretation of the augmented attention links, what do they represent?<\/AC25> <AC26>Is it mainly about their increased flexibility of representing the CNN maps?<\/AC26>\n5. <AC27>Are the X/Y results in the tables always teacher/student?<\/AC27>\n6. <AC28>What does attention maps “at a similar level” mean?<\/AC28> <AC29>At a similar layer depth?<\/AC29>\n7. <AC30>L266, when you say remarkable results, which results are you referring to then?<\/AC30> <AC31>If you say a strong word such as remarkable it should be clear what you mean, apart from that the result should be strong too, of course.<\/AC31>\n8. <AC32>L327-332: do you compare self-supervised approaches to your classically supervised approach here?<\/AC32> <AC33>Or do you make some kind of SS version of your approach?<\/AC33> <AC34>This is not clear<\/AC34>\n\nlimitations: <AC35>The choice of the hyper parameter lambda could be more accounted for (did it include tuning, etc).<\/AC35> <AC36>The authors do not state any potential limitations of their work<\/AC36>, <AC37>which seems a little worrying, perhaps, in terms of transparency.<\/AC37> <AC38>There are always limitations.<\/AC38> However, <AC39>if this can be added the work is sound.<\/AC39>"}, {"message_id": "Reviewer_StQc · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Choosing hyperparameters lambda and Interpretation of the augmented attention links\nWe appreciate that the reviewer said our idea is novel, clear, and conceptually appealing. In addition, the reviewer commented that our extensive experiment and ablation studies support our conclusion well. <AC1>As the reviewer mentioned, our approach is flexible with the student ViT models and the teacher CNN models.<\/AC1>\n\nW1. <AC2>The main weakness of the paper, in my view, is its clarity.<\/AC2>\n\nWe appreciate the recommendation, and <AC3>we revise the commented sentences accordingly.<\/AC3> In addition, <AC4>we add the captions to tables and figures for readability<\/AC4>, and <AC5>all the boldfaced captions are entirely removed.<\/AC5> <AC6>If we have a chance to submit the camera-ready version, we are planning to hire professional proofreaders to improve the writing quality further.<\/AC6>\n\nW2. <AC7>Another weakness are lacking of mention of how the hyperparameters lambda were chosen<\/AC7>\n\n<AC8>At every experiment, we set $\\lambda$ to $2000$<\/AC8>, and we are sorry for the missing initialization value of $\\lambda$.\n<AC9>To justify the value choice, we perform the ablation studies by changing the value of $\\lambda$ by $1500$, $2000$, and $2500$.<\/AC9>\n<AC10>In ImageNet 10%, we obtain top-1 accuracy of 56.5, 64.7, and 64.6 respectively for lambda=1500, 2000, 2500<\/AC10>, and <AC11>we acquire the best performance when $\\lambda$ is set to $2000$.<\/AC11>\nSince <AC12>$\\lambda$ controls the scale of the regularization loss term<\/AC12>, <AC13>its value highly correlates with the overfitting and the underfitting of the target model.<\/AC13> As a result, <AC14>the value of $\\lambda$ should be set to avoid both the overfitting and the underfitting issues<\/AC14>, and <AC15>we empirically found that the value of $\\lambda$ is a proper choice.<\/AC15> <AC16>Due to the lack of time, we fail to show various results<\/AC16>, but <AC17>we will supplement the ablation study with the additional values of in the final version.<\/AC17>\n\nW3. and <AC18>a lacking discussion of the potential weaknesses of the method<\/AC18>\n\n<AC19>Even with its training efficiency, the loss term of $L_{att}$ could feed the inductive bias of CNN models into the ViT models<\/AC19>, <AC20>which results in unnecessary regularization when sufficient training data is given.<\/AC20>\n<AC21>We ensure that our approach shows slightly less performance than ConViT because of this issue when the full ImageNet dataset is considered.<\/AC21>\n<AC22>Even though we relieve the issue by employing the decay rate of $\\lambda$, additional adaptation is required to effectively control the power of inductive bias from the CNN models.<\/AC22>\n<AC23>We are planning to solve the problem in our future work.<\/AC23>\n\n<AC24>The current framework can only handle one teacher model that is limited by one of the CNN models.<\/AC24>\nIn contrast, <AC25>when we can integrate multiple teacher models trained by various datasets, the performance generalization would be further improved.<\/AC25>\nIn addition, <AC26>the current model cannot consider the ViT-based teacher model<\/AC26>, <AC27>which limits the variety of the teacher model.<\/AC27>\n<AC28>Due to the simplicity of this work, we guess that employing the multiple teacher models is a reasonable approach<\/AC28>, so <AC29>we will extend this algorithm for the multiple teacher models even including the transformer-based models.<\/AC29>\n<AC30>If we have a chance to submit the camera-ready version, we will add these limitations to the paper.<\/AC30>\n\nW4: <AC31>No code is released.<\/AC31>\n\n<AC32>We release our code willingly if the paper is accepted.<\/AC32>\n\nQ1. <AC33>How was lambda = 0.99 and 0.98 chosen? (L288)<\/AC33>\n\n<AC34>As shown in Figure 5 of supplementary material, the ViT attention maps seem similar to the CNN activation maps at the related depth levels, while the relation becomes weakened as training goes on.<\/AC34>\nAccordingly, <AC35>we designed our approach to reduce the power of the attention-based knowledge distillation loss terms by employing the decay constant of $\\lambda$.<\/AC35>\nIn addition, <AC36>we perform the ablation study where the variant is built by fixing the decay constant with $0.99$.<\/AC36>\n<AC37>In ImageNet 50\\%, the variant with the fixed decay constant shows the performance of $77.8\\%$ and $93.8\\%$ for top-1 and top-5 accuracy, respectively, which are less than $78.9\\%$ and $94.5\\%$ of the proposed algorithm.<\/AC37>\n<AC38>This result shows that we can tune the decay constant to improve the efficiency of our approach<\/AC38>, <AC39>which would be analyzed in our future work.<\/AC39>\n\nQ2. <AC40>In lines 37-43, do you mean source dataset instead of target dataset?<\/AC40>\n\n<AC41>As the reviewer commented, the target dataset is a source dataset to train the final model.<\/AC41>\nHowever, <AC42>we found that the sentence is ambiguous to deliver our meaning<\/AC42>, so <AC43>we revised the entire sentence as follows<\/AC43>:\n<AC44>However, the previous studies have the remaining limitations where the training datasets must be equivalent for both the student and teacher models.<\/AC44>\nQ4. <AC45>What is your interpretation of the augmented attention links, what do they represent?<\/AC45>\n\n<AC46>For the detailed interpretation of the augmented attention links, we perform three additional experiments.<\/AC46>\nFirst, <AC47>we additionally evaluate our framework through Weakly Supervised Object Localization (WSOL), which is frequently used to show space awareness~[1, 2].<\/AC47>\n<AC48>WSOL trains the network model to classify the input image and evaluates the localization of target objects.<\/AC48>\n<AC49>We determine the position of the target objects by averaging the entire attention maps of Eq.3.<\/AC49>\n<AC50>We measure the localization performance by using the Intersection of Union (IoU) in CUB-200-2011 and Oxford Flower 102 datasets<\/AC50>, and the results are given in Table 9 in supplementary materials. We refer [2] for the evaluation method of WSOL.\n<AC51>Compared to DeiT, although the proposed algorithm shows only 1\\% performance improvement, its localization accuracy is 53% higher than that of DeiT with IoU threshold 0.5<\/AC51>, <AC52>which validates the superiority of the attention link for spatial awareness.<\/AC52>\n\nSecond, <AC53>in Figure 4 in supplementary materials, we compare the learning curve of our approach with those of DeiT and ConViT.<\/AC53>\n<AC54>We can see that our knowledge distillation achieves 70\\% accuracy at about 50 epochs while the two comparisons need more epochs for the same accuracy.<\/AC54>\n\nFinally, <AC55>we enumerate the attention weight changes according to the training epochs.<\/AC55>\n<AC56>As shown in Figure 5 in supplementary materials, the initial attention weight spread out randomly goes to become correlated by the similar depth levels of ViT and CNN models.<\/AC56>\nFurthermore, <AC57>after 300 epochs, the attention weights connecting the CNN models with the heads of last depth levels in ViT models become decreased<\/AC57>, <AC58>which represents the reduced influence of CNN activation maps on the high-level ViT attention maps.<\/AC58>\n<AC59>We added the visualization and the discussions in the revised manuscript and the supplementary material.<\/AC59>\n\n[1] \"Learning Deep Features for Discriminative Localization\", Zhou et al. [2] \"Evaluating Weakly Supervised Object Localization Methods Right\", Choe et al.\n\nQ5. <AC60>Are the X/Y results in the tables always teacher/student?<\/AC60>\n\nA5.\n<AC61>In Table 2, X/Y indicate Top-1/Top-5 test accuracy, respectively.<\/AC61>\n<AC62>In the column 'Gain' of Table 4, X and Y represent the performance gap between the previous study and ours.<\/AC62>\n<AC63>To clear out the misunderstanding, we entirely revise the structure of the tables and add the captions for the description.<\/AC63>\n\nQ6. <AC64>What does attention maps “at a similar level” mean?<\/AC64> <AC65>At a similar layer depth?<\/AC65>\n\nA6. <AC66>Yes, \"attention maps at a similar level” means the attention maps selected at similar layer depth of the respective architecture.<\/AC66>\n\nQ7. <AC67>L266, when you say remarkable results, which results are you referring to then?<\/AC67>\n\nA7.\n<AC68>We agree that the word 'remarkable' should be used more carefully.<\/AC68>\n<AC69>We refer to the remarkable results for the performance in the low-data regime, which outperforms DeiT and ConViT with large performance gaps.<\/AC69> However, <AC70>we think that the order of the table may cause your misunderstanding<\/AC70>, so <AC71>we reorganized the experimental sections and removed the strong words.<\/AC71>\n\nQ8. <AC72>L327-332: do you compare self-supervised approaches to your classically supervised approach here?<\/AC72> <AC73>Or do you make some kind of SS version of your approach?<\/AC73> <AC74>This is not clear<\/AC74>\n\nA8. <AC75>We compared self-supervised approaches to our classically supervised approach.<\/AC75> <AC76>We have yet to consider a self-supervised version of our approach<\/AC76>, but <AC77>we believe it is possible for our future work.<\/AC77>"}, {"message_id": "Reviewer_StQc · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thank you\nThank you to the authors for your detailed replies to my questions. <AC1>Having cleared my confusions, I recommend publication for the revised version of the article.<\/AC1>"}, {"message_id": "Reviewer_StQc · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Dear reviewer StQc\nThe authors appreciate your thorough feedback and recommendation for the revised version of the article. <AC1>We are happy that our answer to your questions have cleared the confusions.<\/AC1>\n\nBest regards, Authors"}, {"message_id": "Reviewer_StQc · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "It was a pleasure to engage in the above discussion with the author, <AC1>which has positively impacted the strength of this work.<\/AC1>"}]}, {"i": 4, "name": "Reviewer_xcGt", "rating": [3, 3], "messages": [{"message_id": "Reviewer_xcGt · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes a loss regularization method for training Vision Transformer (ViT) through matching the attention maps of ViT with the activation map of a pre-trained CNN.<\/AC1> <AC2>The authors aggregate ViT's attention maps from different layers into the number of CNN's activation maps<\/AC2> and then <AC3>use their L2 norm as the additional loss regularization of training ViT.<\/AC3> <AC4>It is shown that the proposed method can outperform the selected baseline on ImageNet when the number of training samples is small.<\/AC4>\nstrengths_and_weaknesses: Strengths\n<AC5>The idea of matching attention maps of ViT with the activation maps looks interesting<\/AC5>, and <AC6>the motivation behind this seems reasonable.<\/AC6>\n\nWeakness\n1. <AC7>How do the authors learn the w_c in Eq. 4, is it end-to-end trainable with Eq. 6 or learned separately?<\/AC7> Besides, <AC8>do the attention map (A_c) and activation map (B_c) in Eq. 5 have the same shape?<\/AC8> <AC9>If not, how do you address it?<\/AC9>\n2. <AC10>The computation complexity of Eq. 4 is also a concern.<\/AC10> <AC11>Since w_c is posed for each pixel in A_(m,n), the complexity of w_c will grow exponentially as P or the number of layers in ViT grows.<\/AC11> <AC12>How will it perform when facing larger or deeper ViT models?<\/AC12>\n3. I have checked the manuscript, but <AC13>I cannot find the initialization value of λ in Eq. 6.<\/AC13> <AC14>Please include it and justify the value choice<\/AC14> as <AC15>it is an important hyper-parameter.<\/AC15>\n4. <AC16>The current description of the experimental setting and results, in my opinion, is difficult for the readers to understand.<\/AC16> <AC17>Please re-organize it - first describe the dataset and different experiment settings, and then explain the results one by one.<\/AC17>\n5. <AC18>I don't think Figure 2 is sufficient to support the two hypotheses in 4.1.<\/AC18> Besides, <AC19>the selective attention link should be discussed in more detail, e.g. why it can achieve better results than the full link.<\/AC19>\n6. <AC20>Please clarify whether the baseline model in Table 4 has been trained with a teacher model or not.<\/AC20> <AC21>If not, the comparison may not be fair.<\/AC21> Besides, <AC22>it seems the performance cannot outperform the ConViT with the full train set<\/AC22>, and therefore <AC23>the generality to large-scale data is in doubt.<\/AC23>\n\nOverall, <AC24>although the idea of this paper is interesting, the methodology is not explained or designed properly<\/AC24>, <AC25>the descriptions of the current experimental settings and results are difficult to read<\/AC25>, and also <AC26>the achieved performance is not convincing.<\/AC26> <AC27>I don't think this paper can be accepted<\/AC27>, and <AC28>I tend to vote for rejection.<\/AC28>\nquestions: See weaknesses above.\nlimitations: <AC29>I didn't check but I don't think this work will lead to a potential negative societal impact<\/AC29>"}, {"message_id": "Reviewer_xcGt · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: <AC1>Attention link is end-to-end trainable.<\/AC1> <AC2>Activation maps are resized with bi-cubic interpolation.<\/AC2> <AC3>We set $\\lambda$ to $2000$ at every experiment scenario.<\/AC3>\nWe appreciate the reviewer's comment that our method is interesting and its motivation is reasonable. <AC4>We respond to every comment with the additional experiments<\/AC4>, and <AC5>we revised the paper and added the supplementary material accordingly.<\/AC5>\n\nQ1. <AC6>Is $w_c$ in Eq.4 end-to-end trainable with Eq.6?<\/AC6>\n\nA1. <AC7>Yes, the adaptive attention link that is $w_c$ in Eq.4 is trained in the end-to-end scheme with Eq.6.<\/AC7>\n<AC8>Since $A_c^+$ is differentiable by $w_c$, $L_{att}$ of Eq.5 directly updates $w_c$ to reduce the L2 distance between the CNN activation map and the augmented attention map .<\/AC8>\nMeanwhile, <AC9>$L_{ce}$ also affects indirectly the update of $w_c$ due to its influence on the ViT attention map ($A$) in Eq.4.<\/AC9>\n\nQ2. <AC10>Do the attention map ($A_c$) and activation map ($B_c$) in Eq.5 have the same shape?<\/AC10>\n\nA2. <AC11>From Eq.3, the spatial size of ViT attention map ($A_c$) is defined by $(P\\times P)$ where $P^2$ is the number of initial input patches.<\/AC11>\nThus, <AC12>we resize each CNN activation map ($B_c$) by using bi-cubic interpolation to be $(P\\times P)$.<\/AC12>\n<AC13>The resizing steps are described in lines 179-181<\/AC13>, but <AC14>we revise the sentence to mention the bi-cubic interpolation.<\/AC14>\n\nQ3. <AC15>The computation complexity of Eq.4 is also a concern.<\/AC15> <AC16>Since $w_c$ is posed for each pixel in $A_(m,n)$, the complexity of $w_c$ will grow exponentially.<\/AC16>\n\nA3. <AC17>The sub-indices $(m,n)$ of attention link $w_c$ and the attention maps $A_c$ are the indices for the self-attention head and level depth, respectively.<\/AC17>\nThus, <AC18>the size of $w_c$ is determined by the channel depth size of the CNN model and the number of self-attention heads in ViT model, which is irrelevant to the spatial size of the attention map.<\/AC18>\n<AC19>We found that the missing definitions of $M$ and $N$ cause ambiguity<\/AC19>, so <AC20>we add the definitions below Eq.4.<\/AC20>\nFurthermore, <AC21>as we mentioned in line 298, $w_c$ needs only 0.068M additional parameters which are quite small compared to the parameter size of conventional ViT models.<\/AC21>\n\nQ4. <AC22>Please include the initialization value of $\\lambda$ in Eq.6 and justify the value choice<\/AC22> as <AC23>it is an important hyper-parameter.<\/AC23>\n\nA4. <AC24>We set $\\lambda$ to $2000$ at every experiment scenario<\/AC24>, and we are sorry for the missing initialization value of $\\lambda$.\n<AC25>To justify the value choice, we perform the ablation studies by changing the value of $\\lambda$ by $1500$, $2000$, and $2500$ for ImageNet 10\\%.<\/AC25>\n<AC26>In ImageNet 10%, we obtain top-1 accuracy of 56.5, 64.7, and 64.6 respectively for lambda=1500, 2000, 2500<\/AC26>, and <AC27>we acquire the best performance when $\\lambda$ is set to $2000$.<\/AC27>\nSince <AC28>$\\lambda$ controls the scale of the regularization loss term<\/AC28>, <AC29>its value highly correlates with the overfitting and the underfitting of the target model.<\/AC29>\nAs a result, <AC30>the value of $\\lambda$ should be set to avoid both the overfitting and the underfitting issues<\/AC30>, and <AC31>we empirically found that the value of $2000$ is a proper choice.<\/AC31>\n<AC32>Due to the lack of time, we fail to show various results<\/AC32>, but <AC33>we will supplement the ablation study with the additional values of $\\lambda$ in the final version.<\/AC33>\nQ5. <AC34>First describe the dataset and different experiment settings, and then explain the results one by one.<\/AC34>\n\nA5. We appreciate the recommendation, and <AC35>we entirely rewrote and reorganized the experiment section accordingly.<\/AC35> The reviewer can refer to the red lines of the submitted revised paper.\n\nQ6. <AC36>I don't think Figure 2 is sufficient to support the two hypotheses in 4.1.<\/AC36>\n\nA6. <AC37>For the detailed interpretation of the augmented attention links, we perform four additional experiments.<\/AC37>\n\nFirst, <AC38>we empirically validate the effectiveness of the selective links including $\\alpha$-link and $\\beta$-link in the various scenarios with the comparison of the full link.<\/AC38> <AC39>$\\alpha$-link showed 1.5\\% better Top-1 accuracy than $\\beta$-link on ImageNet 5\\%.<\/AC39>\n<AC40>From the Figure 4 of supplementary materials, When the entire ImageNet dataset is used for training, $\\beta$-link shows faster convergence than Full-link while their final accuracy becomes similar to each other.<\/AC40>\n<AC41>This result is reasonable<\/AC41> because <AC42>the connection to the high-level heads in Full-link can be disconnected through the update.<\/AC42>\n<AC43>These empirical results can verify the hypothesis<\/AC43> since <AC44>$\\alpha$-link and $\\beta$-link are based on the two hypotheses.<\/AC44>\n\nSecond, <AC45>we additionally evaluate our framework through Weakly Supervised Object Localization (WSOL), which is frequently used to show space awareness~[1, 2].<\/AC45>\n<AC46>WSOL trains the network model to classify the input image and evaluates the localization of target objects.<\/AC46>\n<AC47>We determine the position of the target objects by averaging the entire attention maps of Eq.3.<\/AC47>\n<AC48>We measure the localization performance by using the Intersection of Union (IoU) in CUB-200-2011<\/AC48>, and the results are given in Table 10 in supplementary materials.\nWe refer [2] for the evaluation method of WSOL.\n<AC49>Compared to DeiT, although the proposed algorithm shows only 1\\% performance improvement in Table 9 in supplementary materials, its localization accuracy is 53\\% higher than that of DeiT with IoU threshold 0.5 in Table 10 in supplementary materials<\/AC49>, <AC50>which validates the superiority of the attention link for space awareness.<\/AC50>\n\nThird, <AC51>in Figure 4 of supplementary material, we compare the learning curve of our approach with those of DeiT and ConViT.<\/AC51>\n<AC52>We can see that our knowledge distillation achieves 70\\% accuracy at about 50 epochs while the DeiT needs 120 epochs to reach the same accuracy.<\/AC52> <AC53>This result validates the rapid convergence of our approach, which comes from the correlation of the attention links in our hypothesis.<\/AC53>\n\nFinally, <AC54>we enumerate the attention weight changes according to the training epochs.<\/AC54>\n<AC55>As shown in Figure 5 of supplementary material, the initial attention weight spread out randomly goes to become correlated by the similar depth levels of ViT and CNN models.<\/AC55>\nFurthermore, <AC56>after 300 epochs of training, the attention weights connecting the CNN models with the heads of last depth levels in ViT models become decreased<\/AC56>, <AC57>which represents the reduced influence of CNN activation maps on the high-level ViT attention maps.<\/AC57>\n<AC58>We added the visualization and the discussions in the revised manuscript and the supplementary material.<\/AC58>\n\n[1] \"Learning Deep Features for Discriminative Localization\", Zhou et al.\n[2] \"Evaluating Weakly Supervised Object Localization Methods Right\", Choe et al.\n\nQ7. <AC59>The selective attention link should be discussed in more detail, e.g. why it can achieve better results than the full link.<\/AC59>\n\nA7. <AC60>The weights of the full link are initialized by random values<\/AC60>, so <AC61>the training needs the initial computations to align the noisy weights letting the augmented attention maps be similar to the CNN activation map.<\/AC61>\nIn contrast, <AC62>when we utilize the selective attention link, the noisy links can be ignored at the initial training phase<\/AC62>, <AC63>which results in reduced computation and stable training.<\/AC63>\n<AC64>This leads to the improved performance of the selective attention link<\/AC64>, <AC65>which also validates the analyzed correlation between the CNN activation map and the ViT attention map.<\/AC65>\n\nIn addition, <AC66>we write down the pseudo-code for searching the selective attention link in supplementary material.<\/AC66>\nQ8. <AC67>Clarify whether the baseline model in Table 4 has been trained with a teacher model or not.<\/AC67> <AC68>If not, the comparison may not be fair.<\/AC68>\n\nA8. <AC69>Among the compared algorithms, DeiT is trained with a teacher model of RegNetY-16GF, which is a CNN model showing better performance than our teacher models such as EfficientNet-b3 and ResNet-34.<\/AC69>\n<AC70>Even though the base model of ConViT does not use the teacher model, their supplementary material reports that the hard knowledge distillation for ConViT shows an ignorable improvement in performance compared to accuracy gain in DeiT.<\/AC70>\n\nIn addition, we show comparision table for baseline models.\n\n| | DeiT-S | ConViT-S | AAL |\n|---|---|---|---|\n| Params | 22.4M | 27.8M | 22.5M |\n| FLOPs | 4.27G | 5.35G | 4.27G |\n| Runtime | 0.40 | 1.23 | 0.36 |\n| Teacher | RegNetY_160 | - | EfficientNet_B3 |\n| Params | 83.6 M | - | 12.2 M |\n| FLOPs | 15.9G | - | 0.98 G |\n\n<AC71>We measure the runtime by measuring the time for processing a batch with batch size 128 at the training phase.<\/AC71>\n<AC72>DeiT-S and AAL shares similar value in the number of parameters and FLOPs due to the minimal design of the attention augmentation module.<\/AC72>\n<AC73>As shown in table above, our framework shows the fastest runtime at training phase which includes the inference of teacher CNN among the three comparisons including DeiT and ConViT.<\/AC73> <AC74>This additionally validates the training efficiency of our framework.<\/AC74>\nFurthermore, <AC75>our approach needs 20.2\\% fewer inference FLOPS than ConViT even though they have similar performance.<\/AC75>\n\nQ9. <AC76>It seems the performance cannot outperform the ConViT with the full train set<\/AC76>, and therefore <AC77>the generality to large-scale data is in doubt.<\/AC77>\n\nA9.\n<AC78>As we mentioned in the introduction section, our main objective is to improve the data efficiency and training load of ViT models.<\/AC78>\nAccordingly, <AC79>we successfully show the impressive gain in performance when insufficient data is given for the training as shown in the first rows in Table 2.<\/AC79>\n<AC80>We show the experimental results using the large-scale data to verify that the proposed algorithm is not harmful even for the large-scale data<\/AC80>, <AC81>which is important for its generality to the various scenarios.<\/AC81>\nInterestingly, <AC82>our model shows similar performance to ConViT even though its model size is 22.3\\% less than that of ConViT<\/AC82>, <AC83>which also verifies its training efficiency.<\/AC83>"}, {"message_id": "Reviewer_xcGt · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thanks for the detailed response\nI thank the authors for the detailed response, <AC1>which have cleared parts of my initial concerns.<\/AC1> However, <AC2>I am still concerned about whether the revised manuscript can be improved significantly and satisfyingly in such a short time, with so many modifications to make.<\/AC2>"}, {"message_id": "Reviewer_xcGt · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Dear reviewer xcGt\nThe authors appreciate your feedback and are happy that your initial concerns have been resolved.\n<AC1>We updated the revised version of the paper with supplementary materials which are currently accessible on this page.<\/AC1>\nThe authors would be thankful to the reviewer if the reviewer could check the revised version of the article.\n<AC2>As the reviewer commented, during the short rebuttal time, we had no choice other than to focus on the revision of experimental parts in the paper.<\/AC2>\nHowever, <AC3>we are continually working on polishing the paper with a thorough language check<\/AC3>, and <AC4>we are sure that we can finalize the revised version according to the feedback from every reviewer.<\/AC4>\n<AC5>If we have a chance to submit the camera-ready version, we are planning to hire professional proofreaders to improve the writing quality further.<\/AC5>\n\nBest regards,\n\nAuthors"}, {"message_id": "Reviewer_xcGt · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I am glad to have had the above discussion with the author, <AC1>which has certainly made the work more robust.<\/AC1>"}]}]}, {"paper_id": "zkk_7sV6gm8", "decision": "Reject", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>After careful consideration, I feel I must reject this paper.<\/AC1> <AC2>This paper essentially proposes a specific hierarchical structure onto the action space for a specific set of MDPs (which motivated the paper), where all actions apart from one (the 'do nothing' action) incur some cost.<\/AC2>\n\n<AC3>The proposed mechanism is a reasonable solution technique for such problems.<\/AC3> But <AC4>the fact that hierarchical methods for specific problems that inject a form of domain knowledge are somewhat better than methods that do not has been shown many times<\/AC4>, and <AC5>is unsurprising.<\/AC5>\n\n<AC6>The proposed method is, for instance, brittle to slight variations of the problem<\/AC6>: <AC7>what if some actions sometimes do or do not incur costs, for instance, rather than there being one clear such action?<\/AC7> <AC8>If you do nothing to a robot and it then falls off the table, does or does that not count as an immediate cost?<\/AC8> Also, <AC9>the framing of the paper excludes the 'do nothing' action from the 'original' action space, which - as discussed with reviewers - is a strange framing<\/AC9>: <AC10>why was a valid action, which apparently is often the optimal choice, excluded from the original action space?<\/AC10> And, more importantly, <AC11>what if we just add it back?<\/AC11>\n\n<AC12>I found the explanations of the authors for why to use the proposed mechanism rather than considering the flat action space to be ultimately unconvincing and, more importantly, rather domain specific and brittle.<\/AC12> <AC13>One could argue that the proposed mechanism is sometimes a useful inductive bias, for some problems<\/AC13>, <AC14>which is not very surprising.<\/AC14> <AC15>Other action decompositions will be useful for other problems.<\/AC15>\n\nUltimately, I think the paper should 1) <AC16>make a better case for why and when this particular hierarchy is important and beneficial compared to just allowing the system to decide for itself when to take each action (including the 'do nothing' action)<\/AC16>, 2) <AC17>should be more upfront about limitations (e.g., when is this particular inductive bias a bad idea, rather than beneficial?)<\/AC17>, and 3) <AC18>position itself better in existing work (e.g., show more awareness about prior hierarchical approaches<\/AC18> - <AC19>I would argue this is not really a 'novel method', but instead a specific instance of a hierarchical RL system).<\/AC19>\n\n<AC20>I will therefore suggest to reject the paper so that the authors have an opportunity to use these comments to improve the paper.<\/AC20>\nconfidence: Less certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_A4kA", "rating": [6, 6], "messages": [{"message_id": "Reviewer_A4kA · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes an algorithm for finding the optimal policy in sequential decision problems where there is a cost associated with taking an action.<\/AC1> <AC2>At each timestep, the agent can choose to perform an action or do nothing.<\/AC2> <AC3>LICRA learns two RL policies: one for deciding when to act, and another for taking actions.<\/AC3> <AC4>By first learning when to act, the complexity of the problem is reduced compared to standard RL configurations.<\/AC4>\nstrengths_and_weaknesses: #### Originality\n<AC5>The authors present a novel method for impulse control using two RL policies.<\/AC5>\n\n#### Quality\n<AC6>The paper does a nice job of showcasing practical applications of LICRA in environments such as finance and autonomous driving.<\/AC6> I did not examine the proofs in the appendix very closely, but <AC7>the results seem to follow.<\/AC7>\n\n<AC8>I think the related work section is lacking descriptions and citations for related problem settings such as RL safety and hierarchical RL.<\/AC8> <AC9>Many of these works use a safety policy or high-level policy to intervene the lower-level policy during training.<\/AC9> <AC10>Since LICRA trains two RL processes, it would be interesting to see how it compares to other methods that do the same.<\/AC10>\n\n#### Clarity\n<AC11>The paper is well structured and easy to understand.<\/AC11> <AC12>Algorithm 1 presents a procedure that should be easy to implement with standard auto-differentiation libraries.<\/AC12> <AC13>During the exposition of LICRA, the authors state that adding the zero action is not a good solution to impulse control.<\/AC13> <AC14>I think a small motivational example could be good for demonstrating this.<\/AC14>\n\n##### Nits\n* <AC15>The last paragraph of the introduction should be rewritten for grammar and clarity<\/AC15>\n* Line 28: result \"in\" catastrophic losses\n* Line 56: series of results\n* Line 82: form of\n* Line 90: task is to\n* Line 135: not significantly impact\n* Line 190: $P(\\cdot ; a_{\\tau_k}, s_{\\tau_k})$\n\n#### Significance\n<AC16>The results are useful for applications involving impulse control.<\/AC16> <AC17>Researchers or practitioners may use LICRA due to its effectiveness and how easy it is to implement in practice.<\/AC17>\nquestions: * <AC18>In Figure 1, what are the measures of centrality and spread for the different algorithms?<\/AC18> <AC19>How many random seeds were used?<\/AC19> <AC20>How much hyperparameter tuning was necessary to achieve the results shown.<\/AC20> <AC21>Same questions for Figures 2 and 3.<\/AC21>\n* <AC22>Please provide brief descriptions of each baseline algorithm used, and why they were chosen to be compared with LICRA.<\/AC22>\n* <AC23>What do minibatches refer to in Appendix 12?<\/AC23>\n* <AC24>What do optimization epochs refer to in Appendix 12?<\/AC24>\n* <AC25>In Appendix 12, there are no hyperparameters in square brackets following the notice in the second sentence.<\/AC25> <AC26>This section seems very incomplete to me.<\/AC26> <AC27>The SAC and PPO variants of LICRA should have different sets of hyperparameters.<\/AC27> <AC28>Are these hyperparameters also used for the baseline algorithms?<\/AC28> <AC29>Are these hyperparameters the same for both $\\pi$ and $g$?<\/AC29>\n* <AC30>Are the costs included in the Average Episodic Return reported in the figures?<\/AC30> <AC31>It could be insightful to compare the baselines using the vanilla reward.<\/AC31>\nlimitations: <AC32>I think the potential limitations of LICRA should be discussed in more detail.<\/AC32> <AC33>The experimental environments chosen are very well suited to LICRA<\/AC33> since <AC34>they involve the agent positioning itself in a certain configuration (e.g., spaceship over the goal in lunar lander) and maintaining that configuration by not acting.<\/AC34> <AC35>It would be nice to see how LICRA performs in environments that are less suited to it.<\/AC35> For example, <AC36>what about tasks where the agent should be acting “most” of the time, making it harder for $g$ to learn the few states where it should intervene?<\/AC36>"}, {"message_id": "Reviewer_A4kA · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to the reviewer A4kA\nWe thank the reviewer for their reading and many insightful comments. <AC1>We are glad the reviewer appreciates the clarity of the paper and the plug \\& play aspect which allows for quick implementation.<\/AC1> We address the reviewer's comments and questions individually.\n> Measures of centrality and spread, number of seeds\n\n#### Answer: <AC2>The line indicates mean performance and the shaded area is one standard deviation.<\/AC2> <AC3>For Merton problem, all algorithms were trained 5 times for 5 different seeds.<\/AC3> <AC4>For Drive environment problem, all algorithms were trained 3 times for 3 different seeds.<\/AC4> <AC5>For LunarLander environment, all algorithms were trained 5 times for 5 different seeds.<\/AC5> We apologise for not displaying this clearly and <AC6>will update the script accordingly.<\/AC6>\n\n> Brief descriptions of each baseline algorithm used, and why they were chosen\n\n#### Answer: Thanks for the suggestion. <AC7>We will now update the paper to include these details.<\/AC7>\n\n> \"Minibatches\" and \"optimization epochs\" in Appendix 12?\n\n#### Answer: Apologies for this oversight. <AC8>Minibatches mean the sampled batches of experince for mini-batch learning process.<\/AC8> <AC9>Epochs mean the times of PPO updates in a paramter optimization process (not necessary to set for SAC).<\/AC9>\n\n> Missing information on hyperparameters\n\n#### Answer: We apologise for this oversight. <AC10>For LunarLander experiment, PPO and SAC use the same set of hyperparameters while PPO should consider some extra hyperameters (i.e., number of PPO epoches, whether to use GAE).<\/AC10> <AC11>These hyperparameters are also used for the baseline algorithms, which are the same for both $\\pi$ and $g$.<\/AC11>\n\n> Are the costs included in the Average Episodic Return reported in the figures?\n\n#### Answer:\n<AC12>Yes, the average episodic return includes both the reward and cost.<\/AC12>\n Global/general Response:\n```\nWe would like to thank the reviewers for their careful reading and insights that have improved the paper with more comprehensive analyses. Additionally, we thank the reviewers who have expressed their appreciation of the importance of the problem we tackle and the clarity of our exposition.\n\n<AC13>The purpose of the paper is to introduce a framework within reinforcement learning that easily incorporates existing methods enabling them to efficiently solve problems in which the controller faces costs for taking actions.<\/AC13> <AC14>Our experiments verify our claim that such technology improves RL performance and enables RL methods to consistently solve problems of this kind where existing methods perform badly and may sometimes even fail.<\/AC14>\n\n**We outline some of the items we have now added to the manuscript to complement the already in-depth analyses we have performed in the paper:**\n\n* **<AC15>Comprehensive empirical analysis to validate the convergence theorems of LICRA Q learning variant (Theorem 2 and Theorem 3) (see Section 12 of the supplementary material)<\/AC15>**\n* **<AC16>New variants of LICRA to fully demonstrate LICRA's plug \\& play capabilities.<\/AC16>**\n* **<AC17>Suite of new baselines to verify the claim that LICRA outperforms current state-of-the-art RL methods.<\/AC17>**\n* **<AC18>Additional details relating to experimental settings.<\/AC18>**\n\n<AC19>These analyses now support the suite of ablation studies that yield insights into the behaviour of the policies LICRA generates (see Ablation study 1) and LICRA's behaviour when faced with different forms of costs (see Ablation study 2).<\/AC19>\n\n<AC20>We also restructured the experiment section in order to bring the insights gained in the ablation studies into the main body.<\/AC20>\n\nIn our updated version, we will also add:\n\n* **<AC21>Experiments to validate the claim that when the subregion of the state space in which the agent is required to act (intervention region) is relatively small, LICRA's approach vastly improves efficiency.<\/AC21>**\n\n**EDIT: <AC22>This has now been added<\/AC22> - please see Sec. 11.2 of the supplementary material.**\n\nWe hope the reviewers appreciate the updates to our paper.\n\n**EDIT: <AC23>We believe we have now resolved **all** the reviewers' questions including the very in-depth inspection of our theoretical analyses (see the points raised and inspection by reviewer UN8M) and each of the claims made about our framework each of which are now supported by empirical results some of which were added at the request of the reviewers.<\/AC23>**\n\n```"}, {"message_id": "Reviewer_A4kA · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "te
