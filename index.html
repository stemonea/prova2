elow).\n\nquestions: Some comments / questions:\n\ntwo related comments first\n* <AC17>eta_x should depend on the conditioning end observation.<\/AC17>\n<AC18>If you drop this dependency, you are not sampling from the conditioned SDE.<\/AC18>\n<AC19>In your experiment (L252), you drop this dependency.<\/AC19> <AC20>Is this a typo, a design choice, an approximation?<\/AC20>\n\n* L159: \"In practice, we will let the three sources of randomness be independent of each other.\"\n<AC21>What is lost with that approximation (is it an approximation)?<\/AC21> <AC22>If you choose T large, then the process reverts to the prior (independent of Y), stationary distribution of the uncontrolled SDE.<\/AC22>\n<AC23>Is it what you do?<\/AC23>\n\n* <AC24>The result section, shows that the learned control matches the exact control on a linear SDE scenario.<\/AC24>\n<AC25>Many details are missing<\/AC25>, <AC26>an appendix with those would be great.<\/AC26>\n<AC27>as a reader, I don't want to have to fill all the gaps. Even less as a reviewer.<\/AC27>\nFor example, <AC28>for OU, you could give the exact expression for h, and v.<\/AC28>\n\n* <AC29>The proposed objective seems to contain the control on both side of the square loss, the V_T and the log g(..).<\/AC29>\n<AC30>I do not really understand or see why the optimal control is a minimizer of objective.<\/AC30>\n<AC31>It also feels like hitting a moving target.<\/AC31>\n\n* <AC32>It would be good to have a discussion of this optimization problem.<\/AC32>\nFor example, <AC33>how do the dynamics of learning look like?<\/AC33>\n\n* <AC34>Could you be more precise on which variables you are taking expectations over and why?<\/AC34>\n<AC35>This is important for the loss.<\/AC35>\n\n* Also <AC36>could you give a justification for the 'stop gradient' comment?<\/AC36>\n<AC37>You have a loss that has multiple dependence on c and you decide to only propagate through one part.<\/AC37>\n\n* CDT algorithm, <AC38>it would help to have a more detailed pseudo code for the algorithm.<\/AC38>\n\n* Doob's transform: <AC39>I suggest you either give more details or remove the sketch from the main paper.<\/AC39> <AC40>As is it is not useful.<\/AC40>\n\n* <AC41>Where is the conclusion?<\/AC41> <AC42>It is good to end a paper with the conclusion summarizing the method and results.<\/AC42>\n\nlimitations: None"}, {"message_id": "Reviewer_qRy1 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer qRy1\nWe would like to thank the reviewer for his/her comments that helped us improve the clarity of our manuscript and make it more accessible to readers less versed in SDE theory. The comments are well received and were very helpful. We give a point-by-point response to these comments below.\n***\n1. > My SDE theory is less developed but I don't understand section 2.5, not even at a high level. As a result I m not sure I trust the content of section 3.1 (the loss and algorithm) I m possibly not the best reviewer (hence the low confidence) but I also think clarity could be greatly improved (see below).\n\n<AC1>To help readers who are less familiar with SDEs, we have added the following two figures (with links to our GitHub repository) to visualize the two main concepts underlying our work<\/AC1>:\n\nA. [Doob's $h$-transform](https://anonymous.4open.science/r/CompDoobTransform/figures/illustrate_CDT.pdf);\n\nB. [using Doob's $h$-transform for online filtering of diffusions](https://anonymous.4open.science/r/CompDoobTransform/figures/illustrate_APF.pdf).\n\n<AC2>Figure A shows how uncontrolled trajectories $X_t$ (*black*) under the original diffusion differs from controlled trajectories $\\widehat{X}_t$ (*blue*) under the conditioned diffusion, induced by an informative observation $Y\\sim\\mathcal{N}(X_T,\\sigma_Y^2)$ (*red*).<\/AC2>\n\n<AC3>For the purposes of online filtering, the bootstrap particle filter (BPF) and fully adapted auxiliary particle filter (FA-APF) require one to simulate trajectories under the original diffusion and conditioned diffusion respectively.<\/AC3> <AC4>Figure B illustrates the trajectories (*left panel*) and log-weights (*right panel*) generated by BPF (*black*) and FA-APF (*blue*).<\/AC4> <AC5>It is apparent that FA-APF allows one to obtain trajectories that are more consistent with informative data and weights that exhibit significantly less variability compared to the BPF.<\/AC5>\n\n<AC6>Our work proposes a new framework to compute Doob's $h$-transform that is tailored for the purpose of approximating the FA-APF in the setting of online filtering.<\/AC6>\n***\n2. > $\\eta_x$ should depend on the conditioning end observation. If you drop this dependency, you are not sampling from the conditioned SDE. In your experiment (L252), you drop this dependency. Is this a typo, a design choice, an approximation?\n\n<AC7>We agree that, if our goal were to sample a diffusion process starting from some known distribution $\\pi_0$ at time $t=0$, conditioned upon an observation $y_T$ collected at time $T$, the law of the conditional diffusion at time $t=0$ would depend upon the observation $y_T$.<\/AC7> <AC8>In the \"online filtering\" context of our manuscript, and as rightfully described by the reviewer, we are interested in describing the dynamics of the conditioned diffusion: the initial (conditioned) distribution is not really an object of interest (as can be seen from the description of the fully adapted auxiliary particle filter\").<\/AC8> <AC9>The distribution denoted as $\\eta_x$ is only used as a \"computational device\" during the training phase of the methodology<\/AC9> and <AC10>does not need to be equal to the actual conditioned distribution.<\/AC10> <AC11>As a matter of fact and as empirically observed, for computational stability, the distribution $\\eta_x$ should be chosen to be more \"spread out\" than the actual conditioned distribution.<\/AC11> <AC12>We have now made this point clearer in the updated manuscript.<\/AC12>\n***\n3. > L159: \"In practice, we will let the three sources of randomness be independent of each other.\" What is lost with that approximation (is it an approximation)?\n\n<AC13>It is related to the previous Point 2: these distributions do not need to be equal to the actual conditioned distribution.<\/AC13> <AC14>The randomness is used for exploring the state-space and learning the control in the training phase of the proposed methodology.<\/AC14> <AC15>Our proposed approach of choosing the three sources of randomness is easy to implement<\/AC15> and <AC16>works well empirically.<\/AC16> <AC17>Importantly, this does *not* lead to a biased or or an uncontrolled approximation<\/AC17>: <AC18>we have now made this important point clearer.<\/AC18>\n***\n4. > The result section, shows that the learned control matches the exact control on a linear SDE scenario. Many details are missing, an appendix with those would be great. as a reader, I don't want to have to fill all the gaps. Even less as a reviewer. For example, for OU, you could give the exact expression for $h$, and $v$.\n\nThank you for this suggestion. <AC19>We have now added some details in the main text<\/AC19> and <AC20>provide the details of the Ornstein-Uhlenbeck model in the appendix.<\/AC20>\n***\n5. > The proposed objective seems to contain the control on both side of the square loss, the $V_T$ and the $\\log g(..)$. It also feels like hitting a moving target.\n\nThank you for this comment. <AC21>We have now made this crucial point much clearer.<\/AC21> <AC22>In Equation (18), the control $c$ is to be considered *fixed* (as zero in the \"CDT static scheme\" or as a current approximation of the control in the \"CDT iterative scheme\").<\/AC22> <AC23>Only the weights of the neural networks $\\textrm{N}_0$ and $\\textrm{N}$ in Equation (16) are being learned.<\/AC23> Consequently, <AC24>the dynamics of $X^{c,y}_t$ is considered fixed, and only the dynamics of the process $V_t$ depends on the neural networks $\\textrm{N}_0$ and $\\textrm{N}$.<\/AC24> In summary, <AC25>in the difference $V_T + \\log g(X^{c,Y}_T, Y)$, only the term $V_T$ is \"moving\".<\/AC25>\n***\n6. > Also could you give a justification for the ’stop gradient’ comment?\n\n<AC26>It is related to the previous point 5.<\/AC26> <AC27>In practice, we advocate using the \"CDT iterative scheme\" which chooses the control $c$ at each iteration of our training procedure as the current neural network approximation of the control, i.e. setting $c(x,y,t)=-\\textrm{N}(x,y,t)$.<\/AC27>\n<AC28>As explained in the previous comment, the control $c$ is assumed to be fixed when constructing the loss in Equation (18).<\/AC28>\nConsequently, <AC29>it is necessary to use a \"stop-gradient\" operation to ensure that gradient operations are not propagated through the control function $c$.<\/AC29> <AC30>Points 5 and 6 are important<\/AC30> and we thank the reviewer for raising these questions. <AC31>We have now made the manuscript much clearer on these points.<\/AC31>\n***\n7. > It would be good to have a discussion of this optimization problem. For example, how do the dynamics of learning look like?\n\nThank you for this suggestion. <AC32>We have added the following figures (with links to our GitHub repository) and corresponding discussions about the training process.<\/AC32>\n\n**Ornstein-Uhlenbeck model during initial training phase**\n\nOU-A. [Evolution of loss estimate over first $500$ optimization iterations](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_loss_train.pdf)\n\nOU-B. [Evolution of neural network $\\mathrm{N}_0(x,y)$ (*black to copper*) approximating the initial value function $v(x,y,0)$ (*red*) over first $500$ optimization iterations for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_value_train.pdf)\n\nOU-C. [Evolution of neural network $-\\mathrm{N}(x,y,t)$ (*black to copper*) approximating the control function $c_{\\star}(x,y,t)$ (*red*) over first $500$ optimization iterations for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_control_train.pdf)\n\n**Ornstein-Uhlenbeck model after training**\n\nOU-D. [Evolution of loss estimate over $2000$ optimization iterations under static (*red*) and iterative (*blue*) CDT schemes](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_loss_compare.pdf)\n\nOU-E. [Neural network approximation $\\mathrm{N}_0(x,y)$ of the initial value function $v(x,y,0)$ (*purple*) after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_value_compare.pdf)\n\nOU-F. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ (*purple*) after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_control_compare.pdf)\n\n**Logistic diffusion model during initial training phase**\n\nLD-A. [Evolution of loss estimate over first $500$ optimization iterations](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_loss_train.pdf)\n\nLD-B. [Evolution of neural network $\\mathrm{N}_0(x,y)$ (*black to copper*) approximating the initial value function $v(x,y,0)$ over first $500$ optimization iterations for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_value_train.pdf)\n\nLD-C. [Evolution of neural network $-\\mathrm{N}(x,y,t)$ (*black to copper*) approximating the control function $c_{\\star}(x,y,t)$ over first $500$ optimization iterations for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_control_train.pdf)\n\n**Logistic diffusion model after training**\n\nLD-D. [Evolution of loss estimate over $2000$ optimization iterations under static (*red*) and iterative (*blue*) CDT schemes and various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_loss.pdf)\n\nLD-E. [Neural network approximation $\\mathrm{N}_0(x,y)$ of the initial value function $v(x,y,0)$ after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_value_compare.pdf)\n\nLD-F. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_control_compare.pdf)\n\n**Cell model after training**\n\nCell-A. [Evolution of loss estimate over $2000$ optimization iterations under static (*red*) and iterative (*blue*) CDT schemes and various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_loss.pdf)\n\nCell-B. [Neural network approximation $\\mathrm{N}_0(x,y)$ of the initial value function $v(x,y,0)$ after training with the static (*left column*) and iterative (*right column*) CDT schemes for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_value_function.pdf)\n\nCell-C. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ after training with the static (*upper row*) and iterative (*lower row*) CDT schemes for a typical observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_control_function_in.pdf)\n\nCell-D. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ after training with the static (*upper row*) and iterative (*lower row*) CDT schemes for an extreme observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_control_function_out.pdf)\n***\n8. > Could you be more precise on which variables you are taking expectations over and why? This is important for the loss.\n\n<AC33>We described in Line 157 that: \"The above expectation is with respect to the distribution of the Brownian motion $B_t$, the initial condition $X_0^{c,Y}\\sim \\eta_X$ of the controlled diffusion, and the observation $Y\\sim \\eta_Y$ at time T.\"<\/AC33> <AC34>We hope that this description is clear enough<\/AC34>, and <AC35>would be happy to add more clarification in the text if the reviewer thinks it is necessary.<\/AC35>\n***\n9. > CDT algorithm, it would help to have a more detailed pseudo code for the algorithm.\n\nThis point is well-noted. <AC36>In the updated version of the manuscript, we expand on the algorithmic description (contained in between Lines 169-180) by making references to some algorithmic functions which we will detail in the appendix.<\/AC36> <AC37>These functions will provide more detailed description of each step of the CDT algorithm using PyTorch-like pseudo-code.<\/AC37>\n***\n10. > Doob’s transform: I suggest you either give more details or remove the sketch from the main paper. As is it is not useful.\n\n<AC38>As Doob's $h$-transform is a concept from applied probability, most exposition of it in existing literature tend to be quite technical in nature due to the mathematical formalism involved.<\/AC38> <AC39>Our aim in Sections 2.3 and 2.4 is to provide an intuitive and instructive introduction of Doob's $h$-transform by dispensing with technical complications.<\/AC39> That said, <AC40>as our exposition relies on a few concepts in SDE theory, we acknowledge that it might still be inaccessible for some readers.<\/AC40> <AC41>We have added some overarching discussions in these two sections to help such readers get the key takeaways needed to understand the rest of our article.<\/AC41>\n***\n11. > Where is the conclusion? It is good to end a paper with the conclusion summarizing the method and results.\n\n<AC42>This remark has also been raised by other reviewers.<\/AC42> <AC43>We have added a conclusion that recapitulates the proposed method and numerical results, and also includes the following discussion points.<\/AC43>\n\nA. <AC44>Contrarily to a number of methods in existing literature, the proposed method does not address the SDE time-discretization bias.<\/AC44> <AC45>One could consider employing randomization strategies developed by [RG2015, JLY2020] to remove this bias.<\/AC45>\n\nB. <AC46>Our proposed method is widely applicable<\/AC46> as <AC47>it does not rely on any specific structure of the diffusion.<\/AC47> Furthermore, <AC48>it can yield consistent estimates of the filtering distributions as both the number of discretization steps and the number of particles go to infinity.<\/AC48>\n\nC. <AC49>It is to be contrasted with a number of (very useful) methods proposed in the data-assimilation and geoscience literature that rely on Gaussianity assumptions or model-specific structure.<\/AC49> <AC50>These methods, typically designed to operate in very high-dimensional settings, achieve lower variance by increasing the bias.<\/AC50> <AC51>Future work will explore how to tailor Doob's $h$-transform for problems in geoscience by employing techniques such as localization [P2016].<\/AC51>\n\nD. <AC52>Future work will also experiment with alternative formulations and parameterizations of the neural networks approximating the initial value and control functions to accelerate the training procedure [CWN2019, NR2021].<\/AC52>\n***\nWe hope we have managed to address your concerns about our work, and would be grateful if you could update your evaluation of our submission accordingly. Please feel free to leave us any additional comments or suggestions.\n***\n[CWN2019] Chan-Wai-Nam Q, Mikael J, Warin X. Machine learning for semi linear PDEs. Journal of scientific computing. 2019 Jun;79(3):1667-712.\n\n[JLY2020] Jasra A, Law KJ, Yu F. Unbiased filtering of a class of partially observed diffusions. Advances in Applied Probability. 2020:1-27.\n\n[NR2021] Nüsken N, Richter L. Solving high-dimensional Hamilton–Jacobi–Bellman PDEs using neural networks: perspectives from the theory of controlled diffusions and measures on path space. Partial Differential Equations and Applications. 2021 Aug;2(4):1-48.\n\n[P2016] Poterjoy, J. (2016) A localized particle filter for high-dimensional non- linear systems. Monthly Weather Review, 144, 59–76. https://doi.org/ 10.1175/MWR-D-15-0163.1.\n\n[RG2015] Rhee CH, Glynn PW. Unbiased estimation with square root convergence for SDE models. Operations Research. 2015 Oct;63(5):1026-43.\n Global/general Response:\n```\nWe would like to thank all reviewers for your time and feedback. We appreciate the thoughtful comments and positive response.\n\nWe have provided detailed responses to each reviewer. The following is a summary of (what we think are) the key points from the collated feedback:\n\n1. <AC53>provide more motivation for why online filtering of diffusions is an important problem with a wide range of applications<\/AC53>;\n\n2. <AC54>better position our contribution with respect to related work<\/AC54>;\n\n3. <AC55>provide more intuition in the background section<\/AC55>;\n\n4. <AC56>give more insight on how our neural network approximations evolve during training, how fast training iterations converge, and visualize the trained neural networks<\/AC56>;\n\n5. <AC57>illustrate the applicability of our approach in higher-dimensional settings where it is computationally infeasible to consider classical PDE solvers<\/AC57>;\n\n6. <AC58>clarify whether alternative particle filters are applicable in this problem setting and compare our proposed auxiliary particle filter to not just the bootstrap particle filter but also the current state-of-the-art<\/AC58>;\n\n7. <AC59>add a conclusion recapitulating the main points of our approach and results, and a discussion of future work.<\/AC59>\n\nThis is admittedly a long list and <AC60>we have done a major revision to thoroughly address each point.<\/AC60> Please feel free to leave us any additional comments or suggestions.\n\n```"}, {"message_id": "Reviewer_qRy1 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thanks for the thorough comments\nThank you for the thorough comments that clarify my understanding very positively.\nFor some reason I currently can't access the additional documents on the anonymized repo (I will try again)\n<AC1>I m confident the authors can implement the proposed changes to the manuscript within short delays.<\/AC1>\nI have no further questions."}, {"message_id": "Reviewer_qRy1 · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Update concerning additional figures\nThank you for going through our reply and for your kind response. Unfortunately, we are also having trouble accessing our additional figures on Anonymous Github at the moment, as its server seems to be down. We will monitor the situation and provide an alternative link if this issue persists. As these figures are an integral part of our revision, we sincerely hope the reviewer will take these figures into account in the evaluation of our paper.\n\nHere is an update. We have just gotten confirmation that the issue with the Anonymous Github server has been fixed. The links to all additional figures are now working properly. Thank you for bringing this issue to our attention."}, {"message_id": "Reviewer_qRy1 · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I am grateful for the opportunity to discuss these points with the author, <AC1>which has clearly contributed to strengthening this work.<\/AC1>"}]}]}, {"paper_id": "MG3YN3z1J4M", "decision": "Reject", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>The three reviewers all leaned towards rejection for this paper.<\/AC1> <AC2>One reviewer was concerned with the relatively small number of images used in the experiment and how valid the conclusions can be from that for PPP as a better metric.<\/AC2> <AC3>Another confusion was over how optimality in padding can be defined.<\/AC3> <AC4>This was important<\/AC4> because <AC5>the MAE and SNR measures were based off of this.<\/AC5>\nconfidence: Certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_MMJm", "rating": [4, 4], "messages": [{"message_id": "Reviewer_MMJm · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This study investigates position information patterns learned due to the use of padding.<\/AC1> <AC2>A new evaluation method has been proposed by taking the difference between an optimal padding strategy and the “algorithmically-padded features”.<\/AC2> <AC3>The difference pattern becomes more recognizable when more samples are applied.<\/AC3> Then <AC4>signal-to-noise ratio and mean absolute error are proposed to measure the layer-wise difference between the two paddings.<\/AC4> <AC5>This whole system is claimed to be a better measure for the position information.<\/AC5>\n\nstrengths_and_weaknesses: Strengths: <AC6>The proposed idea of randn padding is plausible<\/AC6>, <AC7>a window is used to compute the mean and deviation values within.<\/AC7> Then <AC8>we can sample padding values based on the learned normal distribution.<\/AC8> <AC9>Addressing the effect of strided convolution also makes the investigation more comprehensive.<\/AC9> <AC10>The proposed randn padding can deliver less position information than other padding strategies.<\/AC10>\nWeakness: <AC11>This study also has some essential problems that need to be addressed<\/AC11>, please see the questions below.\n\nquestions: <AC12>The two metrics SNR-PPP and MAE-PPP, proposed in this paper are questionable.<\/AC12> <AC13>The use of signal-to-noise ratio and mean absolute error is not new<\/AC13>, <AC14>the new metric is essentially the proposed “optimal” padding, which can be used to compare against other paddings and compute differences, including SNR and MAE or any other metrics.<\/AC14> Then let’s focus on the basic question, what the “optimal” padding is.\n\n<AC15>This proposed position measure is conducted at feature level<\/AC15>, <AC16>which is more difficult to draw conclusions than those studies at output level.<\/AC16> <AC17>Accuracy on the BHV test from [1] can be considered a measure against human perception<\/AC17>, <AC18>which is a golden standard in CNN understanding, e.g., why the classifier behaves differently than human and what could be the factor behind (absolute position).<\/AC18> <AC19>Similarly, the artificial ground-truth used in [2] can validate CNNs in a human readable way, if the model can output the wanted pattern based on position.<\/AC19> <AC20>This type of validation has also been applied in other CNN understanding papers[3,4].<\/AC20>\n\n<AC21>The measure proposed in this paper is computed at the feature level<\/AC21>, <AC22>which is not human readable, or is still under exploration.<\/AC22> Then <AC23>the defined “optimal” padding becomes a golden standard to compare<\/AC23>, <AC24>which is very questionable.<\/AC24> <AC25>The paper also agrees with the “optimal” padding shown in Eqs. (1) and (2) “In practice, such an optimal-padding scheme is difficult to achieve.”<\/AC25> <AC26>I personally doubted if such padding exists in practice.<\/AC26> <AC27>Without further explanation, Sec2.2(Fig 1., line 81) directly shows the visual difference between the “optimal” and the “algorithmical” padding<\/AC27>, <AC28>this is really important but looks confusing.<\/AC28> <AC29>I can only guess the “optimal” refers to the randn padding from sec 2.4(please correct me if I am wrong)<\/AC29>, and <AC30>the large difference to zero-padding is not surprising.<\/AC30> <AC31>The padded value by zero-padding is very different from other content-based, e.g., circular, reflect, replicate, which has been already studied in previous studies[1,5].<\/AC31> (In addition, <AC32>the finding in Fig 3 and Table 1 that background color matters can already be found in previous study[5].<\/AC32>) More importantly, <AC33>I am still seeking an explanation why this randn padding could be the “optimal” to compute the two metrics<\/AC33>, <AC34>it looks more like another well-designed “algorithmical” padding.<\/AC34> <AC35>The “optimal” golden standard needs to be set and studied thoroughly<\/AC35>, then <AC36>the resulting findings (Table 2 and 3) can be analyzed reliably.<\/AC36> Otherwise, <AC37>it makes less sense no matter how high or low values a metric can achieve.<\/AC37>\n\nTherefore, <AC38>I suggest a more thorough study on how the “optimal” padding can be achieved before computing metrics on top.<\/AC38> And <AC39>based on Table 1, the proposed randn padding behaves similarly to the replicate padding, which can be considered a special case drawn from the same distribution as randn padding.<\/AC39>\n\n<AC40>Based on the questions above, I would suggest this study can be further improved for a better presentation and less confusion<\/AC40>, <AC41>the use of SNR and MAE is not main focus.<\/AC41> More importantly, <AC42>the design of \"optimal\" padding should be better addressed.<\/AC42>\n\n[1] Kayhan, Osman Semih, and Jan C. van Gemert. \"On translation invariance in cnns: Convolutional layers can exploit absolute spatial location.\" Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition. 2020.\n[2] Islam, Md Amirul, Sen Jia, and Neil DB Bruce. \"How much position information do convolutional neural networks encode?.\" arXiv preprint arXiv:2001.08248 (2020).\n[3]Geirhos, Robert, et al. \"ImageNet-trained CNNs are biased towards texture; increasing shape bias improves accuracy and robustness.\" arXiv preprint arXiv:1811.12231 (2018).\n[4]Geirhos, Robert, Kristof Meding, and Felix A. Wichmann. \"Beyond accuracy: quantifying trial-by-trial behaviour of CNNs and humans by measuring error consistency.\" Advances in Neural Information Processing Systems 33 (2020): 13890-13902.\n[5]Islam, Md Amirul, et al. \"Position, padding and predictions: A deeper look at position information in cnns.\" arXiv preprint arXiv:2101.12322 (2021).\nlimitations: <AC43>The paper can be further polished and re-organized to reduce misleading.<\/AC43> <AC44>The applicability of randn can be further discussed<\/AC44>, <AC45>the previously studied findings can be omitted.<\/AC45>"}, {"message_id": "Reviewer_MMJm · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Thanks for the review. Here are our responses.\nWe sincerely thank the comprehensive review. Here, we discuss the raised weaknesses and questions:\n1. **`I can only guess the “optimal” refers to the randn padding.`**\n    - <AC1>No, randn padding is also algorithmic padding as defined in Eq (1), which is different from optimal padding (defined in Eq (2)).<\/AC1> <AC2>We simulate the behavior of optimal padding with the satellite dataset introduced in Line 205.<\/AC2> <AC3>More specifically, the dataset is served as the S* set described in Line 64.<\/AC3> And therefore <AC4>all variables in Eq (1), (2), and (3) can be derived, as long as all images of S* are large enough.<\/AC4>\n\n    - Here we describe one of the possible realizations of Eq (1), (2), and (3) below. Note that <AC5>any implementations following the same definition will obtain the same results.<\/AC5>\n\n         - <AC6>Given a collection of satellite images at KxK pixels. Following Eq (1) and Eq (2), after a model is fully trained at NxN pixels, we can calculate the second term of Eq (3) (i.e., algorithmic padding part) by cropping NxN regions from the satellite images.<\/AC6> Meanwhile, <AC7>for the first term of Eq (3) (i.e., optimal padding part), we crop a much larger MxM region from the satellite images and set the model to no-padding mode.<\/AC7> <AC8>With such, the model automatically pads the features with realistic features produced by the pixels between the MxM region and the NxN region and follows the definition of optimal padding in Eq (2).<\/AC8>\n\n        - Note that <AC9>K can be any number larger than or equal to M (note M>N)<\/AC9>, and <AC10>its value does not affect PPP as long as K>=M.<\/AC10> <AC11>The M value is architecture-dependent<\/AC11>, and <AC12>we obtain the values in Appendix A.<\/AC12>\n\n    - <AC13>We acknowledge that it may not be straightforward to derive such an implementation from the symbols in Eq (1), (2), and (3).<\/AC13> <AC14>We will add a section in Appendix to explicitly describe the aforementioned realization of the equations.<\/AC14>\n\n2. **`I suggest a more thorough study on how the “optimal” padding can be achieved.`** <AC15>The procedure of obtaining optimal padding is described between lines 86-91.<\/AC15> We describe one of the possible implementations above. <AC16>Any approach following Eq (1), (2), and (3) will yield the same results.<\/AC16>\n\n3. **`SNR and MAE are not the main focus.`** <AC17>Indeed, we did not emphasize these two functions as the core contribution<\/AC17>, <AC18>they are just a prefix of PPP.<\/AC18> <AC19>They are two simple functions aggregating the information reported by PPP<\/AC19>, as <AC20>PPP is a complicated and high-dimensional signal.<\/AC20> <AC21>Any reasonable aggregation (e.g., L2) can serve the purpose.<\/AC21>\n\nDear Reviewer MMJm,\n\nThanks for the comments. We have replied to your questions and wonder whether you have additional comments or not. We would like to address all the questions that you have.\n\nThanks,\n\nNeurIPS 2022 Conference Paper924 Authors"}, {"message_id": "Reviewer_MMJm · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Feedback\nThank the authors for this explanation. However, <AC1>this explanation makes the draft even harder to understand.<\/AC1>\n1. <AC2>Following the draft, from Section 2.1, Eqs(1) and (2) show the definitions of the \"optimal\" padding scenario<\/AC2>(<AC3>this is questionable<\/AC3>). <AC4>Then Section 2.2 discusses PPP, section 2.3 shows the \"proposed\" metrics, then Section 2.4 shows the \"proposed\" padding strategy.<\/AC4> <AC5>This organization is very misleading.<\/AC5>\n\n<AC6>The whole paper is built on top of the fundamental question for formulation Eqs(1) and (2)<\/AC6>, <AC7>without a proper explanation or statement, the first proposed method is shown in Section 2.4<\/AC7>, so <AC8>naturally this would be considered related to the problem formulation Eq(2).<\/AC8> <AC9>Line 42-43, \"To weaken the effect of PPP,.. Section 2.4\", also misleads to this understanding.<\/AC9>\n\n2. I read lines 86-91 again, but <AC10>it simply shows how to \"calculate\" the \"optimal\" padding, instead of explaining what the \"optimal\" padding should be.<\/AC10> <AC11>Line 86-91 and Eq(3) only show the PPP is defined as the \"difference\" between the \"optimal\" padding and an algorithmical padding, no explanation on what the \"optimal\" is, as introduced in Eq(2).<\/AC11> <AC12>This question is the most important and fundamental to this study<\/AC12>, <AC13>if this this question is not clearly defined, then all the proposals are a little lame.<\/AC13>\n\n<AC14>Back to your explanation on the satellite images, there is no discussion or explanation about this in Section 2.1.<\/AC14> More importantly, <AC15>it is a little challenging to convince myself this cropped image can be considered the \"optimal\".<\/AC15> <AC16>If that was \"optimal\"(I personally doubt this), why wouldn't use that (or cropped images for vision tasks) but the proposed Randn?<\/AC16>\n\n3. <AC17>The authors agree that they did not intend to emphasize the terms<\/AC17>, but <AC18>from the paper and the responses to other reviewers, MAE-PPP and SNR-PPP are still widely used to show their efficacy<\/AC18>, <AC19>this \"contribution\" can be simply interpreted as this paper applies MAE and SNR to measure the difference between the proposed \"optimal\" and an algorithmic padding<\/AC19>, while <AC20>why the proposed padding can mimic the \"optimal\" is not properly discussed<\/AC20> and <AC21>the definition of the \"optimal\" is omitted in this draft.<\/AC21> Thus <AC22>no matter what metrics are applied, (other than SNR or MAE), it can not solid measure the PPP.<\/AC22>"}, {"message_id": "Reviewer_MMJm · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Responses to the feedback\nThanks for responding to our rebuttal, we would like to further discuss some of the details as follows.\n\n1. **`The definition of optimal padding`**\n    - To clarify, <AC1>Eq (1) and Eq (2) are the definitions of paddings, following how images are captured from the physical world.<\/AC1> <AC2>It is not clear to us why the definition is questionable.<\/AC2> <AC3>Could the reviewer clarify which part of the definition is questionable or counter-factual?<\/AC3> We would like to know what the reviewer means and address the issues, as <AC4>the definition of PPP is entirely based on such a definition.<\/AC4>\n    - <AC5>Regarding the misunderstanding of randn padding is optimal padding, we will add an additional note to Section 2.4 that randn padding is algorithmic padding.<\/AC5> <AC6>Please note that Sections 2.1 to 2.3 have already given out a complete definition of optimal padding (Section 2.1), PPP (Section 2.2), and PPP metrics (Section 2.3).<\/AC6> <AC7>Section 2.4 does not have any argument or symbol that establishes it is optimal padding, or alternates any of the definitions that were already given in previous sections.<\/AC7>\n\n2. **`What the \"optimal\" is?`**\n    - <AC8>Eq (2) has defined what the optimal padding should be, based on how images are captured from the physical world.<\/AC8> <AC9>It is the original pixels on S* without the S* -> S’ cropping (i.e., image capturing process).<\/AC9> Since <AC10>they are the ground truth pixels<\/AC10>, therefore <AC11>they are the optimal padding pixels.<\/AC11>\n\n    - **`it is a little challenging to convince myself this cropped image can be considered the optimal`** <AC12>The cropped image (S’) is not the source of optimal padding<\/AC12>, <AC13>the uncropped images (S*) define the optimal pixels (in Eq (2)).<\/AC13> <AC14>We use the satellite images to simulate the uncropped S* set<\/AC14>, as <AC15>they are much larger than the receptive field of the CNN models tested in the paper.<\/AC15>\n\n3. The terminology of using SNR-PPP and MAE-PPP\n    - <AC16>Could the reviewer specify the alternative terms intended for us to switch to?<\/AC16> <AC17>The response seems to agree the terms MAE and SNR are not the main issues the reviewer intends to discuss.<\/AC17> Instead, <AC18>the main concern is still on the definition of “optimal” padding, which has no relation to the terminology of MAE-PPP and SNR-PPP.<\/AC18> We would like to know what the reviewer means and address the issues."}, {"message_id": "Reviewer_MMJm · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I am glad to have had the above discussion with the author, <AC1>which has certainly strengthened the paper.<\/AC1>"}]}, {"i": 2, "name": "Reviewer_qWQu", "rating": [4, 4], "messages": [{"message_id": "Reviewer_qWQu · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes a novel metric for measuring and visualizing the encoded positional information arising due to padding in Convolutional Neural Networks.<\/AC1> <AC2>They formally define the encoded information as PPP (Position-information Pattern from Padding) which measures the distance between feature maps arising from an algorithmic padding (such as zero padding) and an optimal notion of padding (i.e. the ground truth pixels that would be around the image).<\/AC2> <AC3>They demonstrate that PPP is a more reliable metric (low variance) than alternate metrics<\/AC3> and hence <AC4>it is useful for measuring the effectiveness of methods debiasing PPP due to padding.<\/AC4> <AC5>They show that PPP is a representation that the network develops as a part of its learning process.<\/AC5>\nstrengths_and_weaknesses: ## Strengths\n1. <AC6>The paper is well-written<\/AC6>, and <AC7>contains sufficient details.<\/AC7>\n2. <AC8>The proposed problem of determining the amount of position information encoded due to padding is important<\/AC8> as <AC9>it can be interfering to actual cues and degrade model performance.<\/AC9>\n3. <AC10>The proposed metric is motivated well<\/AC10>, and <AC11>the analysis of PPP and prior works is thorough.<\/AC11>\n4. <AC12>The idea of using an optimal padding scheme to quantify PPP is sound<\/AC12> and <AC13>reveals consistent patterns in experiments.<\/AC13>\n\n## Weaknesses\n1. <AC14>The evaluation is conducted on only one dataset of just 480 images.<\/AC14> <AC15>A more thorough investigation can be done by incorporating diverse datasets and observing the consistency of PPP as a metric over PosENet.<\/AC15>\n2. <AC16>Fig. 5 and Section 4.3 demonstrate that PPP is a representation that the network favorably develops as a part of its learning process.<\/AC16> <AC17>Can the authors add some discussion on the implications of this?<\/AC17> <AC18>What new insights can be drawn from this experiment?<\/AC18>\nquestions: <AC19>What can be more quantitative metrics to justify a good PPP metric?<\/AC19> <AC20>Currently, the majority of the focus is on the large standard deviation of PosENet.<\/AC20> However, <AC21>there must be other ways to compare which metric is a better representative of measuring the result of padding.<\/AC21>\nlimitations: <AC22>The authors already mention an important limitation of PPP being linked to the architecture of the network as it is evaluated on the outputs of a model.<\/AC22>"}, {"message_id": "Reviewer_qWQu · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Thanks for the review. Here are our responses.\n1. **`Evaluate on only one dataset`**:\n    - <AC1>For the number of samples, we want to highlight that our PPP metrics already achieve extremely low deviation with 480 images<\/AC1>, therefore <AC2>the number of samples is not an issue for the evaluation.<\/AC2>\n    - <AC3>We add two additional datasets to evaluate PPP metrics on all models presented in the paper.<\/AC3> <AC4>Finding a dataset with a large field-of-view with diverse content (as we want the optimal-padding features to be realistic) is non-trivial.<\/AC4> Therefore, <AC5>we collect 1024 images at 2048x2048 pixels, synthesized by InfinityGAN [1] trained on Flickr-Landscape and LSUN-tower.<\/AC5> The evaluation results are attached with the following *anonymous* links:\n\n        - **Comparisons among three datasets**: https://i.imgur.com/hSv7YaW.png\n            - (red denotes the strongest, blue denotes the weakest)\n\n        - **Comparisons of randomly initialized networks**: https://i.imgur.com/hDtBlLf.png\n\n        The results show that (a) <AC6>PosENet still maintains an unacceptable high deviation<\/AC6>, (b) <AC7>the significant PPP gain over model training is consistent with our previous observations<\/AC7>, (c) <AC8>MAE-PPP shows significantly better cross-dataset consistency than all other metrics<\/AC8>, and (d) <AC9>SNR-PPP sometimes recognizes certain models with high peak signal with relatively low MAE-PPP (which measures the average differences of PPP).<\/AC9> <AC10>A solution toward addressing PPP should suppress both SNR-PPP and MAE-PPP.<\/AC10> <AC11>We will include the additional results in the paper and add corresponding discussions.<\/AC11>\n\n2. **`Can the authors add some discussion on the implications of Fig. 5 and Section 4.3?`**\n    Thanks for the suggestion, <AC12>we will add the following description to Section 4.3.<\/AC12>\n\n    - “<AC13>The results show that the network progressively learns to reinforce PPP as a favorable representation.<\/AC13> Therefore, <AC14>future methods in addressing PPP should be focusing on debiasing such a learning process (e.g., design paddings invisible to the network, or make the position-information less favorable with other replaced representations).<\/AC14>“\n\n3. **`What can be more quantitative metrics to justify a good PPP metric?`**\n    - <AC15>For a metric, it is **essential** to have a low deviation.<\/AC15> Otherwise, <AC16>the numbers are not meaningful or comparable.<\/AC16> <AC17>PosENet is trivially dissatisfactory from this perspective<\/AC17>, and <AC18>shall not be used in any future studies.<\/AC18>\n    - <AC19>Could the reviewer provide more details on the expected other ways to compare the quality of a metric?<\/AC19> <AC20>From our perspective, the question implies a high deviation is not sufficient to prove PosENet is not a valid metric, where an additional metric is needed to address the issue.<\/AC20> Some additional details on the issue can help us address the concern.\n\n[1] “InfinityGAN: Towards Infinite-Pixel Image Synthesis”, ICLR’22.\n\nDear reviewer,\n\nThanks for the comments. Please read our response to your questions and let us know if you have additional questions as the discussion phase ends on August 9.\n\nThanks,\n\nNeurIPS 2022 Conference Paper924 Authors"}, {"message_id": "Reviewer_qWQu · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thanks for the authors' response. <AC1>They have adequately addressed the majority of my concerns<\/AC1>, and <AC2>I will likely adjust the score higher.<\/AC2>"}]}, {"i": 3, "name": "Reviewer_rick", "rating": [3, 3], "messages": [{"message_id": "Reviewer_rick · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>Authors present a novel metric for detecting the presence and quantifying the strength of positional information encoding due to padding.<\/AC1> <AC2>They define PPP as a spatial statistic, i.e., expected absolute difference between algorithmically padded and optimally padded images’ activations<\/AC2>, and <AC3>summary statistics are defined from the spatial ones, i.e., SNR and MAE for PPP.<\/AC3> In addition, <AC4>they propose a new padding strategy, which aims to preserve local variability around a boundary when padding.<\/AC4> <AC5>The proposed metric is applied on pre-trained networks as well as those that are trained from scratch at different epochs.<\/AC5> <AC6>Results suggest that the position information encoding gets stronger with training, and very strong for pre-trained models.<\/AC6> <AC7>Compared to two existing alternatives, the proposed metric has lower variance<\/AC7>, and therefore <AC8>seems to be a more reliable metric.<\/AC8>\nstrengths_and_weaknesses: Strengths:\n1. <AC9>The investigated concept is intriguing<\/AC9> and <AC10>potentially affect all application of CNNs.<\/AC10>\n2. <AC11>The proposed measure is very intuitive and easy to compute.<\/AC11>\n3. <AC12>Results suggest that the proposed metric shows lower variability compared to alternatives<\/AC12>, and <AC13>show that almost all networks encode position to some extent.<\/AC13>\n4. <AC14>Results showing emphasized position encoding for pre-trained models is interesting.<\/AC14>\n\nWeaknesses:\n1. <AC15>A solution towards removing the position encoding is not discussed.<\/AC15>\n2. <AC16>Importance of quantifying the strength of PPP is not clear to me.<\/AC16>\n3. <AC17>Authors state that reliable PPP metrics are important for understanding PPP effects in different tasks.<\/AC17> <AC18>While this point is surely intriguing, such an explanation or understanding is not explicitly given in the article.<\/AC18> <AC19>Can the authors explicitly explain what type of understanding one reaches by looking at the PPP maps?<\/AC19>\n4. <AC20>The conclusion of the article remains a bit vague.<\/AC20> <AC21>While the proposed metrics have some more desirable attributes, value of these attributes for applications is unclear to me.<\/AC21> <AC22>How will this actually improve the practice or our understanding?<\/AC22>\n\nquestions: 1. <AC23>My main suggestion is to better motivate the investigation and the developed metrics for applications of CNNs.<\/AC23> <AC24>How will this technology actually be used?<\/AC24> <AC25>A roadmap towards improving the current state of things using the PPP is unclear.<\/AC25>\n2. <AC26>What is the value of quantifying the strength of position encoding?<\/AC26> <AC27>Better explanation towards this end would substantially improve the article.<\/AC27>\n3. <AC28>It is shown in figure 5, that proposed metrics are different at different layers.<\/AC28> <AC29>In this setting, it may be important for authors to provide some guidelines telling which layer one should look at.<\/AC29> More specifically, <AC30>difference (quantified with PPP) at which layer would cause the biggest problem for prediction accuracy?<\/AC30>\n\nlimitations: Yes, they have."}, {"message_id": "Reviewer_rick · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Thanks for the review. Here are our responses.\nWe sincerely thank the comprehensive review. Here, we discuss the raised weaknesses and questions:\n\n1. **`How will this technology actually be used?`** <AC1>The padding-related exploration is a fundamental building block to any existing or future architectures.<\/AC1> <AC2>Recently, researchers started to pay attention to paddings and the effect paddings induce.<\/AC2> <AC3>To better evaluate the efforts made in this field, we show that existing metrics are problematic<\/AC3>, and <AC4>we propose an improved metric.<\/AC4> <AC5>The proposed PPP metric serves as a better evaluation for any future methods related to positional information from padding.<\/AC5> Furthermore, <AC6>our results show that changing the padding scheme does not completely resolve the issue.<\/AC6> <AC7>The observation is a reminder to existing and future users adopting this workaround that the problem is not resolved yet.<\/AC7>\n\n2. **`A solution is not discussed.`**\n    - <AC8>The major focus of the paper is to provide a reasonable metric to any future attempt toward understanding or removing positional information caused by paddings.<\/AC8> To this end, <AC9>the proposed PPP is the solution.<\/AC9> <AC10>A correct metric for the problem is required, especially when there are misunderstandings and erroneous conclusions drawn from previous publications in top-tier conferences (CVPR and ICLR).<\/AC10> <AC11>Without the correct understanding, improving the wrong metrics can never resolve the issue we are discussing.<\/AC11> <AC12>As shown in our paper, the proposed PPP metrics are improved replacements for previous metrics.<\/AC12>\n\n    - <AC13>As for the solution to the position information encoded by paddings, we believe the solution cannot be developed without reasonable metrics.<\/AC13> Therefore, <AC14>our whole paper aims at showing the problems of existing metrics, and demonstrating the new PPP metrics indeed resolve the issues.<\/AC14>\n\n3. **`Can the authors explicitly explain what type of understanding one reaches by looking at the PPP maps?`**\n<AC15>Directly looking at the map only shows how strong PPP is, and how well our method can clearly extract it.<\/AC15> <AC16>SNR-PPP and MAE-PPP aggregate the PPP map into a score that can be used in comparing different models.<\/AC16> <AC17>We show and prove PPP is reliable (PPP is casted from the definition of padding, and shows a substantially lower deviation) compared to previous metrics.<\/AC17> And <AC18>discuss some observations in Section 4.<\/AC18>\n\n4. **`How will this actually improve the practice or our understanding?`**\n    - <AC19>A reliable metric is always the first step to solving or understanding anything.<\/AC19> <AC20>Any information from an unreliable metric should be considered meaningless.<\/AC20> <AC21>Without any meaningful metrics, the severity of the problem cannot be correctly measured, and none of the solutions can claim it addresses the issue.<\/AC21>\n\n    - <AC22>Let’s say, the `accuracy` function in image classification has a 50% deviation without a reason (perhaps some ground truth classes are randomly swapped for some reason). Then it becomes obvious that we should fix the metric first, before starting benchmarking model performance on it.<\/AC22>\n\n5. **`What is the value of quantifying the strength of position encoding?`** First, <AC23>a good metric should report a smooth and continuous value to express the property of interest.<\/AC23> Second, <AC24>if a problem cannot be analytically solved, a continuous value quantifies how well an alternative solution (e.g., a normalization or regularization) performs.<\/AC24> <AC25>To our understanding, the positional information problem is unlikely to be analytically resolved.<\/AC25>\n\n6. **`which layer one should look at`** <AC26>As shown in Figure 5., PPP is progressively reinforced and becomes the strongest in the deepest layer (closest to the network prediction).<\/AC26> <AC27>The problem is caused by paddings throughout the network<\/AC27>, therefore <AC28>a genuine solution should reduce PPP in all layers.<\/AC28>\n\n7. **`at which layer would cause the biggest problem for prediction accuracy?`** <AC29>In Figure 5., PPP is strongest in the final output layer, while being closest to the model prediction at the same time.<\/AC29> Therefore, <AC30>it is the last layer.<\/AC30> But, again, <AC31>PPP is not a problem of a particular layer, it is a problem caused by paddings throughout the whole network.<\/AC31>\n\nDear reviewer,\n\nThanks for the comments. We have replied to your questions and wonder whether you have additional comments or not. We would like to address all the questions that you have.\n\nThanks,\n\nNeurIPS 2022 Conference Paper924 Authors"}, {"message_id": "Reviewer_rick · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "I value the authors' response. <AC1>They have adequately addressed the majority of my concerns<\/AC1>, and <AC2>I am inclined to revise the rating upwards.<\/AC2>"}]}]}, {"paper_id": "b9APFSTylGT", "decision": "Reject", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>This paper presents a novel perspective of prompt tuning for few-shot visual recognition: a dynamic matching algorithm between the prompt candidate and the visual features.<\/AC1> <AC2>Compared to the existing CoOp and CoCoOp algorithm, the proposed \"Optimal Transportation\" idea definitely sounds better<\/AC2> and <AC3>indeed achieves better performance.<\/AC3> <AC4>All the reviewers acknowledge the merits of the paper.<\/AC4>\n\n<AC5>Though AC also acknowledges the merits of the paper, there are two unaddressed demerits<\/AC5>:\n\n1) <AC6>As the proposed method is essentially an ensemble method, comparisons with prompt ensemble should be conducted.<\/AC6> Unfortunately, <AC7>the reported \"G\" in Table 2 and Line 254-265 is not a proper ensemble<\/AC7>, because <AC8>the \"G\" baseline may degenerate into many duplicate single CoOp models with different random seeds.<\/AC8> <AC9>AC conjectures that this is the reason why G's performance is only slightly different from CoOp.<\/AC9> <AC10>By \"proper ensemble\", the authors may want to try initializations by \"this is a photo\"+\"a picture of\" + \"there is an xx of\" etc, or, augmenting each image by random crops, each of which corresponds to a \"G\", and then ensemble.<\/AC10>\n\n2) <AC11>This paper lacks an important \"Base to New\" setting as proposed by CoCoOp.<\/AC11> <AC12>As the proposed PLOT in this paper has significantly more tunable parameters, AC doubts that it may lead to the overfitting of the training classes but ruins (or forgets) other classes which were used to have good zero-shot performance without training.<\/AC12>\n\nUnfortunately, <AC13>AC regrets to recommend reject<\/AC13> and wishes the best of luck in re-submitting the paper to other venues.\nconfidence: Certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_bMB5", "rating": [6, 6], "messages": [{"message_id": "Reviewer_bMB5 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The authors propose a new prompt learning method, which learns multiple prompts to describe diverse characteristics of categories.<\/AC1> <AC2>To optimize the model effectively, they apply optimal transport to match vision and language modalities.<\/AC2> <AC3>The experiments demonstrate its effectiveness<\/AC3> and <AC4>achieve improvement on few-shot learning tasks.<\/AC4>\nstrengths_and_weaknesses: Strengths:\n 1. <AC5>The motivation is innovative.<\/AC5> <AC6>Conventional methods use a single prompt which is not able to capture multi-grained features.<\/AC6> <AC7>The authors therefore aim to learn multiple comprehensive prompts to describe different categories.<\/AC7>\n 2. <AC8>An interesting combination between optimal transport theory and prompt learning.<\/AC8>\n 3. <AC9>The experiments are comprehensive<\/AC9> and <AC10>demonstrate the effectiveness of introduced method.<\/AC10>\n\nWeaknesses:\n 1. <AC11>The proposed method is a two-stage optimization strategy, which is a bit difficult to balance the two steps optimization.<\/AC11> <AC12>Could it be end-to-end training?<\/AC12>\n 2. <AC13>Although it is intuitive that including multiple local prompts helps, for different categories, the features and their positions are not the same.<\/AC13>\n\nquestions: Questions\n<AC14>After optimization, for different images and classes, are they sharing the same prompts?<\/AC14> <AC15>If so, there might be issues.<\/AC15> Because <AC16>different images have different local patterns, like 'a dog lying on the ground' v.s. 'a bird in the forest'.<\/AC16> <AC17>They have totally different local patterns (positions).<\/AC17>\n\nTypos:\n 1. Line 55, <AC18>prompts learning -> prompt learning<\/AC18>\n 2. Line 75, <AC19>simultaneously several items -> several items simultaneously<\/AC19>\n 3. Line 90, <AC20>filed -> field<\/AC20>\n 4. Line 110, 111: <AC21>improve -> improves, achieve -> achieves<\/AC21>\n 5. Line 135, <AC22>vectorss -> vectors<\/AC22>\n 6. Line 158, <AC23>is same as -> is the same as<\/AC23>\n 7. Line 232, <AC24>summarize -> summarizes<\/AC24>\nLine 274, <AC25>we obtain -> We obtain<\/AC25>\nlimitations: N/A"}, {"message_id": "Reviewer_bMB5 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer bMB5\nDear Reviewer bMB5, we are sincerely grateful for your careful reading and valuable feedback, which has helped improve our paper. We provide the point-to-point response below and <AC1>have updated the paper and appendix accordingly.<\/AC1>\n\n>**Q1**: \"The proposed method is a two-stage optimization strategy, which is a bit difficult to balance the two steps of optimization. Could it be end-to-end training?\"\n\n**A1**: Thanks very much for this valuable question. There are two points to this question. First, <AC2>thanks to the Sinkhorn algorithm[1], the optimizations of optimal transport and prompt learning can be integrated.<\/AC2> <AC3>Though it is a two-stage optimization strategy, we find it is natural and relatively easy to the optimization.<\/AC3> <AC4>We have added this into page 5 of the revised paper to reflect this point.<\/AC4> Thanks for your question.\n\nSecond, <AC5>we also updated the paper to make it more explicit that though the optimization strategy is two-stage, the whole training flow is end-to-end.<\/AC5> It is because <AC6>the transport plan is computed using a small number of matrix multiplications using the iterative Sinkhorn algorithm as one feedforward module of the neural network.<\/AC6> <AC7>The gradients of these matrix multiplications are taped for backpropagation for end-to-end optimization<\/AC7>, <AC8>which makes the whole system fully differentiable (including the iterative algorithm) and easy to implement using an autograd library like PyTorch.<\/AC8>\n\nBesides, <AC9>the optimization of the transport plan with the Sinkhorn algorithm is very efficient.<\/AC9> <AC10>As shown in lines 303-305 of the original paper and Section D in the supplementary material, we demonstrate that this optimization process only costs around 10% inference speed and 5% training time.<\/AC10>\n\n[1]Cuturi M. Sinkhorn distances: Lightspeed computation of optimal transport[J]. Advances in neural information processing systems, 2013, 26.\n\n>**Q2**: \"After optimization, for different images and classes, are they sharing the same prompts? If so, there might be issues. Because different images have different local patterns, like a dog lying on the ground' v.s. 'a bird in the forest'. They have different local patterns (positions).\"\n\n**A2**: Thanks for this valuable question. First, <AC11>the **prompts** are shared for different images and classes, and the **prompt features** are only shared for different images of the same class (prompt features contain the information of the class label).<\/AC11> <AC12>It requires the distance between prompt features and visual features to be intra-category robust even if the images in the same class are misaligned.<\/AC12> <AC13>In this paper, we learn a transport plan T to align prompt features and local visual features.<\/AC13> Let us explain why the optimal transport helps solve this intra-category misalignment problem below.\n\n<AC14>Suppose we have two prompts “head” and “tail” for the class “bird”, given two images with position shifts where **Image A** is “left head and right tail” and **Image B** is “right head and left tail”. It will provide a wrong similarity score if we directly match the prompt “head” with the left region and prompt “tail” with the right region.<\/AC14> <AC15>To deal with this problem, we leverage optimal transport, which optimizes a transport plan to adaptively match the prompt feature and visual feature.<\/AC15> <AC16>The optimal transport can acquire the optimal matching flows with minimal distance.<\/AC16> <AC17>In this example, the optimal transport will match prompt “head” with the left region for **Image A** and match prompt “head” with the right region for **Image B**.<\/AC17> Thus, <AC18>even though the prompt features are shared for all images in the same class, the optimal transport can provide the adaptive matching plan to solve the misalignment problem.<\/AC18> <AC19>We have highlighted this capability of optimal transport on page 2 of the revised paper.<\/AC19>\n\n>**Q3**: \"Typos.\"\n\n**A3**: Thank you very much! <AC20>We have corrected the typos in the revised paper.<\/AC20>\n\n Global/general Response:\n```\nWe thank all reviewers for their thoughtful and constructive review of our manuscript. <AC21>We were encouraged to hear the reviewers think PLOT is “effective”(Reviewer fGe6), “reasonable”(Reviewer c3r2), and “well-motivated” (Reviewers bMB5 and c3r2), and that the effectiveness can be demonstrated with “comprehensive experimental analysis”(Reviewers fGe6, bMB5, and c3r2).<\/AC21> We provide a general response here to summarize the modifications of the manuscript.\n\n- To reviewer fGe6: <AC22>We have clarified the motivation and advantage of using Optimal Transport on page 2.<\/AC22>\n- To reviewer fGe6: <AC23>We have added the experimental comparison with CoCoOp in Figure 3.<\/AC23>\n- To reviewer fGe6: <AC24>We have added a subsection on page 5 to introduce the inference strategy of PLOT.<\/AC24>\n- To reviewer fGe6: <AC25>We have split Table 2 into 2 tables for ablation studies and parameters analysis respectively.<\/AC25>\n- To reviewer fGe6: <AC26>We have refined Figure 4 for clarity.<\/AC26>\n- To reviewer bMB5: <AC27>We have clarified our optimization strategy on page 5.<\/AC27>\n- To reviewer bMB5: <AC28>We have highlighted the capability of optimal transport for misalignment on page 2.<\/AC28>\n- To reviewer bMB5: <AC29>We have corrected the typos accordingly.<\/AC29>\n- To reviewer c3r2: <AC30>We have updated the explanation for the failure cases on page 7 and included more visualization results of the failure cases in Section F of the supplementary materials.<\/AC30>\n- To reviewer c3r2: <AC31>We have explicitly included the limitations in Section 4.4 based on previous discussions.<\/AC31>\n```"}, {"message_id": "Reviewer_bMB5 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "I appreciate the authors' efforts in addressing my concerns. <AC1>The authors have answered almost all of my concerns.<\/AC1> <AC2>I uphold my recommendation to accept this paper.<\/AC2>"}]}, {"i": 2, "name": "Reviewer_c3r2", "rating": [7, 7], "messages": [{"message_id": "Reviewer_c3r2 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper focuses on the few-shot prompt learning for vision-language model CLIP.<\/AC1>\n<AC2>On the top of the recent work CoOp who only learns one single prompt, this work proposes a novel method called PLOT, which learn multiple prompts to leverages more fine-grained information from image's feature map.<\/AC2> <AC3>The key motivation of PLOT is to generate a set of prompts so that each prompt can help the model to focus on some specific areas on the feature map.<\/AC3> <AC4>To realize the idea, optimal transport method is used to contrast the effects of each prompt.<\/AC4>\n<AC5>The experiment shows that PLOT can achieve better performance over CoOp in most of the datasets.<\/AC5>\nstrengths_and_weaknesses: Pro:\n+ <AC6>The motivation of PLOT is strong.<\/AC6> <AC7>Figure 1 clearly states the main idea.<\/AC7>\n+ <AC8>Using optimal transport to learn distinguishable prompt is reasonable and simple.<\/AC8>\n+ <AC9>The experiment shows the effectiveness of the proposed methods.<\/AC9>\n+ <AC10>Implementation details are clearly stated.<\/AC10>\n+ <AC11>Analysis is comprehensive and strong.<\/AC11>\n\nCon:\n- <AC12>Lack of explanation of failure cases, such as StanfordCar in Fig.3.<\/AC12> <AC13>A good illustration and discussion on failure case can help the community know better about your method and the problem.<\/AC13>\n- <AC14>Lack of visualization of the learnt prompt.<\/AC14> <AC15>Although it is understandable that it is difficult to print the learnt prompt out into a completed sentence, some words in the prompt can still reveal what the prompt is about.<\/AC15> For example, <AC16>in CoOp, the learnt prompt in OxfordPets has some words like fluffy, paw, etc.<\/AC16> <AC17>Hope PLOT can show more clues about its intrinsic mechanism.<\/AC17>\nquestions: None\nlimitations: <AC18>The authors do not include the discussion on the limitation of the method.<\/AC18> <AC19>We hope the authors can provide more analysis on its weakness in discusssion.<\/AC19>"}, {"message_id": "Reviewer_c3r2 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer c3r2\nDear Reviewer c3r2, thanks for your positive comments and helpful suggestions! <AC1>We made several small revisions, according to your suggestions.<\/AC1> Please see the revised paper and supplementary materials for details.\n\n>**Q1:** “ Lack of explanation of failure cases, such as StanfordCar in Fig.3. A good illustration and discussion on failure cases can help the community know better about your method and the problem.”\n\n**A1:** Thanks very much for this helpful suggestion. <AC2>On the StanfordCar dataset, as you mentioned, learning multiple prompts didn’t significantly improve the performance over a single prompt.<\/AC2> <AC3>It may be because the discriminative characters in this dataset coincide with each other, such that one global prompt and one global visual feature can work well.<\/AC3> <AC4>We have updated this explanation on page 7 of the revised version.<\/AC4> <AC5>To further discover the reason behind this phenomenon, we visualize the attention maps of some failure cases.<\/AC5> <AC6>Specifically, in Figure 1 in the updated version of supplementary materials, we showed two failure examples with class \"2000 AM General Hummer\" in the StanfordCars dataset.<\/AC6> <AC7>Although the number of prompts is set as 4, we found the learned prompts can be roughly divided into two classes: Foreground and Background, where some of the prompts coincide with each other.<\/AC7> For example, <AC8>in both images,\nprompt 2 (right top) and 3 (left down) focus on the foreground car, while the others focus on the background.<\/AC8> <AC9>It demonstrates that not all classes have multiple complementary attributes<\/AC9>, <AC10>which motivates us to go further to learn the dynamic local prompts numbers to reduce the computational load in the future.<\/AC10> <AC11>We included the results and discussions in the updated supplementary materials (Section F on pages 4 and 5).<\/AC11>\n\n>**Q2:** “Lack of visualization of the learnt prompt. Although it is understandable that it is difficult to print the learnt prompt out into a completed sentence, some words in the prompt can still reveal what the prompt is about. For example, in CoOp, the learnt prompt in OxfordPets has some words like fluffy, paw, etc. Hope PLOT can show more clues about its intrinsic mechanism.”\n\n**A2:** Thanks very much for these suggestions. <AC12>We produced the visualization results of the learned prompt and the corresponding discussion<\/AC12>, but <AC13>could not put them in the main paper due to the page limits.<\/AC13> Please kindly refer to Section E and Table 4 in the supplementary materials. <AC14>We found some interesting relations between the learned prompts and corresponding optimal transport plans, which help to understand the semantic attributes of different local prompts.<\/AC14> <AC15>If you think it is essential to show such results in the main paper, we will find a way to achieve it.<\/AC15>\n\n>**Q3:** “The authors do not include a discussion on the limitation of the method. We hope the authors can provide more analysis on its weakness in the discussion.”\n\n**A3:** Thank you! <AC16>We have explicitly included the limitations in Section 4.4 of the updated version based on previous discussions.<\/AC16> <AC17>There are two main limitations of our method.<\/AC17> First, <AC18>PLOT still needs few-shot data for optimization, which cannot be directly applied in the zero-shot setting.<\/AC18> It is because that <AC19>CLIP is trained by matching the global visual feature and text<\/AC19>, while <AC20>our method applies the local visual features which need few-shot data for optimization.<\/AC20> Second, <AC21>The method needs more computing costs than CoOp.<\/AC21>\n\n Global/general Response:\n```\nWe thank all reviewers for their thoughtful and constructive review of our manuscript. <AC22>We were encouraged to hear the reviewers think PLOT is “effective”(Reviewer fGe6), “reasonable”(Reviewer c3r2), and “well-motivated” (Reviewers bMB5 and c3r2), and that the effectiveness can be demonstrated with “comprehensive experimental analysis”(Reviewers fGe6, bMB5, and c3r2).<\/AC22> We provide a general response here to summarize the modifications of the manuscript.\n\n- To reviewer fGe6: <AC23>We have clarified the motivation and advantage of using Optimal Transport on page 2.<\/AC23>\n- To reviewer fGe6: <AC24>We have added the experimental comparison with CoCoOp in Figure 3.<\/AC24>\n- To reviewer fGe6: <AC25>We have added a subsection on page 5 to introduce the inference strategy of PLOT.<\/AC25>\n- To reviewer fGe6: <AC26>We have split Table 2 into 2 tables for ablation studies and parameters analysis respectively.<\/AC26>\n- To reviewer fGe6: <AC27>We have refined Figure 4 for clarity.<\/AC27>\n- To reviewer bMB5: <AC28>We have clarified our optimization strategy on page 5.<\/AC28>\n- To reviewer bMB5: <AC29>We have highlighted the capability of optimal transport for misalignment on page 2.<\/AC29>\n- To reviewer bMB5: <AC30>We have corrected the typos accordingly.<\/AC30>\n- To reviewer c3r2: <AC31>We have updated the explanation for the failure cases on page 7 and included more visualization results of the failure cases in Section F of the supplementary materials.<\/AC31>\n- To reviewer c3r2: <AC32>We have explicitly included the limitations in Section 4.4 based on previous discussions.<\/AC32>\n```"}, {"message_id": "Reviewer_c3r2 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thank you for the authors' feedback. <AC1>The response addresses most of my concerns.<\/AC1> <AC2>I maintain my positive recommendation for this work.<\/AC2>"}]}, {"i": 3, "name": "Reviewer_fGe6", "rating": [null, 7], "messages": [{"message_id": "Reviewer_fGe6 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper focused on adapting large-scaled pre-trained vision-language model (i.e., CLIP) to downstream datasets under the few-shot setting.<\/AC1> <AC2>Compared to the recent related work CoOp, this work (1) learns multiple prompts, (2) uses both local features and global features, and (3) measures the similarity of prompts and visual features using optimal transport.<\/AC2> <AC3>Experiments on 11 benchmark visual recognition datasets show that the proposed method outperforms the baseline CoOp.<\/AC3> <AC4>Ablation studies further more analysis on the contribution of each component.<\/AC4>\n\n----------------------\n\nUpdated after rebuttal:\n\nReasons to accept:\n\n+ <AC5>The motivation for this work is clear.<\/AC5> <AC6>Single prompts may lose the details of local attributes or contexts.<\/AC6>\n\n+ <AC7>The idea of applying optimal transport to prompt learning makes sense<\/AC7> and <AC8>meets well with the motivation.<\/AC8>\n\n+ <AC9>The experiments and analysis are comprehensive.<\/AC9> <AC10>The improvement is significant.<\/AC10>\n\n<AC11>I am satisfied with the authors' responses to my comments and concerns<\/AC11>, and <AC12>I increased my rating from 6 to 7.<\/AC12> I have read other reviewers' concerns on (1) two-stage training, (2) sharing of prompts, and (3) failure analysis and visualization. <AC13>I think these questions are not severe for rejection<\/AC13> and <AC14>the authors have responded to these concerns.<\/AC14>\nstrengths_and_weaknesses: <AC15>Overall, considering both strengths (simple but effective pipeline, comprehensive experimental analysis) and weakness (insight and contribution), my initial rating is borderline.<\/AC15>\n\nStrengths:\n\n\\+ <AC16>The problem of adapting CLIP under few-shot setting is recent.<\/AC16> <AC17>Compared to the baseline method CoOp, the improvement of the proposed method is significant.<\/AC17>\n\n\\+ <AC18>The ablation studies and analysis in Section 4.4 is well organized and clearly written.<\/AC18> <AC19>It is easy to follow the analysis and figure our the contribution of each component.<\/AC19> Also, <AC20>Figure 2 is well designed and clear to illustrate the pipeline.<\/AC20>\n\n\\+ <AC21>The experimental analysis is comprehensive.<\/AC21> <AC22>The analysis on computation time and inference speed is also provided.<\/AC22>\n\nWeakness:\n\n\\- (major concern) <AC23>The contribution is somehow limited.<\/AC23> <AC24>The main contribution is applying optimal transport for few-shot adaptation of CLIP.<\/AC24> <AC25>After reading the paper, it is not clear enough to me why Optimal Transport is better than other distance.<\/AC25> Especially, <AC26>the insight behind the application of Optimal Transport is not clear.<\/AC26> <AC27>I would like to see more analysis and explanation on why Optimal Transport works well.<\/AC27> Otherwise, <AC28>it seems that this work is just an application work on a specific model and a specific task, which limits the contribution.<\/AC28>\n\n\\- <AC29>The recent related work CoCoOp [1] is not compared in the experiments.<\/AC29> <AC30>Although it is a CVPR'22 work that is officially published after the NeurIPS deadline, as the extended version of CoOp, it is necessary to compare with CoCoOp in the experiments.<\/AC30>\n\n\\- <AC31>In the approach method, there lacks a separate part or subsection to introduce the inference strategy, i.e., how to use the multiple prompts in the test stage.<\/AC31>\n\n\\- <AC32>Table 2 mixed different ablation studies (number of prompts, visual feature map, constraint).<\/AC32> <AC33>It would be great if the table can be split into several tables according to the analyzed component.<\/AC33>\n\n\\- <AC34>The visualization in Figure 4 is not clear.<\/AC34> <AC35>It is not easy to see the attention as it is transparent.<\/AC35>\n\nReferences\n\n[1] Kaiyang Zhou, Jingkang Yang, Chen Change Loy, and Ziwei Liu. Conditional prompt learning for vision-language models. In CVPR, 2022.\n\n------------\n\n<AC36>After reading the authors' response and the revised version, my concerns (especially the contribution of introducing the optimal transport distance for fine-tuning vision-language models) are well addressed<\/AC36> and <AC37>I am happy to increase my rating.<\/AC37>\nquestions: Please see weaknesses in the above.\nlimitations: <AC38>The authors have adequately addressed the limitations.<\/AC38>"}, {"message_id": "Reviewer_fGe6 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer fGe6\nDear Reviewer fGe6, we appreciate your time dedicated to reviewing this paper and the valuable comments, which have helped improve our work. <AC1>We revised our manuscript accordingly<\/AC1> (please see the updated paper and supplementary materials for details), and provide a point-to-point response below.\n\n>**Q1**: \"it is not clear enough to me why Optimal Transport is better than other distances. Especially, the insight behind the application of Optimal Transport is not clear. I would like to see more analysis and explanation on why Optimal Transport works well.\"\n\n**A1**: Thanks for your valuable question! <AC2>In light of your comments, we added more comparisons between Optimal Transport and other distance to show the insight of using Optimal Transport in the revised manuscript.<\/AC2>\n\n<AC3>Conventional prompt learning methods (e.g. CoOp) adopt the **Euclidean distance** to measure the similarity between **single (global) prompt feature vector** and **single (global) visual feature vector**.<\/AC3> In contrast, <AC4>PLOT proposes to use the **Optimal Transport** to calculate the distance between **multiple (local) prompt features** and **multiple (local) visual features**.<\/AC4> <AC5>Before we discuss the differences between Optimal Transport and conventional Euclidean distance, we would mention the differences between PLOT and conventional prompt learning methods in three folds: multiple (local) prompt features v.s. single (global) prompt feature; multiple (local) visual features v.s. single (global) visual feature; and using Optimal Transport to calculate set-to-set distance v.s. Euclidean distance.<\/AC5>\nLet’s discuss them one by one:\n\n**1, Multiple (local) prompt features v.s. single (global) prompt feature:** <AC6>Prompt is used to represent the classes.<\/AC6> <AC7>One class can be described with many intrinsic characteristics and extrinsic context relations.<\/AC7> <AC8>It motivates us to use multiple prompt candidates which focus on different attributes to replace one global prompt.<\/AC8> <AC9>Compared with a single prompt, multiple local ones can comprehensively represent the class and thus facilitate classification.<\/AC9>\n\n**2, Multiple (local) visual features v.s. single (global) visual feature:** <AC10>Compared with the single global visual feature, the information provided by local features are more discriminative and transferable.<\/AC10> <AC11>These local features are more robust to visual misalignment such as within-class position shift.<\/AC11>\n\n**3, Using Optimal Transport to calculate set-to-set distance v.s. Euclidean distance:** <AC12>As shown in lines 44-48 in the original manuscript, if we use multiple prompt features and single visual feature, all prompts are encouraged to be closer to one single point and thus tend to learn the same characteristics.<\/AC12> <AC13>It calls for multiple prompt features and multiple local visual features.<\/AC13> <AC14>Given the motivation that we use multiple local prompt and visual features to replace the global one, we further need to calculate the distance between the two feature sets.<\/AC14> <AC15>The conventional solution is to calculate the pairwise Euclidean distance and take the mean of all pairs.<\/AC15> However, <AC16>this distance is not robust for the feature shift.<\/AC16> <AC17>In this paper, we propose to apply the optimal transport to align the visual features and prompts, whose insight is to adaptively align different visual features for each local prompt<\/AC17>, <AC18>which is more robust to the visual misalignment and tolerates well feature shift[1].<\/AC18> It is because <AC19>Optimal Transport distance can represent the data structure by learning an adaptive transport plan for the fine-grained alignment.<\/AC19> Besides, <AC20>some theoretical analyses [2] also show that Optimal Transport distance space is more flexible than Euclidean spaces.<\/AC20> Here we show a toy example to show the advantage of the Optimal Transport distance. <AC21>Given two prompts whose values are 2 and 0, and two visual feature sets of the same class with feature shift (1,1,1,-1) and (1,1,-1,-1). In the mean Euclidean distance space, we get the distances of 1.5 and 1.25 respectively<\/AC21>, while <AC22>with optimal transport, we get the same distance of
