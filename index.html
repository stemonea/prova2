xt": "Title: Thanks for your response\n>>Brief descriptions of each baseline algorithm used, and why they were chosen\n>Answer: Thanks for the suggestion. We will now update the paper to include these details.\n\n<AC1>Where can I find these in the updated paper?<\/AC1>"}]}, {"i": 2, "name": "Reviewer_UN8M", "rating": [null, 5], "messages": [{"message_id": "Reviewer_UN8M · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper studies a class of sequential decision making problems, in which taking an action can incur a large cost.<\/AC1> <AC2>To address these problems, they proposed a method named Learnable Impulse Control Reinforcement Algorithm (LICRA), which learns both when to act and which action to take.<\/AC2> <AC3>For the proposed algorithm, they introduced a new Bellman operator and established convergence results.<\/AC3> Then <AC4>they generalized LICRA with state augmentation to solve the RL problem with a budget.<\/AC4> Finally, <AC5>they tested LICRL on three tasks.<\/AC5>\nstrengths_and_weaknesses: Strengths:\n1. <AC6>They proposed a reasonable LICRA algorithm that utilizes two separate policies to learn when to act and which action to take.<\/AC6> <AC7>It was shown that LICRA can also solve the RL problem with a budget.<\/AC7>\n\nWeakness:\n1. <AC8>The proposed method LICRA is not well-motivated<\/AC8> and <AC9>it is unclear why we need to learn two separate policies.<\/AC9> <AC10>As mentioned by the authors, to address RL problems in which taking an action can incur a cost, we can simply augment the action space with a null action and apply classical RL algorithms.<\/AC10> <AC11>Compared with this simple method, LICRA has an identical search space (action space)<\/AC11> but <AC12>requires twice the computational cost for learning the additional actor and critic.<\/AC12> Besides, <AC13>constrained RL approaches can also be applied in this setting.<\/AC13> <AC14>The authors do not show the advantages of LICRA over the methods mentioned before.<\/AC14>\n2. <AC15>The empirical evaluations are weak.<\/AC15> First, <AC16>the algorithms for comparison are too few.<\/AC16> <AC17>The constrained RL algorithms should be involved for comparison.<\/AC17> Second, <AC18>the improvements of LICRA are not clear on Merton’s Portfolio Problem and Lunar Lander task.<\/AC18> Third, <AC19>the introductions of the baseline algorithms in Figure 2 and Figure 3 are missing.<\/AC19>\n3. <AC20>The theoretical results and notations in Sec 5 are misleading.<\/AC20> See the question part for details. <AC21>I encourage the authors to re-write this part to improve the clarity.<\/AC21>\n4. <AC22>This paper studies RL problems where taking an action can incur a large cost.<\/AC22> <AC23>A closely related work [1] is missing.<\/AC23> <AC24>[1] studies the RL problems where the amounts of some specific actions are limited, which is similar to the problems studied in this paper.<\/AC24>\n\nReferences:\n[1]. Ji-Cheng, Pang, et al. \"Sparsity Prior Regularized Q-learning for Sparse Action Tasks.”arXiv preprint, arXiv: 2105.08666, (2021).\n\nquestions: 1. The operator of $\\mathcal{M}^{\\pi, g}$. <AC25>This operator should be applied on **any** function in $S \\times A \\rightarrow \\mathbb{R}$.<\/AC25> <AC26>Why use the notation $Q^{\\pi, g}$, which depends on $(\\pi, g)$?<\/AC26> Besides, <AC27>the function $\\mathcal{M}^{\\pi, g} Q^{\\pi, g}$ should be dependent on $Q^{\\pi, g}$.<\/AC27> However, <AC28>according to the definition given in line 186, $\\mathcal{M}^{\\pi, g} Q^{\\pi, g}$ is independent of $Q^{\\pi, g}$.<\/AC28> Besides, <AC29>in line 191, what does the notation $\\mathcal{M} v^{\\pi, g}$ mean?<\/AC29>\n2. The operator T in line 195. <AC30>The operator T does not depend on any policy $(\\pi, g)$.<\/AC30> However, <AC31>in its definition, the terms $\\mathcal{M}^{\\pi, g}$, $Q^{\\pi, g}$ and $v^{\\pi, g}$ all depend on some policy $(\\pi, g)$<\/AC31>,\n\nlimitations: <AC32>The authors do not mention any limitations or potential negative societal impact of their work.<\/AC32>"}, {"message_id": "Reviewer_UN8M · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to the reviewer UN8M\nWe thank the reviewer for their reading and comments. We hope that our response will enable the reviewer to appreciate the clarity of the paper and motivation as the other reviewers have.\n> \"The proposed method LICRA is not well-motivated and it is unclear why we need to learn two separate policies.\"\n\n#### Answer:\n\n<AC1>In Sec. 4, we expended considerable effort to explain the benefits of our method and justifying its structure.<\/AC1> We refer the reviewer to lines 144- 172 where this is explained in detail. <AC2>We have now also added several analyses to explain our claims.<\/AC2> Specifically, <AC3>we validated our claim that LICRA's structure leads to large efficiency gains relative to current state-of-the-art RL methods when the agent must be selective about where it acts.<\/AC3> <AC4>Our ablation study (Ablation study 1) reveals that LICRA's dual structure enables it to learn to be highly selective about where to act and where it should learn the corresponding optimal magnitudes for the actions.<\/AC4> <AC5>The reviewer is correct in saying that LICRA requires more computation<\/AC5> - <AC6>as we demonstrate in our numerous analyses, this enables RL to solve problems of this kind and achieve optimal performance unlike current methods which in some cases fail to solve the task e.g. the Drive problem (c.f. Fig. 2) where LICRA achieves maximal performance of a score of $2.5$ and the baselines achieve a score of $0$ indicating their failure to solve the task.<\/AC6>\n\n> \"The empirical evaluations are weak...the algorithms for comparison are too few.\"\n\n#### Answer:\n\nWe thank the reviewer for their comment. <AC7>We emphasise the LICRA is a plug \\& play method which enables existing RL methods to be easily integrated into LICRA.<\/AC7> Therefore <AC8>the most relevant comparison is against the base learner.<\/AC8> <AC9>For the sake of completeness, we have now added state-of-the-art RL methods from the constrained RL baselines (Lagrangian based) so that each experiment as baselines leading to a wide coverage of current methods.<\/AC9> <AC10>We show that in all cases the LICRA variants outperform the baselines which in some cases fail to even solve the task (e.g. Drive drive problem in Fig. 2 and Fig. 5) or are much slower in obtaining the optimal policy e.g. the Lunar Lander probelm in Fig. 3 and the Merton portfolio problem in Fig. .<\/AC10>\n\n<AC11>We are happy to add additional baselines and experiment that reviewer deems necessary for acceptance.<\/AC11>\n\n> The constrained RL algorithms should be involved for comparison.\n\n#### Answer:\n\n<AC12>We have added constrained RL baselines (Lagrangian based) when approriate.<\/AC12> <AC13>We are happy to add further baselines to our experiments.<\/AC13>\n\n> The improvements of LICRA are not clear on Merton’s Portfolio Problem and Lunar Lander task.\n\n#### Answer:\n\n<AC14>As pointed our by reviewer wRMk, the plots may not do the superior performance LICRA achieves justice.<\/AC14>\n\n<AC15>For the Lunar Lander experiment and Drive Environment, we have now added the following final scores to the captions that clearly indicate LICRA's superior empirical performance relative to the base learner.<\/AC15>\n* LunarLander(final scores):\nLICRA_SAC(98.03), SAC(61.20), LICRA_PPO(58.84), PPO(49.77).\n* Drive Env(final scores):\nLICRA_SAC(1.75), SAC(0.37), LICRA_PPO(2.63), PPO(0.24)\n\n<AC16>We chose the Merton problem due to its simplicity ($1$ dimensional state space and action space) and widespread application.<\/AC16> <AC17>Even in this setting, we show that PPO integrated LICRA (LICRA_PPO) solves the problem<\/AC17> whereas <AC18>PPO fails to reach the optimal solution after 500k training steps.<\/AC18> Additionally, <AC19>even though SAC eventually reaches similar performance as LICRA_SAC, SAC alone takes around 250k more training steps to do so in keeping with our claim that LICRA markedly improves the efficiency for tackling problems of this kind.<\/AC19>\n\n<AC20>Each of these evaluations clearly indicate LICRA's superior performance across a range of settings.<\/AC20>\n\n>The introductions of the baseline algorithms in Figure 2 and Figure 3 are missing.\n\n#### Answer:\n\nThanks, <AC21>we will add a brief note about the baselines in our updated version.<\/AC21>\n\n> Clarity and notations in Sec 5.\n\n#### Answer:\n\n<AC22>We have adjusted the notation of Sec. 5 to make it more clear and avoid any ambiguity.<\/AC22> <AC23>Please note that none of the analyses or conlusions are affected by these adjustments.<\/AC23>\n\n> The reference [1] \"Sparsity Prior Regularized Q-learning for Sparse Action Tasks.”arXiv preprint, arXiv: 2105.08666, (2021).\n\nThank you for bringing this paper up. <AC24>It's a pity that we didn't see this paper as it only appeared on arxiv and openreview and hasn't been published in a conference to our best knowledge.<\/AC24> <AC25>It is indeed a related work which highlights the need for treatment of problems of this kind.<\/AC25> <AC26>There are however fundamental differences between the problem settings and approaches.<\/AC26> <AC27>Unlike the approach taken in [1], the problem setting we consider is one in which the agent faces a cost for each action - the produces a need for the agent to be selective about where it performs actions (but does not necessarily constrain the magnitude or choice of those actions).<\/AC27> <AC28>In [1], the setting is one in which the \"opportunities of taking sparse action are limited\".<\/AC28> <AC29>The authors in [1] also do not give a theoretical treatment of ``sparse actions'' and do not suggest a formalism for tackling this setting but rather propose a pure algorithmic development (but with good results).<\/AC29> <AC30>We feel that the lack of formalisation prevents consideration of their approach to continuous sparse action spaces and requires restricting their consideration to discrete action spaces.<\/AC30> <AC31>Our formalisation as impulse control allows for a general approach.<\/AC31>\n\n> The definition of the operator ${\\cal M}^{\\pi, g}$.\n\nThanks for the comment. <AC32>The dependence of $\\mathcal{M} Q^{\\pi,\\mathfrak{g}}$ on $Q^{\\pi,\\mathfrak{g}}$ is apparent in the value function $v^{\\pi,\\mathfrak{g}}$ (which has a dependence of $Q^{\\pi,\\mathfrak{g}}$) which appears in the definition of $\\cal M$.<\/AC32> <AC33>Given the definition of the action-value function $Q$; ${\\cal M}^{\\pi,\\mathfrak{g}}$ acting on $Q^{\\pi',\\mathfrak{g}'}$ represents the expected return when an action intervention is immediately sampled from $\\pi$ (and the agent incurs an action cost $c$) and thereafter the policy $\\pi'$ is executed.<\/AC33>\n\n<AC34>We have updated the definition to the following to avoid this confusion<\/AC34>: \"\"Given a function $Q^{\\pi,\\mathfrak{g}}:\\mathcal{S}\\times\\mathcal{A}\\to\\mathbb{R},\\;\\forall\\pi,\\pi'\\in\\Pi$ and $\\mathfrak{g},\\mathfrak{g}'$, $\\forall s_{\\tau_k}\\in\\mathcal{S}$, we define the intervention operator $$\\mathcal{M}^{\\pi,\\mathfrak{g}}$$ by $$\\mathcal{M}^{\\pi,\\mathfrak{g}}Q^{\\pi',\\mathfrak{g}'}(s_{\\tau_k},a_{\\tau_k})\\\\:=\\mathcal{R}(s_{\\tau_k},a_{\\tau_k})-c(s_{\\tau_k},a_{\\tau_k})+\\gamma\\sum_{s'\\in\\mathcal{S}}P(s';a_{\\tau_k},s)v^{\\pi',\\mathfrak{g}'}(s')\\Big|a_{\\tau_k}\\sim\\pi$$\n\n> The definition of the Bellman operator $T$ and dependence on any policy $(\\pi,g)$.\n\n<AC35>The operator $T$ can act on functions, which depend on $(\\pi,g)$<\/AC35>, but <AC36>they can also act on functions that do not.<\/AC36> <AC37>In our case, they act on the functions that depend on $(\\pi,g)$.<\/AC37>\n\n Global/general Response:\n```\nWe would like to thank the reviewers for their careful reading and insights that have improved the paper with more comprehensive analyses. Additionally, we thank the reviewers who have expressed their appreciation of the importance of the problem we tackle and the clarity of our exposition.\n\n<AC38>The purpose of the paper is to introduce a framework within reinforcement learning that easily incorporates existing methods enabling them to efficiently solve problems in which the controller faces costs for taking actions.<\/AC38> <AC39>Our experiments verify our claim that such technology improves RL performance and enables RL methods to consistently solve problems of this kind where existing methods perform badly and may sometimes even fail.<\/AC39>\n\n**We outline some of the items we have now added to the manuscript to complement the already in-depth analyses we have performed in the paper:**\n\n* **<AC40>Comprehensive empirical analysis to validate the convergence theorems of LICRA Q learning variant (Theorem 2 and Theorem 3) (see Section 12 of the supplementary material)<\/AC40>**\n* **<AC41>New variants of LICRA to fully demonstrate LICRA's plug \\& play capabilities.<\/AC41>**\n* **<AC42>Suite of new baselines to verify the claim that LICRA outperforms current state-of-the-art RL methods.<\/AC42>**\n* **<AC43>Additional details relating to experimental settings.<\/AC43>**\n\n<AC44>These analyses now support the suite of ablation studies that yield insights into the behaviour of the policies LICRA generates (see Ablation study 1) and LICRA's behaviour when faced with different forms of costs (see Ablation study 2).<\/AC44>\n\n<AC45>We also restructured the experiment section in order to bring the insights gained in the ablation studies into the main body.<\/AC45>\n\nIn our updated version, we will also add:\n\n* **<AC46>Experiments to validate the claim that when the subregion of the state space in which the agent is required to act (intervention region) is relatively small, LICRA's approach vastly improves efficiency.<\/AC46>**\n\n**EDIT: <AC47>This has now been added<\/AC47> - please see Sec. 11.2 of the supplementary material.**\n\nWe hope the reviewers appreciate the updates to our paper.\n\n**EDIT: <AC48>We believe we have now resolved **all** the reviewers' questions including the very in-depth inspection of our theoretical analyses (see the points raised and inspection by reviewer UN8M) and each of the claims made about our framework each of which are now supported by empirical results some of which were added at the request of the reviewers.<\/AC48>**\n\n```"}, {"message_id": "Reviewer_UN8M · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Response to the authors\nThank the authors for the detailed response. Below are my responses.\n\nWeakness 1: The benefits of using two separate policies.\nFirst, <AC1>I think that lines 144-172 do not explain the benefits of using two separate policies clearly.<\/AC1> <AC2>Lines 144-155 introduce the procedure of LICRA.<\/AC2> <AC3>In lines 156-167, the authors claim that the decision space is reduced by using two separate policies.<\/AC3> <AC4>I think this claim is not true.<\/AC4> <AC5>Consider a simple approach that augments the action space with a null action and then performs any classical RL method. The decision space is $S(A+1)$.<\/AC5> <AC6>For LICRA, the total decision space is $S \\times 2 + S \\times A = S (A+2)$.<\/AC6> Therefore, <AC7>I think that the benefit that LICRA can reduce the decision space does not hold.<\/AC7>\n\nSecond, <AC8>I think the experiments cannot validate the benefits of using two separate policies in LICRA.<\/AC8> <AC9>The mentioned simple baseline which augments the action space with a null action is not involved for comparison.<\/AC9> Thus, <AC10>I cannot see the benefits of additionally introducing two separate policies.<\/AC10>\n\nWeakness 3: The clarity in section 5.\n\n<AC11>In section 5, there are still some misleading parts.<\/AC11> Therefore, <AC12>it is difficult for me to evaluate the theoretical contribution here.<\/AC12>\n\nFirst, <AC13>the definition of $T$ in eq.(3) is problematic.<\/AC13> <AC14>The LHS term $T v^{\\pi, g} (s_t)$ does not depend on any action $a$.<\/AC14> However, <AC15>the RHS term depends on some certain action $a$ through $\\mathcal{M}^{\\pi, g} Q^{\\pi, g} (s_t, a)$.<\/AC15>\n\nSecond, <AC16>according to the definition of $T$ in eq.(3), $T$ depends on some certain policy $(\\pi, g)$ thorough $\\mathcal{M}^{\\pi, g}$.<\/AC16> Therefore, <AC17>in my understanding, $T$ is similar to the Bellman operator used in classical policy iteration, rather than the Bellman optimality operator in classical value iteration.<\/AC17> <AC18>If true, it is unreasonable that repeatedly applying the policy-dependent Bellman operator $T$ can converge to the optimal Q function.<\/AC18>\n\nThird, <AC19>in the Q-learning update rule in Theorem 2, they use the operator $M^{\\pi, g}$ which depends on certain policies $(\\pi, g)$.<\/AC19> However, <AC20>the part on how to choose $(\\pi, g)$ is missing.<\/AC20>"}, {"message_id": "Reviewer_UN8M · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Response to the reviewer's comments\nThanks a lot for asking these important questions!\n\n**A key point.** A first thing to note is that in this setting since <AC1>the agent faces a positive cost for each action<\/AC1>, <AC2>acting at each step is generally vastly suboptimal.<\/AC2> <AC3>In the case where the cost for acting is undiscounted, any policy that performs actions at each step would produce singular costs.<\/AC3>\n\n**Point about the null action.** <AC4>In our experiments, *all algorithms* apply actions that are drawn from an action set which contains a $0$ action.<\/AC4> <AC5>When this action is executed it produces $0$ costs and exerts no influence on the transition dynamics.<\/AC5> <AC6>This serves the role of a null action<\/AC6> and <AC7>is why we assert that our comparisons are valid.<\/AC7>\n\n**Point about complexity.** <AC8>We highlight the sequential aspect of LICRA means that the policy $\\mathfrak{g}$ eliminates the need to execute the action-policy (and determine optimal actions) at every state but only the subset of states where an action is required.<\/AC8> <AC9>This set is in general smaller than the entire state space given our earlier remarks.<\/AC9> However, <AC10>the reviewer’s calculation presupposes that an action is taken by LICRA’s action policy at each state.<\/AC10> <AC11>This is inconsistent with the setting we consider for the reasons mentioned above.<\/AC11>\n\n**The reviewer’s complexity calculation.** We thank the reviewer for their time in detailing their thoughts. <AC12>Given our remarks, using a similar line of reasoning as the reviewer, we can straightforwardly show that LICRA does indeed reduce complexity.<\/AC12> <AC13>We start by defining the set of states where the agent should act by $\\mathcal{S}_I$ and its compliment by $\\mathcal{S}_I^c$. With this, LICRA requires $|\\mathcal{S}_I^c|+|\\mathcal{S}_I||\\mathcal{A}|$ calculations.<\/AC13>\n<AC14>This is a reduction in complexity<\/AC14> since <AC15>$|\\mathcal{S}_I^c|+|\\mathcal{S}_I||\\mathcal{A}|<|\\mathcal{S}||\\mathcal{A}|$ iff $|\\mathcal{S}_I|(|\\mathcal{A}|-1)-|\\mathcal{S}|(|\\mathcal{A}|-1)<0$, which is always true whenever $\\mathcal{S}_I\\subset \\mathcal{S}$ which holds when $ |\\mathcal{S}_I|< |\\mathcal{S}|$ i.e. it holds whenever the agent should not take an action at every state.<\/AC15>\n<AC16>We did not include this reasoning<\/AC16> as <AC17>it removes focus from the very important case of continuous spaces.<\/AC17>\n\n**Point about LICRA Q learning rule and $\\mathcal{M}$.** <AC18>The dependence of $\\mathcal{M}^{\\pi,\\mathfrak{g}}Q$ on the action is eliminated by the fact that by definition (of $\\mathcal{M}^{\\pi,\\mathfrak{g}}$) the action input is the action which is sampled from the policy $\\pi$.<\/AC18> <AC19>This is analogous to the relationship between the value function $v$ and the action-value function $Q$ in standard reinforcement learning.<\/AC19> <AC20>In our Q learning rule, using the definition of $\\mathcal{M}$ allows for any (admissible) policy $(\\pi,\\mathfrak{g})$ including epsilon greedy and or the Boltzmann distribution.<\/AC20>\nWe again thank the reviewer for their suggestion on performing an analysis of our Q learning method. <AC21>We have now uploaded a version of the paper which contains this analysis.<\/AC21> Please see Section 12 of the supplementary material.\n\n**Point about LICRA's Bellman Operator.** <AC22>Our calcuations include the term $Tv^{\\pi, \\mathfrak{g}}$ .<\/AC22> <AC23>The operator $T$ has no direct dependence on $(\\pi, \\mathfrak{g})$, rather the object that it acts on $v^{\\pi, \\mathfrak{g}}$ has this dependence (please see our earlier comment relating $v^{(\\pi,\\mathfrak{g})}$ and $\\mathcal{M}^{(\\pi,\\mathfrak{g})}Q^{(\\pi,\\mathfrak{g})}$).<\/AC23> <AC24>In our latest upload of our work, we have now updated the notation in our definition of $T$ to avoid this confusion.<\/AC24> <AC25>This is analogous to the Bellman operator in standard RL acting on a value function $v^\\pi$, the operand has a dependence on $\\pi$ but the Bellman operator itself does not.<\/AC25>\n\nWe hope this completely clears everything up and are happy to answer anything that may remain unresolved!"}, {"message_id": "Reviewer_UN8M · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "Title: Response to the authors\nThanks for the response. <AC1>My question on the motivation for using two separate policies is addressed.<\/AC1> However, <AC2>I still have some concerns.<\/AC2>\n\n**Questions on $\\mathcal{M}^{\\pi, g}$ and Bellman operator $T$.**\n\n<AC3>According to your response, the term $\\mathcal{M}^{\\pi, g} Q^{\\pi^\\prime, g^\\prime}$ should be defined as<\/AC3>\n\n$\\mathcal{M}^{\\pi, \\mathfrak{g}} Q^{\\pi^{\\prime}, \\mathfrak{g}^{\\prime}}\\left(s_{\\tau k}, a_{\\tau k}\\right) := \\mathbb{E} _ { a_{\\tau k} \\sim \\pi (\\cdot| s_{\\tau k}) } [\\mathcal{R}\\left(s_{\\tau k}, a_{\\tau k}\\right)-c\\left(s_{\\tau k}, a_{\\tau k}\\right)+\\gamma \\sum_{s^{\\prime} \\in \\mathcal{S}} P\\left(s^{\\prime} ; a_{\\tau k}, s\\right) v^{\\pi^{\\prime}, \\mathfrak{g}^{\\prime}}\\left(s^{\\prime}\\right) ]$\n\n<AC4>In the revision, the expectation over $a_ {\\tau k}$ is missing.<\/AC4> However, <AC5>the above definition is still problematic.<\/AC5> <AC6>The LHS term $\\mathcal{M}^{\\pi, \\mathfrak{g}} Q^{\\pi^{\\prime}, \\mathfrak{g}^{\\prime}}\\left(s_{\\tau k}, a_{\\tau k}\\right)$ depends on certain action $ a_{\\tau k}$<\/AC6> while <AC7>the RHS term is independent of $a_{\\tau k}$ due to the expectation.<\/AC7>\n\n<AC8>For the operator $T$, you said that the operand has a dependence on $\\pi$ but the Bellman operator itself does not.<\/AC8> <AC9>If true, what is the definition of $Tv$ in Lemma 1?<\/AC9> <AC10>Here $v$ is not a value function of any policy.<\/AC10>\n\n**Question on the Q-learning update rule.**\n\n<AC11>My question is about the developed theory of Q-learning (i.e., Theorem 2).<\/AC11> <AC12>In the convergence analysis of Q-learning, how the policies $(\\pi, g)$ are chosen?<\/AC12> <AC13>To my knowledge, without a smart exploration strategy, Q-learning cannot converge in polynomial time [1].<\/AC13>\n\n<AC14>Based on the above concerns, I encourage the authors to revise section 5 thoroughly.<\/AC14> <AC15>Be careful to introduce new definitions and notations, and replenish the missing definitions.<\/AC15>\n\n[1] Chi Jin, Zeyuan Allen-Zhu, Sebastien Bubeck, and Michael I Jordan. Is q-learning provably efficient? In Advances in Neural Information Processing Systems, pages 4863–4873, 2018."}, {"message_id": "Reviewer_UN8M · id_turno 6", "turn": 5, "id_turno": 6, "speaker": "author", "text": "Title: Response to the reviewer\nWe thank the reviewer for their comments.\n\n**Definition of $\\mathcal{M}$.**\n\n<AC1>In the definition of $\\mathcal{M}^{\\pi,\\mathfrak{g}}$ the action $a$ is sampled from the policy in the term $\\mathcal{M}^{\\pi,\\mathfrak{g}}Q(s,a)$ (c.f. line 194 of the definition of $\\mathcal{M}$) i.e. $a\\sim \\pi$<\/AC1> and therefore <AC2>the LHS of the expression is also not dependent on a choice of $a$ (analogous to the fact that $\\max_yf(x,y)$ does not depend on a choice of $y$).<\/AC2> Additionally <AC3>as the action is *sampled* from the policy $\\pi$ this definition does not introduce an expectation as the reviewer has expressed.<\/AC3> <AC4>For our convergence proofs of our LICRA Q-learning variant, the policy pair is restricted<\/AC4> (please see our next comment).\n\n**The Bellman operator and our Q-learning rule**\n\nWe thank the reviewer for raising this question. <AC5>We agree with the reviewer’s point about the requirements for the convergence within RL.<\/AC5> <AC6>To explain our case, in general, the intervention operator $\\mathcal{M}^{\\pi,\\mathfrak{g}}$ can have dependence on an arbitrary policy pair $(\\pi,\\mathfrak{g})$.<\/AC6> <AC7>For the case of our LICRA Q-learning variant, its convergence assumes that this policy pair is fixed as an epsilon-greedy policy (please see lines 553-554 in the supplementary material).<\/AC7> <AC8>This is carried into the Bellman operator and enables us to prove convergence of our Q-learning variant (in polynomial time).<\/AC8> We thank the reviewer for raising this and <AC9>will include a comment in our updated version so as to more clearly highlight this point.<\/AC9>"}, {"message_id": "Reviewer_UN8M · id_turno 7", "turn": 6, "id_turno": 7, "speaker": "reviewer", "text": "Title: Response to the authors\nThanks for the response. <AC1>I think my concerns are not addressed.<\/AC1>\n\n**Definition of $\\mathcal{M}$**\n\n<AC2>If you do not introduce an expectation in the definition of $\\mathcal{M}^{\\pi, g} Q (s, a)$, you cannot remove the dependence on a specific action $a$.<\/AC2> <AC3>Consider $\\max_{y} f(x, y)$, you need the maximum operator to remove the dependence on $y$.<\/AC3>\n\n**The Bellman Operator $T$**\n\n<AC4>I think my question is misunderstood.<\/AC4> I clarify my question as follows. <AC5>In the definition of $T$ (line 202-203), you require that the operand has a dependence on $(\\pi, g)$ (i.e., $v^{\\pi, g}$).<\/AC5> However, <AC6>in Lemma 1, you apply $T$ on an arbitrary element $v$ in the vector space.<\/AC6> <AC7>What is the definition of $Tv$ if $v$ is not a value function of any policy?<\/AC7>\n\n**Q-learning Convergence**\n\n<AC8>I think that the argument that Q-learning with an epsilon-greedy policy can converge to the optimal policy in a polynomial time is not correct.<\/AC8> <AC9>In [1], they have shown that q-learning with an epsilon-greedy policy must require an exponential time complexity in some hard instances.<\/AC9> <AC10>Without a smart exploration strategy (e,g., upper confidence bound), we cannot expect that q-learning can converge to the optimal policy.<\/AC10>\n\n[1] Chi Jin, Zeyuan Allen-Zhu, Sebastien Bubeck, and Michael I Jordan. Is q-learning provably efficient? In Advances in Neural Information Processing Systems, pages 4863–4873, 2018."}, {"message_id": "Reviewer_UN8M · id_turno 8", "turn": 7, "id_turno": 8, "speaker": "author", "text": "Title: Response to the reviewer\nWe thank the reviewer again for their comments which we hope to now resolve.\n\n**Intervention operator $\\mathcal{M}$**\n\n<AC1>Our definition of $\\mathcal{M}^{\\pi,\\mathfrak{g}}$ means that the second argument of the operand is sampled from the policy $\\pi$ (and hence the variable is in fact a dummy variable).<\/AC1> <AC2>We could also load the notation and write $\\mathcal{M}^{a\\sim\\pi,\\mathfrak{g}}Q(s,a)$.<\/AC2> <AC3>To exemplify the point in a specific instance, consider a deterministic policy $f:\\mathcal{S}\\to\\mathcal{A}$ and the term $\\mathcal{M}^{f,\\mathfrak{g}}Q(s,a)$. Then for this the second input to the $Q$ term is simply $f(s)$, i.e. $a\\equiv f(s)$ and the whole expression is $\\mathcal{M}^{f,\\mathfrak{g}}Q^{\\pi',\\mathfrak{g}'}(s_\\tau,a_\\tau)=\\mathcal{R}(s_\\tau,f(s_\\tau))-c(s_\\tau,f(s_\\tau))+\\gamma\\sum_{s'\\in\\mathcal{S}}P(s';f(s_\\tau),s_\\tau)v^{\\pi',\\mathfrak{g}'}(s')$.<\/AC3>\n\n**The Bellman operator $T$ in Lemma 1**\n\n<AC4>For our proof of Lemma 1, we fix the policy as an (epsilon-)greedy policy.<\/AC4> <AC5>This is given in line 554 where the action which is selected at the currect state is that which maximises [current reward - cost + discounted expected future return].<\/AC5> <AC6>We also restrict the function $v$ to maps of the kind $v:\\mathcal{S}\\to\\mathbb{R}$ (c.f. lines 549-550)<\/AC6> therefore <AC7>$v$ in this instance can be interpreted as a value function of an (epsilon-)greedy policy.<\/AC7>\nConcretely, from line 554, the definition of $Tv$ here is:\n$Tv(s_{\\tau}):=\\max\\Big\\\\{\\max_{a\\in\\mathcal{A}}\\\\{\\mathcal{R}(s_{\\tau},a)-c(s_{\\tau},a)+\\gamma\\sum_{s'\\in\\mathcal{S}}P(s';a,s_{\\tau})v(s')\\\\},\n\\[\\mathcal{R}(s_{\\tau},0)+\\gamma\\sum_{s'\\in\\mathcal{S}}P(s';0,s_{\\tau})v(s')]\\\\}$\n\n**Our convergence proof**\n\nWe thank the reviewer for this question. <AC8>Our paper proves convergence of the *value function* $Q$ to the optimal value function $Q^\\star$.<\/AC8> <AC9>As with standard Q learning, this is provable under the standard assumptions of stochastic approximation theory, e.g. [2].<\/AC9> <AC10>This does not assert claims of polynomial-time learning of the *optimal policy* (in episodic settings which is the task and problem setting being considered in [1].)<\/AC10>\n\n[2] Tsitsiklis, J. N. (1994). Asynchronous stochastic approximation and Q-learning. Machine learning, 16(3), 185-202.\nWe great appreciate the reviewer’s effort in providing suggestions to improve the paper and raising questions for us to address their concerns. We would like to ask the reviewer if they have any issues with the paper. If none remain, we would be grateful if the reviewer could adjust their score to reflect their most current appraisal of our work (if they see fit to change it from reject)."}, {"message_id": "Reviewer_UN8M · id_turno 9", "turn": 8, "id_turno": 9, "speaker": "reviewer", "text": "Title: Response to the authors\nThanks for the clarification. <AC1>I will increase my score to 5.<\/AC1> Below are some suggestions.\n\n<AC2>To formalize the meaning that the second argument of the operand is sampled from the policy, I think you should introduce an expectation operator.<\/AC2>\n$\n\\mathcal{M}^{\\pi, g} Q^{\\pi^\\prime, g^\\prime} (s_\\tau) = \\mathbb{E} _ {a_{\\tau k} \\sim \\pi\\left(\\cdot \\mid s_{\\tau k}\\right)}\\left[\\mathcal{R}\\left(s_{\\tau k}, a_{\\tau k}\\right)-c\\left(s_{\\tau k}, a_{\\tau k}\\right)+\\gamma \\sum_{s^{\\prime} \\in \\mathcal{S}} P\\left(s^{\\prime} ; a_{\\tau k}, s\\right) v^{\\pi^{\\prime}, \\mathfrak{g}^{\\prime}}\\left(s^{\\prime}\\right)\\right]\n$\n\n<AC3>For the definition of $Tv$ and the convergence proof, you can replenish these necessary definitions and explanations to the main text.<\/AC3>"}, {"message_id": "Reviewer_UN8M · id_turno 10", "turn": 9, "id_turno": 10, "speaker": "author", "text": "Title: Response to the reviewer\nWe thank the reviewer for their recent suggestion and oveall comments and lively discussions that have enabled us to greatly improve the paper (please see the very last upload). <AC1>We are happy to add more finishing adjustments in the camera-ready should the paper be accepted.<\/AC1>\n\n<AC2>We noted that all reviewers have agreed in full on the importance of the problem setting we have tackled that is currently unaddressed and would be of benefit to the RL community.<\/AC2> <AC3>Our paper, which is supported by elaborate theory and empirical evalutions, now contains a very comprehensive analyses of our novel method that provides some deep insights about LICRA.<\/AC3> <AC4>This includes empirical analyses to validate our theoretical claims, empirical evaluations in 3 domains and 3 ablation studies.<\/AC4>\n\n<AC5>We along with the reviewer have also expended a great deal of effort to ensure confidence in the correctness of our claims, theory and given detailed justifications for our method.<\/AC5> <AC6>We now also believe we have resolved any concerns from all reviewers and delivered on all the reviewers' many and diverse requests.<\/AC6>\n\n<AC7>While we appreciate the reviewer changing their score, given the reviewer's current score of a borderline accept is reserved for special cases where the contribution is only very slight, we respectfully ask the reviewer to reconsider the modest movement and consider a more substantial upward adjustment.<\/AC7>\n\nBest wishes,\n\nThe authors"}, {"message_id": "Reviewer_UN8M · id_turno 11", "turn": 10, "id_turno": 11, "speaker": "reviewer", "text": "I am delighted to have engaged in the above conversation with the author, <AC1>which has definitely improved the overall quality of the paper.<\/AC1>"}]}, {"i": 3, "name": "Reviewer_wRMk", "rating": [null, 5], "messages": [{"message_id": "Reviewer_wRMk · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>According to the authors, this paper studies the problem of choosing when to act, also known as the impulse control problem.<\/AC1> <AC2>Choosing to abstain from actions has relevance in various real-world scenarios where doing nothing can be the right decision.<\/AC2> <AC3>As the authors discuss, this can be because of some costs associated with taking action.<\/AC3> <AC4>A motivating example of their work is portfolio management, where not buying or selling financial instruments is the right move as fees are associated with each action.<\/AC4>\n\n<AC5>The authors model propose a framework that incorporates the impulse control problem in the reinforcement learning problem.<\/AC5> <AC6>They accomplish this by representing costs associated with actions taken in the reward function.<\/AC6> <AC7>They decompose the agent policy into two policies: the original action space policy and a binary policy to choose whether to act or not.<\/AC7> <AC8>They argue against including this action in the rest of the action set<\/AC8> because <AC9>it would be inefficient in the learning process due to action cardinality.<\/AC9>\n\n<AC10>The authors further prove theoretical results that their approach will converge to the optimal Q function.<\/AC10> <AC11>They do this in the tabular and linear function approximator cases.<\/AC11> <AC12>Their experiments further validate the framework<\/AC12>, and <AC13>the authors suggest their framework appropriately deals with these challenges empirically compared to baselines.<\/AC13>\n\nstrengths_and_weaknesses: <AC14>According to the authors, the paper presents a significant problem that has not been studied in the reinforcement learning problem.<\/AC14> <AC15>From the reviewer's experience in robotics, it is a valid consideration that not sending a new action can be the optimal decision.<\/AC15> <AC16>The author's theoretical results support the validity of their proposed algorithms.<\/AC16> <AC17>The fact that their algorithm can augment existing reinforcement learning algorithms is a great advantage<\/AC17> as <AC18>it means one can quickly implement the additional policy for real-world applications.<\/AC18> <AC19>The way the authors structured their problems seems appropriate to understand the problem they are interested in addressing.<\/AC19>\n\nHowever, <AC20>a concern with this paper is with the experiment evaluations.<\/AC20> <AC21>Much more evaluation is necessary to validate the LICRA framework.<\/AC21> <AC22>A few crucial things that come to mind would be to validate the theoretical results in the tabular and linear cases.<\/AC22> <AC23>The authors discuss Q-learning-like algorithms<\/AC23>, but <AC24>it seems like they do not even propose it by itself as a new algorithm or do any experiments with it.<\/AC24> <AC25>Not evaluating this update rule feels like a missed opportunity to isolate and understand the influence of the LICRA framework in more easily reproducible settings.<\/AC25>\n\n<AC26>Supposing the there were reasonable justification against these types of experiments, their existing experiments could still be improved.<\/AC26> <AC27>One discrepancy in the experiments is the different versions of LICRA algorithms that the authors claim to study instead of report.<\/AC27> <AC28>In the Experiments introduction, they introduce LICRA_PPO and LICRA_SAC<\/AC28>, but <AC29>in Figure 1, LICRA_SAC is not present<\/AC29>; <AC30>in Figure 2, there is just \"LICRA,\"<\/AC30>; and <AC31>only in Figure 3 are both of these algorithms present.<\/AC31> <AC32>Perhaps this is nit-picking, but from the author's inclusion of different combinations of RL policies with their algorithm, one would expect full coverage of the combinations (so four different versions of LICRA if using both SAC and PPO for each sub-policy).<\/AC32> Additional comments are left for the question section as they are more about details to be included and for clarification.\nquestions: - <AC33>Are features shared for both policies in the experiments or are they entirely separate?<\/AC33>\n- <AC34>Can the action decision policy be a separate linear head trained with a different reward signal?<\/AC34>\n- <AC35>Were any experiments done to validate the theoretical results?<\/AC35>\n- <AC36>A statement in section 4 seems important to evaluate: \"if the ratio of s to s_i is large, learning g before pi is essential\".<\/AC36> <AC37>What was the rationale for abstaining from testing this scenario?<\/AC37>\n- <AC38>In theorem 2, the max is between taking action or future expected reward after doing nothing.<\/AC38> <AC39>In terms of having taken action, why is it a_t and not max_{a_t}?<\/AC39> <AC40>Wouldnt this make this make it more of a SARSA update?<\/AC40>\n- <AC41>What is delta in section 6 Equation 4?<\/AC41> <AC42>I could not find the definition.<\/AC42>\n- <AC43>What is the state variable of the Merton problem?<\/AC43> <AC44>Does it have any sequential relations?<\/AC44>\n- <AC45>In the Merton experiments, are the results sensitive to the environment parameters of the SDE?<\/AC45> <AC46>I.e., is LICRA robust to these choices?<\/AC46>\n- <AC47>Which hyperparameters were tuned over?<\/AC47> <AC48>It is mentioned in the 12 Hyperparameter section that \"square brackets indicate ranges,\" but I did not see any in the hyperparameter in the table using square brackets.<\/AC48>\n- <AC49>Equation 14 of proof of theorem 1, inconsistent usage of lambda (is its function of 1 or 2 inputs?).<\/AC49> <AC50>What does \"I(\\tau)\" mean in Equation 14?<\/AC50>\n- <AC51>Please tighten up notation in theorem one proof<\/AC51>; <AC52>the proof starts with \\lambda, which becomes \\phi and then \\theta.<\/AC52> <AC53>It is not unclear why these variables change.<\/AC53>\n- <AC54>A paper that might be related is the following: Nonparametric learning for impulse control problems Soren Christensen and Claudia Straugh.<\/AC54> Disclaimer: I thoroughly read the paper, but they mention impulse control and reinforcement learning\n- <AC55>Would it be possible to include in the preliminary discussion on Impulse Control Problem?<\/AC55> <AC56>This seems central to your research but is omitted in the paper.<\/AC56>\n- <AC57>Consider restructuring your existing experiments section.<\/AC57> <AC58>It feels like Figures 1, 2, and 3 are, in some sense, experiments of similar conclusions (i.e., our method performs well).<\/AC58> <AC59>The ablations you do in the appendix seem valuable to include in the main paper<\/AC59> as <AC60>it isolates the effects of hyperparameters of the framework.<\/AC60>\n- <AC61>Consider moving the less crucial details of the Merton problem to the appendix.<\/AC61> For example, <AC62>the SDE feels unnecessary in the main paper.<\/AC62>\n- <AC63>You reference Fig. 5 in line 462 when it seems you mean Figure 4.<\/AC63>\n- <AC64>Consider removing the examples in \"3 Preliminaries\".<\/AC64> <AC65>They do not add much to the discussion that was not already mentioned in the introduction.<\/AC65>\n- <AC66>Consider using a more digestible metric for performance over learning curves (e.g. Final average performance).<\/AC66> <AC67>It’s a bit difficult to distinguish the performance gains of your algorithm.<\/AC67>\n- <AC68>Include Compute resources used.<\/AC68> <AC69>This is mentioned as required in the Checklist<\/AC69>, but <AC70>these details weren’t mentioned in the appendix or paper.<\/AC70>\n- Figure 6: <AC71>If you change to a single metric (average final reward, the area under the curve, success rate, etc.) You could consider using a radar plot to visualize performance.<\/AC71> <AC72>As higher is assumed to be better, you could have the rewards on the outside, and each radar is your algorithm.<\/AC72> <AC73>The bigger the circle, the better your algorithm is across cost functions.<\/AC73>\n- <AC74>What is Figure 5 showing exactly?<\/AC74> <AC75>As K goes up, fewer violations should occur<\/AC75> as <AC76>it's terrible to decelerate in these zones<\/AC76>, but <AC77>it wasn't clear.<\/AC77> <AC78>It could help to visualize this experiment to explain it.<\/AC78>\n\nlimitations: <AC79>It's hard to gauge the limitations of their work<\/AC79> because <AC80>the authors do not seem to discuss this explicitly in the paper.<\/AC80> <AC81>In terms of negative societal impact, there doesn't seem to be any apparent reason their work could have negative social impacts.<\/AC81>"}, {"message_id": "Reviewer_wRMk · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to the reviewer wRMk\nWe thank the reviewer for their reading and many insightful comments. <AC1>We are glad the reviewer appreciates the importance of the problem which at present is unstudied within the context of learning and RL, and the plug \\& play aspect which allows for quick implementation.<\/AC1> We address the reviewer's comments and questions individually.\n>\"More evaluation is necessary\" and Q-Learning like algorithms.\n\n**Answer**\n\nWe thank the reviewer for their insightful suggestions which have now improved our paper. <AC2>We firstly remark that LICRA is a general framework which can accommodate existing RL algorithms to enable them to efficiently solve problems studied in our paper.<\/AC2> <AC3>To exemplify this point, in our experiments we considered variants of the LICRA method showing it seamlessly adopts existing methods.<\/AC3>\n\n<AC4>For the case of the LICRA Q-learning variant, Theorem 2 proves its convergence.<\/AC4> <AC5>As such this also serves as the foundation for establishing results for actor-critic methods which extend value-based learning to included policy updates.<\/AC5> <AC6>We have now included a comprehensive empirical analysis of the LICRA Q-learning variant of Sec. 4 showing the convergence of the Q function.<\/AC6> <AC7>We consider the tabular case showing convergence consistency with Theorem 3.<\/AC7>\n\n>Different variants of LICRA\n\n**Answer**\n\nWe again thank the reviewer for this comment. <AC8>We will update our experiments to include different versions of LICRA in the intervention policy (please see the updated script).<\/AC8> <AC9>We will include full coverage of the 4 combinations in our script in our next update.<\/AC9>\n\n> Are features shared for both policies in the experiments or are they entirely separate?\n\n**Answer** <AC10>The features in our experiments are not shared between policies<\/AC10>, however, <AC11>in principle it would be possible to use LICRA where features are shared.<\/AC11>\n\n> Can the action decision policy be a separate linear head trained with a different reward signal?\n\n**Answer** Thanks for the interesting suggestion. <AC12>It is possible to train a policy with different heads for $\\pi$ and $\\mathfrak{g}$ to improve efficiency.<\/AC12> <AC13>We have not yet tried this<\/AC13> but we are keen to see if it delivers improvements.\n\n> Were any experiments done to validate the theoretical results?\n\n**Answer** Yes, please see our earlier comment. <AC14>We now add a new section in the Appendix in which we empirically validate the results of Theorems 2 and 3.<\/AC14>\n\n> LICRA's increased efficiency given a large difference between $\\cal S$ and the subregion in which it is optimal to intervene (intervention region) $\\cal S_i$\n\n**Answer**\n\nWe thank the reviewer for the great suggestion. <AC15>We will now include a section in the Appendix in which we perform an empirical analysis where we indeed validate this claim showing that LICRA is extremely efficient at learning the optimal policy in a modified version of Drive env. where the optimal policy requires the agent to act only at a very subregion of the state space<\/AC15>\n\n> The Max operator in the algorithm update in Theorem 2.\n\n**Answer**\n<AC16>The current action (if executed due to the decision by $\\mathfrak{g}$) is sampled from the current policy $\\pi$ as per the definition of $\\mathcal{M}^{\\pi,\\mathfrak{g}}$<\/AC16>; <AC17>the max operator (over the agent's action space) affects only the expected future return .<\/AC17> <AC18>This is analogous to the update rule of standard Q learning see for example equation 1 in [1].<\/AC18>\n\n[1] Even-Dar, Eyal, Yishay Mansour, and Peter Bartlett. \"Learning Rates for Q-learning.\" JMLR (2003).\n\n> The delta in Equation 4?\n\n**Answer** Apologies for this oversight. <AC19>The delta function is the Kroncker-delta function which is now defined on line 241.<\/AC19> <AC20>We have highlighted this in the current version for the reviewer's convenience during the rebuttal phase where we added the following definition<\/AC20>:\n\n$$\\sum_{k\\geq 1}\\delta^t_{\\tau_k}=\\begin{cases} 1, \\text{if an impulse was applied at time } t\\\\\\\\0, \\text{otherwise }\\end{cases} $$\n\n<AC21>While this definition is somewhat awkward to read, it is consistent with the impulse control literature.<\/AC21>\n> State variable of the Merton problem\n\n**Answer** <AC22>The state variable is $W_t$ (the investor's wealth) whose transition dynamics are described by equation (7).<\/AC22> <AC23>We have now made a brief comment in the text to highlight this.<\/AC23>\n\n> Details of the hyperparameters\n\n**Answer** Apologies for this oversight. <AC24>For these mentioned hyperparameters, we tune Rollout length within $[32,64,128,256]$.<\/AC24> <AC25>We will update the paper to include this in our revised version.<\/AC25>\n\n> Lambda and \"I(\\tau)\" and notation in the Theorem 1 proof.\n\n**Answer**\n\nThanks for pointing this out (<AC26>each are just functions in $L_2$<\/AC26>). <AC27>We have made this notation consistent in our updated version.<\/AC27> <AC28>We removed $I(\\tau)$<\/AC28> as <AC29>this was a typo.<\/AC29>\n\n> The paper \"Nonparametric learning for impulse control problems\" by S. Christensen, C. Straugh\n\n**Answer** Thanks a lot for this reference. <AC30>This paper is only loosely related to our work (beyond the impulse control we already discussed)<\/AC30>, since <AC31>they consider a continuous-time setting where they assume the reward function is known and knowledge of the probabilitistic component of the dynamics (specifically the coefficient of the noise term).<\/AC31> <AC32>Their analysis uses a data-driven approach namely, parametric estimation for the value function and opposed to reinforcement learning (RL).<\/AC32> <AC33>This is markedly different to our RL approach which is supported by an implementable algorithm and enables us to solve completely unknown settings.<\/AC33> <AC34>We will now include a brief statement in relation to this work.<\/AC34>\n\n> Inclusion of discussion on the Impulse control\n\n**Answer** <AC35>We refer the reviewer to lines 81-88 where we survey the impulse control literature.<\/AC35> Note that <AC36>the literature is vastly dominated with continuous-time analyses (within known environments) which leads to an (optimal stochastic control) approach the markedly differs from ours.<\/AC36>\n\n> Restructuring the experiments section.\n\n**Answer** Thanks for the very valuable suggestion. <AC37>We also agree that the Ablation Study adds a valuable analysis which deserves to be in the main body.<\/AC37> <AC38>We have now adjusted it in the new update.<\/AC38>\n\n> More digestible metric for performance.\n\n**Answer** Thanks for the suggestion. <AC39>We have now added the following final scores to the captions that clearly indicate LICRA's superior empirical performance.<\/AC39>\n* LunarLander(final scores):\nLICRA_SAC(98.03), SAC(61.20), LICRA_PPO(58.84), PPO(49.77).\n* Drive Env(final scores):\nLICRA_SAC(1.75), SAC(0.37), LICRA_PPO(2.63), PPO(0.24)\n\n>Compute resources used.\n\n**Answer** Thank you for pointing out our oversight. <AC40>LICRA does not require large resources to perform the experimentation in the paper.<\/AC40> <AC41>The most computationally intensive experiments can be run using a laptop machine with 8GB memory.<\/AC41> <AC42>We will update the script accordingly with all these details.<\/AC42>\n\n> What Figure 5 shows\n\n**Answer** <AC43>The analysis of Fig 5. shows that LICRA learns to prioritise actions at states where not acting produces the highest penalties.<\/AC43> <AC44>The lower region of the map incurs the highest penalties for moving at a velocity less than $v_{min}$<\/AC44> whereas <AC45>the highest part incurs low costs.<\/AC45> <AC46>As the cost for acting increases (i.e. as we make $\\\\{c_k\\\\}$ larger), LICRA learns it should expend costs for acting in the lower region while ''`taking the hit'' in the higher regions.<\/AC46>\nDear reviewer wRMk,\n\nWe are grateful for your review of our paper.\n\nWe have sought to address each of your points in detail during our rebuttal. <AC47>We believe all the points you have raised have been entirely addressed during the course of our rebuttal.<\/AC47>\n\nWe have not received a response from you during the rebuttal period.\n\nWe would be grateful if you could confirm our responses have resolved all of your comments or let us know if any points of yours remain unaddressed.\n\nBest wishes,\n\nThe authors\nFurther to our last comment.\n\n<AC48>We have also uploaded and update to our paper which now includes an additional section in the supplementary material as well as a more comprehensive set of baselines within our experiments.<\/AC48> We have elaborated the details of the updates in our note to all reviewers.\n\nBest wishes,\n\nThe authors\n Global/general Response:\n```\nWe would like to thank the reviewers for their careful reading and insights that have improved the paper with more comprehensive analyses. Additionally, we thank the reviewers who have expressed their appreciation of the importance of the problem we tackle and the clarity of our exposition.\n\n<AC49>The purpose of the paper is to introduce a framework within reinforcement learning that easily incorporates existing methods enabling them to efficiently solve problems in which the controller faces costs for taking actions.<\/AC49> <AC50>Our experiments verify our claim that such technology improves RL performance and enables RL methods to consistently solve problems of this kind where existing methods perform badly and may sometimes even fail.<\/AC50>\n\n**We outline some of the items we have now added to the manuscript to complement the already in-depth analyses we have performed in the paper:**\n\n* **<AC51>Comprehensive empirical analysis to validate the convergence theorems of LICRA Q learning variant (Theorem 2 and Theorem 3) (see Section 12 of the supplementary material)<\/AC51>**\n* **<AC52>New variants of LICRA to fully demonstrate LICRA's plug \\& play capabilities.<\/AC52>**\n* **<AC53>Suite of new baselines to verify the claim that LICRA outperforms current state-of-the-art RL methods.<\/AC53>**\n* **<AC54>Additional details relating to experimental settings.<\/AC54>**\n\n<AC55>These analyses now support the suite of ablation studies that yield insights into the behaviour of the policies LICRA generates (see Ablation study 1) and LICRA's behaviour when faced with different forms of costs (see Ablation study 2).<\/AC55>\n\n<AC56>We also restructured the experiment section in order to bring the insights gained in the ablation studies into the main body.<\/AC56>\n\nIn our updated version, we will also add:\n\n* **<AC57>Experiments to validate the claim that when the subregion of the state space in which the agent is required to act (intervention region) is relatively small, LICRA's approach vastly improves efficiency.<\/AC57>**\n\n**EDIT: <AC58>This has now been added<\/AC58> - please see Sec. 11.2 of the supplementary material.**\n\nWe hope the reviewers appreciate the updates to our paper.\n\n**EDIT: <AC59>We believe we have now resolved **all** the reviewers' questions including the very in-depth inspection of our theoretical analyses (see the points raised and inspection by reviewer UN8M) and each of the claims made about our framework each of which are now supported by empirical results some of which were added at the request of the reviewers.<\/AC59>**\n\n```"}, {"message_id": "Reviewer_wRMk · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Additional questions based on the updates.\nFirst and foremost, thank you for taking the time to incorporate the feedback into the paper. Thank you for pressing for additional feedback. What follows are thoughts from reviewing your comments and portions of the recently updated draft:\n\n- Thank you for adding the experiments validating Theorem 2 & 3 in the appendix. <AC1>Remember to reference this in the main paper.<\/AC1> More importantly, <AC2>What is the explanation for the massive variance in Figure 8?<\/AC2> <AC3>How many random seeds were used in these experiments?<\/AC3> <AC4>Could you provide additional details on this testing bed used to validate these results?<\/AC4> <AC5>It sounds like a sort of bandit problem<\/AC5>, but <AC6>it could be challenging to reproduce the plots without knowing the exact details of how you experimented.<\/AC6>\n\n- As a follow-up to the above, <AC7>an important series of experiments that seems to be missing are validations of the linear function approximation case.<\/AC7> <AC8>Have you conducted any experiments in this scenario?<\/AC8> <AC9>Considering the Merton-Portfolio problem is one-dimensional, it seems to be the perfect problem to validate LICRA in the linear approximation setting.<\/AC9>\n\n- <AC10>Some other linear experimental test beds one might consider might be mountain cars or cart-pole.<\/AC10> <AC11>One could modify them similarly where the goal is to minimize the necessary amount of input control.<\/AC11>\n<AC12>Another thought for abstaining from an action might be some Roulette world where there are many betting actions.<\/AC12> <AC13>Using the LICRA policy could (I hypothesize) help speed convergence to choosing not to play the game entirely sooner then including it as another action.<\/AC13> <AC14>This setting could focus on the value of separating this decision from a more extensive action set.<\/AC14>\n\n- Figure 1 <AC15>It seems like the performance gains of LICRA PPO are only early in training<\/AC15>, but <AC16>asymptotically the two policies converge to the same mean reward.<\/AC16> <AC17>How do you explain this observation?<\/AC17>\n\n- Thank you for clarifying my confusion about whether there should be a max operator or not in Theorem 2\n\n- Thank you for clarifying the state representation of the Merton problem.\n\n- <AC18>Please include all algorithms' error bars for the reported final score. For example, LunarLander (final scores): Licra_SAC(98.03), SAC(61.20) …<\/AC18>; <AC19>what are the error bars for these and other experiments?<\/AC19>\n\n- <AC20>Another comment noted that only up to 5 experiments were run depending on the environment.<\/AC20> <AC21>What was the rationale for not conducting more repetitions of the experiment?<\/AC21>\n\n- Thank you for clarifying Figure 5. <AC22>Based on your clarification, I understand that LICRA learns to take more actions when the penalty for in-action is worse than the cost incurred for acting.<\/AC22> <AC23>Does this sound correct?<\/AC23>\n\n- Thank you for including the discussion on tuning roll-out length. However, <AC24>often deep RL can be highly dependent on seemingly innocuous hyperparameter choices.<\/AC24> <AC25>Given this potential challenge, what were the justifications for not doing a more extensive sweep?<\/AC25> <AC26>One idea to limit resources might be a random search over defined prior distributions for several hyperparameters, limiting the max number of configurations you do and then repeating each model.<\/AC26>\n\n- <AC27>Knowing the resources you used to conduct all experiments is the more important detail for the Compute resources comment.<\/AC27> For instance, <AC28>was a compute cluster used, what types of GPUs were used (if any), and how many CPUs were available?<\/AC28>\n\nMinor comments:\n\n- <AC29>If you want to keep the examples in “3 Preliminaries,” make sure to tighten the paragraph headers.<\/AC29> <AC30>For the first example, you name it and even have a citation<\/AC30>, but <AC31>for “Example 2” (line 137) you don’t mention autonomous driving in the header.<\/AC31>\n\n- Line 202 - 209: <AC32>When you describe each component in Equation 3, consider including the equation portion you are referring to in the sentence.<\/AC32> For example, “the first term M^{\\pi, g} … is the expected ….”.\n- Line 102: <AC33>A suggestion previously I’ve heard when directly referring to a citation is to use <Last name> et al. year (or just citation), so instead of In [26], put In Pang et al. [26] or Pang et al. 2021…<\/AC33>\n\n- <AC34>Fix the labeling of algorithms in plots<\/AC34>; for example, <AC35>in Figure 7 of the Appendix, you have “Licra_PPO” and “Licra_SAC.”.<\/AC35> <AC36>Consider changing these to “Licra PPO” and “Licra SAC”.<\/AC36> <AC37>This also appears in Figure 1 (Licra_ppo).<\/AC37> Also, <AC38>in the main text (starting at line 271), consider renaming LICRA_PPO to something like LICRA-PPO or LICRA-PPO.<\/AC38>"}, {"message_id": "Reviewer_wRMk · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Response to the reviewer\nThanks a lot to the reviewer for getting back to us and providing great feedback.\n\n**Additional details for the Q-learning analysis**\n\nThanks for raising the points of the extra details of the analysis we have just included. <AC1>We will include the full details the reviewer has highlighted in our updated version.<\/AC1> <AC2>Briefly, the experiment setting was a simple 2-dimensional “gridworld” setting with a continuous action space and target goal state.<\/AC2> <AC3>We agree with the reviewer about testing the linear function approximation case<\/AC3>, <AC4>in fact this experiment tested exactly that.<\/AC4> We find the reviewer’s thoughts on other environment settings very interesting and are grateful for the suggestions. <AC5>We will consider adding an additional experiment though we are mindful of the fact that with the additional analyses the paper is already very comprehensive and lengthy.<\/AC5>\n\n**Asymptotic convergence of LICRA\\_PPO vs PPO**\n\n<AC6>Our framework induces *efficient* learning in problems where the agent faces a fixed positive cost for performing actions.<\/AC6> <AC7>We expect asymptotically, in principle algorithms such as PPO can eventually find the same high performance solutions as LICRA but will require a great number more samples<\/AC7> – <AC8>this is what we observe in Fig. 1 where the problem setting is very simple.<\/AC8> <AC9>In practice, and given more complex problem settings, we observe that given a reasonable training budget PPO and other baselines do not learn the high performance policies as learned by LICRA (and may fail to solve the task altogether)<\/AC9> – <AC10>this is the case for all our other experiments.<\/AC10>\n\n**Including other details**\n\nWe are very grateful to the reviewer for their suggestions about including other important details. <AC11>As during the rebuttal, we are committed to augmenting the paper to be as comprehensive as possible in this area<\/AC11> – <AC12>we will therefore update the camera ready paper with such details should the paper be accepted.<\/AC12>\n\n**Reviewer’s statement about Fig. 5.**\n\n<AC13>The reviewer’s understanding of LICRA’s behaviour in figure 5 is absolutely correct.<\/AC13> <AC14>We find this behaviour both useful and intuitive.<\/AC14> <AC15>We believe this is one of the many interesting features that our framework exhibits when augmenting standard RL methods.<\/AC15>\n\n**Other helpful comments to improve the paper.**\n\nWe greatly appreciate the reviewer’s effort in providing suggestions to improve the paper. <AC16>We are performing these updates as we speak.<\/AC16> We would like to ask the reviewer if they have we can address any concerns that may remain. If we have resolved all of the reviewer's concerns, we would be grateful if the reviewer could adjust their score to reflect their most current appraisal of our work (if they see fit to change it from reject)."}, {"message_id": "Reviewer_wRMk · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "Title: Further clarification on decision when choosing hyperparameters\n<AC1>I think the primary concerns I have remaining are just around the experimental evaluation set-ups.<\/AC1> <AC2>It seems the comments which focus on justifying decisions around hyperparameter choices or the number of experiment evaluations have gone unaddressed.<\/AC2> <AC3>Knowing why a more rigorous evaluation of the potential hyper-parameters in the deep learning algorithms was not considered would be appreciated.<\/AC3> As previously mentioned, <AC4>deep RL can be quite dependent on hyperparameters<\/AC4>, so <AC5>without extensive parameter sweeps the robustness of your conclusions is debatable.<\/AC5>"}, {"message_id": "Reviewer_wRMk · id_turno 6", "turn": 5, "id_turno": 6, "speaker": "author", "text": "Title: Response to the reviewer\nWe thank the reviewer for their comments.\n\n<AC1>LICRA is a plug and play framework which accommodates existing RL algorithms enabling them to tackle the current problem setting.<\/AC1> <AC2>In our paper we have used popular RL algorithms as our “base learners” for LICRA.<\/AC2> As such <AC3>tuning the hyperparameters for LICRA involves tuning over the same hyperparameter spaces as the baselines we compared to<\/AC3> - <AC4>indeed the hyperparameters of our baselines were sweeped over comprehensively.<\/AC4>\n\n<AC5>We are happy to include all such details of this in the camera-ready version should the paper be accepted.<\/AC5>\n\n<AC6>In terms of numbers of evaluations, for the Merton problem, all algorithms were trained 5 times for 5 different seeds.<\/AC6> <AC7>For Drive environment problem, all algorithms were trained 3 times for 3 different seeds.<\/AC7> <AC8>For LunarLander environment, all algorithms were trained 5 times for 5 different seeds.<\/AC8>\n\n<AC9>We have now included all such details in the paper.<\/AC9>"}, {"message_id": "Reviewer_wRMk · id_turno 7", "turn": 6, "id_turno": 7, "speaker": "reviewer", "text": "I am grateful for the opportunity to discuss these points with the author, <AC1>which has definitely improved the overall quality of the paper.<\/AC1>"}]}]}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
// Modalità solo annotazioni: testi segmentati in <ACi> senza grafo, relazioni, grounded e meta-review.
// Le altre modalità (grafo, colori grounded, export .apx) sono disattivate per ora.
const SEG = DATA.mode === "segmentation";
const papers = DATA.papers;
const byId = Object.fromEntries(papers.map(p => [p.paper_id, p]));
const state = { filter: "all", q: "", paper: null, split: false, thread: null, hl: true, ids: false, only: false, gcolor: true,
  view: "text", sel: null, gSup: true, gAtt: true, gIntra: true, gIso: true, gThread: "all", gFocus: "fade", gPanel: true, gq: "", gNodes: "grounded" };
try {
  state.hl = localStorage.getItem("rb-hl") !== "0";
  state.ids = localStorage.getItem("rb-ids") === "1";
  state.only = localStorage.getItem("rb-only") === "1";
  state.gcolor = localStorage.getItem("rb-gcolor") !== "0";
  state.view = localStorage.getItem("rb-view") === "graph" ? "graph" : "text";
  state.gIntra = localStorage.getItem("rb-gintra") !== "0";
  state.gIso = localStorage.getItem("rb-giso") !== "0";
  state.split = localStorage.getItem("rb-split") === "1";
  state.gPanel = localStorage.getItem("rb-gpanel") !== "0";
  state.gNodes = localStorage.getItem("rb-gnodes") === "role" ? "role" : "grounded";
  state.gFocus = ["near", "chain"].includes(localStorage.getItem("rb-gfocus")) ? localStorage.getItem("rb-gfocus") : "fade";
  if (localStorage.getItem("rb-side-collapsed") === "1") document.querySelector(".app").classList.add("collapsed");
} catch (e) {}
{ const v = new URLSearchParams(location.search).get("view"); if (v === "text" || v === "graph") state.view = v; }
if (SEG) { state.view = "text"; state.gcolor = false; }

const REL = { s: ["supporta", "supportato da"], a: ["attacca", "attaccato da"] };
const LABEL_NAME = { in: "IN", ou: "OUT", un: "UNDEC", both: "IN+OUT" };
// Id delle componenti: Mj (meta-review), iRWj (review), iRBt_j (autori), iRFt_j (follow-up del reviewer);
// in modalità segmentazione ACj, numerati da capo in ogni testo
const TAG = SEG ? /<(\/?)(AC\d+)>/g : /<(\/?)(M\d+|\d+RW\d+|\d+R[BF]\d+_\d+)>/g;
const ID_RE = /^(?:(M)(\d+)|(\d+)RW(\d+)|(\d+)R([BF])(\d+)_(\d+)|(Accept|Reject))$/;

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = v => v == null ? "–" : v;
const stripTags = s => s.replace(TAG, "");
const countAC = s => (s.match(new RegExp(TAG.source, "g")) || []).filter(t => t[1] !== "/").length;

// Informazioni ricavate dall'id: tipo, thread, turno
function parseId(id) {
  const m = id.match(ID_RE);
  if (!m) throw new Error("Id inatteso: " + id);
  if (m[1]) return { kind: "meta", thread: "META", turn: 0 };
  if (m[3]) return { kind: "rev", speaker: "reviewer", thread: +m[3], turn: 0 };
  if (m[5]) return { kind: m[6] === "B" ? "auth" : "rev", speaker: m[6] === "B" ? "author" : "reviewer", thread: +m[5], turn: +m[7] };
  return { kind: "dec", thread: "DEC", turn: 0 };
}

// Indice del grafo del paper: nodi (con testo), archi in uscita / in entrata, etichette grounded
function graphIndex(p) {
  if (p._g) return p._g;
  const node = {};
  const addText = (text) => {
    const re = new RegExp(TAG.source, "g"); let m, open = null, start = 0;
    while ((m = re.exec(text))) {
      if (!m[1]) { open = m[2]; start = re.lastIndex; }
      else if (open === m[2]) { node[open] = { id: open, text: text.slice(start, m.index).trim(), ...parseId(open) }; open = null; }
    }
  };
  for (const t of p.threads) for (const m of t.messages) addText(m.text);
  addText(p.metareview.text);
  node.Accept = { id: "Accept", text: "Decisione: accettazione del paper", ...parseId("Accept") };
  node.Reject = { id: "Reject", text: "Decisione: rifiuto del paper", ...parseId("Reject") };
  const g = p.grounded, inS = new Set(g.in), ouS = new Set(g.ou), unS = new Set(g.un);
  const lab = {};
  for (const id in node) lab[id] = inS.has(id) && ouS.has(id) ? "both" : inS.has(id) ? "in" : ouS.has(id) ? "ou" : unS.has(id) ? "un" : "un";
  const out = {}, inc = {};
  const edges = p.edges.map(([s, t, l]) => ({ s, t, l, intra: node[s].thread === node[t].thread && node[s].turn === node[t].turn }));
  for (const e of edges) { (out[e.s] = out[e.s] || []).push(e); (inc[e.t] = inc[e.t] || []).push(e); }
  return (p._g = { node, out, inc, edges, lab });
}
const whoLabel = n => n.kind === "meta" ? "Area chair · meta-review" : n.kind === "dec" ? "Nodo decisione"
  : n.turn === 0 ? `Reviewer ${n.thread} · review` : `${n.speaker === "author" ? "Autori" : "Reviewer"} · thread ${n.thread} · turno ${n.turn}`;

// Nome di esportazione: solo [a-z0-9] e iniziale minuscola, come richiesto da argumentation-designer e da clingo.
// 1RW3 -> r1w3 · 2RB3_1 -> r2b3a1 · 2RF4_2 -> r2f4a2 · M3 -> m3 · Accept -> accept
function apxName(id) {
  const m = id.match(ID_RE);
  if (!m) throw new Error("Id inatteso: " + id);
  if (m[1]) return `m${m[2]}`;
  if (m[3]) return `r${m[3]}w${m[4]}`;
  if (m[5]) return `r${m[5]}${m[6].toLowerCase()}${m[7]}a${m[8]}`;
  return m[9].toLowerCase();
}
// BAF del paper in APX: un arg(...) per nodo, poi attacchi e supporti, esattamente come nel campo "baf"
// (i supporti della meta-review e l'attacco reciproco tra Accept e Reject ne fanno già parte).
function toAPX(p) {
  const g = graphIndex(p), ids = Object.keys(g.node);
  const names = new Map(ids.map(id => [id, apxName(id)]));
  if (new Set(names.values()).size !== names.size) throw new Error("Nomi di esportazione duplicati");
  const lines = ids.map(id => `arg(${names.get(id)}).`);
  for (const [l, f] of [["a", "att"], ["s", "support"]])
    for (const e of g.edges) if (e.l === l) lines.push(`${f}(${names.get(e.s)},${names.get(e.t)}).`);
  return lines.join("\n") + "\n";
}
function exportAPX(p) {
  const url = URL.createObjectURL(new Blob([toAPX(p)], { type: "text/plain;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: `${p.paper_id}.apx` });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Testo annotato -> HTML: componenti (tinte alternate o colore grounded) e testo non argomentativo
function renderTagged(text, g) {
  let out = "", pos = 0, open = null, m, k = 0;
  const re = new RegExp(TAG.source, "g");
  while ((m = re.exec(text))) {
    const chunk = esc(text.slice(pos, m.index));
    if (chunk) out += open ? chunk : `<span class="non-arg">${chunk}</span>`;
    if (!m[1]) {
      open = m[2]; k++;
      if (SEG) {
        out += `<span class="ac ${k % 2 ? "a" : "b"}" title="${open}"><span class="ac-id">${open}</span>`;
        pos = re.lastIndex;
        continue;
      }
      const rel = [...(g.out[open] || []).map(e => `→ ${REL[e.l][0]} ${e.t}`), ...(g.inc[open] || []).map(e => `← ${REL[e.l][1]} ${e.s}`)];
      const title = `${open} · grounded ${LABEL_NAME[g.lab[open]]}` + (rel.length ? "\n" + rel.join("\n") + "\n(clic: apri nel grafo)" : "\nnessuna relazione");
      const cls = state.gcolor ? g.lab[open] : (k % 2 ? "a" : "b");
      out += `<span class="ac ${cls}" data-nid="${open}" title="${esc(title)}"><span class="ac-id">${open}</span>`;
    } else {
      out += "</span>";
      open = null;
    }
    pos = re.lastIndex;
  }
  const rest = esc(text.slice(pos));
  if (rest) out += `<span class="non-arg">${rest}</span>`;
  return out;
}

function paperMatches(p) {
  if (state.filter !== "all" && p.decision !== state.filter) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return p.paper_id.toLowerCase().includes(q) ||
    p.threads.some(t => t.messages.some(m => stripTags(m.text).toLowerCase().includes(q))) ||
    stripTags(p.metareview?.text ?? "").toLowerCase().includes(q);
}
const decLab = p => ["Accept", "Reject"].map(d => graphIndex(p).lab[d]);
const nArgs = p => SEG ? p.threads.reduce((k, t) => k + t.messages.reduce((j, m) => j + countAC(m.text), 0), 0)
    + (p.metareview?.segmented ? countAC(p.metareview.text) : 0)
  : Object.keys(graphIndex(p).node).length - 2;

  const items = papers.filter(paperMatches);

  return `${m.speaker === "author" ? "Autori" : "Reviewer"} · turno ${m.turn}`;

function renderMessage(m, g, t) {
  const rev = t.name ?? `Reviewer ${t.i}`, turno = m.id_turno ?? m.turn;

// Layout fisso: una colonna per thread; in ogni colonna un blocco per messaggio in ordine temporale
// (review, turno 1, turno 2, ...), con le componenti del blocco su una griglia. Poi la meta-review e le decisioni.
function graphElements(p, g) {
  const C = 6, DX = 66, DY = 30, COLW = C * DX + 110, GAP = 78;
  const els = [], placed = new Set();
  const block = (id, label, ids, x0, y0) => {
    els.push({ data: { id, label }, classes: "blk" });
    ids.forEach((nid, i) => {
      placed.add(nid);
      els.push({ data: { id: nid, label: nid, parent: id },
        position: { x: x0 + (i % C) * DX, y: y0 + Math.floor(i / C) * DY },
        classes: `ac ${g.node[nid].kind} g-${g.lab[nid]}${g.out[nid] || g.inc[nid] ? "" : " iso"}` });
    });
    return Math.ceil(ids.length / C) * DY + GAP;
  };
  const idsOf = text => [...text.matchAll(new RegExp(TAG.source, "g"))].filter(m => !m[1]).map(m => m[2]);
  p.threads.forEach((t, ci) => {
    let y = 0;
    for (const m of t.messages) {
      const ids = idsOf(m.text);
      if (!ids.length) continue;
      const who = m.turn === 0 ? "review" : `turno ${m.turn} · ${m.speaker === "author" ? "autori" : "reviewer"}`;
      y += block(`b:${t.i}:${m.turn}`, `R${t.i} · ${who}`, ids, ci * COLW, y);
    }
  });
  const y = block("b:META", "Meta-review", idsOf(p.metareview.text), p.threads.length * COLW, 0);
  block("b:DEC", "Decisione", ["Accept", "Reject"], p.threads.length * COLW, y);
  for (const e of g.edges) if (placed.has(e.s) && placed.has(e.t))
    els.push({ data: { id: `${e.s}>${e.t}`, source: e.s, target: e.t }, classes: `${e.l}${e.intra ? " intra" : ""}` });
  return els;
}

function graphStyle() {

  const fill = state.gNodes === "grounded"
    ? [["node.g-in", v("--g-in-soft"), v("--g-in")], ["node.g-ou", v("--g-ou-soft"), v("--g-ou")], ["node.g-un", v("--g-un-soft"), v("--g-un")], ["node.g-both", v("--g-both-soft"), v("--g-both")]]
      .map(([sel, bg, edge]) => ({ selector: sel, style: { "background-color": bg, "border-width": 1.5, "border-color": edge } }))
    : [["node.rev", "--node-rev"], ["node.auth", "--node-auth"], ["node.meta", "--node-meta"], ["node.dec", "--node-dec"]]
      .map(([sel, c]) => ({ selector: sel, style: { "background-color": v(c) } }));
  return [
    { selector: "node.blk", style: { shape: "round-rectangle", "background-color": v("--block"), "background-opacity": 1,
      "border-width": 1, "border-color": v("--line"), label: "data(label)", "text-valign": "top", "text-halign": "center",
      "font-size": 12, "font-weight": 600, color: v("--muted"), "text-margin-y": -4, padding: 10, "min-zoomed-font-size": 5 } },
    { selector: "node.ac", style: { shape: "round-rectangle", width: 58, height: 20, label: "data(label)", "font-size": 8.5,
      "font-family": "ui-monospace, Menlo, monospace", "text-valign": "center", "text-halign": "center", color: v("--ink"),
      "border-width": 0, "min-zoomed-font-size": 4, "transition-property": "opacity", "transition-duration": 150 } },
    ...fill,
    { selector: "node.dec", style: { "font-weight": 700, "font-size": 10 } },
    { selector: "node.iso", style: { opacity: 0.45 } },
    { selector: "node.match", style: { "border-width": 2, "border-style": "dashed", "border-color": v("--accent") } },
    { selector: "node.ext", style: { opacity: 0.55 } },
    { selector: "edge", style: { "curve-style": "bezier", width: 1.3, "target-arrow-shape": "triangle", "arrow-scale": 0.75, opacity: 0.6 } },
    { selector: "edge.s", style: { "line-color": v("--sup"), "target-arrow-color": v("--sup") } },
    { selector: "edge.a", style: { "line-color": v("--att"), "target-arrow-color": v("--att"), width: 1.8, opacity: 0.8 } },
    { selector: "edge.intra", style: { "line-style": "dashed", opacity: 0.3 } },
    { selector: ".off", style: { display: "none" } },
    { selector: ".faded", style: { opacity: 0.08 } },
    { selector: "edge.focus", style: { opacity: 1, width: 2.6, "z-index": 10 } },
    { selector: "node.focus", style: { opacity: 1 } },
    { selector: "edge.hov", style: { opacity: 1, width: 3.4, "z-index": 20 } },
    { selector: "node.hov", style: { "border-width": 2, "border-color": v("--ink"), opacity: 1 } },
    { selector: "node.sel", style: { "border-width": 3, "border-style": "solid", "border-color": v("--accent"), opacity: 1 } },
    { selector: "edge.sel", style: { opacity: 1, width: 4, "z-index": 30 } },
