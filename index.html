 as 5 other programming languages (Go, Java, Javascript, PHP, Ruby).<\/AC44>\n- **FqUC, dTG5**: how parsable vs un-parsable examples skew the performance of the models. <AC45>We have updated Appendix Section C.3 to include the performance evaluation for our model, CodeBERT, and GraphCodeBERT, when evaluated on the entire dataset, as opposed to just its parsable portion.<\/AC45> <AC46>We have also updated Appendix Section A.2, Table 3, to include original data statistics before parsing<\/AC46>\n- **dTG5, FqUC**: the correctness of the claim about the advantage of the proposed method for longer texts. <AC47>We have rephrased the corresponding claim to specify our model focuses on the faithful representation of details of the query<\/AC47>, and <AC48>walk through experiments that evidence this.<\/AC48>\n- **SyPM**: Clarity issues in the introduction and Section 3.3. <AC49>We have updated those sections to improve the clarity of the writing<\/AC49> and <AC50>added more details about implementation to avoid confusion by the reader.<\/AC50> <AC51>We have also fixed some typos.<\/AC51>\n\nFor your convenience, **the changes to the revised paper** and supplementary material (appendix) **are emphasized with blue text**. To make it more convenient to check our appendix, we only uploaded the appendix pdf file as the supplementary material. Our previous zip file with code is still accessible in the revision history.\n\nWe thank you again for taking the time to review our paper and engage in the discussion.\n\nAuthors\n```"}, {"message_id": "Reviewer_kn2F · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thank you for your response\nThank you for addressing my concerns regarding parsing rules and providing additional experiments about the parser success rate on other datasets. However, given that <AC1>the parser success rate on other CodeSearchNet datasets is still low (<=41%)<\/AC1>, <AC2>a user still needs to add NL parsing rules when they use the proposed method on other datasets.<\/AC2> Moreover, <AC3>training a language model on another natural language is automatic and requires much less effort by NLP experts than writing parsing rules.<\/AC3> So <AC4>I am not changing my review scores at this time.<\/AC4>"}]}]}, {"paper_id": "7yvu4qOKtn1", "decision": "Reject", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>This is an interesting paper<\/AC1>, but <AC2>it also requires some additional work.<\/AC2> <AC3>The paper received mixed responses from the reviewers<\/AC3>, but <AC4>the main concerns were sorted out during the rebuttal and discussion.<\/AC4> <AC5>In the end, the reviewers ended up (weakly) recommending acceptance after the authors promised an extensive number of changes to the paper in the camera-ready stage.<\/AC5> However, <AC6>the promised changes appear very extensive and beyond what would be expected for a typical NeurIPS paper (list below).<\/AC6> <AC7>The authors have provided links to plots in the discussion<\/AC7>, but <AC8>have not revised the paper in OpenReview.<\/AC8> <AC9>Sorting out the issues counts as a 'major revision'<\/AC9> and <AC10>the conference review process does not recognise such a concept.<\/AC10>\n\nList of changes (based on rebuttals):\n* <AC11>Empirical comparison (& discussion) to GIRF instead of only bootstrap particle filter<\/AC11>\n* <AC12>Adding a discussion section to the end of the paper<\/AC12>\n* <AC13>Writing a more thorough Related work section<\/AC13>\n* <AC14>A study on the impact of growing dimensionality (OU process)<\/AC14>\n* <AC15>Plots and discussion on the learned dynamics (control)<\/AC15>\n* <AC16>Plots and discussion on training loss<\/AC16>\n* <AC17>A more intuitive explanation of the Doob's h-transform in the Background section<\/AC17>\n* <AC18>Expanded Introduction to discuss applications (with references)<\/AC18>\n* <AC19>Computational cost discussion (promised to add to the appendix)<\/AC19>\n* <AC20>Figures illustrating Doob’s h-transform trajectories<\/AC20>\n* <AC21>Discussion on how fine discretization is needed<\/AC21>\n* <AC22>Discussion on parameter inference and the smoothing problem<\/AC22>\n* <AC23>Discussion on irregular observation intervals<\/AC23>\nconfidence: Less certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_AjSG", "rating": [null, 5], "messages": [{"message_id": "Reviewer_AjSG · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper develops an approximation to the locally optimal particle filter in discretely observed diffusion processes under the assumption of a constant measurement rate.<\/AC1>\nstrengths_and_weaknesses: S1 - <AC2>The method compares favourably to baseline solutions.<\/AC2>\n\nW1 - <AC3>Experiments are not entirely convincing.<\/AC3> <AC4>More specifically, only low-dimensional examples re considered (d <= 2)<\/AC4>, <AC5>which undermines the rationale for their method in that we are not in a high-dimensional regime where numerical solutions of PDEs become infeasible (paragraph 1 of sec 2.5).<\/AC5>\n\nW2 - <AC6>The method relies on fixed SDE dynamics<\/AC6> so <AC7>is not applicable to parameter inference.<\/AC7>\n\nW3 - <AC8>The method relies on constant sample rate<\/AC8>, <AC9>which is many times infeasible in practice due to e.g. missing measurements.<\/AC9>\nquestions:\nQ1 - <AC10>The difference between CDT static scheme and bootstrap proposals needs to be elucidated.<\/AC10> <AC11>Choosing c = 0 yield the original SDE dynamics, i.e. bootstrap proposals, no?<\/AC11>\nlimitations: Its fine."}, {"message_id": "Reviewer_AjSG · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer AjSG\nWe thank the reviewer for his/she comments. We give a point-by-point response to these comments below.\n***\n1. > Experiments are not entirely convincing. More specifically, only low-dimensional examples re considered $(d \\leq 2)$, which undermines the rationale for their method in that we are not in a high-dimensional regime where numerical solutions of PDEs become infeasible (paragraph 1 of sec 2.5).\n\nThanks for this comment. <AC1>While applicability to higher-dimensional problems is indeed important, we would like to point out that online nonlinear filtering for diffusions is known to be already a hard problem in low dimensions.<\/AC1> <AC2>In low dimensions, even though one can run classical PDE solvers (e.g. finite difference and finite element methods), it is computationally impractical to use this for online filtering<\/AC2> as <AC3>one would require many solver calls (i.e. one call per observation).<\/AC3> Hence <AC4>we believe that our proposed approach based on a neural network solver is interesting even for low-dimensional problems.<\/AC4>\n\n<AC5>To illustrate the applicability of our approach to higher-dimensional settings where it is computationally infeasible to consider classical PDE solvers, we have added a numerical study of how our proposed and competing methods behave as the dimensionality increases.<\/AC5> Here are the numerical results (with a link to our GitHub repository).\n\n[Impact of increasing dimension $d$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_dim_results.pdf)\n\n<AC6>Here we have chosen to perform this study on the Ornstein-Uhlenbeck model<\/AC6> as <AC7>analytical tractability in this example allows us to carefully benchmark our approximations of the fully adapted auxiliary particle filter (FA-APF).<\/AC7> Moreover, <AC8>this linear Gaussian setting is still challenging for many methods that do not exploit the model structure<\/AC8>, and <AC9>the ideal FA-APF itself suffers from the curse of dimensionality [SBBA2008, SBM2015].<\/AC9>\n***\n2. > The method relies on fixed SDE dynamics so is not applicable to parameter inference.\n\n<AC10>Our paper is concerned with the problem of online filtering for (a given) diffusion, which is the setup considered by many works in this literature (e.g. [FPR2008, FPRS2010]).<\/AC10> <AC11>We note that this is already a formidable problem in the regime of informative or extreme observations, or in state-spaces with moderately high dimensions.<\/AC11>\n\n<AC12>Our proposed CDT algorithm can in fact be easily extended to incorporate and learn parameter dependence in the neural networks.<\/AC12> <AC13>We did not pursue this avenue<\/AC13> as <AC14>it is more sensible to consider parameter inference in an offline setting by approximating the smoothing distribution which conditions all observations (instead of the filtering distributions which only conditions on the data sequentially, in an online manner).<\/AC14> <AC15>We view this direction as distinct from the online filtering problem and outside the scope of the current manuscript (to be considered in future work).<\/AC15> <AC16>Following the reviewer's comment, we have added some discussion about parameter inference and the smoothing problem in the updated manuscript.<\/AC16>\n***\n3. > The method relies on constant sample rate, which is many times infeasible in practice due to e.g. missing measurements.\n\nThank you for raising this practical point. <AC17>While we do not think our assumption of constant observation frequency is particularly restrictive in practice, i.e. many types of data are collected at regular time intervals<\/AC17>, <AC18>we do agree that it is worth extending our approach to deal with the setting of irregular observation frequencies.<\/AC18>\n\n<AC19>Due to the nature of the backward Kolmogorov equation, this is reasonably straightforward as long as the inter-observation time is upper bounded.<\/AC19> <AC20>For this purpose, one can for example learn the value function $v(x,y,t)$ satisfying Equation (13) as a function of the current state $x$, the next observation $y$, and the time to the next observation $T-t$.<\/AC20> <AC21>The control $c(x,y,t)=(\\sigma^\\top\\nabla\\log h)(x,y,t)$ is then obtained using automatic differentiation.<\/AC21> <AC22>This type of parametrization has already been employed in the backward SDE community for solving semi-linear PDEs [CMN2019].<\/AC22> <AC23>We have added a few explanatory sentences about irregular observation frequencies in the main text.<\/AC23>\n***\n\n4. > The difference between CDT static scheme and bootstrap proposals needs to be elucidated. Choosing $c = 0$ yield the original SDE dynamics, i.e. bootstrap proposals, no?\n\n<AC24>The CDT static scheme involves training the neural networks approximating the initial value and control functions by simulating sample paths from the \"naive\" uncontrolled dynamics with $c=0$.<\/AC24>\n<AC25>We stress that the CDT static scheme aims to learn the initial value and control functions, which is different from a bootstrap particle filter (BPF) whose purpose is to perform nonlinear filtering.<\/AC25>\n<AC26>After training the initial value and control neural networks with the CDT static scheme, one can use them to approximate the FA-APF<\/AC26>, and <AC27>we refer to the resulting approximation of FA-APF as Static-APF.<\/AC27> <AC28>Our numerical experiments then compare Static-APF to the BPF as a benchmark.<\/AC28> <AC29>We have added a sentence to clarify this point.<\/AC29>\n***\nWe hope we have managed to address your concerns about our work, and would be grateful if you could update your evaluation of our submission accordingly. Please feel free to leave us any additional comments or suggestions.\n***\n[CMN2019] Chan-Wai-Nam Q, Mikael J, Warin X. Machine learning for semi linear PDEs. Journal of scientific computing. 2019 Jun;79(3):1667-712.\n\n[FPR2008] Fearnhead P, Papaspiliopoulos O, Roberts GO. Particle filters for partially observed diffusions. Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2008 Sep;70(4):755-77.\n\n[FPRS2010] Fearnhead P, Papaspiliopoulos O, Roberts GO, Stuart A. Random‐weight particle filtering of continuous time processes. Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2010 Sep;72(4):497-512.\n\n[SBBA2008] Snyder C, Bengtsson T, Bickel P, Anderson J. Obstacles to high-dimensional particle filtering. Monthly Weather Review. 2008 Dec;136(12):4629-40.\n\n[SBM2015] Snyder C, Bengtsson T, Morzfeld M. Performance bounds for particle filters using the optimal proposal. Monthly Weather Review. 2015 Nov;143(11):4750-61.\n\n Global/general Response:\n```\nWe would like to thank all reviewers for your time and feedback. We appreciate the thoughtful comments and positive response.\n\nWe have provided detailed responses to each reviewer. The following is a summary of (what we think are) the key points from the collated feedback:\n\n1. <AC30>provide more motivation for why online filtering of diffusions is an important problem with a wide range of applications<\/AC30>;\n\n2. <AC31>better position our contribution with respect to related work<\/AC31>;\n\n3. <AC32>provide more intuition in the background section<\/AC32>;\n\n4. <AC33>give more insight on how our neural network approximations evolve during training, how fast training iterations converge, and visualize the trained neural networks<\/AC33>;\n\n5. <AC34>illustrate the applicability of our approach in higher-dimensional settings where it is computationally infeasible to consider classical PDE solvers<\/AC34>;\n\n6. <AC35>clarify whether alternative particle filters are applicable in this problem setting and compare our proposed auxiliary particle filter to not just the bootstrap particle filter but also the current state-of-the-art<\/AC35>;\n\n7. <AC36>add a conclusion recapitulating the main points of our approach and results, and a discussion of future work.<\/AC36>\n\nThis is admittedly a long list and <AC37>we have done a major revision to thoroughly address each point.<\/AC37> Please feel free to leave us any additional comments or suggestions.\n\n```"}, {"message_id": "Reviewer_AjSG · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "I acknowledge the authors' response. <AC1>They have adequately addressed the majority of my concerns.<\/AC1>"}]}, {"i": 2, "name": "Reviewer_mpC8", "rating": [null, 6], "messages": [{"message_id": "Reviewer_mpC8 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper addresses the task of online filtering for discretely observed nonlinear diffusion approaches.<\/AC1> <AC2>The paper proposes a method based on the fully adapted auxiliary particle filter (FA-APF).<\/AC2> <AC3>The paper discusses how a control function can be used to construct a controlled diffusion that takes into account a future observation.<\/AC3> <AC4>The desired control function is related to Doob’s h-transform<\/AC4> and <AC5>can be obtained by solving the backward Kolmogorov equations.<\/AC5> <AC6>This is computationally intractable<\/AC6>, so <AC7>the proposed strategy is to work with the value function (the negative log of h).<\/AC7> <AC8>The optimal control can then be expressed in terms of the value function and approximated with neural networks.<\/AC8> <AC9>These networks can be trained by simulating the controlled diffusion trajectories.<\/AC9> <AC10>After training, the online filtering can be performed using the approximately optimal control.<\/AC10>\n\n<AC11>The paper presents numerical results for three models: an Ornstein-Uhlenbeck model, a logistic diffusion model, and a cell model.<\/AC11> <AC12>The results are compared to a bootstrap particle filter.<\/AC12> <AC13>For the Ornstein-Uhlenbeck model, which is analytically tractable, there is also comparison with the exact APF.<\/AC13> <AC14>There superiority of the proposed method is clear in all three examples.<\/AC14>\n\nstrengths_and_weaknesses: Strengths\n1. <AC15>The paper addresses the important problem of online inference for diffusion processes<\/AC15> (<AC16>although it doesn’t make a compelling case as to why this problem is important<\/AC16>) and <AC17>provides an elegant algorithm for performing the filtering.<\/AC17> <AC18>To the best of my knowledge, this represents a novel approach to solving this problem<\/AC18> and <AC19>I would rate it as a highly original approach.<\/AC19> <AC20>I think the work could have a significant impact on research addressing online inference for diffusion processes.<\/AC20>\n\n2. <AC21>The paper is very well written.<\/AC21> <AC22>The material is relatively dense<\/AC22>, but <AC23>the authors do an excellent job of providing a clear description of the algorithm.<\/AC23> <AC24>It is developed step-by-step in an intuitive manner.<\/AC24>\n\nWeaknesses\n1. Related work and performance comparison: <AC25>there is very little discussion of existing methods for filtering partially observed diffusions.<\/AC25> <AC26>Multiple methods are acknowledged (and dismissed) with the single sentence “Specialized methodologies have been developed to circumvent or mitigate these issues.”<\/AC26> <AC27>Other methods like [R1] are ignored.<\/AC27>\n<AC28>Even if some of the methods are more limited in their applicability, there should have been an effort to compare with them experimentally for examples where they are applicable.<\/AC28> <AC29>Some discussion of the limitations of existing work should be included in the paper.<\/AC29>\n\n2. Motivation: <AC30>The paper does not provide a compelling motivation for the analyzed problem.<\/AC30> <AC31>There are very general claims about the ubiquity of diffusion processes in the first few sentences but no citations to any literature to support these claims.<\/AC31> <AC32>There are no citations of work providing more practical examples of where the proposed filtering problem would prove beneficial.<\/AC32> <AC33>The studied examples, while providing a good illustration of the benefits of the technique, do not provide compelling evidence of the practical utility.<\/AC33> <AC34>The cell model and the logistic diffusion model for population size dynamics do not seem suited to a meaningful, practical filtering task.<\/AC34>\n\n3. Experimental analysis: <AC35>There is no performance comparison to any methods except for the basic bootstrap particle filter.<\/AC35> <AC36>There have been multiple approaches to address the filtering task<\/AC36>, so <AC37>there should either be a clear explanation as to why existing approaches are inapplicable or other methods should be included.<\/AC37> <AC38>I could not find the details of exactly how many particles are used in the simulations (apart from the specification that it increases linearly with K).<\/AC38> <AC39>This seems to be an important design choice<\/AC39> and <AC40>there should be an explanation as to how the value was selected.<\/AC40> <AC41>Preferably there should be an analysis of how performance changes with varying K.<\/AC41> <AC42>There is no reporting of computational requirements.<\/AC42> <AC43>It is not clear if the proposed filter and the BPF have the same (or very similar) computations.<\/AC43> <AC44>Presumably there are additional neural network evaluations for the proposed scheme<\/AC44>, but <AC45>these may be negligible compared to other computational overhead.<\/AC45> <AC46>If they are non-negligible, then a fairer comparison would use more particles for the BPF.<\/AC46>\n\n[R1] Jasra, A., Law, K. J., & Yu, F. (2020). Unbiased filtering of a class of partially observed diffusions. Advances in Applied Probability, 1-27.\n\nquestions: 1. <AC47>How many particles were used in the experiments (or what was the scaling factor with K)?<\/AC47> <AC48>Why was this value chosen?<\/AC48> <AC49>What is the sensitivity to this choice?<\/AC49> <AC50>Is it possible to achieve improved performance with more particles or is the computational burden already considerable, i.e. if I were trying to implement a real-time system with a reasonably powerful computer, with a reasonable time between observations, how many particles could I use?<\/AC50>\n\n2. <AC51>What is the computational overhead?<\/AC51> <AC52>How does the computation of the proposed method compare to the BPF?<\/AC52> <AC53>What are the key contributors to the computational burden?<\/AC53>\n\n3. <AC54>What are the state-of-the-art competing techniques?<\/AC54> <AC55>Why are these not considered in a quantitative performance comparison?<\/AC55> <AC56>Are methods like [R1] inapplicable for the studied settings?<\/AC56>\n\nlimitations: Yes."}, {"message_id": "Reviewer_mpC8 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer mpC8\nWe would like to thank the reviewer for the positive feedback of our work and the very thorough reading of our manuscript. His/her remarks and comments have helped us to significantly improve the quality of our manuscript. We give a point-by-point response below.\n***\n1. > Weaknesses 1. Related work and performance comparison: there is very little discussion of existing methods for filtering partially observed diffusions. Multiple methods are acknowledged (and dismissed) with the single sentence “Specialized methodologies have been developed to circumvent or mitigate these issues.” Other methods like [R1] are ignored. Even if some of the methods are more limited in their applicability, there should have been an effort to compare with them experimentally for examples where they are applicable. Some discussion of the limitations of existing work should be included in the paper.\n\nThank you for this comment. <AC1>It is a very important point that was also raised by another reviewer.<\/AC1>\n\nA. <AC2>A number of methodologies have been developed to remove (or asymptotically eliminate) the time-discretization bias; see e.g. [BPG2006, BPRF2006, BZ2020, FPR2008, FPRS2010] that were cited in our manuscript.<\/AC2>\n<AC3>To better position our work, we now made it clearer in the introduction that this is not our objective: even if the control is learned perfectly, the SDE discretization bias remains.<\/AC3> <AC4>Although it is not always the case, in many situations, the time-discretization bias is negligible when compared to Monte Carlo errors.<\/AC4> <AC5>It is especially true in the regime of highly informative or extreme observations considered in this work.<\/AC5>\n\nWe thank the reviewer for pointing us to the reference [JLY2020], <AC6>which is very relevant to the setup we have considered and complementary to our proposed method.<\/AC6> In particular, <AC7>one can think of the novel double randomization scheme of [JLY2020] as a \"wrapper\" to enable our proposed auxiliary particle filters to return estimators of filtering expectations with no time-discretization bias.<\/AC7> <AC8>We now cite this reference and discuss this connection.<\/AC8>\n\nB. <AC9>When assimilating high-dimensional systems, there are indeed a number of methods relying on Gaussianity assumptions (e.g. EnKF and related approaches).<\/AC9> <AC10>We now briefly describe some of these methods<\/AC10> and also <AC11>emphasize that we do not compare to these methods that are \"asymptotically biased\", i.e. a possibly large, or difficult to quantify, bias can remain (in addition to the time-discretization bias) even as the number of particles goes to infinity.<\/AC11> In contrast, <AC12>the focus of this work is to offer a general methodology (by building on the strengths of neural networks) that can yield consistent estimates of the filtering distributions as both the number of discretization steps and the number of particles go to infinity.<\/AC12>\n\nC. <AC13>We have now added a brief discussion of the method pioneered by [VL2010] that attempts to steer particles toward the observations and make their weights exhibit less variance.<\/AC13> <AC14>This method relies on some model structure, e.g. the observation is assumed to be of the form $y = F(x) + \\varepsilon$ where $\\varepsilon$ denotes Gaussian noise<\/AC14>, and <AC15>has a number of tuning parameters.<\/AC15> Furthermore, <AC16>it can be understood as parametrizing a linear control<\/AC16>, <AC17>which is only expected to work well for linear Gaussian dynamics (which is a very important special case in applications).<\/AC17> <AC18>Indeed, this method appears to work very well in challenging geoscience applications.<\/AC18> <AC19>It is now discussed within the main text.<\/AC19>\n\nD. <AC20>We also now briefly discuss the \"Implicit Particle Filter\" of [CMT2010] in our updated manuscript.<\/AC20> <AC21>The method attempts to transform standard Gaussian samples (by solving a nonlinear optimization routine) to create samples from the optimal proposal density.<\/AC21> <AC22>Operationalizing this methodology requires a number of assumptions and requires a nonlinear optimization step for each particle and each time step<\/AC22>, <AC23>which can quickly become computational burdensome.<\/AC23>\nE. <AC24>We now discuss and numerically compare our proposed particle filters against the \"Guided Intermediate Resampling Filters\" (GIRF) of [DMM2015, PI2020]<\/AC24>; see Point 3 below for our numerical findings. <AC25>Like the bootstrap particle filter, these recently proposed algorithms move particles using the original SDE<\/AC25>, but <AC26>rely on resampling at intermediate time steps between observation times to guide particles to appropriate regions of the state-space.<\/AC26> <AC27>The choice of guiding functions that assign weights to particles at these intermediate steps is crucial for good algorithmic performance.<\/AC27> <AC28>We note that GIRF is in fact intimately related to Doob's $h$-transform<\/AC28> as <AC29>the optimal choice of guiding functions is given by the $h$-function [PI2020], i.e. $h(x,y,t)$ defined in Equation (10).<\/AC29> However, <AC30>even under this optimal choice, the resulting GIRF is still sub-optimal when compared to an auxiliary particle filter that move particles using the optimal control induced by the $h$-function, i.e. it is better to move particles well rather than rely on weighting and resampling.<\/AC30> <AC31>The latter behaviour is supported by our numerical experiments<\/AC31> and <AC32>a discussion of the above-mentioned connection has been added to the main text and appendix.<\/AC32>\n***\n2. > Motivation: The paper does not provide a compelling motivation for the analyzed problem. There are very general claims about the ubiquity of diffusion processes in the first few sentences but no citations to any literature to support these claims. There are no citations of work providing more practical examples of where the proposed filtering problem would prove beneficial. The studied examples, while providing a good illustration of the benefits of the technique, do not provide compelling evidence of the practical utility. The cell model and the logistic diffusion model for population size dynamics do not seem suited to a meaningful, practical filtering task.\n\n<AC33>We agree with this comment.<\/AC33> Since <AC34>models described by diffusion processes are very common in biological sciences (e.g. population modelling, multi-species models, stochastic delay population systems), neuroscience (e.g. models for synaptic input, stochastic Hodgkin–Huxley model, stochastic Fitzhugh–Nagumo model), and finance (e.g. modeling multi assets prices)<\/AC34> - mainly because <AC35>this flexible class of models is easily amenable to computations and simulations<\/AC35> - <AC36>we have motivated our study by taking several examples from these fields.<\/AC36>\n<AC37>In these disciplines, tracking signal from partial or noisy observations is a very common task.<\/AC37>\n\n<AC38>We could have, indeed, also added a few examples from the geoscience literature.<\/AC38> However, <AC39>we feel that our proposed methodology (as it stands) does not scale up to the kind of dimensions that are practically relevant to geoscience\n(e.g. spatially extended fields with effective dimensionality >100 or >1000), unless we exploit certain model structure using techniques such as localization.<\/AC39> <AC40>Future work will explore how to tailor Doob's $h$-transform for problems in geoscience.<\/AC40>\n\n<AC41>As the camera-ready version allows an additional page of text, we will expand our introduction section to provide more motivation and references.<\/AC41> Thank you again for raising this point.\n***\n3. >There is no performance comparison to any methods except for the basic bootstrap particle filter.\n\nWe thank the reviewer for this comment that has helped us to significantly improve our numerical section. <AC42>We have added numerical comparisons to the recently proposed \"Guided Intermediate Resampling Filters\" (GIRF) of [DMM2015, PI2020], which are the current state-of-the-art within the class of asymptotically exact methods for filtering SDEs.<\/AC42> The numerical results are given below (with links to our GitHub repository), and <AC43>the corresponding findings have been added to our updated manuscript.<\/AC43>\n**Ornstein-Uhlenbeck model**\n\nOU-A. [Results for Ornstein-Uhlenbeck model in dimension $d=1$ with various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_results.pdf)\n\nOU-B. [Results for Ornstein-Uhlenbeck model with increasing dimension $d$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_dim_results.pdf)\n\n<AC44>Following the feedback from other reviewers, we have added a numerical study of how our proposed and competing methods behave as the dimensionality increases.<\/AC44> <AC45>Here we have chosen to perform this study on the Ornstein-Uhlenbeck model<\/AC45> as <AC46>analytical tractability in this example allows us to carefully benchmark our approximations of the fully adapted auxiliary particle filter (FA-APF).<\/AC46> Moreover, <AC47>this linear Gaussian setting is still challenging for many methods that do not exploit the model structure<\/AC47>, and <AC48>the ideal FA-APF itself suffers from the curse of dimensionality [SBBA2008, SBM2015] - as alluded to in Point 2.<\/AC48>\n\n<AC49>We have also leveraged analytical tractability in this model to implement the optimal guiding functions for GIRF, which is given by the Doob's $h$-function [PI2020].<\/AC49> <AC50>These results show that GIRF can perform better than the bootstrap particle filter (BPF) in challenging regimes (i.e. when observations are informative or extreme, or in higher-dimensional settings)<\/AC50>, and <AC51>it is typically outperformed by the auxiliary particle filters.<\/AC51>\n\n**Logistic diffusion model and cell model**\n\nLD-A. [Results for logistic diffusion model with various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_results.pdf)\n\nCell-A. [Results for cell model with various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_results.pdf)\n\n<AC52>As the optimal guiding functions for GIRF is intractable for these two models, we considered a sub-optimal implementation that gradually introduces information from the next observation by annealing the observation density in a specific manner.<\/AC52> <AC53>We have added full implementation details in the appendix.<\/AC53> <AC54>In these numerical comparisons, we have considered both linear and quadratic annealing schedules which determine the rate at which information from the observation is introduced.<\/AC54> <AC55>Our numerical findings seem to indicate these instantiations of GIRF offer performance gains over the BPF when filtering extreme observations, but not when observations are informative.<\/AC55> Moreover, <AC56>Iterative-APF typically outperforms Static-APF and GIRF.<\/AC56>\n***\n4. > I could not find the details of exactly how many particles are used in the simulations (apart from the specification that it increases linearly with K). This seems to be an important design choice and there should be an explanation as to how the value was selected. Preferably there should be an analysis of how performance changes with varying K.\nHow many particles were used in the experiments (or what was the scaling factor with K)? Why was this value chosen? What is the sensitivity to this choice? Is it possible to achieve improved performance with more particles or is the computational burden already considerable, i.e. if I were trying to implement a real-time system with a reasonably powerful computer, with a reasonable time between observations, how many particles could I use?\n\n<AC57>In all numerical experiments, we chose the number of particles $N$ as $N=2^6K/100$, where $K$ denotes the number of observations.<\/AC57> <AC58>Increasing $N$ linearly with $K$ is necessary to keep marginal likelihood estimators stable [BDMD2014] when producing the figures listed in Point 3.<\/AC58> <AC59>Our numerical findings are not sensitive to the choice of scaling factor $2^6/100$ (as long as this is large enough to have adequate number of particles for the smallest $K$ considered)<\/AC59>; <AC60>it was simply chosen for ease of plotting the results<\/AC60>, as <AC61>too large a factor will render it hard to visualize the differences between the particle filters (in terms of the ELBO gap and the variance of the log-marginal likelihood estimators).<\/AC61> <AC62>For a given model and application, the appropriate scaling factor, or equivalently the number of particles required, would be very much problem-specific, and dependent on the desired precision of filtering approximations.<\/AC62> Hence <AC63>the number of particles is usually determined in practice by preliminary runs.<\/AC63> Furthermore, <AC64>as pointed out by the reviewer, how the computational cost depends on the number of particles also depends on the specificities of the problem.<\/AC64> <AC65>For the models we have considered, it was reasonable to use quite large number of particles compared to what is usually possible in geoscience applications (as discussed in Point 2).<\/AC65>\n***\n\n5. > There is no reporting of computational requirements. It is not clear if the proposed filter and the BPF have the same (or very similar) computations. Presumably there are additional neural network evaluations for the proposed scheme, but these may be negligible compared to other computational overhead. If they are non-negligible, then a fairer comparison would use more particles for the BPF.\nWhat is the computational overhead? How does the computation of the proposed method compare to the BPF? What are the key contributors to the computational burden?\n\n<AC66>The main computational overhead comes from training the initial value and control neural networks<\/AC66>; <AC67>the additional overhead from having to evaluate these neural networks in our proposed particle filters was negligible.<\/AC67> <AC68>Following this comment, we now detail the computational cost for each model in the appendix.<\/AC68> <AC69>The main point here is that the training cost is actually very small when filtering long time series, or running BPF with many particles in challenging regimes.<\/AC69>\n***\nWe hope we have managed to address your concerns about our work, and would be grateful if you could update your evaluation of our submission accordingly. Please feel free to leave us any additional comments or suggestions.\n***\n[BDMD2014] Bérard J, Del Moral P, Doucet A. A lognormal central limit theorem for particle approximations of normalizing constants. Electronic Journal of Probability. 2014 Jan;19:1-28.\n\n[BPG2006] Beskos A, Papaspiliopoulos O, Roberts GO. Retrospective exact simulation of diffusion sample paths with applications. Bernoulli. 2006 Dec;12(6):1077-98.\n\n[BPRF2006] Beskos A, Papaspiliopoulos O, Roberts GO, Fearnhead P. Exact and computationally efficient likelihood‐based estimation for discretely observed diffusion processes (with discussion). Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2006 Jun;68(3):333-82.\n\n[BZ2020] Blanchet J, Zhang F. Exact simulation for multivariate Itô diffusions. Advances in Applied Probability. 2020 Dec;52(4):1003-34.\n\n[CMT2010] Chorin, A.J., Morzfeld, M. and Tu, X. (2010) Interpolation and iteration for nonlinear filters. Communications in Applied Mathematics and Computational Science, 5, 221–240.\n\n[DMM2015] Del Moral P, Murray LM. Sequential Monte Carlo with highly informative observations. SIAM/ASA Journal on Uncertainty Quantification. 2015;3(1):969-97.\n\n[FPR2008] Fearnhead P, Papaspiliopoulos O, Roberts GO. Particle filters for partially observed diffusions. Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2008 Sep;70(4):755-77.\n\n[FPRS2010] Fearnhead P, Papaspiliopoulos O, Roberts GO, Stuart A. Random‐weight particle filtering of continuous time processes. Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2010 Sep;72(4):497-512.\n\n[JLY2020] Jasra A, Law KJ, Yu F. Unbiased filtering of a class of partially observed diffusions. Advances in Applied Probability. 2020:1-27.\n\n[PI2020] Park J, Ionides EL. Inference on high-dimensional implicit dynamic models using a guided intermediate resampling filter. Statistics and Computing. 2020 Sep;30(5):1497-522.\n\n[SBBA2008] Snyder C, Bengtsson T, Bickel P, Anderson J. Obstacles to high-dimensional particle filtering. Monthly Weather Review. 2008 Dec;136(12):4629-40.\n\n[SBM2015] Snyder C, Bengtsson T, Morzfeld M. Performance bounds for particle filters using the optimal proposal. Monthly Weather Review. 2015 Nov;143(11):4750-61.\n\n[VL2010] van Leeuwen, P.J. (2010) Nonlinear data assimilation in geosciences: an extremely efficient particle filter. Quarterly Journal of the Royal Meteorological Society, 136, 1991–1999.\n\n Global/general Response:\n```\nWe would like to thank all reviewers for your time and feedback. We appreciate the thoughtful comments and positive response.\n\nWe have provided detailed responses to each reviewer. The following is a summary of (what we think are) the key points from the collated feedback:\n\n1. <AC70>provide more motivation for why online filtering of diffusions is an important problem with a wide range of applications<\/AC70>;\n\n2. <AC71>better position our contribution with respect to related work<\/AC71>;\n\n3. <AC72>provide more intuition in the background section<\/AC72>;\n\n4. <AC73>give more insight on how our neural network approximations evolve during training, how fast training iterations converge, and visualize the trained neural networks<\/AC73>;\n\n5. <AC74>illustrate the applicability of our approach in higher-dimensional settings where it is computationally infeasible to consider classical PDE solvers<\/AC74>;\n\n6. <AC75>clarify whether alternative particle filters are applicable in this problem setting and compare our proposed auxiliary particle filter to not just the bootstrap particle filter but also the current state-of-the-art<\/AC75>;\n\n7. <AC76>add a conclusion recapitulating the main points of our approach and results, and a discussion of future work.<\/AC76>\n\nThis is admittedly a long list and <AC77>we have done a major revision to thoroughly address each point.<\/AC77> Please feel free to leave us any additional comments or suggestions.\n\n```"}, {"message_id": "Reviewer_mpC8 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Response to rebuttal\n<AC1>The response to the reviews has been very thorough.<\/AC1> <AC2>The proposed changes lead to a considerably stronger paper with a much better performance evaluation.<\/AC2> <AC3>In my view, most of the concerns raised by other reviewers have been addressed, leading to improvements and better explanations concerning the proposed method.<\/AC3> <AC4>One consideration is that the changes from the original submission are substantial<\/AC4> and <AC5>the revised paper almost needs to go through another thorough review.<\/AC5> <AC6>My questions have been satisfactorily addressed<\/AC6> and <AC7>I have raised my score to a 6.<\/AC7>"}, {"message_id": "Reviewer_mpC8 · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Reply to Reviewer mpC8\nThank you for taking the time to go through our rebuttal and for your kind response."}, {"message_id": "Reviewer_mpC8 · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I am glad to have had the above discussion with the author, <AC1>which undoubtedly enhances the strength of this paper.<\/AC1>"}]}, {"i": 3, "name": "Reviewer_q4F1", "rating": [null, 6], "messages": [{"message_id": "Reviewer_q4F1 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper presents a novel method for online filtering where the latent process has a higher frequency than the observations.<\/AC1> <AC2>The authors define an algorithm, Computational Doob’s h-Transform, for iteratively learning a control function over the latent space and an observation to drive a stochastic process to a specific point at time T.<\/AC2> <AC3>The learned control function is then later applied in online filtering, where no further learning is required but the controlled dynamics can be applied to compute the particle filtering weights and to propagate the particles.<\/AC3> <AC4>CDT is applied to low-dimensional settings in the experiments section, where it is compared to bootstrap particle filtering for nonlinear dynamics, and to the exact analytical solution when available.<\/AC4>\nstrengths_and_weaknesses: Strengths\n1. <AC5>An original method for learning a control function for particle filtering using a Doob’s h-transform<\/AC5>\n2. <AC6>Separation of learning the control and the filtering itself is an attractive idea for improving efficiency<\/AC6>\n3. <AC7>The work is reproducible (the code was provided and I was able to run it)<\/AC7>\n\nWeaknesses\n1. <AC8>Limitations and related work were not discussed enough<\/AC8>, <AC9>the paper would have benefited from a well-structured Conclusions/Discussion\n     section at the end instead of scattered remarks.<\/AC9> <AC10>It was not clear to me how the method presented compares to earlier work.<\/AC10>\n2. <AC11>While I agree that covering the theory in detail is well justified, having three pages of background section would have been more\n     comfortable to read if there was more text motivating why the topics covered are important or intuitive/heuristic explanations.<\/AC11>\n3. <AC12>The convergence properties of the iterative scheme were not studied empirically or theoretically<\/AC12>, <AC13>I was not able to develop an intuition\n     into how the control behaves at iteration 1 versus iteration N.<\/AC13>\n4. <AC14>Low dimensional experiments, only comparisons to a simple baseline method (bootstrap particle filter) and not to more recent work<\/AC14>\n5. <AC15>The figures were focused on presenting error metrics<\/AC15>, <AC16>the behaviour of the learned control or the filtering distribution were hardly\n      visualized<\/AC16>\n\nquestions: Questions\n1. On the iterative method: <AC17>how many iterations of the iterative method were required until satisfactory results/convergence?<\/AC17> <AC18>Can you\n      point to any theoretical results or give heuristics on the behaviour of the learned control through the iterative method?<\/AC18>\n2. On dimensionality: <AC19>How does the method scale when the dimensionality of the problem is changed?<\/AC19> <AC20>I’m concerned of the learning of\n       the control function, and how representative is the sampling scheme for observations during training when the problem is high-\n      dimensional<\/AC20>\n3. On experiments; <AC21>Do they present a fair comparison?<\/AC21> <AC22>Is there some more recent work than bootstrap filters you could compare to in the\n        experiment settings where no analytical solution is available?<\/AC22>\n4. On training of neural networks; <AC23>Did training the initial value and control networks simultaneously present any issues?<\/AC23>\n5. On the loss function: <AC24>the loss function considers only the final state of the value function.<\/AC24> <AC25>Was no regularization needed on the\n         dynamics?<\/AC25> <AC26>Why, and are there some cases where it would be beneficial?<\/AC26>\n6. On the observations: <AC27>There is a comment in the experiments section (Line 242) that the results are not sensitive to choice of T as long\n        as the discretization has a small enough step size.<\/AC27> <AC28>What is small enough?<\/AC28> <AC29>A heuristic explanation/plot showing how long it takes the\n       control to steer to the observation would have been informative.<\/AC29>\n7. On clarity of text: (minor) <AC30>some parts of the text had, to my knowledge, a number of typos and issues with grammar and notation.<\/AC30> In\n      addition, <AC31>there was some vague phrasing.<\/AC31> <AC32>Please consider going through the following lines<\/AC32>\n\nLines to check:\nLine 13-14: <AC33>applications listed<\/AC33>, but <AC34>no references provided<\/AC34>\nLine 21: <AC35>“is collected” while referring to multiple observations<\/AC35>\nLine 29-30: <AC36>“the goal of the article is…” This sentence felt too vague on my initial read<\/AC36>\nLine 33: <AC37>“these quantities” which quantities are you referring to here?<\/AC37> <AC38>Only the control function has been referred to so far<\/AC38>\nLine 37: <AC39>Efficient in what sense?<\/AC39>\nLine 44: <AC40>“an homogenous” should be “a”?<\/AC40>\nLine 68: comma before while\nEquation 4: <AC41>why p_T?<\/AC41> <AC42>It is confusing to the reader in the case k> 1.<\/AC42> <AC43>The notation makes sense after reading 88-90<\/AC43>, but <AC44>this equation is before that<\/AC44>\nLine 136: <AC45>“Ito lemma” should be “Ito’s lemma”<\/AC45>\nLine 143: <AC46>Period missing from the last sentence of the paragraph.<\/AC46>\nEquation 15: <AC47>t is used as time on the left-hand size<\/AC47>, but <AC48>it is the integrated variable on the right-hand side<\/AC48>\nLine 217: <AC49>why is the control evaluated at t-t_k?<\/AC49>\nLine 238: <AC50>odd to say that all experiments had 10 observations, when nearly all experiments vary K?<\/AC50>\nLine 248: <AC51>why was it required to grow the number of samples when the number of observations grows?<\/AC51> <AC52>Does this mean that when K=1000, there were 100k samples (since there were 1k samples for K=10)<\/AC52>\nLine 255: <AC53>“Analytically tractability”<\/AC53>\nFigure 1: <AC54>the figure text was quite vague<\/AC54>, <AC55>I didn’t get what I should be concluding based on the plots?<\/AC55> <AC56>I can see that they somewhat match<\/AC56>, but <AC57>was there some additional insight I’m missing here?<\/AC57>\nFigure 2: <AC58>The y-axis labels slightly overlap with the subplot borders<\/AC58>\n\nlimitations: 1. <AC59>Societal impact of the work was not discussed.<\/AC59> <AC60>As the paper is presenting theoretical work, it does not require a deeper investigation into such matters.<\/AC60>\n2. <AC61>Scalability to higher dimensional problems and convergence of the iterative method were not sufficiently discussed or empirically tested, even though scalability to high-dimensional problems was explicitly stated as a motivating factor for not using standard numerical methods for solving PDEs (Line 126-128)<\/AC61>"}, {"message_id": "Reviewer_q4F1 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer q4F1\nWe would like to thank the reviewer for the positive feedback of our work and the very thorough reading of our manuscript. His/her remarks and comments have helped us to significantly improve the quality of our manuscript. We give a point-by-point response below.\n***\n1. > Limitations and related work were not discussed enough, the paper would have benefited from a well-structured Conclusions/Discussion section at the end instead of scattered remarks. It was not clear to me how the method presented compares to earlier work.\n\nThank you, <AC1>this point was also raised by another reviewer and is now addressed in our revision.<\/AC1> The main changes are as follows.\n\nA. <AC2>A number of methodologies have been developed to remove (or asymptotically eliminate) the time-discretization bias; see e.g. [BPG2006, BPRF2006, BZ2020, FPR2008, FPRS2010].<\/AC2> <AC3>To better position our work, we now made it clearer in the introduction and conclusion that this is not our\nobjective: even if the control is learned perfectly, the SDE discretization bias remains.<\/AC3> <AC4>Although it is not always the case, in many situations, the time-discretization bias is negligible when compared to Monte Carlo\nerrors.<\/AC4> <AC5>It is especially true in the regime of highly informative or extreme observations considered in this work.<\/AC5>\n\nB. <AC6>In the data-assimilation literature, a number of methods rely on Gaussianity assumptions (e.g. EnKF and related approaches such as [VL2010]).<\/AC6> <AC7>We now briefly describe some of these \"asymptotically biased\" methods, i.e. a possibly large, or difficult to quantify, bias can remain (in addition to the time-discretization bias) even as the number of particles goes to infinity.<\/AC7> <AC8>Although this class of methods is indeed extremely useful in very high-dimensional systems and spatially extended scenarios that are common in numerical weather forecasting, it is not the purpose of this article to tackle such problems.<\/AC8> In contrast, <AC9>the focus of this work is to offer a general methodology (by building on the strengths of neural networks) that can yield consistent estimates of the filtering distributions as both the number of discretization steps and the number of particles go to infinity.<\/AC9> <AC10>We have made these points clearer in our manuscript.<\/AC10>\n\nC. <AC11>We now discuss and numerically compare our proposed particle filters against the \"Guided Intermediate Resampling Filters\" (GIRF) of [DMM2015, PI2020]<\/AC11>; see Point 4 below for our numerical findings. <AC12>Like the bootstrap particle filter, these recently proposed algorithms move particles using the original SDE<\/AC12>, but <AC13>rely on resampling at intermediate time steps between observation times to guide particles to appropriate regions of the state-space.<\/AC13> <AC14>The choice of guiding functions that assign weights to particles at these intermediate steps is crucial for good algorithmic performance.<\/AC14> <AC15>We note that GIRF is in fact intimately related to Doob's $h$-transform<\/AC15> as <AC16>the optimal choice of guiding functions is given by the $h$-function [PI2020], i.e. $h(x,y,t)$ defined in Equation (10).<\/AC16> However, <AC17>even under this optimal choice, the resulting GIRF is still sub-optimal when compared to an auxiliary particle filter that move particles using the optimal control induced by the $h$-function, i.e. it is better to move particles well rather than rely on weighting and resampling.<\/AC17> <AC18>The latter behaviour is supported by our numerical experiments<\/AC18> and <AC19>a discussion of the above-mentioned connection has been added to the main text and appendix.<\/AC19>\n\nD. <AC20>We also have some discussion about future work in the newly-added conclusion.<\/AC20>\n***\n2. > While I agree that covering the theory in detail is well justified, having three pages of background section would have been more comfortable to read if there was more text motivating why the topics covered are important or intuitive/heuristic explanations.\n\n<AC21>We agree with this comment.<\/AC21> Since <AC22>models described by diffusion processes are very common in biological sciences (e.g. population modelling, multi-species models, stochastic delay population systems), neuroscience (e.g. models for synaptic input, stochastic Hodgkin–Huxley model, stochastic Fitzhugh–Nagumo model), and finance (e.g. modeling multi assets prices)<\/AC22> - mainly because <AC23>this flexible class of models is easily amenable to computations and simulations<\/AC23> - <AC24>we have motivated our study by taking several examples from these fields.<\/AC24> <AC25>In these disciplines, tracking signal from partial or noisy observations is a very common task.<\/AC25>\n<AC26>We could have, indeed, also added a few examples from the geoscience literature.<\/AC26> However, <AC27>we feel that our proposed methodology (as it stands) does not scale up to the kind of dimensions that are practically relevant to geoscience (e.g. spatially extended fields with effective dimensionality >100 or >1000), unless we exploit certain model structure using techniques such as localization.<\/AC27> <AC28>Future work will explore how to tailor Doob's $h$-transform for problems in geoscience.<\/AC28> <AC29>As the camera-ready version allows an additional page of text, we will expand our introduction section to provide more motivation and references.<\/AC29>\n\n<AC30>To offer readers more intuition when going through the background section, we have added the following two figures (with links to our GitHub repository) to visualize the two main concepts underlying our work<\/AC30>:\n\nA. [Doob's $h$-transform](https://anonymous.4open.science/r/CompDoobTransform/figures/illustrate_CDT.pdf);\n\nB. [using Doob's $h$-transform for online filtering of diffusions](https://anonymous.4open.science/r/CompDoobTransform/figures/illustrate_APF.pdf).\n\n<AC31>Figure A shows how uncontrolled trajectories $X_t$ (*black*) under the original diffusion differs from controlled trajectories $\\widehat{X}_t$ (*blue*) under the conditioned diffusion, induced by an informative observation $Y\\sim\\mathcal{N}(X_T,\\sigma_Y^2)$ (*red*).<\/AC31>\n\n<AC32>For the purposes of online filtering, the bootstrap particle filter (BPF) and fully adapted auxiliary particle filter (FA-APF) require one to simulate trajectories under the original diffusion and conditioned diffusion respectively.<\/AC32> <AC33>Figure B illustrates the trajectories (*left panel*) and log-weights (*right panel*) generated by BPF (*black*) and FA-APF (*blue*).<\/AC33> <AC34>It is apparent that FA-APF allows one to obtain trajectories that are more consistent with informative data and weights that exhibit significantly less variability compared to the BPF.<\/AC34>\n\n<AC35>Our work proposes a new framework to compute Doob's $h$-transform that is tailored for the purpose of approximating the FA-APF in the setting of online filtering.<\/AC35>\n\nThank you again for raising this point that has helped us to improve our paper.\n***\n3. > The convergence properties of the iterative scheme were not studied empirically or theoretically, I was not able to develop an intuition into how the control behaves at iteration 1 versus iteration N.\n\nThank you for this important comment. <AC36>We have added numerical experiments to study convergence of the neural networks approximating the initial value and control functions as the training procedure progresses.<\/AC36> <AC37>These are compared to the optimal initial value function and optimal control function in the case of the Ornstein-Uhlenbeck model.<\/AC37> <AC38>The following figures (with links to our GitHub repository) illustrate quite rapid convergence.<\/AC38> <AC39>We also include the estimated loss function over the training iterations<\/AC39> as <AC40>these figures can be informative in practice.<\/AC40> <AC41>All figures and corresponding discussions about the training process have been added to both the main article and appendix.<\/AC41>\n\n**Ornstein-Uhlenbeck model during initial training phase**\n\nOU-A. [Evolution of loss estimate over first $500$ optimization iterations](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_loss_train.pdf)\n\nOU-B. [Evolution of neural network $\\mathrm{N}_0(x,y)$ (*black to copper*) approximating the initial value function $v(x,y,0)$ (*red*) over first $500$ optimization iterations for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_value_train.pdf)\n\nOU-C. [Evolution of neural network $-\\mathrm{N}(x,y,t)$ (*black to copper*) approximating the control function $c_{\\star}(x,y,t)$ (*red*) over first $500$ optimization iterations for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_control_train.pdf)\n\n**Ornstein-Uhlenbeck model after training**\n\nOU-D. [Evolution of loss estimate over $2000$ optimization iterations under static (*red*) and iterative (*blue*) CDT schemes](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_loss_compare.pdf)\n\nOU-E. [Neural network approximation $\\mathrm{N}_0(x,y)$ of the initial value function $v(x,y,0)$ (*purple*) after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_value_compare.pdf)\n\nOU-F. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ (*purple*) after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_control_compare.pdf)\n\n**Logistic diffusion model during initial training phase**\n\nLD-A. [Evolution of loss estimate over first $500$ optimization iterations](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_loss_train.pdf)\n\nLD-B. [Evolution of neural network $\\mathrm{N}_0(x,y)$ (*black to copper*) approximating the initial value function $v(x,y,0)$ over first $500$ optimization iterations for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_value_train.pdf)\n\nLD-C. [Evolution of neural network $-\\mathrm{N}(x,y,t)$ (*black to copper*) approximating the control function $c_{\\star}(x,y,t)$ over first $500$ optimization iterations for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_control_train.pdf)\n\n**Logistic diffusion model after training**\n\nLD-D. [Evolution of loss estimate over $2000$ optimization iterations under static (*red*) and iterative (*blue*) CDT schemes and various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_loss.pdf)\n\nLD-E. [Neural network approximation $\\mathrm{N}_0(x,y)$ of the initial value function $v(x,y,0)$ after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*left panel*) and an extreme (*right panel*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_value_compare.pdf)\n\nLD-F. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ after training with the static (*red*) and iterative (*blue*) CDT schemes for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_control_compare.pdf)\n\n**Cell model after training**\n\nCell-A. [Evolution of loss estimate over $2000$ optimization iterations under static (*red*) and iterative (*blue*) CDT schemes and various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_loss.pdf)\n\nCell-B. [Neural network approximation $\\mathrm{N}_0(x,y)$ of the initial value function $v(x,y,0)$ after training with the static (*left column*) and iterative (*right column*) CDT schemes for a typical (*upper row*) and an extreme (*lower row*) observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_value_function.pdf)\n\nCell-C. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ after training with the static (*upper row*) and iterative (*lower row*) CDT schemes for a typical observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_control_function_in.pdf)\n\nCell-D. [Neural network approximation $-\\mathrm{N}(x,y,t)$ of the control function $c_{\\star}(x,y,t)$ after training with the static (*upper row*) and iterative (*lower row*) CDT schemes for an extreme observation $y$](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_control_function_out.pdf)\n***\n4. > Low dimensional experiments, only comparisons to a simple baseline method (bootstrap particle filter) and not to more recent work\n\nWe thank the reviewer for this feedback that has helped us to significantly improve our numerical section.\n\n<AC42>While applicability to higher-dimensional problems is indeed important, we would like to point out that online nonlinear filtering for diffusions is known to be already a hard problem in low dimensions.<\/AC42> <AC43>In low dimensions, even though one can run classical PDE solvers (e.g. finite difference and finite element methods), it is computationally impractical to use this for online filtering<\/AC43> as <AC44>one would require many solver calls (i.e. one call per observation).<\/AC44> Hence <AC45>we believe that our proposed approach based on a neural network solver is interesting even for low-dimensional problems.<\/AC45> <AC46>To illustrate the applicability of our approach to higher-dimensional settings where it is computationally infeasible to consider classical PDE solvers, we have added a numerical study of how our proposed and competing methods behave as the dimensionality increases.<\/AC46>\n\n<AC47>We have also added numerical comparisons to the recently proposed \"Guided Intermediate Resampling Filters\" (GIRF) of [DMM2015, PI2020], which are the current state-of-the-art within the class of asymptotically exact methods for filtering SDEs.<\/AC47> The numerical results are given below (with links to our GitHub repository), and <AC48>the corresponding findings have been added to our updated manuscript.<\/AC48>\n\n**Ornstein-Uhlenbeck model**\n\nOU-A. [Results for Ornstein-Uhlenbeck model in dimension $d=1$ with various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_results.pdf)\n\nOU-B. [Results for Ornstein-Uhlenbeck model with increasing dimension $d$ ](https://anonymous.4open.science/r/CompDoobTransform/figures/OU_dim_results.pdf)\n\n<AC49>Here we have chosen to study the impact of increasing dimension on the Ornstein-Uhlenbeck model<\/AC49> as <AC50>analytical tractability in this example allows us to carefully benchmark our approximations of the fully adapted auxiliary particle filter (FA-APF).<\/AC50> Moreover, <AC51>this linear Gaussian setting is still challenging for many methods that do not exploit the model structure<\/AC51>, and <AC52>the ideal FA-APF itself suffers from the curse of dimensionality [SBBA2008, SBM2015] - as alluded to in Points 1 and 2.<\/AC52>\n\n<AC53>We have also leveraged analytical tractability in this model to implement the optimal guiding functions for GIRF, which is given by the Doob's $h$-function [PI2020].<\/AC53> <AC54>These results show that GIRF can perform better than the bootstrap particle filter (BPF) in challenging regimes (i.e. when observations are informative or extreme, or in higher-dimensional settings)<\/AC54>, <AC55>it is typically outperformed by the auxiliary particle filters.<\/AC55>\n\n**Logistic diffusion model and cell model**\n\nLD-A. [Results for logistic diffusion model with various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/logistic_results.pdf)\n\nCell-A. [Results for cell model with various levels of informative observations](https://anonymous.4open.science/r/CompDoobTransform/figures/cell_results.pdf)\n\n<AC56>As the optimal guiding functions for GIRF is intractable for these two models, we considered a sub-optimal implementation that gradually introduces information from the next observation by annealing the observation density in a specific manner.<\/AC56> <AC57>We have added full implementation details in the appendix.<\/AC57> <AC58>In these numerical comparisons, we have considered both linear and quadratic annealing schedules which determine the rate at which information from the observation is introduced.<\/AC58> <AC59>Our numerical findings seem to indicate these instantiations of GIRF offer performance gains over the BPF when filtering extreme observations, but not when observations are informative.<\/AC59> Moreover, <AC60>Iterative-APF typically outperforms Static-APF and GIRF.<\/AC60>\n***\n5. > The figures were focused on presenting error metrics, the behaviour of the learned control or the filtering distribution were hardly visualized.\n\n<AC61>With reference to Point 3, we have added new figures to help readers visualize the neural networks approximating the initial value and control functions during the training procedure and after training is completed.<\/AC61> <AC62>These plots illustrate the rate of convergence during training and the differences between the neural networks obtained using the static and iterative CDT schemes.<\/AC62>\n\nIs there any other set of experiments that the reviewer may find helpful to build more intuition?\n\n<AC63>As for the filtering distributions, we did not find it very helpful to plot them<\/AC63> but <AC64>we could add some figures similar to the following illustrative plot if the reviewer thinks it would add value to the paper.<\/AC64>\n\n[Using Doob's $h$-transform for online filtering of diffusions](https://anonymous.4open.science/r/CompDoobTransform/figures/illustrate_APF.pdf)\n***\n6. > On the iterative method: how many iterations of the iterative method were required until satisfactory results/convergence? Can you point to any theoretical results or give heuristics on the behaviour of the learned control through the iterative method?\n\nWith reference to Point 3, we have added new figures showing:\n\nA. <AC65>the behaviour of our neural network approximations during training (Figures OU-B, OU-C, LD-B, LD-C)<\/AC65>;\n\nB. <AC66>the estimated loss function over the training iterations (Figures OU-D, LD-D, Cell-A).<\/AC66>\n\n<AC67>Although the methodology presented in our manuscript is quite close in spirit to several recently proposed neural network based backward SDE approaches to approximate semi-linear PDEs, most of these methods do not change the dynamics of the simulated sample paths as the training progresses.<\/AC67> Hence <AC68>most closely related theoretical results in the literature do not cover our approach.<\/AC68>\n<AC69>We are aware of only one relevant work [NR2021], which has some results concerning the stability of the training procedure near the optimal control and in high-dimensional settings.<\/AC69> <AC70>We will add this reference to our manuscript.<\/AC70> Thank you for this question.\n***\n\n7. > How does the method scale when the dimensionality of the problem is changed? I’m concerned of the learning of the control function, and how representative is the sampling scheme for observations during training when the problem is high-dimensional\n\n<AC71>We agree that scalability to higher-dimensional settings is indeed important.<\/AC71>\n<AC72>We have added a numerical study of how our proposed and competing methods behave as the dimensionality increases<\/AC72>, and refer to Point 4 for more details.\n***\n8. > On experiments; Do they present a fair comparison? Is there some more recent work than bootstrap filters you could compare to in the experiment settings where no analytical solution is available?\n\n<AC73>To the best of our knowledge, there are relatively few existing methodologies that are applicable in the setup we consider and are as general (i.e. do not heavily rely on the structure of the model) as ours.<\/AC73> Note that <AC74>our method does not exploit any structure of the diffusion except the ability to simulate SDEs and differentiate through the transition densities.<\/AC74>\n\n<AC75>With reference to Point 4, we have added numerical comparisons to the recently proposed \"Guided Intermediate Resampling Filters\" (GIRF) of [DMM2015, PI2020], which are the current state-of-the-art within the class of asymptotically exact methods for filtering SDEs.<\/AC75> <AC76>Although GIRF is generally applicable, the choice of guiding functions that assign weights to particles at intermediate steps is crucial for good algorithmic performance.<\/AC76> <AC77>Our implementation of GIRF employed the optimal guiding functions for the Ornstein-Uhlenbeck model, and a sub-optimal but practical choice for other models that gradually introduces information from the next observation by annealing the observation density in a specific manner.<\/AC77> <AC78>We have also considered various annealing schedules (but report just two) in an effort to provide a fair comparison.<\/AC78>\n\nIf the reviewer is aware of another class of methods that is applicable to this problem setting, we would be happy to perform additional comparisons.\n***\n9. > On training of neural networks; Did training the initial value and control networks simultaneously present any issues?\n\n<AC79>We did not encounter any numerical instabilities in our experiments.<\/AC79> <AC80>Interestingly, recent work by [NR2021] (from the backward SDE and PDE perspective), indicate that faster convergence of the training procedure could be achieved by using different parameterizations of the neural networks approximating the initial value and control functions.<\/AC80> <AC81>We will experiment with these alternative formulations in future work.<\/AC81>\n***\n10. > On the loss function: the loss function considers only the final state of the value function. Was no regularization needed on the dynamics? Why, and are there some cases where it would be beneficial?\n\n<AC82>It is an important point which we have also given much thought to when designing the method.<\/AC82> <AC83>We were initially surprised that there is enough \"gradient information\" for the optimal control to be learned efficiently even though the \"loss function only depends on the final state of the value function\".<\/AC83> <AC84>Empirically, this does not seem to be an issue.<\/AC84>\n\n<AC85>One instructive way to understand why is to view the CDT algorithm as minimizing some divergence between path measures defined on path space [NR2021].<\/AC85> We refer also to the excellent article by [CWN2019] for discussions and comparisons of neural architecture and loss functions (in the context of solving semi-linear PDEs).\n***\n11. > On the observations: There is a comment in the experiments section (Line 242) that the results are not sensitive to choice of T as long as the discretization has a small enough step size. What is small enough? A heuristic explanation/plot showing how long it takes the control to steer to the observation would have been informative.\n\nThank you for this comment. <AC86>When the time-discretization is too coarse, the induced bias will dominate the total error (and hence poor performance is obtained)<\/AC86> and <AC87>the time-discretized process might be unstable to simulate.<\/AC87> <AC88>What is considered \"small enough\" depends on the particular model and the informativeness of the observations.<\/AC88> <AC89>We advocate running the methodology for increasingly finer discretization: all the performance metrics quickly stabilize when the discretization becomes \"small enough\".<\/AC89> <AC90>We have not been able to find a more theoretically grounded approach for setting the step-size<\/AC90>, and <AC91>have been quite satisfied with this data-driven approach.<\/AC91> <AC92>We have added a sentence in the main text to better explain this point and our rationale.<\/AC92> Lastly, <AC93>the requested plots have been added<\/AC93> - we refer to Figures A and B in Point 2.\n***\n\n12. > On clarity of text: (minor) some parts of the text had, to my knowledge, a number of typos and issues with grammar and notation. In addition, there was some vague phrasing. Please consider going through the following lines\n\nThank you for your very careful review of our manuscript, it is very much appreciated. <AC94>We have corrected all the points you have raised<\/AC94> - <AC95>this has significantly improved the quality of the text.<\/AC95> Thank you!\n***\nWe hope we have managed to address your concerns about our work, and would be grateful if you could update your evaluation of our submission accordingly. Please feel free to leave us any additional comments or suggestions.\n***\n[BPG2006] Beskos A, Papaspiliopoulos O, Roberts GO. Retrospective exact simulation of diffusion sample paths with applications. Bernoulli. 2006 Dec;12(6):1077-98.\n\n[BPRF2006] Beskos A, Papaspiliopoulos O, Roberts GO, Fearnhead P. Exact and computationally efficient likelihood‐based estimation for discretely observed diffusion processes (with discussion). Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2006 Jun;68(3):333-82.\n\n[BZ2020] Blanchet J, Zhang F. Exact simulation for multivariate Itô diffusions. Advances in Applied Probability. 2020 Dec;52(4):1003-34.\n\n[CWN2019] Chan-Wai-Nam Q, Mikael J, Warin X. Machine learning for semi linear PDEs. Journal of scientific computing. 2019 Jun;79(3):1667-712.\n\n[DMM2015] Del Moral P, Murray LM. Sequential Monte Carlo with highly informative observations. SIAM/ASA Journal on Uncertainty Quantification. 2015;3(1):969-97.\n\n[FPR2008] Fearnhead P, Papaspiliopoulos O, Roberts GO. Particle filters for partially observed diffusions. Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2008 Sep;70(4):755-77.\n\n[FPRS2010] Fearnhead P, Papaspiliopoulos O, Roberts GO, Stuart A. Random‐weight particle filtering of continuous time processes. Journal of the Royal Statistical Society: Series B (Statistical Methodology). 2010 Sep;72(4):497-512.\n\n[NR2021] Nüsken N, Richter L. Solving high-dimensional Hamilton–Jacobi–Bellman PDEs using neural networks: perspectives from the theory of controlled diffusions and measures on path space. Partial Differential Equations and Applications. 2021 Aug;2(4):1-48.\n\n[PI2020] Park J, Ionides EL. Inference on high-dimensional implicit dynamic models using a guided intermediate resampling filter. Statistics and Computing. 2020 Sep;30(5):1497-522.\n\n[SBBA2008] Snyder C, Bengtsson T, Bickel P, Anderson J. Obstacles to high-dimensional particle filtering. Monthly Weather Review. 2008 Dec;136(12):4629-40.\n\n[SBM2015] Snyder C, Bengtsson T, Morzfeld M. Performance bounds for particle filters using the optimal proposal. Monthly Weather Review. 2015 Nov;143(11):4750-61.\n\n[VL2010] van Leeuwen, P.J. (2010) Nonlinear data assimilation in geosciences: an extremely efficient particle filter. Quarterly Journal of the Royal Meteorological Society, 136, 1991–1999.\n\n Global/general Response:\n```\nWe would like to thank all reviewers for your time and feedback. We appreciate the thoughtful comments and positive response.\n\nWe have provided detailed responses to each reviewer. The following is a summary of (what we think are) the key points from the collated feedback:\n\n1. <AC96>provide more motivation for why online filtering of diffusions is an important problem with a wide range of applications<\/AC96>;\n\n2. <AC97>better position our contribution with respect to related work<\/AC97>;\n\n3. <AC98>provide more intuition in the background section<\/AC98>;\n\n4. <AC99>give more insight on how our neural network approximations evolve during training, how fast training iterations converge, and visualize the trained neural networks<\/AC99>;\n\n5. <AC100>illustrate the applicability of our approach in higher-dimensional settings where it is computationally infeasible to consider classical PDE solvers<\/AC100>;\n\n6. <AC101>clarify whether alternative particle filters are applicable in this problem setting and compare our proposed auxiliary particle filter to not just the bootstrap particle filter but also the current state-of-the-art<\/AC101>;\n\n7. <AC102>add a conclusion recapitulating the main points of our approach and results, and a discussion of future work.<\/AC102>\n\nThis is admittedly a long list and <AC103>we have done a major revision to thoroughly address each point.<\/AC103> Please feel free to leave us any additional comments or suggestions.\n\n```"}, {"message_id": "Reviewer_q4F1 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Response to rebuttal\nI thank the authors for their thorough response. <AC1>The rebuttals have included major improvements such as experiments in higher-dimensional settings, a more interesting baseline method than BPF and suggested content for a discussion section.<\/AC1> <AC2>As my main concerns on the manuscript have been properly addressed and questions extensively answered, I am changing my score to 6.<\/AC2>"}, {"message_id": "Reviewer_q4F1 · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Reply to Reviewer q4F1\nThank you for taking the time to go through our rebuttal and for your kind response."}, {"message_id": "Reviewer_q4F1 · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "I am glad to have had the above discussion with the author, <AC1>which has significantly improved the quality of this work.<\/AC1>"}]}, {"i": 4, "name": "Reviewer_qRy1", "rating": [null, 6], "messages": [{"message_id": "Reviewer_qRy1 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: Disclaimer: I am not expert in SDE theory so my review will focus on the high level and clarity.\n\n<AC1>The authors are interested in the filtering problem in SDEs, i.e. computing the conditional distributions x_t|y<t, with x the latent process and y the observations.<\/AC1>\n<AC2>The focus is on particule filtering, where the filtering distribution is approximated via discrete particules.<\/AC2>\n<AC3>In particule filtering, a guiding function q or proposal is used to propagate the values of the particules in time.<\/AC3>\n<AC4>A convenient guide is the 'Fully Adapted Auxiliary Particle Filter' which samples from the conditional p(x_t+1|y_t+1, x_t).<\/AC4>\n\n<AC5>Doob's theorem happens to give an expression for the SDE corresponding to this conditional p(x_t+1|y_t+1, x_t), which shares the same\ndiffusion as the a priori SDE and whose drift function is equal to the prior drift function plus an offest, or control function.<\/AC5>\n<AC6>Sampling from this SDE for starting point x_t would give the desired sample of p(x_t+1|y_t+1, x_t) for the purpose of particule filtering<\/AC6>\n\n<AC7>The authors propose an algorithm to find learn this control function c, without having to have to first solve a PDE first.<\/AC7>\n<AC8>This function and the prior density is parameterized by neural network.<\/AC8>\n<AC9>An objective is proposed to learn the control function.<\/AC9>\n<AC10>An algorithm is proposed to optimize this objective.<\/AC10>\n\n<AC11>The algorithm is evaluated to check the validity of the learned control in toy settings and in Particle filtering scenarios.<\/AC11>\n\nstrengths_and_weaknesses: <AC12>I find the proposed manuscript is well motivated.<\/AC12>\n<AC13>The background on particule filtering is clear.<\/AC13>\n\n<AC14>My SDE theory is less developed but I don't understand section 2.5,\nnot even at a high level.<\/AC14> As a result <AC15>I m not sure I trust the content of section 3.1 (the loss and algorithm)<\/AC15>\nI m possibly not the best reviewer (hence the low confidence)\nbut <AC16>I also think clarity could be greatly improved<\/AC16> (see b
