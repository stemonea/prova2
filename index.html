being upfront about the limitations of their work and any potential negative societal impact.\n\n1. <AC10>Needs more explanation about how the training set is constructed.<\/AC10>\n\n2. <AC11>In order to compare with some recently published works(e.g. [1]), it is recommended that the author can supplement the results on smaller scale datasets, such as cc3m.<\/AC11>\n\n3. <AC12>The categories obtained by object detection are simply joined by commas.<\/AC12> <AC13>Whether different joint forms have an impact on the results (e.g. splicing with spaces)?<\/AC13>\n\n[1] Robust Cross-Modal Representation Learning with Progressive Self-Distillation. CVPR 2022.\nquestions: See the weaknesses.\nlimitations: Yes"}, {"message_id": "Reviewer_WsHx · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Reply to Reviewer WsHx\n**Q1: About training set.**\n\n<AC1>Our training set is a collection of publicly available datasets, such as CC3M, YFCC15M, and a subset of 99M data in LAION400M.<\/AC1> <AC2>All these datasets are image-text pairs crawled from the Internet<\/AC2>, <AC3>which may contain a lot of noise.<\/AC3> <AC4>As for the 99M data seletected from 400M, we use the image-text similarities provided by LAION400M as metric and select the largest 99M.<\/AC4> More details can be found in section 4.1 of the main text and A.1 in the supplementary material.\n\n**Q2: Results on CC3M.**\n\n<AC5>We conduct experiments on CC3M and compare PyramidCLIP with the CLIP baseline<\/AC5>, and the results are shown in the table below. <AC6>For fair comparison, the following experiments are all trained for 32ep with the same hyperparameters, e.g. batch size, learning rate.<\/AC6>\n\n| Method | Model Structure | ImageNet Top-1 Acc | ImageNet Top-5 Acc |\n| --- | :-: | :-: | :-: |\n| CLIP | RN50 | 18.9 | 36.3 |\n| PyramidCLIP | RN50 | 27.4 (**+8.5**) | 47.4 (**+11.1**) |\n| CLIP | ViT-B/32 | 12.4 | 26.4 |\n| PyramidCLIP | ViT-B/32 | 24.0 (**+11.6**) | 42.5 (**+16.1**) |\n\nSince <AC7>in PSD (Robust Cross-Modal Representation Learning with Progressive Self-Distillation), the baseline and its method both are trained for a longer time, i.e. 100ep, and the hyperparmaters used are also quite different<\/AC7>, <AC8>we think the comparison is unfair.<\/AC8>\n\n**Q3: About different joint forms of categoires.**\n\n<AC9>We have tried different joint forms, such as splicing with spaces<\/AC9>, but <AC10>they have little effect on the results, and the fluctuation is around 0.2<\/AC10>, so <AC11>we adopt the most intuitive and easy-to-understand joint approach, namely \"adj adj adj n, adj adj adj n, ....\".<\/AC11>"}, {"message_id": "Reviewer_WsHx · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thank you for the authors' feedback. <AC1>Most of my concerns have been addressed.<\/AC1> <AC2>I reaffirm my positive endorsement for this paper.<\/AC2>"}]}, {"i": 4, "name": "Reviewer_e9Ef", "rating": [6, 6], "messages": [{"message_id": "Reviewer_e9Ef · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This work introduces to construct an input pyramid with different semantic levels for each modality.<\/AC1> <AC2>It then aligns visual elements and linguistic elements in a hierarchical way.<\/AC2> <AC3>The proposed PyramidCLIP outperforms CLIP with a large margin.<\/AC3>\n\nstrengths_and_weaknesses: Strength:\n- <AC4>The results are very promising.<\/AC4> <AC5>The model outperforms the sota methods across many datasets.<\/AC5>\n- <AC6>The overall framework is easy to follow.<\/AC6>\n\nWeakness:\n- <AC7>The idea of introducing ROI features may increase the computational cost significantly.<\/AC7>\n- <AC8>In peer-level semantics alignment, the authors introduced coarse-grained global contrast learning and fine-grained local contrast learning.<\/AC8> However, <AC9>I didn’t find the more studies to validate that combining two contrast alignments helps model training.<\/AC9>\n- <AC10>The authors described the cross-level relation alignment in Sec 3.3.<\/AC10> <AC11>Three structures are proposed<\/AC11> but <AC12>I suggest the authors providing more analysis to prove their effectiveness.<\/AC12>\nquestions: Please see my comments in the weaknesses part.\nlimitations: Yes."}, {"message_id": "Reviewer_e9Ef · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Reply to Reviewer e9Ef\n**Q1: About the computational cost brought by ROI features.**\n\n1） <AC1>The ROI features are extracted offline in advance<\/AC1>, so <AC2>in the training process of all the models, they are extracted once and for all.<\/AC2>\n\n2） <AC3>Our ROI features are only used in the training phase and do not affect testing and depolyment, i.e., no extra computational burden is introduced in the inference stage<\/AC3>, <AC4>which is parctical.<\/AC4>\n\n3） <AC5>In the training process, ROI features are input to the latter layers of the visual model (specifically, for ViT, the 9th of the 12 blocks, for ResNet, only the last attention pooling)<\/AC5>, <AC6>which requires less computation.<\/AC6> Furthermore, <AC7>Transformer performs Self-Attention on N tokens, with a complexity of O($N^{2}$).<\/AC7> <AC8>For input images of 224 resolution, for ViT-B/16, patch tokens plus cls token, a total of 197 token and for ResNet-50, the final attention pooling is calculated on 50 tokens.<\/AC8> However, <AC9>we only extract 10 ROI features for each image, so there are only 11 tokens for one image<\/AC9>, and <AC10>the amount of computation introduced is much less than that of images.<\/AC10>\n\nWe list the FLOPs of the visual and textual model in the following table. <AC11>Taking ResNet-50 as an example, when the input image is 224x224, the total computational cost of visual model and textual model is 6.26+2.98=9.24GMacs.<\/AC11> <AC12>When the input is ROI features, the computation amount of visual model is very small (0.185G), and the total calculation amount is only 3.165GMacs, which is only 34% of that of 224x224 image input.<\/AC12>\n\n| Input | PyramidCLIP-RN50 | PyramidCLIP-ViT-B/16 |\n| --- | :-: | :-: |\n| 224x224 image | 6.26G(V)｜ 2.98G(L) | 17.61G(V) ｜ 2.98G(L) |\n| ROI features | 0.185G(V) ｜2.98G(L) | 0.229G(V) ｜2.98G(L) |\n\nNote that xG(V) in the above table indicates that the calculation amount in visual modality is XGMacs. L represents linguistical modality.\n\n4）<AC13>In order to show that simply increasing the computation amount can not bring significant performance improvement, we increase the number of training epochs of the CLIP baseline to 2 or 3 times.<\/AC13> <AC14>It can be seen that the results of the CLIP baseline trained for a longer time still cannot exceed PyramidCLIP.<\/AC14>\n\n| Model | Epoch | IN ZS-shot Top-1 |\n| --- | :-: | :-: |\n| CLIP-RN50 | 8 | 18.9 |\n| CLIP-RN50 | 16 | 19.7|\n| CLIP-RN50 | 24 | 20.2 |\n| PyramidCLIP-RN50 | 8 | 24.5 |\n\nNote that <AC15>the above experiments are performed on CC3M, and for fairness, the same hyperparameters are used.<\/AC15>\n\n**Q2: About the ablation of peer-level alignment.**\n\n<AC16>Due to the page limitation of the paper, we put more ablation studies in the supplementary material, including the granular ablation of peer-level alignment.<\/AC16> Please refer to Section F.2 (especially Fig 2 and Table 8) in the supplementary material for more details.\n\n**Q3: About the cross-level relation alignment.**\n\nHere, we re-introduce the cross-level relation alignment briefly.\n\n**Motivation:**\n\n&ensp;&ensp; <AC17>Cross-level relation alignment aims at introducing object-level information, thereby enhancing the modeling of relation between objects, both appearance and position.<\/AC17>\n\n**Method:**\n\n1) First Step (preparation):\n\n<AC18>PyramidCLIP uses a pre-trained object detector to extract salient object features (termed as ROI features) and corresponding categroy information in the image.<\/AC18> <AC19>ROI features are position-sensitive.<\/AC19> <AC20>In each ROI feature of 2052D, 2048D is for appearance and 4D for position information.<\/AC20>\n\n 2) Second Step (encoding):\n\n- Visual Modelling: <AC21>We input the 2052D ROI feature sequence into one or several transformer blocks, using MHSA to aggregate ROI features.<\/AC21> <AC22>After MHSA integration, the cls token contains the relationship between ROI features, both appearance and position.<\/AC22>\n\n   (<AC23>When the image encoder is ViT, the ROI feature sequence can be directly input to the later layers of the visual encoder for modelling, as shown in Fig 3(b).<\/AC23> <AC24>When the visual model is CNN, we replace the traditional global average pooling with attention pooling and input the ROI feature sequence into the attention pooling for modelling, which is shown in Fig 3(a).<\/AC24>)\n\n- Linguistic Modelling: <AC25>The category information together with descriptions of all objects are concatenated and input to text encoder to capture the relationship between objects.<\/AC25>\n\n3) Third Step (contrasting):\n- <AC26>Contrasting visual relation-containing cls token with original caption or text summarization, can promote the text encoder to model the relationship between the nouns and learn the prepositions in the caption.<\/AC26>\n- <AC27>Contrasting textual relation-containing cls token with global view or local view, can make up for the problem that the original caption lacks the description of the salient objects.<\/AC27>\n\nThe effectiveness of cross-level relation alignment please kindly refer to the Table 5 in the main text.\n\nAs for Fig 3(c)，<AC28>this is Locally-enhanced Feed-Forward(LeFF) we used for ViT, which aims to improve the patch-level local perception and interaction.<\/AC28> The effectiveness of LeFF please kindly refer to the last two rows of Table 5 in the main text."}, {"message_id": "Reviewer_e9Ef · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "I appreciate the authors' efforts in addressing my concerns. <AC1>The authors have answered almost all of my concerns.<\/AC1> <AC2>I reaffirm my positive endorsement for this paper.<\/AC2>"}]}, {"i": 5, "name": "Reviewer_jqKi", "rating": [null, 5], "messages": [{"message_id": "Reviewer_jqKi · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes to improve CLIP by adding contrastive losses at different levels.<\/AC1> <AC2>Specifically, for each image in the original data, they construct image views at global, local, and region levels<\/AC2>, and also <AC3>create their corresponding text captions.<\/AC3> Therefore, <AC4>for each image-caption pair in the original dataset, they can create two additional image-caption pairs<\/AC4> and <AC5>the model is trained with additional contrastive losses given the newly constructed data.<\/AC5> <AC6>They also soften the original contrastive loss with a label-smoothing-like technique.<\/AC6> <AC7>Experiments demonstrate improvements over several baselines on zero-shot retrieval, linear probing on image classification, object detection, and semantic segmentation tasks.<\/AC7>\nstrengths_and_weaknesses: Strengths:\n1. <AC8>The empirical results are strong<\/AC8> as <AC9>they can outperform several popular baselines.<\/AC9>\n2. <AC10>The paper is well-structured.<\/AC10>\n3. <AC11>I like the idea of softening the contrastive loss objective<\/AC11>, <AC12>which makes sense<\/AC12> and <AC13>the paper shows it works well.<\/AC13>\n\nWeaknesses:\n1. <AC14>The comparisons between their model and baselines may not be fair.<\/AC14> <AC15>The paper uses multiple pre-trained models for their model (e.g. text summarization and object detection models)<\/AC15> <AC16>which can introduce more supervision.<\/AC16> Also, because <AC17>their method will create more image-caption pairs for their model<\/AC17>, <AC18>they would have more pretraining data than the baselines.<\/AC18>\n2. <AC19>Some designs are questionable.<\/AC19> For example, <AC20>the text captions in image-caption datasets are typically short<\/AC20>, whereas <AC21>they use a pre-trained text summarization model, which is designed for summarizing long documents, to further shorten the captions<\/AC21>, <AC22>which does not make sense to me.<\/AC22>\n3. <AC23>While it is true that the pre-training datasets can be noisy, the problem may be alleviated if sufficiently large data are used.<\/AC23> <AC24>It would be good to see if they can keep the performance gain as more data are included.<\/AC24> For example, <AC25>they can plot performance-data size curves for both their model and baselines and see the performance gap when the data size varies.<\/AC25>\nquestions: <AC26>Would it make more sense to use a keyword extraction model than a summarization model?<\/AC26>\nlimitations: <AC27>I am not sure if their method can be scalable<\/AC27> as <AC28>when more data is included, many of the problems mentioned in the paper may be alleviated.<\/AC28>"}, {"message_id": "Reviewer_jqKi · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Reply to Reviewer jqKi\n**Q1: About the amount of pre-training data.**\n\n<AC1>We want to emphasize that instead of creating more image-caption pairs, we are mining more information based on existing image-text paris and improving the information utilization of image-caption paris.<\/AC1> <AC2>Text augmentation and extracting more fine-grained object information with a pre-trained object detector are two very common approaches used in image-text pre-training.<\/AC2> For example, <AC3>in FILIP, the text modal uses back-translation operation (please kindly refer to section 3.2 in FILIP[8], https://arxiv.org/pdf/2111.07783v1.pdf).<\/AC3> <AC4>OSCAL/VinVL/MVPTR all use a pre-trained object detector to extract the features of object, thereby introducing fine-grained information.<\/AC4>\n\n<AC5>At present, it is far from enough to use the original data for image-text pre-training.<\/AC5> <AC6>Basically, all mainstream methods will resort to data augmentation, either in visual modality or linguistic modality, so as to improve data utilization<\/AC6>, <AC7>which is reasonable.<\/AC7>\n\n**Q2: About text summarization.**\n\n<AC8>We have counted the average caption length for each dataset we used and the corresponding average summarization length<\/AC8>, which is listed in the table below.\n\n1) <AC9>It can be seen that the averge text length of some datasets is quite long (which may contain redundance)<\/AC9>, but <AC10>the text summarization length is significantly shorter.<\/AC10> For example, <AC11>for YFCC15M dataset, the average length of the original text is 33.8, and the average length of text summarization is 8.5, which is shorted by 75%.<\/AC11>\n\n2) <AC12>When the original text itself is relatively short, the extracted text summarization still summarize the original caption<\/AC12>, but <AC13>the magnitude is relatively small.<\/AC13>\n\nIn conclusion, <AC14>text summarization works for captions of any length.<\/AC14>\n\n| Datasets | Caption Length (avg) | Summarization Length (avg) |\n| --- | :-: | :-: |\n| CC3M | 10.3 | 10.1 |\n| CC12M | 17.7 | 10.8 |\n| YFCC15M | 33.8 | 8.5 |\n| YFCC15V2 | 16.7 | 8.8 |\n| LAION99M | 9.7 | 8.4|\n\n**Q3.1: About \" <AC15>the noisy problem may be alleviated if sufficiently large data are used<\/AC15>\".**\n\n1） <AC16>Increasing the amount of data may lead to the improvement of performance<\/AC16>, but <AC17>it will also increase the training time and bring more computation.<\/AC17>\n\n2） <AC18>With the increase of the data set, the marginal return diminishes<\/AC18>, and <AC19>a large amount of data is required to bring about a siginificant improvement.<\/AC19> <AC20>As shown in the Figure 1(left) of DeCLIP[10] (https://arxiv.org/pdf/2110.05208.pdf), with the pre-training data of CLIP increasing from 15M to 88M, the ImageNet Top-1 accuracy increases by 21%<\/AC20>, but <AC21>with increasing from 88M to 400M, the accuracy only increases by 2.7%.<\/AC21> <AC22>Similar trend can be found in Figure 2 of CLIP[6].<\/AC22> <AC23>The computational cost of training 400M data is 4.5 times that of 88M<\/AC23>, and <AC24>the cost-performance ratio is relatively low.<\/AC24>\n\n**Q3.2: About \"performance-data size curve.\"**\n\n<AC25>In the table below, we record the performance of the baseline and PyramidCLIP with the increase in the amount of data.<\/AC25> <AC26>It can be seen that in the case of a small amount of data, the improvement brought by PyramidCLIP is significant<\/AC26>, but <AC27>when using 83% of the data volume of YFCC15-V1(i.e. 12.5M), PyramidCLIP can still bring a gain of 8.6%<\/AC27>, <AC28>which is considerable.<\/AC28>\n\n| Data Volume | CLIP (baseline) | PyramidCLIP |\n| --- | :-: | :-: |\n| 2.5M | 6.9 | 24.8(+17.9) |\n| 5M | 21.7 | 31.8(+10.1) |\n| 7.5M | 25.1 | 35.4(+10.3) |\n| 10M | 28.2 | 37.3(+9.1) |\n| 12.5M | 30.6 | 39.2(+8.6) |\n\n<AC29>The results in the table above are zero-shot ImageNet top-1 accuracy, pre-trained with YFCC15M-V1 subsets of different sizes.<\/AC29> Note, <AC30>the subsets are sampled randomly.<\/AC30>\n\nFurthermore, <AC31>as shown in the Table 3 of the main text, when we increase the pre-training data volume to 143M, PyramidCLIP can still bring significant improvement compared to the CLIP baseline trained on 143M.<\/AC31> <AC32>Specifically, when the visual encoder is ResNet-50, PyramidCLIP improves zero-shot ImageNet classification by 6.1%<\/AC32>, and <AC33>on the Flickr30K retrieval task, the R@1 of I2T/T2I improves by 5.7%/8% respectively.<\/AC33>\n\nFinally, <AC34>we would like to emphasize that PyramidCLIP solves the common problem existing in vision-language pre-training, that is, the semantic mismatch of image-text and the mutual compatibility between pairs<\/AC34>, <AC35>making PyramidCLIP effective regardless of the size of the pre-training dataset.<\/AC35>\n**Q4: About replacing text summarization with keywords.**\n\n<AC36>We try to use keywords to replace text summarization<\/AC36>, but <AC37>the performance is not as good as text summarization.<\/AC37> We analyze it from both qualitative perspective and quantitative perspective.\n\n- Qualitative perspective. <AC38>Most of the extracted keywords are nouns, and there are relatively few adjectives and prepositions<\/AC38>， <AC39>which will lack some visual patterns and position information between objects.<\/AC39> For example, <AC40>the keyswords for \"Soccer player competes for the ball during day of the training camp.\" is \"Soccer, training camp\", while the summarization is \"Soccer player competes for the ball.\"<\/AC40>, <AC41>the semantic information of summarization is better.<\/AC41>\n\n- Quantitative perspective. <AC42>We replace the text summarization by keywords and conduct experiments on CC3M.<\/AC42> The results are shown in the table below. <AC43>It can be seen that the results of keywords are not as good as text summarization.<\/AC43>\n\n| Method | IN ZS Top-1 Acc |\n| --- | :-: |\n| PyramidCLIP(Summarization) | 24.8 |\n| PyramidCLIP(Keywords) | 24.2(-0.6) |\n\nNote that <AC44>we use hugging face's open sourced keyword extraction model (https://huggingface.co/yanekyuk/bert-keyword-extractor) to extract keywords, which is finetuned from bert.<\/AC44>"}, {"message_id": "Reviewer_jqKi · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Reply\nThank you for the response!\n\n**Q2&Q4**\n\n<AC1>I'm still not convinced that applying pre-trained text summarization models to image captions is a valid approach.<\/AC1> <AC2>Text summarization datasets typically have quite long inputs (e.g. the average number of tokens of data instances for popular summarization datasets are<\/AC2>\n\n| | Reddit| XSum| CNN/DM | WikiHow | NYT | PubMed |\n| ----- | ----- | -----| ----- | -----| ----- | -----|\n| Input |482| 430 | 766 | 580 | 1183 | 444|\n| Output | 28 | 23 | 58 | 62 | 119 | 210 |\n\n<AC3>As you have shown in this table, the image captions are quite short (even shorter than an output summary of a typical instance)<\/AC3> and <AC4>I cannot imagine how sentences such as 'a street sign sits on top of a stop sign.' (which I randomly sample from COCO) can be summarized.<\/AC4> Therefore, <AC5>I do not believe applying summarization models to image captions is technically sound.<\/AC5> <AC6>Not including this augmentation method or using keyword extractors (e.g. TextRank) and sentence simplification models would be more plausible to me.<\/AC6>\n\n**Q1&Q3**\n\nThank you for the additional experiments! <AC7>I'm not sure if training the models with more data would be more costly than using an object detector and text summarizer to first create instances and then training the model with the augmented data.<\/AC7> Also, <AC8>the performance gap between CLIP and PyramidCLIP indeed seems to narrow as more data are included.<\/AC8> However, <AC9>I think this is a general problem for data augmentation methods<\/AC9> and <AC10>I do not have many concerns in this aspect.<\/AC10>"}, {"message_id": "Reviewer_jqKi · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Reply to Reviewer jqKi\nThanks for your prompt reply.\n\n<AC1>We would like to stress once more about the soundness of text summarization.<\/AC1>\n\n<AC2>COCO dataset is a manually annotated dataset with relatively concise captions and has less noise in captions<\/AC2>, while <AC3>the datasets used in large-scale image-text pre-training are usually crawled from the Internet<\/AC3>, and <AC4>the quality of captions is far inferior to that of manually annotated ones.<\/AC4>\n\nWe randomly sample one caption and the corresponding text summarization from the several public datasets we used, and list them in the table below.\n\n| Dataset | Original Caption | Text Summarization |\n| --- | --- | --- |\n| CC3M | look an interesting photo , animal is sitting on child | animal is sitting on child.|\n| CC12M | A lot of <PERSON> plastic Lego blocks. A lot of <PERSON> plastic Lego blocks stock photography | plastic Lego blocks stock photography.|\n| YFCC15M | Alaska cruise day 1, boarding/setting sail: All aboard. 1 Sep 2008: Coral Princess setting sail from Vancouver, Canada. | coral princess set sail from Vancouver, canada. |\n| YFCC15MV2 | Hungry Boy Dendrocopos major - Great Spotted Woodpecker - I heard the unmistakalbe peck-peck-peck coming from the top of a pine tree and saw a young woodpecker sitting on a branch Moments later its tired parent landed on the same branch to feed him and then the two of them flew away Not the best picture technically but I liked the moment | a young woodpecker and its tired parent landed on the same branch to feed him |\n| LAION99M | Small kid's meal - spaghetti with cherry tomatoes and basil. Colorful italian dinner on white wooden table. Plate captured from above (top view, flat lay). Layout with free copy (text) space. | colorful italian dinner on white wooden table. |\n\n<AC5>It can be seen that the captions of these datasets are relatively noisy and contain more redundant information<\/AC5>, but <AC6>after the summarizaion model, captions with relatively compact and concise semantics can be obtained.<\/AC6>\n\nFinally, <AC7>it is worth mentioning that when we extract the text summarization, if the output length of the summarization model is less than the original caption, we will directly use the original caption<\/AC7>, so <AC8>the length of text summarization must be less than or equal to the caption.<\/AC8>"}, {"message_id": "Reviewer_jqKi · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "Title: Reply\nThank you for the response!\n\n<AC1>The qualitative examples do address my concerns partially.<\/AC1> <AC2>I am still a bit uncomfortable with using summarization models that are pre-trained for summarizing long documents (>400 words) in the news domain in summarizing short captions (10~30 words) in another domain<\/AC2>, <AC3>especially considering that the summarizers can have the hallucination problem.<\/AC3> <AC4>It would be good to include these qualitative examples and discussions in the revised version.<\/AC4>\n\nAlso, <AC5>I assume that you mean \"if the output length of the summarization model is **greater** than the original caption, we will directly use the original caption\"?<\/AC5> <AC6>If the summary length can indeed be greater than the caption length, it confirms my hypothesis that using pre-trained summarizers is not suitable in this setting.<\/AC6>\n\n<AC7>Given the additional examples and considering that this is one of the minor contributions of the paper, I would increase my score by 1<\/AC7>, but <AC8>I do hope the paper can be more explicit about the potential issue of applying summarization models in this setting.<\/AC8>"}]}]}, {"paper_id": "Nx4gNemvNvx", "decision": "Accept", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>This paper proposes a novel Byzantine-robust method for performing Gaussian process regression in a Federated learning setup.<\/AC1> <AC2>The contributions include the proposed method (novel), an accompanying theoretical analysis, and experiments.<\/AC2>\n\n<AC3>The reviewers were generally favorable about this paper, finding that the approach is novel, and appreciating the theoretical guarantees.<\/AC3> <AC4>Several criticisms were raised in the initial reviews<\/AC4> and <AC5>these were resolved in the post-rebuttal discussion.<\/AC5> <AC6>While the paper may have some limitations, there was consensus that the paper should be accepted.<\/AC6> <AC7>When preparing a camera ready version, please take care to improve the presentation and address common concerns that came up in the reviews, such as more clearly describing the relationship to previous work, and establishing the relationship between the attack model considered in this paper and that of previous work.<\/AC7>\nconfidence: Less certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_3mHJ", "rating": [5, 5], "messages": [{"message_id": "Reviewer_3mHJ · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper studies consider Byzantine-tolerant federated learning for streaming data using Gaussian process regression (GPR).<\/AC1> <AC2>A cloud and a group of agents aim to collaboratively learn a latent function where some agents are subject to Byzantine attacks.<\/AC2> <AC3>The paper develops a Byzantine-tolerant federated GPR algorithm, which includes three modules: agent-based local GPR, cloud-based aggregated GPR and agent-based fused GPR.<\/AC3>\n\nstrengths_and_weaknesses: Strengths:\n\n1. <AC4>Develops a Byzantine-tolerant federated GPR algorithm.<\/AC4> <AC5>The algorithm includes three modules: agent-based local GPR, cloud-based aggregated GPR, and agent-based fused GPR.<\/AC5>\n2. <AC6>The predictive mean of the cloud-based aggregated GPR is theoretically guaranteed to be restricted within a neighborhood of the target function provided that Byzantine agents are less than one-quarter of all the agents.<\/AC6>\n<AC7>Experiments on a synthetic dataset and two real-world datasets are conducted to evaluate the proposed algorithm.<\/AC7>\n\nWeakness:\n1. Technical contribution: <AC8>the paper is a combination of existing methods on Byzantine attacks, federated GPR, and online learning<\/AC8>, <AC9>the technical challenges of such a combination, however, have not been identified<\/AC9>, so <AC10>the technical contribution of this work is not clear.<\/AC10>\n2. Related work: <AC11>the paper does not include discussions with related work<\/AC11>, <AC12>there has been a sequence of works on Byzantine resilient secure federated learning, federated learning, online learning, and data streams.<\/AC12> However, <AC13>the difference between this work and theirs are not clearly stated.<\/AC13>\n3. Experiments: <AC14>this paper targets data streams<\/AC14>, but <AC15>in experiments, there is no study in terms of data streams; for example, to simulate streaming data with concept drift.<\/AC15> <AC16>The measures should also include efficiency, as well as computation and memory costs.<\/AC16>\nquestions: 1. <AC17>What are the technical challenges and contributions?<\/AC17>\n2. <AC18>Is there a section of related work?<\/AC18>\n3. <AC19>How to address the streaming data challenge, e.g., concept drifting?<\/AC19>\n4. <AC20>How to simulate and test a data stream in experiments?<\/AC20>\nlimitations: See the above questions."}, {"message_id": "Reviewer_3mHJ · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer 3mHJ\nThank you so much for your detailed and encouraging reviewing. The comments you give are valuable, and they can improve the quality of our paper. We address your comments as follows.\n\nWeaknesses:\n\nW1: Technical contribution: <AC1>the paper is a combination of existing methods on Byzantine attacks, federated GPR, and online learning<\/AC1>, <AC2>the technical challenges of such a combination, however, have not been identified<\/AC2>, so <AC3>the technical contribution of this work is not clear.<\/AC3>\n\n$Answer:$ Thank you so much for the comment on technical contribution. <AC4>Although our work is in the intersection of Byzantine attack, GPR and federated learning, there are new and unique challenges to be addressed.<\/AC4>\n\nFirst of all, <AC5>most existing literature on Byzantine attacks mostly focus on deep neural networks as the machine learning model.<\/AC5> Please refer to references [C1], [C2] and [C3]. <AC6>The technical challenges typically rely on the convergence of SGD under Byzantine attacks.<\/AC6> <AC7>In our paper, we focus on Byzantine attacks on the predictions of GPR as the machine learning model.<\/AC7> <AC8>The technique challenge lies on the convergence of GPR under Byzantine attacks.<\/AC8>\n\nSecond, <AC9>to the best of our knowledge, this is the first paper to analyze the Byzantine tolerance of federated GPR models.<\/AC9> <AC10>We theoretically guarantee that the global predictive mean in the cloud converges to a neighborhood of the ground truth regardless of Byzantine attacks.<\/AC10>\n\nW2: Related work: <AC11>the paper does not include discussions with related work<\/AC11>, <AC12>there has been a sequence of works on Byzantine resilient secure federated learning, federated learning, online learning, and data streams.<\/AC12> However, <AC13>the difference between this work and theirs are not clearly stated.<\/AC13>\n\n$Answer:$ Thank you so much for the comment on related work. <AC14>In fact, our introduction includes the related work, which is explicitly described in the second paragraph.<\/AC14> <AC15>In our revised paper, we highlight and group this section under \"related work\" to improve the clarity.<\/AC15>\n\nW3: Experiments: <AC16>this paper targets data streams<\/AC16>, but <AC17>in experiments, there is no study in terms of data streams; for example, to simulate streaming data with concept drift.<\/AC17> <AC18>The measures should also include efficiency, as well as computation and memory costs.<\/AC18>\n\n$Answer:$ Thank you for the valuable comment on our experiments. <AC19>Although the data pool is static, we simulate data stream by feeding the agents with data sequentially.<\/AC19> <AC20>Specifically, at the initial time, $\\mathcal{D}^{[i]}(0)=\\emptyset$.<\/AC20> <AC21>As time arises, each agent $i\\in\\mathcal{V}$ collects data online and updates its local dataset by $\\mathcal{D}^{[i]}(t)=\\mathcal{D}^{[i]}(t-1)\\bigcup(\\mathcal{Z}^{[i]}(t),\\boldsymbol{y}^{[i]}(t))$.<\/AC21> <AC22>For each test input $z_*\\in\\mathcal{Z}_{\\star}$, we sequentially execute the agent-based local GPR, the cloud-based aggregated GPR and the agent-based fused GPR.<\/AC22>\n\n<AC23>This is a standard way to evaluate online learning algorithms with streaming data.<\/AC23> Please refer to [C4],[C5] and references therein. <AC24>Concept drift in supervised learning indicates that the underlying distribution of the data is changing, and consequently the predictions might become less accurate as the time passes [C6], [C7].<\/AC24> However, <AC25>our paper focuses on Byzantine tolerance only.<\/AC25> Therefore <AC26>in the experiments, we only study the performance of our algorithm under Byzantine attacks.<\/AC26> <AC27>Studying how our algorithm performs under concept drift is an interesting future work.<\/AC27>\n\nQuestions:\n\nQ1: <AC28>What are the technical challenges and contributions?<\/AC28>\n\n$Answer:$ Thank you for your question. First, <AC29>we develop a novel trimming rule by removing a fraction of extreme values on local predictive means and variances such that product-of-experts (PoE) computation is secured.<\/AC29> <AC30>Please refer to Lemma 2, which guarantees the robustness of the trimming rule.<\/AC30>\n\nSecond, <AC31>in the attack-free scenario, the convergence of prediction error for the cloud-based aggregated GPR is guaranteed in Corollary 1.<\/AC31> <AC32>This is a new theoretical result.<\/AC32> Further, <AC33>when we consider Byzantine agents in the network, problem becomes harder.<\/AC33> This is because <AC34>the Byzantine agents can make the learning performance of existing PoE arbitrarily bad.<\/AC34> <AC35>Even so, Theorem 1 in our paper guarantees the robustness of the Byzantine-tolerant PoE.<\/AC35>\n\nQ2: <AC36>Is there a section of related work?<\/AC36>\n\n$Answer:$ Thank you for your question. <AC37>In our revised version, we add the key words ``Related work'' before this paragraph to make it clearer.<\/AC37>\n\nQ3: <AC38>How to address the streaming data challenge, e.g., concept drifting?<\/AC38>\n\n$Answer:$ Many thanks for the question. <AC39>There are many challanges in streaming data, including Byzantine attacks, concept drift and variety of formats.<\/AC39>\n\n<AC40>This paper considers Byzantine attacks only.<\/AC40> <AC41>In fact, to deal with concept drift, one idea is to combine with existing work [C8].<\/AC41> <AC42>Specifically, we can develop a method to detect the changes of the probability distribution of samples, and control the error rate of the data.<\/AC42>\n\nQ4: <AC43>How to simulate and test a data stream in experiments?<\/AC43>\n\n$Answer:$ Please refer to our answers to W3. Thank you so much.\n\nReferences\n\n[C1] D. Yin, Y. Chen, R. Kannan, and P. Bartlett, “Byzantine-robust distributed learning: Towards\noptimal statistical rates,” in International Conference on Machine Learning, pp. 5650–5659,\nPMLR, 2018.\n\n[C2] P. Blanchard, E. M. El Mhamdi, R. Guerraoui, and J. Stainer, “Machine learning with adversaries:\nByzantine tolerant gradient descent,” in Advances in Neural Information Processing Systems\n(I. Guyon, U. V. Luxburg, S. Bengio, H. Wallach, R. Fergus, S. Vishwanathan, and R. Garnett,\neds.), vol. 30, Curran Associates, Inc., 2017.\n\n[C3] Y. Chen, L. Su, and J. Xu, “Distributed statistical machine learning in adversarial settings:\nByzantine gradient descent,” Proceedings of the ACMonMeasurement and Analysis of Computing\nSystems, vol. 1, no. 2, pp. 1–25, 2017.\n\n[C4] E. Beyazit, J. Alagurajah, and X. Wu, “Online learning from data streams with varying feature spaces,” in AAAI Conference on Artificial Intelligence, 2019.\n\n[C5] B. J. Hou, L. Zhang, and Z. H. Zhou, “Learning with\nfeature evolvable streams,” in Advances in Neural Information Processing Systems, 2017.\n\n[C6] S. Wang, L. L. Minku, D. Ghezzi, D. Caltabiano, P. Tino, and X. Yao,\n“Concept drift detection for online class imbalance learning,” in Neural\nNetworks (IJCNN), The 2013 International Joint Conference on. IEEE,\n2013, pp. 1–10.\n\n[C7] R. Klinkenberg and T. Joachims, “Detecting concept drift with support vector machines,” in Proceedings of the Seventeenth International Conference on Machine Learning. Morgan Kaufmann Publishers Inc.,\n2000, pp. 487–494.\n\n[C8] J. Gama, P. Medas, G. Castillo, and P. Rodrigues, “Learning with drift detection,” in Advances in Artificial Intelligence–SBIA. Springer, pp. 286–295, 2004."}, {"message_id": "Reviewer_3mHJ · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thanks for the authors' clarification. <AC1>They've addressed nearly all of my concerns<\/AC1>, and <AC2>I will likely adjust the score higher.<\/AC2>"}]}, {"i": 2, "name": "Reviewer_dgxv", "rating": [null, 6], "messages": [{"message_id": "Reviewer_dgxv · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The authors consider applying Byzantine-tolerant federated learning for online GPR<\/AC1> and <AC2>proposed a new algorithm with various modules for IoT applications.<\/AC2> <AC3>Theoretical supports on the proposed algorithms are also provided.<\/AC3>\n\nstrengths_and_weaknesses: Strengthes:\n1. <AC4>A novel Byzantine-tolerant federated GPR algorithm for online streaming data.<\/AC4>\n2. <AC5>Theoretical performance analyses on the posterior mean and variance subject to attacks.<\/AC5>\n\nWeaknesses:\n1. <AC6>The main ideas and techniques rely on reference [24] to certain extent.<\/AC6>\n2. <AC7>Attack is perhaps too simple.<\/AC7>\n3. <AC8>Comparison with other methods is insufficient<\/AC8>, for instance,\n(a) Gaussian process with differential privacy, https://arxiv.org/abs/2106.00474\n(b) Reference [23]\n4. <AC9>The following reference also discussed about the malicious protection and privacy issue of distributed GP for IoT applications, which may be mentioned in the manuscript<\/AC9>:\nhttps://ieeexplore.ieee.org/abstract/document/9250516\nquestions: 1. <AC10>Do assumptions 2 and 3 hold even for the SE kernel?<\/AC10> <AC11>This is not justified in the paper.<\/AC11>\n2. <AC12>Are the bounds tight in Theorem 1 and 2?<\/AC12>\nlimitations: 1. <AC13>Insufficient algorithm comparison.<\/AC13>\n2. <AC14>Insufficient experimental evaluations.<\/AC14>"}, {"message_id": "Reviewer_dgxv · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer dgxv\nThank you so much for reviewing our paper, and the comments you give are valuable, which can improve the quality of our paper.\n\nWeaknesses:\n\nW1: <AC1>The main ideas and techniques rely on reference [24] to certain extent.<\/AC1>\n\n$Answer:$ Thanks so much for the comment on the main ideas and techniques of our paper. <AC2>We agree that both paper [24] and our paper study Byzantine resilience of federated learning.<\/AC2> However, <AC3>they are different in terms of problem formulation, machine learning model, algorithm and theoretical guarantees.<\/AC3> <AC4>Specifically, paper [24] considers batch learning and adopts deep neural networks as the machine learning model<\/AC4>, while <AC5>our paper focuses on online learning and uses Gaussian process regression (GPR) as the learning model.<\/AC5> <AC6>In terms of algorithm of Byzantine tolerance, paper [24] designs a Byzantine robust aggregation algorithm for stochastic gradient descent to solve an optimization problem<\/AC6>, while <AC7>our paper designs a Byzantine-tolerant product-of-experts (PoE) algorithm to aggregate posterior distributions from local agents.<\/AC7> Furthermore, <AC8>in paper [24], Byzantine agents only send one variable, the malicious gradients, to the cloud<\/AC8>, while <AC9>in our paper, Byzantine agents could send two variables, malicious predictive means and variances.<\/AC9> Since <AC10>the global predictive mean depends on these two coupling variables using aggregation rules, e.g., generalized product of experts (gPoE) and Bayesian committee machine (BCM)<\/AC10>, <AC11>it is non-trivial to determine which agent's local predictions can be used to aggregate in the cloud to ensure the convergence of the cloud-based aggregated GPR.<\/AC11> <AC12>Even so, we give the novel theoretical guarantees, i.e., the convergence of the global predictive mean and the boundedness of global variance in the attack scenario.<\/AC12> <AC13>To the best of our knowledge, this is the first paper that studies Byzantine tolerance in the context of GPR.<\/AC13>\n\nW2: <AC14>Attack is perhaps too simple.<\/AC14>\n\n$Answer:$ Thank you so much for your comment on our attack model. <AC15>By reviewing the existing state-of-the-art papers with respect to Byzantine resilience, our attacks are modeled in a standard way.<\/AC15> Please refer to papers [A1]-[A5] I list below, which are written by researchers in security community.\n\n<AC16>Basically, Byzantine attack model allows the attacker to corrupt messages in an arbitrary way<\/AC16>, and <AC17>it does not impose any restriction on attack actions.<\/AC17> <AC18>It includes other complicated attack models as special cases; e.g., attack actions are obtained via solving optimization problems or games or attack actions force aggregate gradient to be null (Please see [24]).<\/AC18> Moreover, <AC19>Byzantine attack model treats attacks as black boxes<\/AC19>, while <AC20>complicated attack models treat attacks as white boxes.<\/AC20> <AC21>It is like any bounded uncertainty and a sinusoidal uncertainty generated by an exosystem.<\/AC21> Therefore, <AC22>our attack model is strong.<\/AC22>\n\nW3: <AC23>Comparison with other methods is insufficient<\/AC23>, for instance, (a) Gaussian process with differential privacy, https://arxiv.org/abs/2106.00474 (b) Reference [23].\n\n$Answer:$ Thank you so much for your comment on comparisons between different methods. <AC24>Our paper studies Byzantine tolerance of federated learning<\/AC24>, and <AC25>it is a security problem.<\/AC25> <AC26>Paper (https://arxiv.org/abs/2106.00474) studies privacy protection to Gaussian processes via differential privacy<\/AC26>, and <AC27>it is a privacy problem.<\/AC27> Note that <AC28>information security dedicates to protecting against unauthorized access, and its goals are confidentiality, integrity, and availability (CIA triad).<\/AC28> <AC29>Privacy defines the ability to secure personally identifiable data.<\/AC29> <AC30>Since adversaries can infer private information of data owners from collected raw data, in general privacy involves cryptography to make the data confidential.<\/AC30> Since <AC31>the two papers focus on different problems<\/AC31>, <AC32>comparison between them could be unfair.<\/AC32>\n\nOn the other side, <AC33>reference [23] provides several aggregation rules using local predictions.<\/AC33> However, <AC34>our current theoretical results only support the proposed aggregation rule.<\/AC34> In particular, <AC35>for different aggregation rules, e.g., gPoE and BCM, theoretical results could be completely different<\/AC35> and <AC36>they are not included to avoid confusion.<\/AC36> <AC37>Our current theoretical and experimental results have demonstrated that the proposed algorithm in our paper is robust to Byzantine attacks.<\/AC37> <AC38>Generalizing the theoretical results and comparing the performances of different aggregation rules are definitely part of our future work.<\/AC38>\n\nW4: <AC39>The following reference also discussed about the malicious protection and privacy issue of distributed GP for IoT applications, which may be mentioned in the manuscript<\/AC39>: https://ieeexplore.ieee.org/abstract/document/9250516.\n\n$Answer:$ Thank you for the reference and <AC40>we have added this paper into our reference list.<\/AC40> <AC41>It is mentioned in the first paragraph of our introduction.<\/AC41>\n\nQuestions:\n\nQ1: <AC42>Do assumptions 2 and 3 hold even for the SE kernel?<\/AC42> <AC43>This is not justified in the paper.<\/AC43>\n\n$Answer:$ Thank you so much for the careful reading. <AC44>In our revised version, we add the justification after Assumption 2.<\/AC44>\n\nFirst of all, the squared-exponential kernel is given as $k(z,z_*)=\\sigma_f^2\\exp({-\\frac{1}{2\\ell^2}}||z-z_*||^2)$. <AC45>Based on the distance definition $D(z,z_*)=||z-z_*||$, we have that $k(z,z_*)=\\kappa(D(z,z_*))$ where $\\kappa(D(z,z_*))=\\sigma_f^2\\exp({-\\frac{1}{2\\ell^2}}D(z,z_*)^2)$.<\/AC45> Hence <AC46>the decomposition property in Assumption 2 is satisfied.<\/AC46>\n\nSecond, <AC47>it can be seen that $\\kappa(D(z,z_*))$ is a monotonically decreasing function with regard to $D(\\cdot,\\cdot)$.<\/AC47> <AC48>When $D(z,z_*)=0$, we have $\\kappa(0)=\\sigma_f^2$.<\/AC48>\n\nThird, <AC49>please refer to equation (6.5) on page 131 of reference [A8], the function can be written as $f(x)=\\sum_{i=1}^{n}\\alpha_ik(z_*,z_i)$ with $z_i\\in\\mathcal{Z}$ and $\\alpha_i\\in\\mathbb{R}$.<\/AC49> Since <AC50>$k(z_i,z_*) = \\sigma_f^2\\exp({-\\frac{1}{2\\ell^2}}||z_i-z_*||^2)$ is Lipschitz continuous [A8],[A9]<\/AC50>, then <AC51>we can conclude that Assumption 3 holds even for the SE kernel.<\/AC51>\n\nQ2: <AC52>Are the bounds tight in Theorem 1 and 2?<\/AC52>\n\n$Answer:$ Thank you so much for the question on the tightness of the bounds. <AC53>At this moment, we do not have any claim on the tightness of the bounds in Theorem 1 and 2.<\/AC53> <AC54>There have been a very limited number of numerical algorithms whose upper bounds on convergence are proven to be tight under restrictive conditions.<\/AC54> For example, <AC55>paper [A6] derives a tight upper bound of the gradient descent method with exact line search for unconstrained optimization when the objective function is $L$-smooth and $\\mu$-strongly convex.<\/AC55> <AC56>Paper [A7] derives an almost tight upper bound, by comparing the upper bound with the lower bound, for nonparametric regression using stochastic gradient descent when there is no observation noise, the estimation error diminishes almost surely, and the feature variables are uniformly\nbounded.<\/AC56> <AC57>To the best of our knowledge, we have not found any paper showing the upper bound on prediction error under Byzantine attacks is tight through mathematical proofs or simulations.<\/AC57> Please refer to [A1]-[A5] and the references therein. <AC58>In fact, the upper bound provides insights on the potential factors that affect prediction errors, e.g., the number of Byzantine agents.<\/AC58> <AC59>This helps us to analyze the effects on the prediction error convergence Byzantine agents cause.<\/AC59> We still thank for the comment, and <AC60>we will consider tighter upper bounds in future works.<\/AC60>\n\nReferences\n\n[A1] P. Blanchard, E. M. El Mhamdi, R. Guerraoui, and J. Stainer, “Machine learning with adversaries:\nByzantine tolerant gradient descent,” in Proceedings of International Conference on Neural\nInformation Processing Systems, pp. 118–128, 2017.\n\n[A2] J. So, B. Güler, and A. S. Avestimehr, “Byzantine-resilient secure federated learning,” IEEE\nJournal on Selected Areas in Communications, vol. 39, no. 7, pp. 2168–2181, 2020.\n\n[A3] D. Yin, Y. Chen, R. Kannan, and P. Bartlett, “Byzantine-robust distributed learning: Towards\noptimal statistical rates,” in Proceedings of the International Conference on Machine Learning,\npp. 5650–5659, 2018.\n\n[A4] D. Data and S. Diggavi, “Byzantine-resilient high-dimensional SGD with local iterations on\nheterogeneous data,” in Proceedings of the International Conference on Machine Learning,\npp. 2478–2488, 2021.\n\n[A5] Y. Chen, L. Su and J. Xu, ``Distributed statistical machine learning in adversarial settings: Byzantine gradient descent,'' Proceedings of the ACM on Measurement and Analysis of Computing Systems, vol. 1, no. 2, pp. 1–25, 2017.\n\n[A6] E. De Klerk, F. Glineur, and A. B. Taylor, “On the worst-case complexity of the gradient method with exact line search for smooth\nstrongly convex functions,” Optimization Letters, vol. 11, no. 7, pp. 1185–1199, 2017.\n\n[A7] R. Berthier, F. Bach, and P. Gaillard, “Tight nonparametric convergence ratesfor stochastic gradient descentunder the noiseless\nlinear mode,” in Proc. Advances in Neural Information Processing Systems (NeurIPS), vol. 33, 2020, pp. 2576–2586.\n\n[A8] C. K. Williams and C. E. Rasmussen, Gaussian processes for machine learning. MIT press Cambridge, MA, 2006.\n\n[A9] A. Lederer, J. Umlauft and S. Hirche, ``Uniform error bounds for Gaussian process regression with application to safe control,'' in 3rd Conference on Neural Information Processing Systems, 2019."}, {"message_id": "Reviewer_dgxv · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thanks for the authors' response. <AC1>They have adequately addressed the majority of my concerns.<\/AC1>"}]}, {"i": 3, "name": "Reviewer_vGEs", "rating": [null, 5], "messages": [{"message_id": "Reviewer_vGEs · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper explains the Byzantine-tolerated local approximation Gaussian process (GP) model for streaming data.<\/AC1> <AC2>In the GP framework, distributed learning scenario is used to scale the costly GP to big data.<\/AC2> Besides, <AC3>this local approximation method is used in federated learning when security requirements should be satisfied.<\/AC3> <AC4>The paper proposes a solution to divide the agent set into Benign and Byzantine agents sets.<\/AC4> <AC5>By specifying the Byzantine agents, the model excludes them and uses the benign agents to reduce the negative effects of the attack.<\/AC5> <AC6>The authors evaluate the proposes model on synthetic and real world data sets to show the capacity of their solution.<\/AC6>\nstrengths_and_weaknesses: Strengths:\n\n<AC7>The paper correctly defines the problem.<\/AC7> <AC8>It explains the model, restrictions, related assumptions, and the main problem by addressing all related issues.<\/AC8>\n\nWeaknesses:\n<AC9>The paper has some shortcomings<\/AC9>, and I will mention them here:\n\n1- Agent-based local GPR:\n\n<AC10>The size of the local input data in an agent is not determined.<\/AC10> <AC11>When time rises (i.e., t goes to infinity), how the model handles the data assigned to each agent?<\/AC11> <AC12>In streaming data, the size of the input data increases continuously.<\/AC12> <AC13>Since the local models use the nearest neighborhood GP regression, how many streaming inputs should be selected for NNGP?<\/AC13>\n<AC14>The size of the data inputs raises, so the model needs a clearly defined strategy that determines the local partitions' scope, the number of neighborhood points in NNGP, and related complexity.<\/AC14> <AC15>The computational cost of a GP has a cubic dependency on the sample size (in the local approximations, cubically depends on the subsample sizes).<\/AC15> <AC16>Since the sample size increases when time t raises, the model needs a predefined mechanism to deal with complexity.<\/AC16> Moreover, <AC17>the complexity O(t) mentioned in line 146 only shows the search cost in NN and not the cost of the training of the NNGP.<\/AC17>\n\n2- Cloud-based aggregated GPR\n\n<AC18>The paper's main contribution is this part, where they proposed a solution to find Byzantine agents.<\/AC18> <AC19>The paper considers the agents with the smallest and largest local means and variances at each test point as potential Byzantine agents.<\/AC19> <AC20>It is not supported by a theoretical analysis in the paper<\/AC20> and <AC21>is a heuristic trick.<\/AC21> <AC22>Consider a simple case that all Byzantine agents reported small values as local predictions while the higher mean values are more proper.<\/AC22> <AC23>In this case, steps 4 to 7 in Algorithm 3 exclude a small number of Byzantine agents, while some high-quality agents are also excluded.<\/AC23>\n\n<AC24>There are some related selection methods in the literature.<\/AC24> For instance, <AC25>the Gaussian graphical model can select the benign agents using the precision matrix between agents' predictions.<\/AC25> <AC26>The agent selection method in (https://arxiv.org/abs/2102.01496.pdf) uses the interactions between agents in the related graphical model, determines those agents whose predictions are not close to the other agents' predictions, and excludes them for the final aggregation.<\/AC26> <AC27>Indeed, the ensemble technique in (https://arxiv.org/pdf/2010.08873.pdf) can divide the agents set into two clusters, Byzantine and benign agents, using spectral clustering and the precision matrix of the local predictions.<\/AC27> Besides, <AC28>the importance of an agent in the original GPoE (https://arxiv.org/pdf/1410.7827.pdf) and robust Bayesian committee machine (https://arxiv.org/pdf/1502.02843.pdf) can also help to select benign agents.<\/AC28> <AC29>They proposed the difference in the differential entropy between the prior and the local posterior distribution.<\/AC29>\n\n3- Byzantine-tolerant PoE\n\n<AC30>The generalized product of experts (GPoE) with equal weights (Deisenroth et al. 2015) can provide conservative predictions.<\/AC30> <AC31>This model averaging approach uses the agents' weights to improve the overconfident predictions of traditional PoE.<\/AC31> However, <AC32>its prediction quality is generally lower than the Bayesian committee machine family, mainly when disjoint partitioning is used.<\/AC32> <AC33>It would be better if the authors considered the other newer aggregation methods.<\/AC33>\n\n4- Agent-based fused GPR\n\n<AC34>This part is somewhat unclear.<\/AC34> <AC35>When the local predictions have been combined using PoE, what is the reason for this step?<\/AC35> <AC36>It should be explained that can it change the final aggregation?<\/AC36> <AC37>The model compares the variance of the GPoE and local variances.<\/AC37>\n<AC38>The reason for comparison is unclear<\/AC38>, and also, <AC39>the paper does not describe why this comparison and related replacement (steps 3 and 5 in Algorithm 4) are essential?<\/AC39>\nquestions: Please check the points mentioned in \"Strengths And Weaknesses.\". <AC40>Indeed, it has been confirmed that disjoint partitioning captures the local features more accurately and outperforms random partitioning (see reference [23] in the paper)<\/AC40>; <AC41>why did the authors use random partitioning in the experiments?<\/AC41>\n\nlimitations: Yes."}, {"message_id": "Reviewer_vGEs · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Response to Reviewer vGEs\nThank you so much for reviewing our paper. We are grateful and indebted for the time invested to evaluate our paper, and for the suggestions to make our paper a better and stronger contribution.\n\nWeaknesses:\n\nW1 Agent-based local GPR:\n\nW1-1: <AC1>The size of the local input data in an agent is not determined.<\/AC1> <AC2>When time rises (i.e., t goes to infinity), how the model handles the data assigned to each agent?<\/AC2>\n\n$Answer:$ Thank you so much for your comment on the size of local datasets. <AC3>In fact, our algorithm of agent-based local GPR does not assign the data to each agent.<\/AC3> Instead, <AC4>the agents collect data independently.<\/AC4> <AC5>As in Line 6 of Algorithm 1, each agent $i\\in\\mathcal{V}$ collects data online and updates its local dataset by $\\mathcal{D}^{[i]}(t)=\\mathcal{D}^{[i]}(t-1)\\bigcup(\\mathcal{Z}^{[i]}(t),y^{[i]}(t))$.<\/AC5> <AC6>We admit that better learning performance requires an infinite amount training data in theory<\/AC6>, but <AC7>it is impractical in the applications.<\/AC7> <AC8>In fact, there is a tradeoff between theory and engineering.<\/AC8> <AC9>Full GPR uses all training data to make better predictions<\/AC9>, and <AC10>the corresponding computation complexity is $\\mathcal{O}(t^3)$.<\/AC10> Hence <AC11>to reduce the computation complexity in practice, we have to limit the size of the local input data in an agent.<\/AC11> <AC12>We can either adopt a simple practice such as stop collecting data when the size of training data reaches certain threshold or use existing work [B1] to only keep a fix number of most informative data points.<\/AC12>\n\n<AC13>Our algorithm only is associated with one training data by using projection<\/AC13>, and <AC14>covariance between two training inputs is $0$.<\/AC14> <AC15>Although our algorithm has learning performance loss, the computation complexity is reduced to $\\mathcal{O}(t)$<\/AC15>, <AC16>which is practical in the applications.<\/AC16>\n\nW1-2: <AC17>In streaming data, the size of the input data increases continuously.<\/AC17> <AC18>Since the local models use the nearest neighborhood GP regression, how many streaming inputs should be selected for NNGP?<\/AC18>\n\n$Answer:$ Thank you for your question. <AC19>In this paper, instead of feeding the whole training dataset to GPR, the agent-based local GPR only uses the nearest input denoted by $z_*^{[i]}(t)\\in(z_{\\star},\\mathcal{Z})$ and its corresponding output $y_{z_*^{[i]}(t)}^{[i]}$ to compute the local predictions.<\/AC19> Therefore, <AC20>we only choose one training point by projection to compute the local predictions.<\/AC20>\n\nW1-3: <AC21>The size of the data inputs raises, so the model needs a clearly defined strategy that determines the local partitions' scope, the number of neighborhood points in NNGP, and related complexity.<\/AC21> <AC22>The computational cost of a GP has a cubic dependency on the sample size (in the local approximations, cubically depends on the subsample sizes).<\/AC22> <AC23>Since the sample size increases when time t raises, the model needs a predefined mechanism to deal with complexity.<\/AC23> Moreover, <AC24>the complexity O(t) mentioned in line 146 only shows the search cost in NN and not the cost of the training of the NNGP.<\/AC24>\n\n$Answer:$ We very appreciate the suggestions to train a NNGP on the determination of local training data size and complexity reduction. <AC25>We agree that the computation complexity of the hyperparameter tuning for NNGP is $\\mathcal{O}(t^3)$.<\/AC25> <AC26>In fact, the computation complexity of the hyperparameter tuning can be reduced to $\\mathcal{O}(1)$ by using recursive hyperparameter tuning (please refer to reference [B2]).<\/AC26> <AC27>We briefly mention this in the revised version in the subsection of the agent-based local GPR.<\/AC27> Furthermore, <AC28>this paper considers the computation complexity in prediction, which is also $\\mathcal{O}(t^3)$ for full GPR.<\/AC28> <AC29>By using NNGP, this complexity is reduced to $\\mathcal{O}(t)$.<\/AC29>\n\nW2 Cloud-based aggregated GPR:\n\nW2-1: <AC30>The paper's main contribution is this part, where they proposed a solution to find Byzantine agents.<\/AC30> <AC31>The paper considers the agents with the smallest and largest local means and variances at each test point as potential Byzantine agents.<\/AC31> <AC32>It is not supported by a theoretical analysis in the paper<\/AC32> and <AC33>is a heuristic trick.<\/AC33> <AC34>Consider a simple case that all Byzantine agents reported small values as local predictions while the higher mean values are more proper.<\/AC34> <AC35>In this case, steps 4 to 7 in Algorithm 3 exclude a small number of Byzantine agents, while some high-quality agents are also excluded.<\/AC35>\n\n$Answer:$ We really appreciate the comment on the cloud-based aggregated GPR. <AC36>We agree that our trimming rule could exclude some high-quality agents.<\/AC36> However, <AC37>Lemma 2 theoretically guarantees the robustness of the trimming rule, which can further secure the computation of PoE with the remaining agents' local predictions.<\/AC37> <AC38>Please note that Byzantine agents can send arbitrary messages to the cloud.<\/AC38> <AC39>No one can theoretically guarantee that the proposed agent selection algorithm is perfect [B1]-[B5].<\/AC39> <AC40>If the algorithm misses any malicious agent, the learning performance of existing PoE could be arbitrarily bad.<\/AC40> In contrast, <AC41>the learning performance of our Byzantine-tolerant GPR is bounded, and depends on some parameters, e.g., the number of Byzantine agents.<\/AC41> Please refer to Theorem 1. <AC42>The first two experiments in our paper are conducted to demonstrate this result.<\/AC42> Therefore, <AC43>our design is not heuristic.<\/AC43>\n\nW2-2: <AC44>There are some related selection methods in the literature.<\/AC44> For instance, <AC45>the Gaussian graphical model can select the benign agents using the precision matrix between agents' predictions.<\/AC45> <AC46>The agent selection method in (https://arxiv.org/abs/2102.01496.pdf) uses the interactions between agents in the related graphical model, determines those agents whose predictions are not close to the other agents' predictions, and excludes them for the final aggregation.<\/AC46> <AC47>Indeed, the ensemble technique in (https://arxiv.org/pdf/2010.08873.pdf) can divide the agents set into two clusters, Byzantine and benign agents, using spectral clustering and the precision matrix of the local predictions.<\/AC47> Besides, <AC48>the importance of an agent in the original GPoE (https://arxiv.org/pdf/1410.7827.pdf) and robust Bayesian committee machine (https://arxiv.org/pdf/1502.02843.pdf) can also help to select benign agents.<\/AC48> <AC49>They proposed the difference in the differential entropy between the prior and the local posterior distribution.<\/AC49>\n\n$Answer:$ Thank you so much for your good suggestion on selection methods. <AC50>We agree that these papers provide different methods on agents selection.<\/AC50> However, <AC51>existing agent selection methods require information, which is not available for the cloud.<\/AC51>\n\nSpecifically, on the one hand, <AC52>the first two methods utilize interactions between agents in a graph.<\/AC52> However, <AC53>in our network model or the setup of federated learning, there is no edge between any two agents.<\/AC53> In particular, <AC54>in terms of paper (https://arxiv.org/abs/2102.01496.pdf), the full experts set is divided into two subsets, important and unimportant experts.<\/AC54> <AC55>The importance of an expert is measured according to interactions with other experts.<\/AC55> <AC56>By definition of importance and unimportance (see its Definition 2 on page 4), $M_{\\alpha}$ is the set of important experts, if it contains $\\alpha\\times100$ of the most connected experts in graph $\\mathcal{G}$, where $\\alpha\\in[0,1]$.<\/AC56> <AC57>Its complement, $\\tilde{{M}}_{\\alpha}$ contains the remaining unimportant experts.<\/AC57> <AC58>There is no connection between agents in our problem<\/AC58>, and <AC59>we cannot measure the importance and unimportance.<\/AC59> <AC60>Similar to (https://arxiv.org/pdf/2010.08873.pdf).<\/AC60> Therefore, <AC61>such strategies cannot be used in our problem.<\/AC61>\n\nOn the other hand, <AC62>in terms of gPoE (https://arxiv.org/pdf/1410.7827.pdf) and rBCM (https://arxiv.org/pdf/1502.02843.pdf), at a given point $x$, for each agent $i\\in\\mathcal{V}$, the weighting term $\\alpha_i(x)$ is introduced to compute the global mean and variance.<\/AC62> <AC63>This term can control the influence of individual experts and help to partition groups.<\/AC63> Note that <AC64>typical choice of $\\alpha_i(x)$ is the change in entropy from prior to posterior at point $x$, or the difference between the prior and posterior variance.<\/AC64> First, <AC65>we do not assume that the cloud has any prior local information for each agent $i\\in\\mathcal{V}$, e.g., entropy and variance, in our paper.<\/AC65> Second, <AC66>even though the cloud is able to obtain the potentially corrupted $\\alpha_i(x)$ (since the local posterior predictions the cloud receives could be corrupted by Byzantine attacks), it is arbitrary as well.<\/AC66> <AC67>We also need to find an algorithm to construct an agent set where some agents' local information can be used for aggregation.<\/AC67> <AC68>It is not straightforward.<\/AC68> Thanks again for good suggestions.\n\nW3 Byzantine-tolerant PoE:\n\nW3: <AC69>The generalized product of experts (GPoE) with equal weights (Deisenroth et al. 2015) can provide conservative predictions.<\/AC69> <AC70>This model averaging approach uses the agents' weights to improve the overconfident predictions of traditional PoE.<\/AC70> However, <AC71>its prediction quality is generally lower than the Bayesian committee machine family, mainly when disjoint partitioning is used.<\/AC71> <AC72>It would be better if the authors considered the other newer aggregation methods.<\/AC72>\n\n$Answer:$ Many thanks for the valuable suggestion on the aggregation rules in the could. <AC73>We agree that gPoE can be more conservative in predictions.<\/AC73> However, <AC74>our current theoretical results only support gPoE, and can be rigorously proved for solving the problem of Byzantine-tolerant federated GPR.<\/AC74> <AC75>Generalizing our theoretical results to the BCM family requires additional analysis<\/AC75> and <AC76>is part of our ongoing work.<\/AC76>\n\nW4 Agent-based fused GPR:\n\nW4-1: <AC77>This part is somewhat unclear.<\/AC77> <AC78>When the local predictions have been combined using PoE, what is the reason for this step?<\/AC78>\n\n$Answer:$ Thank you for the comment on the agent-based fused GPR. Notice that <AC79>cloud-based aggregated GPR makes predictions using data from all the agents<\/AC79> while <AC80>agent-based local GPR makes predictions using local data only.<\/AC80> Therefore, <AC81>the cloud-based GPR tends to have better performances compared to agent-based local GPR.<\/AC81> <AC82>Since eventually it is the agents who make predictions, fused GPR allows the agents to utilize the predictions from the cloud to potentially enhance predictions by leveraging communication.<\/AC82>\n\nW4-2: <AC83>It should be explained that can it change the final aggregation?<\/AC83>\n\n$Answer:$ We appreciate the good suggestion. <AC84>Our algorithm is one-round.<\/AC84> <AC85>The refined predictions in the agent-based local GPR will not be transmitted to the cloud<\/AC85>, hence <AC86>it cannot change the final aggregation.<\/AC86> <AC87>As you suggest, we add the explanation in our revised version.<\/AC87>\n\nW4-3: <AC88>The model compares the variance of the GPoE and local variances.<\/AC88> <AC89>The reason for comparison is unclear<\/AC89>, and also, <AC90>the paper does not describe why this comparison and related replacement (steps 3 and 5 in Algorithm 4) are essential?<\/AC90>\n\n$Answer:$ Thank you so much for the comment on the fused GPR. <AC91>The design relies on the intuition that the predictive variance reflects the uncertainties in the predictions.<\/AC91> <AC92>Predictions with lower variance, corresponding to lower predictive uncertainties, usually implies higher prediction accuracy.<\/AC92> Therefore, <AC93>fused GPR replaces the predictions of the agent-based local GPR with those of the cloud aggregate GPR if the variance from the cloud is lower than that from the local GPR.<\/AC93>\n\nQuestions:\n\nQ1: <AC94>Indeed, it has been confirmed that disjoint partitioning captures the local features more accurately and outperforms random partitioning (see reference [23] in the paper)<\/AC94>; <AC95>why did the authors use random partitioning in the experiments?<\/AC95>\n\n$Answer:$ We appreciate your careful reading. <AC96>In fact, in our experiments, we partition the dataset into disjoint groups<\/AC96>, and please refer to the synthetic dataset on page vii. <AC97>We also partition the training dataset into disjoint groups.<\/AC97> <AC98>We find that the word \"randomly\" there can be confusing.<\/AC98> Therefore, <AC99>we revise the description in our revised paper.<\/AC99> Thank you so much for pointing this out.\n\nReferences\n\n[B1] Lawrence, Neil, Matthias Seeger, and Ralf Herbrich. ``Fast sparse Gaussian process methods: The informative vector machine.'' Advances in neural information processing systems 15, 2002.\n\n[B2] Huber, Marco F. ``Recursive Gaussian process: On-line regression and learning.'' Pattern Recognition Letters 45, 85-91, 2004\n\n[B3] P. Blanchard, E. M. El Mhamdi, R. Guerraoui, and J. Stainer, “Machine learning with adversaries:\nByzantine tolerant gradient descent,” in Proceedings of International Conference on Neural\nInformation Processing Systems, pp. 118–128, 2017.\n\n[B4] J. So, B. Güler, and A. S. Avestimehr, “Byzantine-resilient secure federated learning,” IEEE\nJournal on Selected Areas in Communications, vol. 39, no. 7, pp. 2168–2181, 2020.\n\n[B5] D. Yin, Y. Chen, R. Kannan, and P. Bartlett, “Byzantine-robust distributed learning: Towards\noptimal statistical rates,” in Proceedings of the International Conference on Machine Learning,\npp. 5650–5659, 2018.\n\n[B6] D. Data and S. Diggavi, “Byzantine-resilient high-dimensional SGD with local iterations on\nheterogeneous data,” in Proceedings of the International Conference on Machine Learning,\npp. 2478–2488, 2021.\n\n[B7] Y. Chen, L. Su and J. Xu, ``Distributed statistical machine learning in adversarial settings: Byzantine gradient descent,'' Proceedings of the ACM on Measurement and Analysis of Computing Systems, vol. 1, no. 2, pp. 1–25, 2017."}, {"message_id": "Reviewer_vGEs · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: About the authors' response to the agent-based fused GPR algorithm, comparison with other agent selection methods, and clarifications of computational costs\nThank you for clarifying the points, especially in W4. <AC1>The cloud-based aggregated GPR is the main output of the model<\/AC1>, and <AC2>it has been reported in the experiments.<\/AC2> Thus, <AC3>the proposed model does not use the results from the agent-based fused GPR algorithm.<\/AC3> Besides, <AC4>in the range of the data, GPoE overestimates the variance (predictions are conservative), especially with an increasing number of GP experts (see: Deisenroth et al. 2015, distributed Gaussian processes).<\/AC4> <AC5>It seems the comparison between variances in step 2 and step 5 does not lead to many changes.<\/AC5>\n Thanks for your response. <AC6>I need to first talk about a misunderstanding about the suggested methods.<\/AC6>\n<AC7>In the experiments, the proposed method has been compared with attacked PoE and attacked-free PoE<\/AC7>, <AC8>which is insufficient.<\/AC8> Therefore, <AC9>using the suggested baselines (e.g., graph-based models or weighting-based models) in the experiments can demonstrate the efficacy of the proposed method.<\/AC9>\n\nHowever, I want to add some details about the authors' responses.\n1- <AC10>The suggested graph-based methods convert the set of agents into a graphical model.<\/AC10> However, <AC11>instead of the initial data, they use the means of the local predictive distributions.<\/AC11> <AC12>When the local predictions of an agent are not close to those of the other agents, the graphical model defines this agent as an unimportant expert and excludes it from final aggregation.<\/AC12> <AC13>The proposed method in this paper also determines an agent as Byzantine if its moments of local predictive distribution (mean and variance) are far from those of the other agents (see Equations 6 and 7).<\/AC13> Therefore, <AC14>the strategies to determine a Byzantine or unimportant agent and inputs in both papers are the same.<\/AC14> <AC15>The interactions between the agents in the graphical models are not a significant issue here.<\/AC15> However, <AC16>the graph-based papers considered independent agents and showed the methods also work when there is no interaction.<\/AC16>\nOn the other hand, <AC17>the main disadvantage of the graph-based models is that they assign a fixed set of agents to all new data points<\/AC17> and <AC18>are not flexible in capturing the specific behavior of the new test points.<\/AC18> While <AC19>the proposed method in the paper is a flexible pointwise method, and the selection method is repeated for further test points.<\/AC19> <AC20>The weighting-based models can also provide different baselines for comparison.<\/AC20>\n\n2- <AC21>We can accept the selection trick here is not a complete heuristic method (due to the discussion in Section 3.4).<\/AC21> However, <AC22>it only considers too simple attacks.<\/AC22> <AC23>It assumes that a Byzantine agent always sent a simple arbitrary message far from the other messages.<\/AC23> <AC24>It can be easily discovered by removing the large and small values in Equation 6.<\/AC24> Thus, <AC25>the algorithm does not explain how a Byzantine agent can be separated from a weak benign expert (an agent which provides low-quality predictions).<\/AC25> <AC26>As an example of the model limitation, consider the example in the review when all Byzantine agents send small values as arbitrary messages, and the model can not detect all of them.<\/AC26> Instead, <AC27>it removes some benign agents that provide the largest local predictive means.<\/AC27>\nThanks for the clarifications of computational costs in the proposed model. <AC28>The training cost of a full GP is $\\mathcal{O}(t^3)$ while the prediction cost is $\\mathcal{O}(t^2)$ due to the vector-matrix operation in Equation (3)<\/AC28> (<AC29>it would be better to modify it in the paper<\/AC29>).\n<AC30>I am not sure whether training a local GP with only one training point makes sense or not.<\/AC30> However, <AC31>the authors' answer, \" In this paper, instead of feeding the whole training dataset to GPR, the agent-based local GPR only uses the nearest input denoted,\" contradicts the procedure in the experiments.<\/AC31> For instance, <AC32>see Lines 279 and 280, \"In the experiment, we partition 40 000 training data\n into n = 40 disjoint groups, and assign each group to an agent\".<\/AC32>"}, {"message_id": "Reviewer_vGEs · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Response to Reviewer vGEs\n$Answer:$ We really appreciate the comment on the aggregation rule in the cloud.\n\nFirst of all, <AC1>we would like to highlight that this paper is about Byzantine resiliency<\/AC1> and <AC2>needs to demonstrate the trimming rule is effective.<\/AC2> <AC3>The Byzantine resiliency is supported by our theory and experiments when gPoE is used.<\/AC3> <AC4>It is not trivial to obtain theoretical guarantees when other PoE or rBCM is used.<\/AC4> <AC5>We leave the extension as a future work.<\/AC5>\n\nTable 1 Prediction performance comparisons between local GPR and fused GPR on agent 1 and 6.\n_____________________________________________________\nTraining data size | 6000 | 10000 | 40000 | 150000\n_____________________________________________________\nMSE/i=1/local $\\quad$ | 0.0721 | 0.0681 | 0.0585 | 0.0527\n_____________________________________________________\nMSE/i=1/fused $\\quad$ |0.0096|0.0681|0.0094|0.0537\n_____________________________________________________\nMSE/i=6/local $\\quad$ |0.0727|0.0566|0.0564|0.0555\n_____________________________________________________\nMSE/i=6/fused $\\quad$|0.0727|0.0086|0.0564|0.0076\n_____________________________________________________\n\nSecond, <AC6>we conduct additional experiments to demonstrate the improvements by applying our gPoE and fusion algorithm to the synthetic dataset.<\/AC6> <AC7>For a test point, the local variances $\\check{\\sigma}'^{2}_{z*|\\mathcal{D}(t)}$ lie within $[0.3660,0.6228]$, and the global variance is $\\hat{\\sigma}'^2=0.4678$.<\/AC7> The prediction performance comparisons between the agent-based local GPR and fused GPR on agent $1$ and $6$ are listed in Table 1. <AC8>It shows that the learning performance of the agent-based fused GPR is better than that of the agent-based local GPR.<\/AC8> Note that <AC9>the order of the prediction errors for the agent-based fused GPR can decrease from $10^{-2}$ to $10^{-3}$.<\/AC9> <AC10>This demonstrates that the comparison between variances in step 2 and step 5 in our proposed fusion algorithm is able to improve the learning accuracy<\/AC10>, and <AC11>our algorithm is effective.<\/AC11> <AC12>We will incorporate the new experimental results and justifications in our revised paper.<\/AC12>\n\nThank you so much for reviewing our paper, and the comments you give are valuable, which can improve the quality of our paper.\n\nComment 1: <AC13>In the experiments, the proposed method has been compared with attacked PoE and attacked-free PoE<\/AC13>, <AC14>which is insufficient.<\/AC14> Therefore, <AC15>using the suggested baselines (e.g., graph-based models or weighting-based models) in the experiments can demonstrate the efficacy of the proposed method.<\/AC15>\n\n$Answer:$ Thank you so much for your comment on the experiments.\n\n<AC16>The suggested comparisons are interesting and will make the experiments stronger.<\/AC16> However, <AC17>our current experiments are sufficient to demonstrate the effectiveness of our algorithm.<\/AC17> The reasons are twofold.\n\nFirst of all, <AC18>the objective of our paper is to design an algorithm which can enable the agents and the cloud to correctly learn the function $\\eta$ without requiring the agents to share local streaming data $({{z}^{[i]}(t), y^{[i]}(t)})$ despite some agents are subject to Byzantine attacks.<\/AC18> <AC19>We do not aim to distinguish Byzantine agents and benign agents.<\/AC19> Hence <AC20>the experiments are conducted to show the proposed algorithm is able to perform correct predictions regardless of Byzantine attacks, instead of showing our agent selection strategy is superior to others.<\/AC20>\n\nSecond, <AC21>our experiment setup is consistent with the literature on Byzantine-tolerant machine learning [D1]-[D4].<\/AC21> <AC22>The experiments of all these references including our paper focus on the correct predictions regardless of Byzantine attacks and how the number of Byzantine agents affects learning error (convergence rate).<\/AC22> For example, <AC23>paper [D1] uses MNIST dataset to show the effectiveness of the proposed agent selection methods.<\/AC23> <AC24>This paper trains a multi-class logistic regression model and a convolutional neural network (CNN) using distributed gradient descent, and for each model, the paper compares the learning accuracy in different settings: attack-free standard aggregation rule, attacked standard aggregation rule, and Byzantine-resilient aggregation rule.<\/AC24> <AC25>Paper [D2] considers the task of spam filtering.<\/AC25> <AC26>The learning model is a multi-layer perceptron (MLP) with two hidden layers.<\/AC26> <AC27>The paper compares learning accuracy in different settings: attack-free standard aggregation rule, attacked standard aggregation rule, and Byzantine-resilient aggregation rule, and analyzes the learning error with different number of Byzantine agents.<\/AC27> <AC28>Both papers [D1] and [D2] conclude that standard aggregation rule cannot tolerate Byzantine agents, while their proposed aggregation rule can.<\/AC28> <AC29>Our paper follows the same experiment setup to demonstrate that our proposed aggregation rule can tolerate Byzantine agents and the performance of the Byzantine-tolerant PoE increases as the ratio of Byzantine agents decreases.<\/AC29>\n\nLastly, <AC30>we would like to mention that the major contribution of the paper lies in the theoretical guarantees (Theorem 1 and Theorem 2).<\/AC30>\nComment 2: <AC31>We can accept the selection trick here is not a complete heuristic method (due to the discussion in Section 3.4).<\/AC31> However, <AC32>it only considers too simple attacks.<\/AC32> <AC33>It assumes that a Byzantine agent always sent a simple arbitrary message far from the other messages.<\/AC33> <AC34>It can be easily discovered by removing the large and small values in Equation 6.<\/AC34> Thus, <AC35>the algorithm does not explain how a Byzantine agent can be separated from a weak benign expert (an agent which provides low-quality predictions).<\/AC35> <AC36>As an example of the model limitation, consider the example in the review when all Byzantine agents send small values as arbitrary messages, and the model can not detect all of them.<\/AC36> Instead, <AC37>it removes some benign agents that provide the largest local predictive means.<\/AC37>\n\n$Answer:$ Thank you so much for the comment on our trimming rule. <AC38>As we clarify, we do not aim to separate Byzan
