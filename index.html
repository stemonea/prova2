<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebuttal BAF Viewer</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e3df;
  --accent: #3b5bdb; --accent-soft: #e8edfd;
  --reviewer: #f1f0ec; --author: #eaf1fb; --meta: #f6f0e4;
  --accept: #2b8a3e; --accept-soft: #e6f4ea; --reject: #c92a2a; --reject-soft: #fbe9e9;
  --ac-a: #fff0b3; --ac-a-edge: #d9a400; --ac-b: #d6ecff; --ac-b-edge: #3d8bd9;
  --ac-focus: #ffd8a8;
  --g-in: #2b8a3e; --g-in-soft: #d3f0db; --g-ou: #c92a2a; --g-ou-soft: #fadada;
  --g-un: #868e96; --g-un-soft: #e9ecef; --g-both: #d9480f; --g-both-soft: #ffe3c4;
  --sup: #2b8a3e; --att: #e03131; --node-rev: #f5dc8f; --node-auth: #b4d2f7; --node-meta: #9fdccb; --node-dec: #d0bfff; --block: #f3f2ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9b9a94; --line: #33332f;
    --accent: #8ea6ff; --accent-soft: #252c45;
    --reviewer: #262624; --author: #1f2a3a; --meta: #2e291f;
    --accept: #69db7c; --accept-soft: #1d3324; --reject: #ff8787; --reject-soft: #3a2020;
    --ac-a: #4a3f14; --ac-a-edge: #e0b030; --ac-b: #1c3550; --ac-b-edge: #5fa8ef;
    --ac-focus: #6b4a1e;
    --g-in: #69db7c; --g-in-soft: #1f3d27; --g-ou: #ff8787; --g-ou-soft: #4a2323;
    --g-un: #adb5bd; --g-un-soft: #2c2e31; --g-both: #ffa94d; --g-both-soft: #4a3216;
    --sup: #69db7c; --att: #ff8787; --node-rev: #7a6020; --node-auth: #2c4f7c; --node-meta: #1f5c4f; --node-dec: #4d3f80; --block: #232321;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9b9a94; --line: #33332f;
  --accent: #8ea6ff; --accent-soft: #252c45;
  --reviewer: #262624; --author: #1f2a3a; --meta: #2e291f;
  --accept: #69db7c; --accept-soft: #1d3324; --reject: #ff8787; --reject-soft: #3a2020;
  --ac-a: #4a3f14; --ac-a-edge: #e0b030; --ac-b: #1c3550; --ac-b-edge: #5fa8ef;
  --ac-focus: #6b4a1e;
  --g-in: #69db7c; --g-in-soft: #1f3d27; --g-ou: #ff8787; --g-ou-soft: #4a2323;
  --g-un: #adb5bd; --g-un-soft: #2c2e31; --g-both: #ffa94d; --g-both-soft: #4a3216;
  --sup: #69db7c; --att: #ff8787; --node-rev: #7a6020; --node-auth: #2c4f7c; --node-meta: #1f5c4f; --node-dec: #4d3f80; --block: #232321;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.side-head h1 { font-size: 16px; margin: 0; }
.side-head .sub { color: var(--muted); font-size: 12px; margin-top: -6px; }
input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.paper-list { overflow-y: auto; flex: 1; padding: 6px; }
.paper-item { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: inherit; font: inherit; padding: 10px; border-radius: 8px; cursor: pointer; }
.paper-item:hover { background: var(--bg); }
.paper-item[aria-current="true"] { background: var(--accent-soft); }
.paper-item .pid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600; }
.paper-item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.paper-item .scores { color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.badge.Accept { background: var(--accept-soft); color: var(--accept); }
.badge.Reject { background: var(--reject-soft); color: var(--reject); }
.lab { display: inline-block; font: 600 10.5px ui-monospace, Menlo, monospace; padding: 0 5px; border-radius: 4px; vertical-align: 1px; }
.lab.in { background: var(--g-in-soft); color: var(--g-in); }
.lab.ou { background: var(--g-ou-soft); color: var(--g-ou); }
.lab.un { background: var(--g-un-soft); color: var(--g-un); }
.lab.both { background: var(--g-both-soft); color: var(--g-both); }

main { overflow-y: auto; overflow-x: hidden; min-height: 0; min-width: 0; }
.wrap { max-width: 940px; margin: 0 auto; padding: 24px 24px 80px; }
.paper-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; }
.paper-head h2 { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 20px; }
.paper-head a { color: var(--accent); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 12px 0 20px; color: var(--muted); font-size: 13px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
details.meta { background: var(--meta); border-radius: 10px; padding: 12px 16px; margin-bottom: 22px; }
details.meta summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details.meta .plain { margin-top: 8px; white-space: pre-wrap; font-size: 14px; }
details.meta .verdict { margin-top: 10px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
details.meta .verdict .nlink { font-size: 12px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 18px; }
.tab { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab .r { font-size: 12px; font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }

.toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 16px; position: sticky; top: 0; background: var(--bg); padding: 8px 0; z-index: 2; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.split-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 3px 12px; font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.split-btn::before { content: ""; width: 26px; height: 14px; border-radius: 999px; background: var(--line); box-shadow: inset -12px 0 0 2px var(--panel); transition: box-shadow .15s, background .15s; }
.split-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.split-btn[aria-pressed="true"]::before { background: var(--accent); box-shadow: inset 12px 0 0 2px var(--accent-soft); }

/* discussione come su OpenReview: ogni review con le risposte annidate sotto */
.forum-title { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.note-thread { margin-bottom: 26px; }
.replies { margin-left: 22px; padding-left: 14px; border-left: 2px solid var(--line); }
.msg { border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; border: 1px solid var(--line); }
.msg.reviewer { background: var(--reviewer); }
.msg.author { background: var(--author); }
.msg.metarev { background: var(--meta); }
.msg-head .rating { font-variant-numeric: tabular-nums; }
.msg .gtitle { margin: 12px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.side-stats { display: grid; grid-template-columns: auto auto auto; gap: 2px 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-stats b { color: var(--ink); }
.side-stats .h { font-weight: 600; color: var(--ink); }
.msg-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.msg-head .who { font-weight: 700; color: var(--ink); font-size: 13px; }
.msg-head .count { margin-left: auto; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
details.gpart { margin-top: 12px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; background: var(--panel); }
details.gpart summary { cursor: pointer; font-size: 12px; color: var(--muted); }
details.gpart .text { margin-top: 8px; font-size: 14px; }

/* componenti argomentative: due tinte alternate, oppure il colore della grounded */
.hl .ac { border-radius: 3px; padding: 1px 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; transition: background .1s; }
.hl .ac.a { background: var(--ac-a); box-shadow: inset 0 -2px 0 var(--ac-a-edge); }
.hl .ac.b { background: var(--ac-b); box-shadow: inset 0 -2px 0 var(--ac-b-edge); }
.hl .ac.in { background: var(--g-in-soft); box-shadow: inset 0 -2px 0 var(--g-in); }
.hl .ac.ou { background: var(--g-ou-soft); box-shadow: inset 0 -2px 0 var(--g-ou); }
.hl .ac.un { background: var(--g-un-soft); box-shadow: inset 0 -2px 0 var(--g-un); }
.hl .ac.both { background: var(--g-both-soft); box-shadow: inset 0 -2px 0 var(--g-both); }
.hl .ac:hover { background: var(--ac-focus); }
.ac-id { display: none; }
.show-ids .hl .ac-id { display: inline; font: 600 10px ui-monospace, Menlo, monospace; color: var(--muted); vertical-align: super; margin-right: 3px; }
.only-args .non-arg { opacity: .35; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.hl .ac[data-nid] { cursor: pointer; }
.ac.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--ac-focus); box-shadow: 0 0 0 3px var(--ac-focus); } }
.legend-inline { display: inline-flex; gap: 6px; align-items: center; }

/* vista testo / grafo */
.viewswitch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
.viewswitch button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 5px 14px; cursor: pointer; }
.viewswitch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.export-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; align-self: center; }
.export-btn:hover { border-color: var(--muted); }

/* grafo: nella vista grafo la pagina è una colonna a tutta altezza e il canvas prende lo spazio libero */
.wrap.wide { max-width: none; height: 100vh; display: flex; flex-direction: column; padding: 14px 18px; }
.wrap.wide .stats { margin: 6px 0 10px; }
.garea { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.garea:fullscreen { padding: 12px; }
.gtoolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.gtoolbar label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.gtoolbar select, .gtoolbar input[type=search] { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 13px; }
.gtoolbar input[type=search] { width: 230px; }
.gsearch { display: inline-flex; gap: 6px; align-items: center; }
.gsearch .cnt { font-size: 12px; min-width: 64px; font-variant-numeric: tabular-nums; }
.gbtns { display: inline-flex; gap: 4px; margin-left: auto; }
.gbtns button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 3px 9px; font: inherit; font-size: 13px; cursor: pointer; min-width: 30px; }
.gbtns button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.gbtns button:hover { border-color: var(--muted); }
.swatch { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; }
.swatch.s { border-color: var(--sup); } .swatch.a { border-color: var(--att); } .swatch.i { border-top-style: dashed; border-color: var(--muted); }
.dot { display: inline-block; width: 12px; height: 9px; border-radius: 3px; vertical-align: middle; }
.dot.rev { background: var(--node-rev); } .dot.auth { background: var(--node-auth); } .dot.meta { background: var(--node-meta); } .dot.dec { background: var(--node-dec); }
.dot.in { background: var(--g-in); } .dot.ou { background: var(--g-ou); } .dot.un { background: var(--g-un); } .dot.both { background: var(--g-both); }
.graph-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; }
.graph-wrap.nopanel { grid-template-columns: minmax(0, 1fr); }
.graph-wrap.nopanel .gpanel { display: none; }
.cybox { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-height: 0; min-width: 0; overflow: hidden; }
#cy { position: absolute; inset: 0; }
.glegend { position: absolute; left: 10px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; pointer-events: none; max-width: calc(100% - 20px); }
.gtip { position: absolute; z-index: 5; max-width: 340px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.14); pointer-events: none; }
.gtip code { font-weight: 700; }
.gtip .snip { color: var(--muted); }
.gtip .rl { font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; }
.gtip .rl.s { color: var(--sup); border: 1px solid var(--sup); } .gtip .rl.a { color: var(--att); border: 1px solid var(--att); }
.gpanel { overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 14px; font-size: 14px; min-height: 0; }
.gpanel h4 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.gpanel .ghead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; font-size: 12px; color: var(--muted); }
.gpanel .ghead code { font-size: 14px; font-weight: 700; color: var(--ink); }
.gpanel .gtext { margin: 8px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.gpanel ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.gpanel li { font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; padding: 4px 6px; border-radius: 6px; }
.gpanel li:hover { background: var(--bg); }
.gpanel .rl { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-right: 4px; white-space: nowrap; }
.gpanel .rl.s { color: var(--sup); border: 1px solid var(--sup); } .gpanel .rl.a { color: var(--att); border: 1px solid var(--att); }
.nlink { font: 600 12px ui-monospace, Menlo, monospace; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.gpanel .snip { color: var(--muted); }
.gpanel .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.gpanel .btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.gpanel .none { color: var(--muted); font-size: 13px; padding: 0 6px; }
.gpanel .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 8px; }
.gpanel .kv b { font-variant-numeric: tabular-nums; }
.gpanel kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--bg); }
.gpanel .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.gpanel .keys > kbd { justify-self: start; align-self: start; }
.gpanel .edge-arrow { margin: 10px 0; font-size: 13px; }

/* elenco dei paper richiudibile (desktop) */
.side-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.icon-btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 1px 8px; font: inherit; font-size: 14px; cursor: pointer; line-height: 1.5; }
.icon-btn:hover { border-color: var(--muted); }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 2px 10px; font: inherit; font-size: 13px; cursor: pointer; align-self: center; }
@media (min-width: 761px) {
  .app { transition: grid-template-columns .2s ease; }
  .app.collapsed { grid-template-columns: 0 minmax(0, 1fr); }
  .app.collapsed > aside { visibility: hidden; overflow: hidden; border-right: 0; }
  .app.collapsed .menu-btn { display: inline-block; }
}
@media (max-width: 1000px) {
  .wrap.wide { height: auto; display: block; }
  .graph-wrap { grid-template-columns: minmax(0, 1fr); }
  .cybox { height: 65vh; }
  .gbtns { margin-left: 0; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: fixed; inset: 0 30% 0 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; min-width: 260px; }
  aside.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
  .menu-btn { display: inline-block; padding: 4px 10px; }
  .wrap { padding: 16px 16px 60px; }
  .replies { margin-left: 8px; padding-left: 8px; }
}
</style>
</head>

<script id="data" type="application/json">{"mode": "segmentation", "papers": [{"paper_id": "4rTN0MmOvi7", "decision": "Accept", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>The paper receives overall positive reviews<\/AC1> and <AC2>rebuttal has resolved the reviewer's concerns.<\/AC2> <AC3>Reviewers agree that the paper proposes a simple yet effective approach to enrich language concepts to learn better region-concept alignment for object detection.<\/AC3> <AC4>The approach is supported by solid empirical evidence on the LVIS dataset and 13 DATA.<\/AC4> <AC5>AC agrees the methodology of processing data is worth sharing to a broader audience<\/AC5> and <AC6>recommends to accept the paper.<\/AC6>\nconfidence: Certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_5KVn", "rating": [6, 6], "messages": [{"message_id": "Reviewer_5KVn · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The work proposes to build a concept dictionary which enables to perform visual-concept pretraining in a unified way across multiple heterogeneous datasets for open-world detection.<\/AC1> <AC2>With the proposed dictionary design, the proposed method can even perform partial annotation enrichment for label completion and negative concept sampling to further improve the performance.<\/AC2>\nstrengths_and_weaknesses: Strength:\n\n1. <AC3>The built concept dictionary can be used to convert the annotations of heterogeneous datasets, including detection, visual grounding, etc, into a unified one.<\/AC3>\n2. <AC4>With the concept dictionary, the proposed method can perform concept enrichment with the assistance of other pretrained text encoder, FILIP in addition to negative concept sampling and partial annotation enrichment for those labels which are not well annotated in the existing datasets.<\/AC4>\n3. <AC5>The performance improvement in LVIS for rare and frequent categories is significant as compared with other previous state-of-the-art method.<\/AC5>\n\nWeakness:\n\n1. <AC6>The construction of the concept dictionaries rely on the wordNet<\/AC6>, and thus <AC7>the concepts are mainly composed of those which are well-defined in WordNet.<\/AC7>\n2. <AC8>For the concept enrichment, it still requires a pre-trained text encoder, like FILIP, to match related concepts.<\/AC8> <AC9>The quality will depends on the reliability of the pretrained text-encoder used.<\/AC9>\n3. <AC10>When resolving the name ambiguity among different datasets, only the text part is used without exploiting the corresponding image information.<\/AC10>\nquestions: <AC11>The experimental results are very thorough covering different open-vocabulary datasets<\/AC11>, and also <AC12>show promising performance improvement.<\/AC12> I have few questions.\n\n1. <AC13>Is the definition from the wordNet necessary to be used?<\/AC13> <AC14>If we only use the unified label, how much will it affect the performance?<\/AC14>\n<AC15>The following work is not targeted at open-vocabulary detection<\/AC15>, but <AC16>it also proposes to perform contrastive learning using the unified space.<\/AC16>\n\nYang, Jianwei, Chunyuan Li, Pengchuan Zhang, Bin Xiao, Ce Liu, Lu Yuan, and Jianfeng Gao. \"Unified contrastive learning in image-text-label space.\" In Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition, pp. 19163-19173. 2022.\n\n2. <AC17>How is the pseudo labeling for label completion of using the all the concepts in the dictionary conducted?<\/AC17> <AC18>The dictionary size is usually very large (e.g., 14k).<\/AC18> <AC19>The paper describes to add the concepts in the dictionary as the addition category inputs.<\/AC19>\n3. <AC20>For concept enrichment and partial concept enrichment, how would the pretrained encoder FILIP affect the final performance?<\/AC20> <AC21>Do the authors try other text-encoders?<\/AC21>\n4. <AC22>How is the proposed method compared with recently released work, GLIPv2 (optional)?<\/AC22>\nhttps://arxiv.org/abs/2206.05836\nlimitations: <AC23>The authors do address the limitations and why there is no potential negative societal impact of their work.<\/AC23>"}, {"message_id": "Reviewer_5KVn · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To Reviewer 5KVn\nWe thank the reviewer for the positive feedback and insightful comments! All comments are summarized and addressed as follows.\n\n**R1Q1. <AC1>The construction of the concept dictionaries is constrained by the WordNet.<\/AC1>**\n\n<AC2>Yes, the current concepts dictionary relies on the concepts in WordNet<\/AC2> since <AC3>it is large enough to cover most object concepts in our daily life.<\/AC3>\n\n<AC4>Specifically, according to [1], WordNet contains approximately 57,000 noun word forms organized into approximately 48,800 word meanings (synsets)<\/AC4>, <AC5>which can cover more than 95\\% concepts of the currently available detection datasets like LVIS and Object365.<\/AC5>\n\n<AC6>While making dictionaries larger and more diverse promises to further improve the performance, one of our main purposes is to demonstrate the effectiveness of the idea of the concept dictionary.<\/AC6> <AC7>As shown in Table 3 of the main paper, our models using the current dictionary improves the LVIS rare category performance from 22.2 to 26.0 when trained with Objects365 and from 21.6 to 26.4 when trained with Objects365+GoldG, respectively.<\/AC7> <AC8>We will consider enriching our dictionary by including concepts from broader sources like Wikipedia in the future.<\/AC8>\n\n[1] Miller, George A., et al. \"Introduction to WordNet: An on-line lexical database.\" International journal of lexicography 3.4 (1990): 235-244.\n\n**R1Q2. <AC9>The concept enrichment relies on a pre-trained language model, how would it affect the final performance?<\/AC9> <AC10>Do the authors try other text-encoders?<\/AC10>**\n\n<AC11>During training, we use a pre-trained language model to retrieve a definition in our dictionary for concepts without a direct match in WordNet.<\/AC11> <AC12>Due to the wide coverage of WordNet, only a small fraction (less than 10%) of concepts require retrieving their definitions.<\/AC12> <AC13>Therefore we can expect that the choice of the language model would lead to limited influence on the performance.<\/AC13>\n\n<AC14>We also conduct additional experiments to study how the pre-trained language model in the concept enrichment affects the final performance.<\/AC14> <AC15>Three different settings are considered: 1) do not use the language model, i.e., directly adopt the category name as the input for the concepts not in WordNet; 2) use a pre-trained FILIP text encoder; 3) use a pre-trained RoBERTa as in GLIP.<\/AC15> The results are shown in the following table. We can observe that: 1) <AC16>the concept enrichment procedure can bring significant improvements, (e.g., +3.6% on rare categories) even without using a pre-trained language model<\/AC16>; 2) <AC17>using FILIP can further boost the AP performance from 28.3 to 28.8<\/AC17>, while <AC18>using RoBERTa achieves similar performance with no language model is used.<\/AC18> <AC19>We update these experimental results in the revised paper (refer to the Paragraph 'Impact of pre-trained language models in Concept enrichment.' and Table 9 in Appendix D).<\/AC19>\n\nTable 1: Performance comparison of using different pre-trained text encoders in concept enrichment\nprocedure on LVIS minival dataset. The training dataset is Objects365.\n\n| Concept Enrichment | Pre-trained Text Encoder | LVIS minival AP (r/c/f) |\n| :----------------: | :----------------------: | :-----------------------: |\n| X | / | 27.8 (22.2/26.8/29.7) |\n| &#10004; | None | 28.3 (25.8/27.0/29.9) |\n| &#10004; | RoBERTa-base | 28.2 (24.5/27.3/29.7) |\n| &#10004; | FILIP text-encoder | **28.8 (26.0/28.0/30.0)** |\n\n**R1Q3. <AC20>When resolving the name ambiguity among different datasets, only the text part is used without exploiting the corresponding image information.<\/AC20>**\n\nThanks for your suggestion, <AC21>images can provide valuable information for resolving the name ambiguity, e.g., \"mouse\" can be an animal or equipment.<\/AC21> <AC22>We will consider this direction in our future work.<\/AC22>\n\n**R1Q4. <AC23>Is the definition from WordNet necessary to be used?<\/AC23> <AC24>How would it compare to using the unified label?<\/AC24>**\n\n<AC25>Yes, the definition from the WordNet is important for the performance<\/AC25> since <AC26>it can explicitly provide the useful relationships between various concepts.<\/AC26> <AC27>We show the performance of only using the unified label (similar to the listed CVPR22 paper [2]) in row4 of Table 3 in the main paper, where O365 and GoldG are used for training and no concept enrichment is adopted.<\/AC27> <AC28>Comparing it to the results of row5, where the concept enrichment is used, we can find that augmenting category names with definitions achieves significant improvements (+4% on LVIS and +3% on 13 detection datasets)<\/AC28>\n\n[2] Yang, Jianwei, Chunyuan Li, Pengchuan Zhang, Bin Xiao, Ce Liu, Lu Yuan, and Jianfeng Gao. \"Unified contrastive learning in image-text-label space.\" In Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition, pp. 19163-19173. 2022.\n\n**R1Q5. <AC29>How the pseudo labeling for label completion is conducted<\/AC29> since <AC30>dictionary size is usually very large (14K)?<\/AC30>**\n\nDuring pseudo labeling, since <AC31>we use a text encoder that has no interaction with the vision encoder<\/AC31>, <AC32>the text embedding of all concepts can be pre-computed and stored for the later computation.<\/AC32> <AC33>This process requires all concepts to forward the text encoder only once<\/AC33>, <AC34>which is quite efficient.<\/AC34>\n<AC35>Then the text embeddings are used as the classification weights for object proposals, where the category number is the number of concepts, i.e., 14k.<\/AC35> <AC36>Before calculating the classification scores, we first use a series of conditions to filter proposal candidates with low quality (as described in the L16-18 in Appendix B)<\/AC36>, <AC37>which significantly reduces the number of object candidates.<\/AC37> <AC38>By doing this, we can directly calculate the similarities between object proposals and concept texts without encountering memory issues.<\/AC38> <AC39>If a larger scale of concepts is involved, we can split the concepts into multiple chunks and compute the similarities for each chunk separately.<\/AC39> <AC40>We have updated more implementation details about this part in the Paragraph **Pseudo Labeling on Image-Text Pair Data** in Appendix B.<\/AC40>\n\n**R1Q6. The comparison with GLIPv2.**\n\n<AC41>The DetCLIP focuses on building an effective paralleled framework with external knowledge for open-world object detection<\/AC41> while <AC42>GLIPv2 is proposed to serve different vision tasks, which is orthogonal to our work.<\/AC42>\n\n<AC43>For zero-shot detection performance comparison, our DetCLIP-T still outperforms GLIPv2-T (refer to Table 2 of GLIPv2 paper) by a large margin (35.9% v.s. 29.0%) on LVIS minival.<\/AC43> <AC44>We have updated this comparison in Table 1 (row 9) of the revised paper.<\/AC44> <AC45>Note that the performance of the other two models GLIPv2-B and GLIPv2-H cannot be directly compared with our DetCLIP<\/AC45> since <AC46>they include images of LVIS during the training<\/AC46>, <AC47>which is thus not zero-shot.<\/AC47>\n Global/general Response:\n```\nWe thank all the reviewers for their time, insightful suggestions, and valuable comments. <AC48>We are glad that **ALL** reviewers give positive feedback and find our method simple and effective, an elegant concept parallel framework that scales well with a large number of categories (reviewer 'rAnj' and 'aMQW'), with significant improvements over GLIP on LVIS and 13 downstream detection datasets (reviewer '5KVn', '82yp' and 'aMQW').<\/AC48>\n\nWe respond to each reviewer's comments in detail below. <AC49>We have also revised the main paper and appendix according to the reviewers' suggestions.<\/AC49> The main changes are listed as follows:\n\n- <AC50>In Table 1, we add comparisons with GLIP-C and GLIPv2-T.<\/AC50>\n\n- <AC51>In Appendix B, we elaborate on more implementation details about how to conduct pseudo labeling for YFCC dataset when using a large-size concept dictionary.<\/AC51>\n\n- <AC52>In Appendix C, we add an experiment to evaluate our method under VILD protocol.<\/AC52>\n\n- <AC53>In Appendix D, we add experimental results about the impact of the pre-trained language model for concept enrichment.<\/AC53>\n\n- <AC54>As suggested by Reviewer2, we revise the abstract to make it more clear and neat and modify the improper bold text.<\/AC54>\n\nNote that we marked the revisions in blue. We hope that our efforts address the reviewers' concerns.\n```"}, {"message_id": "Reviewer_5KVn · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thanks for the authors' response. <AC1>Most of my concerns have been addressed.<\/AC1> <AC2>I reaffirm my positive endorsement for this paper.<\/AC2>"}]}, {"i": 2, "name": "Reviewer_82yp", "rating": [6, 6], "messages": [{"message_id": "Reviewer_82yp · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper explores a parallel visual-concept pretraining method for open vocabulary object detection by resorting to knowledge enrichment from a designed concept dictionary.<\/AC1>\nThey make the following contributions:\n1.<AC2>a novel paralleled concept formulation to improve learning efficiency.<\/AC2>\n2.<AC3>a novel concept dictionary to enrich the prompt text concepts during joint pretraining.<\/AC3>\n3.<AC4>DetCLIP outperforms the state-of-the-art GLIP.<\/AC4>\nstrengths_and_weaknesses: Strengths\n1. <AC5>The method is simple and effective<\/AC5> and <AC6>I like the examples author offered here and there.<\/AC6>\n2. <AC7>The model significantly improves the learning efficiency.<\/AC7>\n3. <AC8>The experiment results seem solid.<\/AC8> <AC9>They evaluate the method on LVIS and transfer the model to 13 downstream detection datasets.<\/AC9>\n\nWeaknesses\n<AC10>I think the writing of the abstract and introduction needs to be significantly improved<\/AC10>: <AC11>they are too long especially for the abstract.<\/AC11> <AC12>And also many concepts were used directly without explanation/definitions/references at the first hand or not at all.<\/AC12> For instance, <AC13>what is GLIP, DetCLIP-T, GLIP-T, positive samples v.s. negative samples ?<\/AC13> <AC14>What is the grounding, what's its difference to image-text pair data ?<\/AC14> <AC15>what's the partial label problem ?<\/AC15>\n\n<AC16>Authors claimed their method is much more efficient and effective than GLIP in terms of data usage.<\/AC16> However <AC17>I notice that they have also utilized other models such as CLIP , FILIP.<\/AC17> <AC18>Are these models considered as part of the proposed method (are they multi-stage) ?<\/AC18> <AC19>How would this compare to GLIP ?<\/AC19>\n\nL157 <AC20>Can you provide further explanation that why interaction between categories is unnecessary?<\/AC20>\n\nL169: <AC21>Why context information is just removed.<\/AC21> <AC22>I know the context cannot fed into the text encoder individually.<\/AC22> <AC23>Maybe it can be added to every individual concept phrase.<\/AC23> <AC24>Any study for this ?<\/AC24>\n\nL243 : <AC25>What is partial positive concept ?<\/AC25> <AC26>Is it derived from the partial labelling problem, I don't see a clue.<\/AC26>\n\nLast, <AC27>bold text is normally for title/subtitle as a standard practice.<\/AC27> <AC28>Be using it properly!<\/AC28>\n\nquestions: See above\nlimitations: See above"}, {"message_id": "Reviewer_82yp · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To Reviewer 82yp\nWe thank the reviewer for the positive feedback and insightful comments! All comments are summarized and addressed as follows.\n\n**R2Q1. <AC1>Authors claimed their method is much more efficient and effective than GLIP in terms of data usage.<\/AC1> However, <AC2>I notice that they have also utilized other models such as CLIP, FILIP.<\/AC2> <AC3>Are these models considered as part of the proposed method (are they multi-stage)?<\/AC3> <AC4>How would this compare to GLIP?<\/AC4>**\n\n<AC5>Yes, these models are considered as part of the proposed method<\/AC5> and <AC6>they are multi-stage.<\/AC6>\n<AC7>Although our method involves external models such as CLIP and FILIP, the comparison with GLIP on data efficiency is fair and clear.<\/AC7> Specifically, we can compare the components in our method where the external models are introduced:\n\n1) <AC8>We use weights of a vision-language pre-trained FILIP text-encoder as the initialization of our text-encoder<\/AC8>, while <AC9>GLIP loads weights from a language pre-trained RoBERTa.<\/AC9> <AC10>Both models are transformer models but FILIP has lower complexity, i.e., 63.3 M parameters of FILIP-base v.s. 124.8 M parameters of RoBERTa-base<\/AC10>, <AC11>which should not lead to an advantage of our model in comparison.<\/AC11> <AC12>Indeed, in our early stage of experiments, we have also tried using RoBERTa-base as the text encoder<\/AC12>, and <AC13>it achieves comparable results compared to using FILIP's text encoder.<\/AC13>\n\n2) <AC14>In our concept enrichment technique, we use a pre-trained FILIP text-encoder to retrieve definitions for concepts without a direct match in WordNet.<\/AC14> <AC15>In Q2 of Reviewer 5KVn, we show that this process is robust to the choice of language model<\/AC15> and <AC16>it can achieve a strong performance even without using a language model.<\/AC16>\n\n3) <AC17>We use CLIP to perform pseudo labeling for image-text pair data<\/AC17> while <AC18>GLIP uses a GLIP-L model trained on detection/grounding data.<\/AC18> <AC19>The effects of using different models during this process cannot be directly compared<\/AC19> since <AC20>we follow different training stages, i.e., we use 2 stages of pseudo-labeling->training while GLIP follows 3 stages of training->pseudo-labeling->re-training.<\/AC20> However, <AC21>to show our method can achieve a better data usage efficiency, we can exclude the pseudo labeling process for both methods and compare the results trained with only detection+grounding data.<\/AC21> <AC22>Under this setting, as shown in the updated Table 1 in the main paper, our DetCLIP-T(B) (34.4% mAP) can outperform the counterpart GLIP-C (24.9% mAP) by 9.5% mAP on LVIS.<\/AC22>\n\n**R2Q2. Further explanation for why interaction between categories is unnecessary.**\n\n<AC23>The interaction between categories can cause inefficient learning and an inconsistency between the training and testing phases.<\/AC23> <AC24>Specifically, in our method, the text embedding of the category name serves as the classification weight of the detector.<\/AC24> <AC25>In the sequential formulation, due to the interaction between category names, the text embedding of each category will depend on other categories which are input together with it, and the order in which they are arranged.<\/AC25> <AC26>This will lead to dynamic classification weights for each category.<\/AC26> <AC27>In other words, the classification weight of a category depends on all the category names and also depends on how we organize them.<\/AC27> <AC28>That is to say, we expect the model to learn visual embeddings that can work on dynamic classification weights<\/AC28>, <AC29>which increases the learning difficulty and hurts the final performance.<\/AC29> <AC30>As demonstrated in our experiments (Fig.4 and Table 3 in the main paper), replacing the sequential formulation with paralleled formulation can significantly improve learning efficiency as well as performance.<\/AC30>\n\nOn the other hand, <AC31>to make sequential formulation work, GLIP samples a large number of different category names at each training iteration and shuffles their order as the input to the text-encoder.<\/AC31> <AC32>The purpose of these practices is to reduce the influence of contextual information in the text on each class name<\/AC32>, <AC33>which is contrary to the purpose of interaction.<\/AC33>\n\n**R2Q3. <AC34>Why context information is just removed?<\/AC34> <AC35>Maybe it can be added to every individual concept phrase.<\/AC35>**\n\n<AC36>We remove the context information<\/AC36> since <AC37>our paper targets at the open-world detection which concentrates on recognizing the class of each object.<\/AC37> <AC38>Specifically, in our setting, we keep the adjective for each concept and remove the conjunction and verb in each caption in grounding datasets, which follows the way the grounding datasets annotate objects.<\/AC38>\n\n<AC39>We conduct the experiments (L150-153 in the revised main paper \\& Table 6 in the Appendix D) to show that randomly shuffling the word order in the grounding training data for GLIP can even bring a slight improvement for the downstream detection task<\/AC39>, <AC40>indicating that the noun phrase is more critical for the detection task, compared to the context information.<\/AC40>\n\n<AC41>We agree including more context information (e.g., the verb) into concept phrases may be helpful for the model to better distinguish more fine-grained patterns, e.g., actions of objects<\/AC41>, <AC42>which is not considered in this paper.<\/AC42>\n**R2Q4. <AC43>What is partial positive concept and is it derived from the partial labelling problem?<\/AC43>**\n\n<AC44>Yes, it is derived from the partial labelling problem.<\/AC44> <AC45>Specifically, the \"lack of annotations of partial positive concepts\" indicates that some concepts in images are not annotated with captions in grounding and image-text datasets.<\/AC45> <AC46>We will make it more clear in revision.<\/AC46>\n\n**R2Q5. Writing issues.**\n\nThanks for you suggestions. <AC47>We will refine the abstract/introduction to make them more clear and neat<\/AC47>, and <AC48>modify the bold text in the revision.<\/AC48>\n\n**R2Q6. <AC49>Many concepts were used directly without explanation/definitions/references at the first hand.<\/AC49>**\n\nThanks for your kindly reminder, <AC50>we will update this information in the revision.<\/AC50> The explanations are listed as follows:\n\n1) <AC51>The GLIP denotes the method in [1]<\/AC51> and <AC52>the DetCLIP is our proposed method.<\/AC52>\n\n2) <AC53>`-T' denotes the model that adopts the Swin-T transformer as the image encoder.<\/AC53>\n\n3) <AC54>The positive/negative samples for an image denote the categories (or concepts) labeled/not labeled in the ground truth of the image, respectively.<\/AC54> <AC55>In our paralleled formulation, for each training image, we use ground truth categories/concepts as positives and sample negatives from a pool of candidates to perform classification learning.<\/AC55> <AC56>The pool of negative candidates for detection data is the set of categories not appear in the ground truth<\/AC56>, and <AC57>for grounding/image-text pair data it is our proposed concept dictionary.<\/AC57>\n\n4) <AC58>The grounding data denotes the data annotated with fine-grained correspondence between\ntext phrases in a sentence and objects in an image.<\/AC58>\n\n5) <AC59>Partial label problem stands in some grounding or image-text pair datasets, only the main objects that people care about are labeled in the caption.<\/AC59>\n\n[1] Li, Liunian Harold, et al. \"Grounded language-image pre-training.\" Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition. 2022.\n Global/general Response:\n```\nWe thank all the reviewers for their time, insightful suggestions, and valuable comments. <AC60>We are glad that **ALL** reviewers give positive feedback and find our method simple and effective, an elegant concept parallel framework that scales well with a large number of categories (reviewer 'rAnj' and 'aMQW'), with significant improvements over GLIP on LVIS and 13 downstream detection datasets (reviewer '5KVn', '82yp' and 'aMQW').<\/AC60>\n\nWe respond to each reviewer's comments in detail below. <AC61>We have also revised the main paper and appendix according to the reviewers' suggestions.<\/AC61> The main changes are listed as follows:\n\n- <AC62>In Table 1, we add comparisons with GLIP-C and GLIPv2-T.<\/AC62>\n\n- <AC63>In Appendix B, we elaborate on more implementation details about how to conduct pseudo labeling for YFCC dataset when using a large-size concept dictionary.<\/AC63>\n\n- <AC64>In Appendix C, we add an experiment to evaluate our method under VILD protocol.<\/AC64>\n\n- <AC65>In Appendix D, we add experimental results about the impact of the pre-trained language model for concept enrichment.<\/AC65>\n\n- <AC66>As suggested by Reviewer2, we revise the abstract to make it more clear and neat and modify the improper bold text.<\/AC66>\n\nNote that we marked the revisions in blue. We hope that our efforts address the reviewers' concerns.\n```"}, {"message_id": "Reviewer_82yp · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "I acknowledge the authors' response. <AC1>The authors have answered almost all of my concerns.<\/AC1> <AC2>I will continue to recommend accepting this work.<\/AC2>"}]}, {"i": 3, "name": "Reviewer_aMQW", "rating": [null, 6], "messages": [{"message_id": "Reviewer_aMQW · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes an extension of GLIP for Open World Detection.<\/AC1> <AC2>The extension comprises two parts: one methodological by introducing a so-called parallel processing of the text data, and one more data related that allows the unification of many heterogeneous datasets for training.<\/AC2> <AC3>The latter also proposes a richer description of the categories -- deemed concepts in the paper -- through wordnet.<\/AC3>\n<AC4>The paper reports significant improvements of GLIP.<\/AC4> <AC5>It is mainly evaluated on LVIS dataset<\/AC5>\nstrengths_and_weaknesses: On the positive side:\n- <AC6>the authors study an important problem in literature that of open-world object detection where not many solutions are available<\/AC6>\n- <AC7>the parallel extension to GLIP, although straightforward, makes sense.<\/AC7> <AC8>The original GLIP sequentual formulation was problematic<\/AC8> and <AC9>did not scale well with a large number of categories<\/AC9>\n- <AC10>the authors did a good job in terms of proposing a framework for unifying many established and heterogeneous datasets including standard detection dataset, grounding data, and image/caption pairs.<\/AC10> <AC11>Actually, in my opinion, this is the biggest contribution of the paper.<\/AC11>\n- <AC12>the improvements over GLIP are significant.<\/AC12> <AC13>Even when trained on the same data, +5.1% is reported (table 3).<\/AC13>\nquestions: On the negative side:\n- <AC14>the methodological contribution of the parallel processing is rather thin<\/AC14> and <AC15>is actually the first thing that would come to mind when reading the original GLIP paper.<\/AC15>\n- <AC16>most of the improvements and contributions come from the dataset side.<\/AC16> <AC17>Although the framework for creating the dataset is worthy, it is more an engineering approach rather than an actual methodological contribution.<\/AC17> <AC18>After reading the paper you get mostly the impression that the authors created a much better dataset and then trained a (straightforward) extension of GLIP on it.<\/AC18>\n- <AC19>The evaluation on LVIS is sound and convincing.<\/AC19> However <AC20>with such big and heterogeneous data used, the zero shot capabilities of the method are not clear.<\/AC20> <AC21>Can the authors also evaluate following the VILD protocol (https://arxiv.org/pdf/2104.13921.pdf) where the method is trained on base classes and then explicitly evaluated on unseen classes?<\/AC21>\n\n**Final Recommendation**\n<AC22>As said I will stick to my original score which is line with the score from other Rs.<\/AC22>\nlimitations: <AC23>I didn't see a paragraph for this in the paper.<\/AC23>"}, {"message_id": "Reviewer_aMQW · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To Reviewer aMQW\nWe thank the reviewer for the positive feedback and insightful comments! All comments are summarized and addressed as follows.\n\n**R4Q1. <AC1>The parallel processing is rather thin<\/AC1> and <AC2>is actually the first thing that would come to mind.<\/AC2>**\n\n<AC3>We argue that the proposed paralleled formulation for unifying heterogeneous datasets is new.<\/AC3> <AC4>We also demonstrate this idea is neat yet effective.<\/AC4> <AC5>Specifically, it achieves significant performance improvement (+4.1% mAP on LVIS) compared with the sequential formulation used in GLIP, as compared in row1 and row2 in the Tabel 3 of the main paper.<\/AC5> And <AC6>paralleled formulation is also efficient for both training (5x faster than GLIP) and inference (19x faster than GLIP), as demonstrated in Table 2 of the main paper.<\/AC6> <AC7>These explorations can serve as a valuable guideline for the community to design vision-language models for open-domain detection tasks.<\/AC7>\n\n**R4Q2. <AC8>Most of the improvements and contributions come from the dataset side.<\/AC8> <AC9>It is more an engineering approach rather than an actual methodological contribution.<\/AC9>**\n\n<AC10>It should be noted that our main focus is not simply using more training data for learning, but to investigate and design an effective framework able to incorporate large-scale heterogeneous data sources to largely boost the learning of wider range of visual-language knowledge, and to provide a broader-generalization model for open-domain detection<\/AC10>, <AC11>which is a critically important direction that also shares the same motivation and focus as GLIP.<\/AC11> <AC12>While directly comparing to the pioneering work GLIP in this direction, our proposal has several key technical advantages and contributions: (i) we propose a neat yet effective paralleled formulation, (ii) we introduce a novel concept enrichment method with the proposed concept dictionary to explicitly build the relationship between categories (iii) we explore label completion technique to better utilize large-scale image-text pair data.<\/AC12> Moreover, <AC13>as demonstrated in Q1, our method can significantly improve the performance as well as the efficiency compared to GLIP.<\/AC13>\n\n**R4Q3. <AC14>Can the authors evaluate the proposed method following the VILD protocol?<\/AC14>**\n\n<AC15>GLIP protocol and VILD protocol are both common practices to evaluate the zero-shot detection performance.<\/AC15> <AC16>The former is a stronger and more challenging setting<\/AC16> since <AC17>it does not make any prior assumptions about the data distribution of downstream tasks<\/AC17>, For instance, <AC18>GLIP and DetCLIP can directly perform the evaluation on 13 detection datasets with highly varied distributions<\/AC18>, while <AC19>the VILD protocol still assumes the testing images and training images should come from the same dataset (LVIS).<\/AC19> Besides, <AC20>achieving a good performance under the GLIP protocol is more difficult<\/AC20> and <AC21>that is why we should use large-scale and heterogeneous training data.<\/AC21>\n\n<AC22>To make a more comprehensive evaluation of our method, we also perform experiments under the VILD protocol as suggested.<\/AC22> <AC23>We replace the Objects365 part in our training data with LVIS-base, and GoldG and YFCC1M are still included.<\/AC23> <AC24>Including additional data will lead to somehow unfair comparison with VILD<\/AC24> but <AC25>it is necessary<\/AC25> since <AC26>this is the core component in our method to enable zero-shot capability, which differs from VILD that distills knowledge from a pre-trained CLIP model.<\/AC26> The result is shown in the following Table. <AC27>Our method (27.3% mAP) outperforms VILD (22.5% mAP) by 4.8% mAP.<\/AC27> <AC28>Note that due to the limited time of the rebuttal, we implement DetCLIP using the same training/testing setting as in the paper, and do not use techniques such as large-scale jittering and prompt ensemble which is adopted by VILD to boost the performance.<\/AC28> <AC29>The comparison is updated in the revised paper (Table 5 in Appendix C).<\/AC29>\n\n| Model | Backbone | LVIS val AP |\n| :-----: | :------: | :---------: |\n| VILD | ResNet50 | 22.5 |\n| DetCLIP | ResNet50 | **27.3** |\n\n**R4Q4. <AC30>No limitation paragraph.<\/AC30>**\n\nPlease refer to the Appendix A.\n\n Global/general Response:\n```\nWe thank all the reviewers for their time, insightful suggestions, and valuable comments. <AC31>We are glad that **ALL** reviewers give positive feedback and find our method simple and effective, an elegant concept parallel framework that scales well with a large number of categories (reviewer 'rAnj' and 'aMQW'), with significant improvements over GLIP on LVIS and 13 downstream detection datasets (reviewer '5KVn', '82yp' and 'aMQW').<\/AC31>\n\nWe respond to each reviewer's comments in detail below. <AC32>We have also revised the main paper and appendix according to the reviewers' suggestions.<\/AC32> The main changes are listed as follows:\n\n- <AC33>In Table 1, we add comparisons with GLIP-C and GLIPv2-T.<\/AC33>\n\n- <AC34>In Appendix B, we elaborate on more implementation details about how to conduct pseudo labeling for YFCC dataset when using a large-size concept dictionary.<\/AC34>\n\n- <AC35>In Appendix C, we add an experiment to evaluate our method under VILD protocol.<\/AC35>\n\n- <AC36>In Appendix D, we add experimental results about the impact of the pre-trained language model for concept enrichment.<\/AC36>\n\n- <AC37>As suggested by Reviewer2, we revise the abstract to make it more clear and neat and modify the improper bold text.<\/AC37>\n\nNote that we marked the revisions in blue. We hope that our efforts address the reviewers' concerns.\n```"}, {"message_id": "Reviewer_aMQW · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: keep my original score\nI appreciate the authors' effort to address my comments, especially evaluating their method using the VILD protocol. <AC1>This result should be included in the final version (at least in the supplementary).<\/AC1> <AC2>I still believe I was right in my original assessment about the advantages and disadvantages of the proposed method.<\/AC2> Overall, <AC3>I still believe the paper makes a good contribution<\/AC3> and hence <AC4>I stick to my original score.<\/AC4>"}]}, {"i": 4, "name": "Reviewer_rAnj", "rating": [null, 6], "messages": [{"message_id": "Reviewer_rAnj · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper is developed based on GLIP<\/AC1>:\n\n- <AC2>To solve the problems of inefficient interaction between categories and the restriction of max input sentence length, it proposes a parallel method.<\/AC2> <AC3>Compared to the sequential input in GLIP, the paper extracts phrases as the input in a parallel manner.<\/AC3>\n- <AC4>To build implicit relationships between input phrases, it proposes a concept dictionary to provide the prior knowledge.<\/AC4>\n\n<AC5>The paper is verified in the task of zero-shot detection on LVIS.<\/AC5>\n\nstrengths_and_weaknesses: Strengths:\n- <AC6>The framework does make sense.<\/AC6> <AC7>I agree with the point that extracting the noun phrase is efficient for alignment between regions and concept words.<\/AC7>\n- <AC8>The proposed large-scale concept dictionary could be a future valuable toolkit for future open-vocabulary or vision-language research if it can be open-released.<\/AC8>\n- <AC9>Compared to GLIP, improvements are large.<\/AC9>\n\nquestions: - <AC10>The notations in Formula (1) are odd due to the upper letter T and Transpose.<\/AC10> <AC11>Please consider changing it.<\/AC11>\n- <AC12>Experiments mainly use Swin-Transformer as the backbone.<\/AC12> <AC13>Can the backbone be ViT?<\/AC13>\nlimitations: None."}, {"message_id": "Reviewer_rAnj · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To Reviewer rAnj\nWe thank the reviewer for the positive feedback and insightful comments! All comments are summarized and addressed as follows.\n\n**R3Q1. <AC1>Experiments mainly use Swin-Transformer as the backbone.<\/AC1> <AC2>Can the backbone be ViT?<\/AC2>**\n\n<AC3>Our method is not limited to a specific backbone.<\/AC3> <AC4>Other vision backbones like ViT or ResNet can be considered as a choice.<\/AC4> <AC5>Swin-Transformer is more suitable for object detection tasks compared to ViT<\/AC5> since <AC6>the window-attention mechanism can help significantly reduce the computational cost when the input has a high resolution.<\/AC6> <AC7>Another consideration of using Swin-Transformer is it can lead to a fair comparison with GLIP if we use the same backbone.<\/AC7> <AC8>If someone would like to use ViT as the backbone, we recommend following the method in [1].<\/AC8>\n\n[1] Li, Yanghao, et al. \"Exploring plain vision transformer backbones for object detection.\" arXiv preprint arXiv:2203.16527 (2022).\n\n**R3Q2. <AC9>The notations in Formula (1) should be changed.<\/AC9>**\n\nThanks for your suggestion, <AC10>we will change it in the revision.<\/AC10>\n Global/general Response:\n```\nWe thank all the reviewers for their time, insightful suggestions, and valuable comments. <AC11>We are glad that **ALL** reviewers give positive feedback and find our method simple and effective, an elegant concept parallel framework that scales well with a large number of categories (reviewer 'rAnj' and 'aMQW'), with significant improvements over GLIP on LVIS and 13 downstream detection datasets (reviewer '5KVn', '82yp' and 'aMQW').<\/AC11>\n\nWe respond to each reviewer's comments in detail below. <AC12>We have also revised the main paper and appendix according to the reviewers' suggestions.<\/AC12> The main changes are listed as follows:\n\n- <AC13>In Table 1, we add comparisons with GLIP-C and GLIPv2-T.<\/AC13>\n\n- <AC14>In Appendix B, we elaborate on more implementation details about how to conduct pseudo labeling for YFCC dataset when using a large-size concept dictionary.<\/AC14>\n\n- <AC15>In Appendix C, we add an experiment to evaluate our method under VILD protocol.<\/AC15>\n\n- <AC16>In Appendix D, we add experimental results about the impact of the pre-trained language model for concept enrichment.<\/AC16>\n\n- <AC17>As suggested by Reviewer2, we revise the abstract to make it more clear and neat and modify the improper bold text.<\/AC17>\n\nNote that we marked the revisions in blue. We hope that our efforts address the reviewers' concerns.\n```"}, {"message_id": "Reviewer_rAnj · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thanks for the authors' response. <AC1>The authors have answered almost all of my concerns.<\/AC1>"}]}]}, {"paper_id": "7YTh6S8HIY", "decision": "Accept", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>This paper proposes PyramidCLIP.<\/AC1> <AC2>It improve contrastive learning method CLIP with more fine-grained information to produce multiple views of both the image and text during training.<\/AC2> <AC3>During inference/evaluation, only the standard view is used.<\/AC3> <AC4>The empirical results with different network architectures at different pretraining data scales show that the proposed Pyramid achieves clear gain over the baseline methods.<\/AC4>\n\n<AC5>The paper is comprehensively discussed, and receives unanimous accept from all reviewers<\/AC5>, <AC6>leading to an ``Accept'' decision.<\/AC6> <AC7>The authors are highly encouraged to revise the paper accordingly.<\/AC7> <AC8>The authors reported results on a customized benchmark, and showed improvement based on its own baseline.<\/AC8> <AC9>In the future, the authors are highly encouraged to report results based on a common benchmark below [*], so that readers can clearly see the position of PyramidCLIP in the context of all other similar papers in the literature.<\/AC9>\n\n[*] https://computer-vision-in-the-wild.github.io/eccv-2022/\nconfidence: Certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_BusK", "rating": [5, 5], "messages": [{"message_id": "Reviewer_BusK · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>Under the contrastive CLIP learning framework, the work proposes to utilize more fine-grained information to produce multiple views of both the image and text during training<\/AC1>, and hence <AC2>constructs more contrastive loss terms across different views.<\/AC2> <AC3>During inference/evaluation, only the standard view is used.<\/AC3>\n\n<AC4>Empirically, with 3 different architectures (ResNet50/ViT-B32/ViT-B16), different pretraining data scales and several down-stream datasets, authors show that the proposed approach achieves clear gain over the baseline systems.<\/AC4>\nstrengths_and_weaknesses: <AC5>The work follows a natural motivation<\/AC5> and <AC6>achieves very good empirical gain over some strong baseline systems.<\/AC6> Overall, <AC7>the paper is well written<\/AC7> and <AC8>the empirical study is solid.<\/AC8>\n\n<AC9>A key concern I have is whether the comparison is fair enough.<\/AC9> <AC10>If I understand correctly, for each view of either the image or the text, we need to feed the view into the model once, which leads to roughly 2x - 3x additional computation cost.<\/AC10> <AC11>Again, if my understanding is correct, despite using the same batch size, the actual pretraining cost might be much higher for the proposed method than baselines<\/AC11>, <AC12>making the comparison less information.<\/AC12> <AC13>A better comparison seems to be make the batch size of baselines larger until the training cost is comparable.<\/AC13>\nquestions: <AC14>If my understanding above is correct, how would the comparison look like if similar training cost is invested in training the baselines, particularly with soften and LeFF disabled?<\/AC14> (NOTE: <AC15>In my opinion, this is very critical for judging whether the proposed method is really useful.<\/AC15> Hence, <AC16>my final review will largely depend on this.<\/AC16>)\nlimitations: <AC17>I don't see any particular problem here.<\/AC17>"}, {"message_id": "Reviewer_BusK · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Reply to Reviewer BusK\n<AC1>During the training process, the computation cost of PyramidCLIP is about 2.3 times that of baseline.<\/AC1> Therefore <AC2>we compare the baseline (with longer training time and larger batch size) and PyramidCLIP (with soften target and LeFF disabled)<\/AC2> and the results are shown in the table below. <AC3>For fair comparison, all of these experiments are conducted on CC3M, using 16 V100 and the same hyperparameters.<\/AC3>\n\n<AC4>It can be seen that when we adjust the training epoch of the baseline from 8ep to 2times (16ep) or even 3times (24ep), the improvement is not obvious<\/AC4>, and <AC5>it still underperforms PyramidCLIP trained with 8ep.<\/AC5>\n\n| Batch Size | Epoch | Model | ImageNet Zero-shot Top1 | Model | ImageNet Zero-shot Top1 |\n| :-: | :-: | :-: | :-: |:-: |:-: |\n| 2048 | 8 | CLIP-ResNet50 | 18.9 | CLIP-ViT-B/32 | 10.6 |\n| 2048 | 16 | CLIP-ResNet50 | 19.7 | CLIP-ViT-B/32 | 11.7 |\n| 2048 | 24 | CLIP-ResNet50 | 20.2 | CLIP-ViT-B/32 | 13.6 |\n| 4096 | 8 | CLIP-ResNet50 | 18.3 | CLIP-ViT-B/32 | 9.7 |\n| 4096 | 16 | CLIP-ResNet50 | 18.9 | CLIP-ViT-B/32 | 10.9 |\n| 2048 | 8 | PyramidCLIP-ResNet50 | 23.8 | PyramidCLIP-ViT-B/32 | 16.8 |\n\nFurthermore, <AC6>we would like to emphasize the importance of soften target proposed in PyramidCLIP.<\/AC6> <AC7>As shown in the table above, when we increase the batch size of baseline from 2048 to 4096, the top-1 acc drops instead.<\/AC7> <AC8>We attribute this phenomenon to that the repetitive rate of text in the existing image-text paired datasets is too high<\/AC8>, since <AC9>they are constructed by crawling images through a text on the Internet<\/AC9>, and <AC10>it is very likey that one text corresponds to multiple images.<\/AC10> (<AC11>We calculates the text repetitive ratio in the CC3M dataset, which is as high as 30.24%.<\/AC11> <AC12>Same phenomenon also occurs in other pretraining datasets.<\/AC12>） Therefore, <AC13>when the batch size increases, the probability of false negative samples will also increase.<\/AC13>\n\n| Batch Size | Epoch | Model | ImageNet Zero-shot Top1 |\n| :-: | :-: | :-: | :-: |\n| 2048 | 8 | PyramidCLIP-ResNet50 (w/o soften target) | 23.8 |\n| 2048 | 8 | PyramidCLIP-ResNet50 (w/ soften target) | 24.5 |\n| 4096 | 8 | PyramidCLIP-ResNet50 (w/o soften target) | 23.4 |\n| 4096 | 8 | PyramidCLIP-ResNet50 (w/ soften target) | 24.3 |\n\n<AC14>As shown in the table above, soften target can significantly alleviate the problem of false negatives<\/AC14>, <AC15>which brings insight for follow-up research in this field.<\/AC15>\nHi, Reviewer BusK, did our reply address your concerns? If you have other concerns, please feel free to let us know."}, {"message_id": "Reviewer_BusK · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thank you for the authors' detailed response. <AC1>They have addressed most of the issues I raised<\/AC1>, and <AC2>I will consider raising the rating score.<\/AC2>"}]}, {"i": 2, "name": "Reviewer_QuL5", "rating": [null, 7], "messages": [{"message_id": "Reviewer_QuL5 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes a new framework called PyramidCLIP for vision-language pre-training (VLP).<\/AC1> <AC2>PyramidCLIP first extracts multi-level features from both the visual and linguistic domains and then conducts contrastive learning by aligning visual and linguistic features in both peer-level and cross-level ways.<\/AC2> <AC3>In this way, the vision and language representations learned by PyramidCLIP encode better image-text alignment<\/AC3>, <AC4>which alleviates the semantic mismatch problem that exists in the image-text pairs for pre-training.<\/AC4> Moreover, <AC5>the authors also replace the loss term of the negative samples in contrastive learning with a softened version, to tackle the problem that different image-text pairs may have potential correlation.<\/AC5> <AC6>The empirical results show that PyramidCLIP clearly outperforms the CLIP baseline in a variety of downstream tasks<\/AC6> and also <AC7>achieves SoTA performance on several downstream tasks, as compared with other VLP models.<\/AC7>\nstrengths_and_weaknesses: ### Strengths\n* <AC8>This paper addresses the problem of the quality of image-text pairs (which is an important problem in VLP) using hierarchical feature alignment.<\/AC8> <AC9>The core idea and specific designs of the proposed PyramidCLIP are generally reasonable.<\/AC9>\n* <AC10>The authors conduct extensive experiments to demonstrate the effectiveness of PyramidCLIP, covering different backbone architectures (ResNet50 and ViT-B), pre-training datasets of varying sizes and a variety of downstream tasks (zero-shot image classification, zero-shot image-text retrieval, linear probe, object detection and instance segmentation).<\/AC10>\n* <AC11>The ablation study is comprehensive<\/AC11>, <AC12>showing that all the components of the proposed method are conducive.<\/AC12>\n* <AC13>Qualitative analyses are conducted to intuitively show that PyramidCLIP learns better vision and linguistic representation than CLIP.<\/AC13>\n* <AC14>The paper is generally well-written and easy to follow.<\/AC14>\n\n### Weaknesses\n\n1. <AC15>Some specific designs of PyramidCLIP seem counter-intuitive.<\/AC15>\n* <AC16>Random crop cannot guarantee the quality, especially for the local view.<\/AC16> For example, <AC17>if the local view is irrelevant to the textual description, minimizing the distance of the corresponding features may confuse the model.<\/AC17>\n* <AC18>It is unclear how the cross-level alignment helps the modelling of relations between salient objects.<\/AC18> For example, <AC19>how does the model know that \"a table is next to a chair\", by contrasting the ROI features to the textual summary or the original text?<\/AC19> <AC20>It is better to provide an intuitive explanation.<\/AC20>\n\n2. <AC21>The difference between PyramidCLIP and existing VLP methods that also introduce multi-level semantics is not clearly discussed.<\/AC21> <AC22>In the related work, the authors state that \"Different from methods mentioned above, each level is input to the corresponding encoder individually, without concatenating.\"<\/AC22> <AC23>Such a difference seems trivial and incremental.<\/AC23>\n\n3. <AC24>Many methods described in the related work are not compared in the experiments, especially the methods that also introduce multi-level semantics (e.g., MVPTR and X-VLM).<\/AC24>\n\nquestions: * <AC25>Could you provide an explanation about how the cross-level alignment helps the modelling of relations between salient objects?<\/AC25>\n* <AC26>Could provide a more detailed discussion on the difference between PyramidCLIP and the VLP methods that also introduce multi-level semantics?<\/AC26>\n* <AC27>Why not compare PyramidCLIP with MVPTR and X-VLM?<\/AC27>\nlimitations: * <AC28>The soften objective function treats all the negative samples equally using label smoothing<\/AC28>, <AC29>which is suboptimal considering different image-text pairs should have different degrees of correlation.<\/AC29>"}, {"message_id": "Reviewer_QuL5 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: Reply to Reviewer QuL5\n**Q1.1: About Random Crop.**\n\n<AC1>We assume that the information at the edge of the image usually does not appear in the caption, or is not the main description of the caption.<\/AC1> <AC2>When constructing the local view, the ratio of random crop is 0.5-1, and its expectation is 0.75.<\/AC2> Therefore, <AC3>the discarded area is usually the bounding rectangle<\/AC3>, <AC4>which can eliminate the irrelevant information of the image.<\/AC4>\n\n<AC5>We supplement an experiment in the table below, adjusting the scale of the ramdom crop ratio for the local view from 0.5-1 to using the whole image.<\/AC5> <AC6>It can be seen that the improvement brought by the random crop operation is quite obvious<\/AC6>, <AC7>which further verifies that the random crop operation can indeed discard parts of the image that are not related to the captions.<\/AC7>\n\n| Method | YFCC5M |\n| --- | :-: |\n| PyramidCLIP (random crop=0.5-1) | 31.8 |\n| PyramidCLIP (random crop disabled）| 30.2(-1.6) |\n\nNote that <AC8>YFCC5M are randomly sampled from YFCC15Mv1.<\/AC8>\n\n**Q1.2: About Cross-level Relation Alignment.**\n\n<AC9>Our ROI features are position-sensitive, and its dimension is 2052D, of which 2048D is for appearance, 4D is the position coordinate information.<\/AC9> <AC10>After MHSA aggregates ROI features, the class token contains the relationship between ROIs, both appearance and location.<\/AC10> <AC11>Then we contrast the relation class token with textual summay and the original text.<\/AC11> <AC12>Taking \"a table is next to a chair\" as an example, we detect the visual feature and position information of \"table\" and \"chair\" from the image, and obtain the visual and location relationship of the two after MHSA integration, then contrast the relaiton-containing visual cls token with the caption (\"a table is next to a chair\")<\/AC12>, <AC13>which can enhance the text encoder's modeling of the relationship between \"table\" and \"chair\" and learning of preposition \"next\".<\/AC13>\n\n**Q2: About the difference between PyramidCLIP and existing VLP methods that introduce multi-level semantics.**\n\nHere we mainly discuss the differences between PyramidCLIP and OSCAR/VinVL/MVPTR/X-VLM from five perspectives, that are listed in the table below.\n\n| Method | Paradigm | Encoder Type | Auxiliary Pre-trained Model | Semantics Level | Pre-training Objective |\n| --- | :-: | :-: | :-: | :-: | :-: |\n| OSCAR/VinVL | Single-stream | Transformer-based | object(-attribute) detector | 2 levels（level concatenation） | 1）Masked Token Loss 2）Contrastive Loss |\n| MVPTR | Dual-stream + Cross-modal fusion | Transformer-based | 1) object detector 2) scene graph parser | 2 levels（level concatenation) | 1）Masked Concept Recovering 2）Contrastive Loss 3）Weakly-supervised Phrase Grounding 4）Masked Language Modeling 5）Image Text Matching |\n| X-VLM | Dual-stream + Cross-modal fusion | Transformer-based | None | several levels(each level processed parallelly) | 1）Bounding Box Prediction 2）Contrastive Loss 3）Matching Prediction 4）Masked Language Modeling |\n|PyramidCLIP | Dual-stream | Visual: CNN-based or ViT-based, Text: Transformer-based | 1) object-attribute detector 2）summary extractor | 3 levels(each level processed parallelly) | Contrastive Loss |\n\n<AC14>It can be seen that PyramidCLIP is a pure dual-stream network that does not need concatenating tokens from two modalities, and only requires contrastive loss for training<\/AC14>, <AC15>which is succinct.<\/AC15> Moremore, <AC16>PyramidCLIP can support more kinds of visual encoders, both CNN and ViT<\/AC16>, <AC17>which is more flexible.<\/AC17> In addition, <AC18>compared to OSCAR/VinVL/MVPTR, PyramidCLIP can support more granular semantics<\/AC18>; <AC19>compared to X-VLM, PyramidCLIP is more flexible and does not rely on manually annotated bounding boxes and corresponding text descriptions.<\/AC19>\n\nNote that <AC20>X-VLM is similar to PyramidCLIP to some extend regardless of the final cross-modal encoder.<\/AC20> However, <AC21>the several levels of X-VLM only make sense for datasets containing labeled bounding boxes and corresponding annotations like COCO and Visual Genome.<\/AC21> <AC22>For datasets of image-caption pairs, it degenerates into only one level.<\/AC22> Besides, <AC23>the contrastive loss of X-VLM is employed at each level.<\/AC23> <AC24>Compared with X-VLM, PyramidCLIP also introduces cross-level alignment (contrastive loss) to provide more supervisions in addition to the peer-level alignment at each level.<\/AC24> And <AC25>the three levels of PyramidCLIP make sense for any dataset containing image-caption pairs.<\/AC25>\n**Q3: <AC26>About why not compare PyramidCLIP with MVPTR and X-VLM?<\/AC26>**\n\n<AC27>The targeted downsteam tasks of PyramidCLIP are quite different from MVPTR/X-VLM (see the table below).<\/AC27> <AC28>The common task is only zero-shot image-text retrieval.<\/AC28> However, <AC29>the model parameters are not comparable<\/AC29> since <AC30>MVPTR/X-VLM includes an additional cross-modal encoder.<\/AC30> Besides, <AC31>the pre-training datasets are also different.<\/AC31> Therefore, <AC32>comparison with MVPTR/X-VLM does not make much sense.<\/AC32> <AC33>PyramidCLIP is a further extension of CLIP<\/AC33>, so <AC34>it is mainly compared with CLIP-like methods (CLIP, SLIP, DeCLIP, FILIP and DeFILIP) in this paper.<\/AC34>\n\n| Method | Targeted Tasks | Model Params | Datasets(Web Crawled) | Datasets(Human Annotated) |\n| --- | :-: | :-: | :-: | :-: |\n| PyramidCLIP | image classification , image-text retrieval (zero-shot) , object detection and instance segmentation | 100M (RN50) | SBU, CC3M, CC12M, YFCC15M-V1, YFCC15M-V2, LAION99M | None |\n| MVPTR| image-text retrieval (finetune) , VQA, visual entailment, visual grounding | / | Conceptual Captions (CC) , SBU | MSCOCO, Flirck30k, GQA, OpenImages |\n| X-VLM | image-text retrieval (zero-shot and finetune) , VQA, NLVR2, visual grounding, image captioning | 216M | SBU, CC3M, CC12M | COCO, VG, Objects365, OpenImages |"}, {"message_id": "Reviewer_QuL5 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Response to \"Reply to Reviewer QuL5 (Part 1/2)\"\nThanks for taking the time to respond to my comments.\n\n**Q1.1: About Random Crop.**\n\n<AC1>I agree that producing the local view using random crop is an acceptable solution<\/AC1>, and, <AC2>intuitively, the [0.5,1] can indeed cover the relevant regions of the image in most cases.<\/AC2> However, <AC3>the possibility that \"the local view is irrelevant to the textual description\" is still a potential problem<\/AC3> because <AC4>there is a trade-off in terms of the ratio of the random crop.<\/AC4> <AC5>If the ratio is too small, it is likely that the local view is an irrelevant region.<\/AC5> <AC6>If the ratio is too large, it degenerates into the whole image.<\/AC6> Therefore, <AC7>I think it would be nice to further analyze this trade-off.<\/AC7>\n\n**Q1.2 and Q2**\n\n<AC8>My concern regarding these two questions is generally addressed.<\/AC8> Just one more question: <AC9>What are the advantages of pure dual-stream models over concatenating tokens from two modalities?<\/AC9> <AC10>Less computation?<\/AC10>"}, {"message_id": "Reviewer_QuL5 · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Reply to Reviewer QuL5\nQ1.1: About Random Crop.\n\n<AC1>Here we use salient ROI instances as evaluation metric to quantitatively analyze the quality of Local Crops.<\/AC1>\n\n<AC2>The ROI instances are salient objects detected by a powerful pre-trained detector.<\/AC2> <AC3>The more ROI instances the Local Crop contains, the more information of the original image the Local Crop contains.<\/AC3>\n\n<AC4>We define that if area(intersection(ROI, Local Crop))/area(ROI) > 0.5, the ROI is in the Local Crop.<\/AC4>\n\n<AC5>And the amount of information contained in Local Crop = #(ROIs in local crops)/#(All ROIs), term as InfoiLC.<\/AC5>\n\nIn the table below, we list the amount of information contained in the Local Crop (InfoiLC) under different random crop ratios, as well as the corresponding zero-shot ImageNet top-1 accuracy. <AC6>All are the results on the cc3m dataset.<\/AC6>\n\n| Random Crop Ratio | InfoiLC | IN ZS Top-1 |\n| --- | --- | --- |\n| 1.0-1.0 | 100% | 23.1 |\n| 0.9-1.0 | 99.1% | 22.8 |\n| 0.8-1.0 | 97.8% | 23.5 |\n| 0.7-1.0 | 96.2% | 23.6 |\n| 0.6-1.0 | 94.0% | 24.4 |\n| 0.5-1.0 | 93.0% | 24.5 |\n| 0.4-1.0 | 90.1% | 24.1 |\n| 0.3-1.0 | 87.1% | 24.0 |\n| 0.2-1.0 | 80.9% | 23.2 |\n\n<AC7>It can be seen that when the the random crop ratio is 0.5-1, the Local Crop still contains 93% of the original image information<\/AC7>, and <AC8>the result is improved by (24.5%-22.8%)=1.7%, compared to the random crop ratio 0.9-1.0 that contains 99.1% of the original image information.<\/AC8> <AC9>We hold the opinion that this improvement is brought by discarding the part of the image that does not match the caption.<\/AC9>\n\nIn addition, <AC10>it can also be seen that when the random crop ratio is too small, the zero-shot ImageNet Top-1 Acc will drop<\/AC10>, so <AC11>0.5-1.0 is a reasonable value.<\/AC11>\n\nQ1.2 and Q2: About the advantage of pure dual-stream models.\n\n1）<AC12>The parallelization of the dual-stream model is better.<\/AC12>\n\nOn the one hand, <AC13>in practice, for some tasks, such as zero-shot classification, text features can be extracted offline in advance<\/AC13>, <AC14>which is more flexible and friendly in actual deployment.<\/AC14>\n\nOn the other hand, <AC15>on some tasks that require one image and multiple captions to predict, such as zero-shot multi-label classification, dual-stream shows great flexibility.<\/AC15> <AC16>For the dual-stream model, an image and multiple captions are forwarded separately, and then compared at the end<\/AC16>, while <AC17>the single-stream model requires image-text(concatenate) to be forwarded multiple times.<\/AC17>\n\n2）<AC18>The computational cost of the dual-stream model is smaller than that of the single-stream<\/AC18>, since <AC19>the number of tokens input to the fusion transformer is the sum of visual tokens and language tokens.<\/AC19> (<AC20>Transformer performs Self-Attention on N tokens, with a complexity of O(N2).<\/AC20>)"}, {"message_id": "Reviewer_QuL5 · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "Title: Response\nThank you for the response. <AC1>My concerns are well-addressed now.<\/AC1> <AC2>It would be nice to see the additional results and discussions in the next version of the paper.<\/AC2> <AC3>I will raise my rating to 7.<\/AC3>"}]}, {"i": 3, "name": "Reviewer_WsHx", "rating": [8, 8], "messages": [{"message_id": "Reviewer_WsHx · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes hierarchical feature alignment for vision language pre-training, called PyramidCLIP, which alleviates semantic mismatch as well as mutual compatibility problems, i.e. false positives and false negatives.<\/AC1> <AC2>PyramidCLIP constructs inputs with three levels of semantics in visual and language modalities respectively<\/AC2> and then <AC3>resolves semantic mismatch through peer-level semantic alignment and cross-level relation alignment.<\/AC3> In addition, <AC4>PyramidCLIP adopts a soft form of InfoNCE to deal with mutual compatibility.<\/AC4>\nstrengths_and_weaknesses: Strengths:\n\n1. <AC5>This paper is well written and easy to follow.<\/AC5>\n\n2. <AC6>The motivation and solution of the article are clear.<\/AC6> <AC7>More precise hierarchical feature alignment for tackling semantic mismatch, and softening InfoNCE for mutual compatibility.<\/AC7>\n\n3. <AC8>The experiments are well designed<\/AC8>, and <AC9>the results are excellent.<\/AC9>\n\nLimitations:\n\nHave the authors adequately addressed the limitations and potential negative social impact of their work? If not, please include constructive suggestions for improvement. Authors should be rewarded rather than punished for
