function buildGraph(p, keepView) {
  const view = keepView && cy ? { zoom: cy.zoom(), pan: cy.pan() } : null;
  if (cy) { cy.destroy(); cy = null; }
  const box = $("#cy");
  if (!box) return;
  if (typeof cytoscape === "undefined") {
    box.innerHTML = `<div class="empty">Impossibile caricare la libreria del grafo (cytoscape.js da cdnjs): serve una connessione a Internet.</div>`;
    return;
  }
  const g = graphIndex(p);
  cy = cytoscape({ container: box, elements: graphElements(p, g), style: graphStyle(), layout: { name: "preset" },
    minZoom: 0.06, maxZoom: 4, boxSelectionEnabled: false, wheelSensitivity: 0.25 });
  cy.nodes(".blk").ungrabify();
  cy.on("tap", "node.ac", e => selectNode(e.target.id()));
  cy.on("tap", "edge", e => selectEdge(e.target.id()));
  cy.on("tap", e => { if (e.target === cy) selectNode(null); });
  cy.on("dbltap", "node.ac", e => {
    const near = e.target.closedNeighborhood().filter(x => !x.hasClass("off"));
    cy.animate({ fit: { eles: near, padding: 60 } }, { duration: 300 });
  });
  cy.on("mouseover", "node.ac", e => { e.target.addClass("hov"); e.target.connectedEdges().addClass("hov"); showTip(e.target); });
  cy.on("mouseout", "node.ac", e => { e.target.removeClass("hov"); e.target.connectedEdges().removeClass("hov"); hideTip(); });
  cy.on("mouseover", "edge", e => { e.target.addClass("hov"); showTip(e.target); });
  cy.on("mouseout", "edge", e => { e.target.removeClass("hov"); hideTip(); });
  cy.on("viewport grab", hideTip);
  updateSearch(false);
  applyFilters();
  if (view) { cy.zoom(view.zoom); cy.pan(view.pan); }
  else if (state.sel && g.node[state.sel]) focusView(true);
  else cy.fit(undefined, 30);
  renderPanel();
}

// ---- filtri: tipo di arco, thread, focus sul nodo selezionato
const edgeOn = e => (e.l === "s" ? state.gSup : state.gAtt) && (state.gIntra || !e.intra);

function focusSet(g, id) {
  const keep = new Set([id]);
  if (state.gFocus === "near") {
    for (const e of [...(g.out[id] || []), ...(g.inc[id] || [])]) if (edgeOn(e)) { keep.add(e.s); keep.add(e.t); }
    return keep;
  }
  // catena: tutto ciò che il nodo supporta/attacca (transitivamente) e tutto ciò che punta a lui
  for (const [dir, next] of [[g.out, e => e.t], [g.inc, e => e.s]]) {
    const stack = [id], seen = new Set([id]);
    while (stack.length) for (const e of dir[stack.pop()] || []) {
      const n = next(e);
      if (edgeOn(e) && !seen.has(n)) { seen.add(n); keep.add(n); stack.push(n); }
    }
  }
  return keep;
}

function applyFilters() {
  if (!cy) return;
  const p = byId[state.paper], g = graphIndex(p);
  cy.batch(() => {
    cy.elements().removeClass("off faded focus sel ext");
    cy.edges().forEach(x => {
      const [s, t] = x.id().split(">");
      x.toggleClass("off", !edgeOn((g.out[s] || []).find(e => e.t === t)));
    });
    let keep = null, own = null;
    if (state.gThread !== "all") {
      own = new Set(Object.keys(g.node).filter(id => String(g.node[id].thread) === state.gThread));
      keep = new Set(own);
      for (const id of own) for (const e of [...(g.out[id] || []), ...(g.inc[id] || [])]) if (edgeOn(e)) { keep.add(e.s); keep.add(e.t); }
    }
    if (state.sel && state.gFocus !== "fade") keep = focusSet(g, state.sel);
    if (gs.edge) keep = null;
    if (keep) {
      if (state.sel) keep.add(state.sel);
      cy.nodes(".ac").forEach(n => {
        n.toggleClass("off", !keep.has(n.id()));
        n.toggleClass("ext", !!own && !own.has(n.id()) && n.id() !== state.sel);
      });
    }
    if (!state.gIso) cy.nodes(".iso").forEach(n => { if (n.id() !== state.sel) n.addClass("off"); });
    cy.nodes(".blk").forEach(b => b.toggleClass("off", b.children().every(c => c.hasClass("off"))));
    if (gs.edge) {
      const e = cy.getElementById(gs.edge);
      cy.elements().not(".blk").not(e).not(e.connectedNodes()).addClass("faded");
      e.addClass("sel"); e.connectedNodes().addClass("focus");
    } else if (state.sel) {
      const n = cy.getElementById(state.sel);
      const edges = n.connectedEdges().not(".off");
      if (state.gFocus === "fade") cy.elements().not(".blk").not(n).not(edges).not(edges.connectedNodes()).addClass("faded");
      edges.addClass("focus"); edges.connectedNodes().addClass("focus"); n.addClass("sel");
    }
  });
}

// Sposta la vista dopo una selezione: nelle modalità "solo i vicini / catena" adatta a ciò che resta, altrimenti centra il nodo
function focusView(center) {
  if (!cy || !state.sel) return;
  const n = cy.getElementById(state.sel);
  if (state.gFocus !== "fade") cy.animate({ fit: { eles: cy.nodes(".ac").not(".off"), padding: 60 } }, { duration: 300 });
  else if (center) cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 1.1) }, { duration: 300 });
}

function selectNode(id, center = false, record = true) {
  const g = graphIndex(byId[state.paper]);
  const next = id && g.node[id] ? id : null;
  if (record && next && state.sel && state.sel !== next) gs.hist.push(state.sel);
  if (!next) gs.hist = [];
  state.sel = next; gs.edge = null;
  applyFilters();
  if (next) focusView(center);
  else if (state.gFocus !== "fade" && cy) cy.animate({ fit: { padding: 30 } }, { duration: 300 });
  renderPanel();
}

function selectEdge(eid) {
  gs.edge = eid; state.sel = null;
  applyFilters();
  renderPanel();
}

function goBack() {
  const prev = gs.hist.pop();
  if (prev) selectNode(prev, true, false);
}

// ---- tooltip
function showTip(el) {
  const tip = $("#gtip");
  if (!tip) return;
  const g = graphIndex(byId[state.paper]);
  const cut = (s, k) => esc(s.length > k ? s.slice(0, k) + "…" : s);
  if (el.isNode()) {
    const n = g.node[el.id()], o = (g.out[n.id] || []).length, i = (g.inc[n.id] || []).length;
    tip.innerHTML = `<code>${n.id}</code> <span class="lab ${g.lab[n.id]}">${LABEL_NAME[g.lab[n.id]]}</span> <span class="snip">${whoLabel(n)}</span><div>${cut(n.text, 260)}</div>
      <div class="snip">${o} in uscita · ${i} in entrata</div>`;
  } else {
    const [s, t] = el.id().split(">"), e = g.out[s].find(x => x.t === t);
    tip.innerHTML = `<code>${s}</code> <span class="rl ${e.l}">${REL[e.l][0]}</span> <code>${t}</code>${e.intra ? ' <span class="snip">(intra-turno)</span>' : ""}
      <div class="snip" style="margin-top:4px">${cut(g.node[s].text, 140)}</div><div style="margin-top:4px">${cut(g.node[t].text, 140)}</div>`;
  }
  tip.hidden = false;
  const pos = el.isNode() ? el.renderedPosition() : el.renderedMidpoint();
  const W = tip.parentElement.clientWidth, H = tip.parentElement.clientHeight;
  let x = pos.x + 16, y = pos.y + 16;
  if (x + tip.offsetWidth > W - 8) x = Math.max(8, pos.x - tip.offsetWidth - 16);
  if (y + tip.offsetHeight > H - 8) y = Math.max(8, pos.y - tip.offsetHeight - 16);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { const tip = $("#gtip"); if (tip) tip.hidden = true; }

// ---- ricerca
function updateSearch(jump) {
  const g = graphIndex(byId[state.paper]), q = state.gq.trim().toLowerCase();
  gs.matches = q.length < 2 ? [] : Object.values(g.node)
    .filter(n => n.id.toLowerCase() === q || n.id.toLowerCase().startsWith(q) || n.text.toLowerCase().includes(q)).map(n => n.id);
  if (!jump) gs.mi = -1;
  if (cy) { cy.nodes().removeClass("match"); gs.matches.forEach(id => cy.getElementById(id).addClass("match")); }
  const cnt = $("#g-count");
  if (cnt) cnt.textContent = q.length < 2 ? "" : gs.matches.length ? `${gs.mi >= 0 ? gs.mi + 1 + "/" : ""}${gs.matches.length} risultati` : "nessuno";
  if (jump && gs.matches.length) {
    gs.mi = (gs.mi + 1) % gs.matches.length;
    selectNode(gs.matches[gs.mi], true);
    if (cnt) cnt.textContent = `${gs.mi + 1}/${gs.matches.length} risultati`;
  }
}

// ---- pannello laterale
function relItems(list, dir, g) {
  if (!list.length) return `<div class="none">Nessuna</div>`;
  return `<ul>${list.map(e => {
    const other = dir === 0 ? e.t : e.s, txt = g.node[other].text;
    return `<li data-eid="${e.s}>${e.t}"><span class="rl ${e.l}">${REL[e.l][dir]}</span><button class="nlink" data-nid="${other}">${other}</button>
      <span class="lab ${g.lab[other]}">${LABEL_NAME[g.lab[other]]}</span>${e.intra ? " <span class='snip'>(intra-turno)</span>" : ""}
      <div class="snip">${esc(txt.length > 160 ? txt.slice(0, 160) + "…" : txt)}</div></li>`;
  }).join("")}</ul>`;
}

function renderPanel() {
  const p = byId[state.paper], g = graphIndex(p), panel = $("#gpanel");
  if (!panel) return;
  const back = gs.hist.length ? `<button class="btn" id="g-back" title="Torna al nodo precedente">← ${gs.hist[gs.hist.length - 1]}</button>` : "";
  if (gs.edge) {
    const [s, t] = gs.edge.split(">"), e = g.out[s].find(x => x.t === t);
    panel.innerHTML = `
      <div class="ghead"><b>Relazione</b>${e.intra ? "<span>intra-turno</span>" : ""}</div>
      <div class="ghead" style="margin-top:12px"><button class="nlink" data-nid="${s}">${s}</button><span>${whoLabel(g.node[s])}</span></div><div class="gtext">${esc(g.node[s].text)}</div>
      <div class="edge-arrow"><span class="rl ${e.l}">${REL[e.l][0]} ↓</span></div>
      <div class="ghead"><button class="nlink" data-nid="${t}">${t}</button><span>${whoLabel(g.node[t])}</span></div><div class="gtext">${esc(g.node[t].text)}</div>`;
    return;
  }
  if (!state.sel) {
    const by = k => g.edges.filter(k).length;
    const ids = Object.keys(g.node).filter(id => g.node[id].kind !== "dec");
    const cnt = l => ids.filter(id => g.lab[id] === l).length;
    const [a, r] = decLab(p);
    panel.innerHTML = `
      <div class="ghead"><b>Grafo argomentativo</b></div>
      <p class="snip">Ogni nodo è una componente argomentativa; le frecce vanno dall'argomento che supporta/attacca a quello bersaglio. Passa sopra un nodo o una freccia per un'anteprima, clicca per i dettagli.</p>
      <div class="kv">
        <span>Nodi</span><b>${ids.length}</b>
        <span>Supporto</span><b>${by(e => e.l === "s")}</b>
        <span>Attacco</span><b>${by(e => e.l === "a")}</b>
        <span>Intra-turno</span><b>${by(e => e.intra)}</b>
        <span>Tra turni / reviewer</span><b>${by(e => !e.intra)}</b>
        <span>Nodi isolati</span><b>${ids.filter(id => !g.out[id] && !g.inc[id]).length}</b>
      </div>
      <h4>Grounded</h4>
      <div class="kv">
        <span>Accept</span><b><span class="lab ${a}">${LABEL_NAME[a]}</span></b>
        <span>Reject</span><b><span class="lab ${r}">${LABEL_NAME[r]}</span></b>
        <span><span class="lab in">IN</span></span><b>${cnt("in")}</b>
        <span><span class="lab ou">OUT</span></span><b>${cnt("ou")}</b>
        <span><span class="lab un">UNDEC</span></span><b>${cnt("un")}</b>
      </div>
      <p class="snip">Calcolata come su argumentation.dimes.unical.it: grounded sugli attacchi estesi (diretti, più «X attacca Z e Z supporta Y ⇒ X attacca Y») e sugli argomenti fuori dai cicli di supporto, che risultano <i>out</i>. Quindi chi attacca una componente che supporta Accept attacca anche Accept.</p>
      <h4>Scorciatoie</h4>
      <div class="keys">
        <kbd>/</kbd><span>cerca un nodo (Invio = risultato successivo)</span>
        <kbd>Esc</kbd><span>deseleziona</span>
        <kbd>Backspace</kbd><span>nodo precedente</span>
        <kbd>F</kbd><span>adatta alla vista</span>
        <kbd>+</kbd><span>ingrandisci · <kbd>−</kbd> riduci</span>
        <kbd>P</kbd><span>mostra/nascondi pannello</span>
        <kbd>[</kbd><span>mostra/nascondi elenco paper</span>
      </div>
      <h4>Esportazione</h4>
      <p class="snip">«Esporta .apx» scarica l'intero BAF del paper (filtri esclusi): solo <code>arg</code>, <code>att</code> e <code>support</code>: le relazioni della discussione, i supporti della meta-review verso le decisioni e l'attacco reciproco tra <code>accept</code> e <code>reject</code>. Nomi: <code>r1w4</code> = 1RW4, <code>r2b3a1</code> = 2RB3_1, <code>r2f4a2</code> = 2RF4_2, <code>m3</code> = M3.</p>`;
    return;
  }
  const n = g.node[state.sel];
  panel.innerHTML = `
    <div class="ghead"><code>${n.id}</code><span class="lab ${g.lab[n.id]}">${LABEL_NAME[g.lab[n.id]]}</span><span>${whoLabel(n)}</span><span title="Nome del nodo nel file .apx esportato">export: <code>${apxName(n.id)}</code></span></div>
    <div class="gtext">${esc(n.text)}</div>
    <div class="btns">${back}${n.kind === "dec" ? "" : `<button class="btn" id="goto-text">Mostra nel testo</button>`}</div>
    <h4>In uscita (${(g.out[n.id] || []).length})</h4>${relItems(g.out[n.id] || [], 0, g)}
    <h4>In entrata (${(g.inc[n.id] || []).length})</h4>${relItems(g.inc[n.id] || [], 1, g)}`;
}

// Apre la vista testo sul thread che contiene il nodo e fa lampeggiare la sua componente
function showInText(nid) {
  setView("text");
  const n = graphIndex(byId[state.paper]).node[nid];
  if (typeof n.thread === "number") state.thread = n.thread;
  renderPaper();
  const span = document.querySelector(`#forum .ac[data-nid="${CSS.escape(nid)}"]`);
  if (span) { span.scrollIntoView({ block: "center" }); span.classList.add("flash"); }
}

function setView(v) {
  state.view = v;
  try { localStorage.setItem("rb-view", v); } catch (e) {}
}

function zoomBy(f) {
  if (cy) cy.animate({ zoom: { level: cy.zoom() * f, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } } }, { duration: 150 });
}

function toggleSide(collapse) {
  const app = $(".app");
  const c = collapse ?? !app.classList.contains("collapsed");
  app.classList.toggle("collapsed", c);
  save("rb-side-collapsed", c);
  const t = $("#side-toggle");
  if (t) t.setAttribute("aria-expanded", !c);
  setTimeout(() => { if (cy) cy.resize(); }, 260);
}

function toggleGraphPanel() {
  state.gPanel = !state.gPanel;
  save("rb-gpanel", state.gPanel);
  $("#gwrap")?.classList.toggle("nopanel", !state.gPanel);
  $("#g-panel")?.setAttribute("aria-pressed", state.gPanel);
  if (cy) cy.resize();
}

function render() { renderList(); renderPaper(); }

function select(pid) {
  if (pid !== state.paper) { state.sel = null; state.thread = null; state.gThread = "all"; gs.hist = []; gs.edge = null; }
  state.paper = pid;
  if (location.hash !== "#" + pid) history.replaceState(null, "", "#" + pid);
  $("#side").classList.remove("open");
  render();
}

function fromHash() {
  const pid = decodeURIComponent(location.hash.slice(1));
  if (byId[pid]) state.paper = pid;
  else if (!state.paper && papers.length) state.paper = papers[0].paper_id;
}

function save(k, v) { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} }

document.addEventListener("click", e => {
  const item = e.target.closest(".paper-item");
  if (item) return select(item.dataset.pid);
  const chip = e.target.closest(".chip");
  if (chip) {
    state.filter = chip.dataset.f;
    chip.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
    return renderList();
  }
  const tab = e.target.closest(".tab[data-tid]");
  if (tab) { state.thread = +tab.dataset.tid; return renderPaper(); }
  if (e.target.closest("#split")) { state.split = !state.split; save("rb-split", state.split); return renderPaper(); }
  const vbtn = e.target.closest(".viewswitch button");
  if (vbtn) { setView(vbtn.dataset.view); return renderPaper(); }
  const nl = e.target.closest(".nlink");
  if (nl && nl.dataset.goto) { state.sel = nl.dataset.goto; gs.hist = []; setView("graph"); return renderPaper(); }
  if (nl) return selectNode(nl.dataset.nid, true);
  const id = e.target.closest("button")?.id;
  if (id === "goto-text" && state.sel) return showInText(state.sel);
  if (id === "export") return exportAPX(byId[state.paper]);
  if (id === "g-back") return goBack();
  if (id === "g-fit" && cy) return cy.animate({ fit: { padding: 30 } }, { duration: 300 });
  if (id === "g-zin") return zoomBy(1.3);
  if (id === "g-zout") return zoomBy(1 / 1.3);
  if (id === "g-reset") return buildGraph(byId[state.paper], true);
  if (id === "g-panel") return toggleGraphPanel();
  if (id === "g-full") {
    const a = $("#garea");
    return document.fullscreenElement ? document.exitFullscreen() : a?.requestFullscreen?.();
  }
  if (id === "side-toggle") return toggleSide(true);
  const ac = e.target.closest("#forum.hl .ac[data-nid]");
  if (ac && !getSelection().toString()) {
    state.sel = ac.dataset.nid; gs.hist = []; setView("graph");
    return renderPaper();
  }
  if (id === "menu") {
    if (matchMedia("(min-width: 761px)").matches) return toggleSide(false);
    return $("#side").classList.toggle("open");
  }
  if (!e.target.closest("#side")) $("#side").classList.remove("open");
});
document.addEventListener("change", e => {
  if (e.target.id === "hl") { state.hl = e.target.checked; save("rb-hl", state.hl); renderPaper(); }
  if (e.target.id === "gcolor") { state.gcolor = e.target.checked; save("rb-gcolor", state.gcolor); renderPaper(); }
  if (e.target.id === "ids") { state.ids = e.target.checked; save("rb-ids", state.ids); document.body.classList.toggle("show-ids", state.ids); }
  if (e.target.id === "only") { state.only = e.target.checked; save("rb-only", state.only); document.body.classList.toggle("only-args", state.only); }
  if (e.target.id === "g-sup") { state.gSup = e.target.checked; applyFilters(); }
  if (e.target.id === "g-att") { state.gAtt = e.target.checked; applyFilters(); }
  if (e.target.id === "g-intra") { state.gIntra = e.target.checked; save("rb-gintra", state.gIntra); applyFilters(); }
  if (e.target.id === "g-iso") { state.gIso = e.target.checked; save("rb-giso", state.gIso); applyFilters(); }
  if (e.target.id === "g-nodes") {
    state.gNodes = e.target.value;
    try { localStorage.setItem("rb-gnodes", state.gNodes); } catch (err) {}
    const p = byId[state.paper];
    $(".glegend").outerHTML = renderGraphShell(p).match(/<div class="glegend">[\s\S]*?<\/div>/)[0];
    buildGraph(p, true);
  }
  if (e.target.id === "g-thread") {
    state.gThread = e.target.value;
    applyFilters();
    if (cy) cy.animate({ fit: { eles: cy.nodes(".ac").not(".off"), padding: 40 } }, { duration: 300 });
  }
  if (e.target.id === "g-focus") {
    state.gFocus = e.target.value;
    try { localStorage.setItem("rb-gfocus", state.gFocus); } catch (err) {}
    applyFilters(); focusView(true);
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "g-search") { state.gq = e.target.value; updateSearch(false); }
});
// passando su una relazione del pannello si evidenzia la freccia corrispondente
document.addEventListener("mouseover", e => {
  const li = e.target.closest(".gpanel li[data-eid]");
  if (li && cy) cy.getElementById(li.dataset.eid).addClass("hov");
});
document.addEventListener("mouseout", e => {
  const li = e.target.closest(".gpanel li[data-eid]");
  if (li && cy) cy.getElementById(li.dataset.eid).removeClass("hov");
});
// i colori vengono dai token CSS: ricostruisce il grafo quando cambia il tema
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (cy) buildGraph(byId[state.paper], true); });
addEventListener("resize", () => { if (cy) cy.resize(); });
document.addEventListener("fullscreenchange", () => { if (cy) { cy.resize(); cy.fit(undefined, 30); } });
$(".app").addEventListener("transitionend", e => { if (e.target === $(".app") && cy) cy.resize(); });
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
addEventListener("hashchange", () => { fromHash(); render(); });
addEventListener("keydown", e => {
  if (e.target.id === "g-search") {
    if (e.key === "Enter") { e.preventDefault(); updateSearch(true); }
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey || !state.paper) return;
  if (e.key === "[") return toggleSide();
  if (state.view === "graph") {
    if (e.key === "Escape") selectNode(null);
    else if (e.key === "Backspace") { e.preventDefault(); goBack(); }
    else if (e.key === "f" || e.key === "F") cy?.animate({ fit: { padding: 30 } }, { duration: 300 });
    else if (e.key === "+" || e.key === "=") zoomBy(1.3);
    else if (e.key === "-") zoomBy(1 / 1.3);
    else if (e.key === "p" || e.key === "P") toggleGraphPanel();
    else if (e.key === "/") { e.preventDefault(); $("#g-search")?.focus(); }
    return;
  }
  if (state.split && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const ts = byId[state.paper].threads, i = ts.findIndex(t => t.i === state.thread);
    const j = e.key === "ArrowRight" ? Math.min(i + 1, ts.length - 1) : Math.max(i - 1, 0);
    if (j !== i) { state.thread = ts[j].i; renderPaper(); }
  }
});

const total = papers.reduce((k, p) => k + nArgs(p), 0);
if (SEG) {
  $("#side h1").textContent = "Rebuttal Segmentation Viewer";
  document.title = "Rebuttal Segmentation Viewer";
  $("#subtitle").textContent = `${papers.length} paper · ${total} componenti · solo annotazioni`;
  $("#q").placeholder = "Cerca id paper o testo…";
} else {
const totRel = papers.reduce((k, p) => k + p.edges.length, 0);
$("#subtitle").textContent = `${papers.length} paper · ${total} argomenti · ${totRel} relazioni`;
  const real = d => papers.filter(p => p.decision === d).length;
  const solver = d => papers.filter(p => graphIndex(p).lab[d] === "in").length;
  const both = d => papers.filter(p => p.decision === d && graphIndex(p).lab[d] === "in").length;
  $("#side-stats").innerHTML = `
    <span></span><span class="h">Reali</span><span class="h">Grounded (in)</span>
    <span>Accept</span><b>${real("Accept")}</b><b title="di cui realmente Accept: ${both("Accept")}">${solver("Accept")} <span>(${both("Accept")} corretti)</span></b>
    <span>Reject</span><b>${real("Reject")}</b><b title="di cui realmente Reject: ${both("Reject")}">${solver("Reject")} <span>(${both("Reject")} corretti)</span></b>`;
}
fromHash();
render();
</script>
