tine agents from benign agents.<\/AC38> <AC39>This is completely different from the agent selection methods in [D5]-[D8].<\/AC39> <AC40>Papers [D1]-[D4] including our paper on Byzantine-tolerant machine learning dedicate to guaranteeing the robustness of the proposed algorithms without correctly identifying Byzantine agents<\/AC40>, and <AC41>their theories and ours hold even when malicious agents are included and benign agents are excluded.<\/AC41>\n\nWe take a toy example to illustrate. Assume that there are 5 agents in the network. Agent 1: $\\mu_1=1$; Agent 2: $\\mu_2=2$; Agent 3: $\\mu_3=3$; Agent 4: $\\mu_4 = 4$; Agent 5: $\\mu_5=5$. The ground truth average is $3$. We assume that agent 3 is a Byzantine agent. We consider two cases as follows.\n\nCase 1): <AC42>The Byzantine agent changes $\\mu_3=3$ to an extreme value ($\\mu_3'>5$ or $\\mu_3'<1$).<\/AC42> <AC43>Since we assume that the cloud is aware of the number of Byzantine agents ($|\\mathcal{B}|=1$), agent 3 is removed by our trimming rule (removing a largest value and a smallest value).<\/AC43> <AC44>The computed average is $3$, which is the ground truth average.<\/AC44>\n\nCase 2): <AC45>The Byzantine agent changes $\\mu_3=3$ to $\\mu_3'\\in(1,5)$.<\/AC45> <AC46>By applying our trimming rule, the values of agents 2, 3 and 4 are kept, and the computed average belongs to $(\\frac{7}{3},\\frac{11}{3})$<\/AC46>, <AC47>which is around the ground truth average.<\/AC47>\n\nThe above example provides the following insights. First, <AC48>when the cloud receives $\\mu_1$, $\\mu_2$, $\\mu_3'$, $\\mu_4 $ and $\\mu_5$, it cannot identify which one is the Byzantine agent<\/AC48>; Second, <AC49>even though some benign agents are removed and Byzantine agents are included, the computed averages are close to the ground truth average.<\/AC49> Third, <AC50>it is not always optimal for the Byzantine agent to choose extreme values.<\/AC50> <AC51>In case 1, the Byzantine agent chooses an extreme value but the ground truth average can be obtained.<\/AC51>\n\nTherefore, <AC52>our trimming rule is applicable to Byzantine agents with $arbitrary$ $messages$.<\/AC52> <AC53>It is interesting to adopt the suggested agent selection methods in our algorithm and theoretically analyze their robustness.<\/AC53> <AC54>We leave it as a future work.<\/AC54>\n\nReferences\n\n[D1] D. Yin, Y. Chen, R. Kannan, and P. Bartlett, “Byzantine-robust distributed learning: Towards\noptimal statistical rates,” in Proceedings of the International Conference on Machine Learning,\npp. 5650–5659, 2018.\n\n[D2] P. Blanchard, E. M. El Mhamdi, R. Guerraoui, and J. Stainer, “Machine learning with adversaries:\nByzantine tolerant gradient descent,” in Proceedings of International Conference on Neural\nInformation Processing Systems, pp. 118–128, 2017.\n\n[D3] D. Data and S. Diggavi, “Byzantine-resilient high-dimensional SGD with local iterations on\nheterogeneous data,” in Proceedings of the International Conference on Machine Learning,\npp. 2478–2488, 2021.\n\n[D4] L. Li, W. Xu, T. Chen, G. B. Giannakis, and Q. Ling, “RSA: Byzantine robust stochastic aggregation methods for distributed learning from\nheterogeneous datasets,” in Proceedings of the AAAI Conference on Artificial Intelligence, pp. 1544–1551, 2019.\n\n[D5] H. Jalali, M. Pawelczyk, and G. Kasneci, ``Gaussian experts selection using graphical models,'' https://arxiv.org/abs/2102.01496, 2021.\n\n[D6] H. Jalali and G. Kasneci, ``Aggregating Dependent Gaussian experts in local approximation,'' https://arxiv.org/abs/2010.08873, 2020.\n\n[D7] Y. Cao and D. J. Fleet, ``Generalized product of experts for automatic and principled fusion of Gaussian process predictions,'' https://arxiv.org/abs/1410.7827, 2014.\n\n[D8] M. P. Deisenroth and J. W. Ng, ``Distributed Gaussian processes,'' in Proceedings of the 32nd International Conference on Machine Learning, 2015.\n$Answer:$ Thank you so much for the suggestion, and <AC55>we modify it in our revised paper.<\/AC55> <AC56>In this paper, we train GPR using standard method and using all the local data.<\/AC56> But <AC57>the local GPR makes prediction for each test inputs using only one data point that is nearest to the test point.<\/AC57> <AC58>This reduces the computation complexity for prediction to the complexity of nearest neighbor search, which is $\\mathcal{O}(t)$ in the worst case.<\/AC58>\n\n<AC59>Similarly in the experiment, we use the partitioned data to train the GPR.<\/AC59> But <AC60>after training, for prediction, we only use one data point for each test input.<\/AC60> Thank you for pointing this out and <AC61>we also refine the description of the procedure in our revised paper.<\/AC61>"}, {"message_id": "Reviewer_vGEs · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "It was a pleasure to engage in the above discussion with the author, <AC1>which has made the paper much stronger.<\/AC1>"}]}]}, {"paper_id": "ZChgD8OoGds", "decision": "Accept", "conference": "NeurIPS 2022 Conference", "metareview": {"text": "metareview: <AC1>The authors propose an entropy search method for multi-objective Bayesian optimization that considers the mutual information gain of the location and value of the optimizer simultaneously while selecting query points.<\/AC1> <AC2>Most reviewers found the approach to be interesting.<\/AC2> <AC3>The work is commendable in its attempt to rigorously compare different information-based acquisition functions via high-quality re-implementations of algorithms (e.g., PESMO).<\/AC3> <AC4>Many reviewers left detailed comments that the authors addressed in part, or agreed to examine in the camera ready.<\/AC4> <AC5>Examples include more rigorous examination of the performance with respect to noise and batch size, inferential statistics for the experiments, and transparent reporting on the strengths and weaknesses relative to the existing literature.<\/AC5>\nconfidence: Certain", "segmented": true}, "threads": [{"i": 1, "name": "Reviewer_LjBd", "rating": [7, 7], "messages": [{"message_id": "Reviewer_LjBd · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This paper proposes a novel information-theoretic acquisition function for BO called Joint Entropy Search (JES), which considers the joint information gain for the optimal set of inputs and outputs.<\/AC1> <AC2>The authors present several analytical approximations to the JES acquisition function<\/AC2> and also <AC3>introduce an extension to the batch setting.<\/AC3> <AC4>The authors show the effectiveness of this new approach on a range of synthetic and real-world problems in terms of the hypervolume and its weighted variants<\/AC4>\nstrengths_and_weaknesses: Strength 1, <AC5>it identifies the problem of predictive entropy search (PES) method, i.e., the acquisition function is heavily dependent on the approximation of p(y|x, Dn, X∗)<\/AC5>, <AC6>which is difficult to implement and optimize.<\/AC6> Besides, <AC7>it also shows that the max-value entropy search (MES) method, though comes with closed-form expressions, does not directly dealing with the maximum Y∗.<\/AC7> <AC8>JES combines the advantages of both methods.<\/AC8>\n\nStrength 2, <AC9>it gives several theoretic property of the JES function, with in-depth study.<\/AC9>\n\nStrength 3, <AC10>the experiments are very detail<\/AC10>, and <AC11>have a good overall design.<\/AC11>\nquestions: No\nlimitations: <AC12>the authors adequately addressed the limitations of their work. i.e., the computational complexity of JES.<\/AC12>"}, {"message_id": "Reviewer_LjBd · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To LjBd\nMany thanks for the positive feedback.\n Global/general Response:\n```\nWe thank all the reviewers for their comments and the effort to assess our paper. <AC1>In our revised manuscript, we have addressed the most common and important points<\/AC1>:\n\n- <AC2>We have clarified that the modification to the noiseless conditional entropy estimate was meant as an ad hoc adjustment to account for the amount of exploration when there is observation noise.<\/AC2> As <AC3>this result caused some confusion<\/AC3>, <AC4>we have relegated it to Appendix D in favour of emphasizing our main result in Prop. 2 (previously Prop. 3), which gives a more principled and better performing estimate.<\/AC4>\n\n- <AC5>We have further emphasised the connection to existing work in the main text.<\/AC5>\n\n- <AC6>We have provided error bars in the plots.<\/AC6>\n\n- <AC7>We have added an in-sample standard hypervolume comparison (Appendix J.4) as requested by one of the reviewers.<\/AC7>\n\n- <AC8>We have augmented the discussion of the experiments with additional points raised by the reviewers.<\/AC8>\n\n- <AC9>We have sorted all typos and minor errors.<\/AC9>\n\nBelow we provide a point-by-point response to each reviewer separately.\n```"}, {"message_id": "Reviewer_LjBd · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Thanks for the authors' response. <AC1>Most of my concerns have been addressed.<\/AC1> <AC2>I will continue to recommend accepting this work.<\/AC2>"}]}, {"i": 2, "name": "Reviewer_QtD3", "rating": [null, 4], "messages": [{"message_id": "Reviewer_QtD3 · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>This work proposes a novel acquisition function JES for multi-objective Bayesian optimization based on the joint entropy of the optimal inputs and outputs.<\/AC1> <AC2>Previously works have studied input and output entropy independently.<\/AC2> <AC3>The work proposes novel entropy approximations—particularly one based on moment-matching, which has been previously used in the single objective setting but not the multi-objective setting.<\/AC3> <AC4>The work extends the proposed JES acquisition function to the batch setting using an additional approximation.<\/AC4> In addition, <AC5>this work analyzes potential for negative pathologies when using the hypervolume indicator for evaluation<\/AC5> and <AC6>proposes an alternative weighted hypervolume evaluation criterion.<\/AC6>\nstrengths_and_weaknesses: <AC7>Although this paper is largely well-written and provides precise detail on the empirical setup and evaluation, the contributions are limited.<\/AC7> <AC8>Multi-objective BO is an important but well-studied space.<\/AC8> Hence, <AC9>the work can, inherently, at best be incremental.<\/AC9> Furthermore, <AC10>entropy-based methods have been studied in multi-objective BO.<\/AC10> <AC11>The contributions of a novel joint input/output entropy acquisition function and a new multi-objective entropy approximation show improvement over previous ES methods<\/AC11>, but <AC12>these are small contributions that leverage well-studied ideas from the literature.<\/AC12> <AC13>Although JES approximations show good empirical performance, the evaluation is limited to evaluating the out-of-sample model predicted Pareto frontier.<\/AC13> <AC14>This evaluation technique favors and is well-suited to information theoretic methods<\/AC14>, but <AC15>as the paper states often time decision-makers would prefer to launch a previously evaluated design (regardless of whether this is observation noise).<\/AC15> Therefore, <AC16>it is not clear that JES approximations outperform alternative approaches such as DGEMO and NEHVI when the decision maker is only interested in choosing a final design at implementation time from the set of previously evaluated designs.<\/AC16> <AC17>Evaluation of the performance using this in-sample Pareto frontier (under the noiseless objectives) would help provide more clarity.<\/AC17> Furthermore, <AC18>the absense of error bars in the empirical evaluation makes it impossible to determine which differences in performance are statistically significant.<\/AC18> Moreover, <AC19>the paper does not propose one single JES approximation to use.<\/AC19> <AC20>There are numerous JES methods and many confusing acronyms<\/AC20>, and <AC21>the empirical evaluation does not obviously indicate a single best JES method (even based on the mean performance, without accounting for uncertainty).<\/AC21> In addition, <AC22>JES is computationally intensive and is slower than even EHVI-based methods---which are known to be computationally demanding.<\/AC22>\n\n<AC23>The additional contributions of an analysis of the HV indicator and the proposed weighted HV metric are a bit orthogonal to the new JES method<\/AC23> and <AC24>feel out of place with the rest of the paper, which focuses on JES.<\/AC24> <AC25>It seems like the weighted HV metric should be de-emphasized in the main text (specifically, the contributions)<\/AC25>, since <AC26>it is not actually used in the main text<\/AC26> and <AC27>it is unclear what distribution is appropriate for sampling scalarization weights.<\/AC27> <AC28>The weighted HV and HV analysis are not JES specific, but is a general comment on multi-objective optimization that is out-of-place with the JES-focus of the paper.<\/AC28>\n\n<AC29>It is worth noting that code is provided and well-documented.<\/AC29> <AC30>This is particularly notable<\/AC30> because <AC31>PES is known to be difficult to implement and most BO papers leverage an old Spearmint implementation with now unsupported dependencies.<\/AC31> <AC32>A high-quality PES implementation is of value to the community.<\/AC32>\n\nOn a whole, a) <AC33>the contributions are scattered (results on JES, results on ES methods handling monotonic transformations, an analysis of using HV for evaluating multi-objective optimization algorithms)<\/AC33>, b) <AC34>the JES-specific contributions are incremental (a new joint entropy and a new application of an approximation techniques from the single objective setting)<\/AC34>, and c) <AC35>the empirical evaluation is difficult to interpret (which JES method is best/should be used, what does performance look like if only in-sample---rather than out-of-sample---designs can be used in the Pareto frontier)<\/AC35> and <AC36>lacks measures of statistical significance.<\/AC36>\nquestions: * <AC37>How well does the constrained version work empirically?<\/AC37>\n* <AC38>How robust is the performance to the noise level?<\/AC38>\n* <AC39>The JES approach seems quite incremental.<\/AC39>\n  * <AC40>The input entropy and output entropy are well-studied<\/AC40>\n  * <AC41>The moment-matching approximation is well-studied in the single objective case [50]<\/AC41>\n  * <AC42>The box decomposition-based entropy computation is proposed in [68]<\/AC42>\n  * <AC43>Lemma 1 is not novel.<\/AC43> <AC44>It comes directly from [68] and is used in [68] which should be made more prominent<\/AC44>\n  * <AC45>The whole JES computation algorithm is an incarnation of BAX with a different acquisition function than PES and a different approximation method.<\/AC45>\n* <AC46>JES does not support modeling correlated outcomes---independent GPs models are assumed to be used.<\/AC46> <AC47>Why then distinguish equations (10) and (11)?<\/AC47> Also, <AC48>Why does Figure 3 show correlation between outcomes?<\/AC48> <AC49>Aren’t the covariances matrices across outcomes for a single point always diagonal under the assumption of the independent GP models?<\/AC49>\n* <AC50>The batch extension follows [50]<\/AC50> and <AC51>is “suboptimal” (L193)<\/AC51> and <AC52>approximates the joint JES across a batch of points with the sum of the independent entropies of each point.<\/AC52> <AC53>Why would the best batch of `q` points not be the same point `q` times using this acquisition function?<\/AC53>\n  * Also, <AC54>sequential greedy batch selection is common practice.<\/AC54> <AC55>While the submodularity proof is neat, it applies to 1) approximating true batch JES with sequential greedy or 2) approximating the coarse approximation (sum of independent entropy) of batch JES with sequential greedy.<\/AC55> <AC56>It makes no guarantees about how well the coarse approximation (12) approximates batch JES (or some approximate version of JES without the batch independent entropy approximation (12)).<\/AC56> <AC57>This error seems like it could be quite large.<\/AC57>\n  * <AC58>How does JES scale with increasing batch size both in terms of wall time and in terms of optimization performance?<\/AC58> <AC59>It is hard to draw conclusions from q=1 and q=8 alone.<\/AC59>\n* <AC60>Why does this paper focus on multi-objective JES and not a single objective JES?<\/AC60>\n* <AC61>Being invariant to component-wise monotonic transformations of the objectives is a nice property of entropy-based methods (prop 4).<\/AC61> But <AC62>this is not specific to JES<\/AC62>, and therefore <AC63>seems a bit odd to include.<\/AC63>\n* Page 7 footnote: “The reference point is typically chosen to be the nadir…”. <AC64>Typically the reference point is typically chosen to be *slightly worse* than the nadir of the *Pareto frontier*, *not the entire objective space* as stated in the footnote.<\/AC64> <AC65>Using the nadir of entire objective space (as described) would often be a poor choice of reference point<\/AC65> because <AC66>it would be very far from the pareto frontier.<\/AC66> <AC67>Was this strategy used for evaluation purposes (hypervolume computation) in the experiments?<\/AC67> Also <AC68>using the nadir of the Pareto frontier directly would be a poor choice<\/AC68> because <AC69>it gives zero hypervolume to the end points, which is why the reference point is typically chosen to be slightly worse than the nadir (see Ishibuchi et al., 2011).<\/AC69>\n  * L954/983: <AC70>using a nadir over all observed points as the reference point is also is likely a poor choice for solving the MOOP problem for recommendation and for use in NEHVI and EHVI.<\/AC70> <AC71>A point that is slightly worse than the nadir point over the pareto frontier across the observed designs is likely a much better choice<\/AC71> because it 1) <AC72>will ensure that it is not very far from the current pareto frontier, which could be the case with using the nadir across all observed points<\/AC72> and 2) <AC73>gives non-zero hypervolume to the endpoints of the pareto frontier and beyond the endpoints, which is likely very important for discovering designs outside of the currently observed Pareto frontier with EHVI/NEHVI.<\/AC73>\n  * <AC74>It is very hard to distinguish the trend lines in Figure 5.<\/AC74> <AC75>I would recommend focusing on one JES method.<\/AC75> <AC76>This would also help the reader understand which JES method is best and should be used.<\/AC76> <AC77>Currently, this is very hard to parse.<\/AC77> <AC78>The colors for TSEMO and LB-JES-0 are very similar.<\/AC78>\n  * Also, <AC79>can you provide error bars please?<\/AC79> <AC80>Currently, it is not clear which differences in performance are statistically significant<\/AC80>\n* <AC81>How does the performance look on noiseless problems?<\/AC81>\n* L288: <AC82>Regarding being able to specify a preferred region (via the reference point) with hypervolume-based methods, this seems like a positive.<\/AC82> <AC83>It seems like a major drawback of entropy-based methods to only be able to identify the entire Pareto frontier and not just an area of interest.<\/AC83>\n* <AC84>For problems such as the ZDT family, the optimal designs lie in a small region of design space.<\/AC84> <AC85>This means that the heuristic for selecting the initial points for gradient-based acquisition optimization is particularly important for improvement-based acquisition functions<\/AC85> since <AC86>they can be 0 over a large portion of the design space.<\/AC86> <AC87>In L903, the paper says that initial points were not sampled near the Pareto frontier, which would have led to faster convergence for entropy-methods.<\/AC87> <AC88>I think it would be even more important for improvement-based methods.<\/AC88> <AC89>Can you provide empirical results were the initialization heuristic does sample points near the current best (pareto optimal) for acquisition optimization?<\/AC89>\n\nMinor comments\n\nL24: <AC90>“trade-off” -> “trade-offs”<\/AC90>\n\nL31: <AC91>“might suffer when the scale of the objectives is unknown apriori”. A common approach is simply to rescale the objectives to the unit cube based on the observed outcomes<\/AC91>\n\nL32: “or when the input space is high-dimensional”. <AC92>Wouldn’t high-dimensional output spaces be more problematic for random scalarizations?<\/AC92>\n\nL50: “analytically available, which enables the use of gradient-based optimization”. <AC93>It is not clear here why analytic availability implies differentiable<\/AC93>\n\nL73: <AC94>should be \\subseteq instead of \\subset<\/AC94>\n\nL196: <AC95>These acronyms are very confusing<\/AC95>\n\nL298: <AC96>it would be good to clarify that “multi-objective optimization” refers to the fact that computing JES requires solving a set of multi-objective optimization problems of optimizing GP function samples.<\/AC96>\n\nlimitations: <AC97>Some limitations are discussed in the last section<\/AC97>, but <AC98>further discussion around when to use which method would be useful.<\/AC98> Additionally, <AC99>characterizing drawbacks of the approach and sensitivity of the approach and entropy-based methods more generally to model-specification would be useful.<\/AC99> <AC100>Negative societal impacts are not discussed.<\/AC100>"}, {"message_id": "Reviewer_QtD3 · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To QtD3\n- W1 (in sample results): <AC1>In the revision, we have included the results for the in-sample experiments in Appendix J.4.<\/AC1> <AC2>We have also included a discussion in the main text.<\/AC2> <AC3>The in-sample results reveal that the information-theoretic algorithms have tendency not to directly select the best performing points and instead opt to query more informative points that have higher uncertainty.<\/AC3> <AC4>This can result in a behaviour where the in-sample performance appears to stagnate, whilst the out-of-sample performance improves.<\/AC4> <AC5>We mention that if directly querying high performing points is useful, taking an epsilon greedy approach where one occasionally picks points by maximizing a greedy criterion might be a useful modification.<\/AC5>\n\n- W2 (error bars): <AC6>We have now restructured all the plots<\/AC6> and <AC7>have included error bars.<\/AC7>\n\n- W3 (computation cost): <AC8>We have been quite thorough about testing the wall times of our different conditional entropy approximations and acquisition functions using a single processor (Appendix J.3 and J.7).<\/AC8> <AC9>Our approaches, MES-LB and JES-LB results in competitive wall times with other competing methods even without using parallelization<\/AC9>, <AC10>which could improve the run time further.<\/AC10>\n\n- W4 (many approximations): <AC11>We have indeed proposed multiple implementations for JES.<\/AC11> <AC12>Our intention was to be methodical and thorough on how JES can be implemented and made more efficient.<\/AC12> <AC13>The main observation is that the JES approximations can perform similarly for the same number of Monte Carlo samples and sampled Pareto optimal points.<\/AC13> <AC14>The best choice can be selected based on wall-times.<\/AC14> <AC15>Our experiments showed the benefit of using the lower bound estimates for both the multi-objective MES and JES when only using CPU computations.<\/AC15> <AC16>Some routines could parallelized for further speed gains.<\/AC16> For example, <AC17>the vector optimization (step 4 in Algorithm 1) was executed serially using a gradient-free optimization method.<\/AC17> <AC18>Potentially this can be solved in parallel using gradient-based optimization such as the one proposed by Liu et al. (2021).<\/AC18>\n\n- W5 (weighting the hypervolume): <AC19>Our impression is that there is over-emphasis in the recent literature on maximization of the hypervolume.<\/AC19> <AC20>This can be misleading in some cases<\/AC20>, so <AC21>the aim of Section 4 and Figure 4 is to highlight this and propose a more complete assessment and comparison.<\/AC21> <AC22>Clearly our intention is to focus more on information theoretic methods (and hence include Prop. 3 on invariance to reparameterization)<\/AC22> but <AC23>we believe that the point of working towards more diverse comparisons is valuable for all methods.<\/AC23> <AC24>Interestingly our probabilistic weighting idea can be viewed as an extension of Zitzler et al (2007), who identified this issue from their early work (Zitzler et al 1998) that first introduced the hypervolume criterion.<\/AC24>\n\nAs regards to the overall assessment, <AC25>we respectfully disagree with a) and b)<\/AC25> but understand the reviewer's point of view and thank them for the feedback. <AC26>Regarding point c) on empirical evaluation, we believe our revisions has addressed this.<\/AC26>\n\n- Q1 (constraints): <AC27>Early numerical results with constraints are encouraging<\/AC27>, but <AC28>more work is needed to report concrete conclusions.<\/AC28>\n\n- Q2 (noise levels): <AC29>In the paper we used different noise levels in the different examples<\/AC29>, but <AC30>in numerical work not presented here we did try different noise levels for each example and noticed fairly similar results.<\/AC30>\n\n- Q3a (incremental and references): <AC31>Input and output entropy are well studied<\/AC31>, but <AC32>until this paper have not been used jointly.<\/AC32> <AC33>We believe is a natural but not straightforward extension.<\/AC33> <AC34>We have now further emphasized the connection with earlier work in the main work.<\/AC34> In particular, <AC35>we have added additional references to Moss et al. (2021) and Suzuki et al. (2020) throughout the paper and especially in the contributions section.<\/AC35> Moreover, <AC36>we have emphasized that Lemma 1 and the box-decomposition strategy are standard results in multi-objective optimization dating back to earlier work by Keane (2012), Couckuyt et al. (2014), Picheny (2015) and Suzuki et al. (2020).<\/AC36>\n\n- Q3b (BAX): <AC37>The BAX acquisition function (Neiswanger et al 2021) is subtly different to the one considered here.<\/AC37> <AC38>The probability density of observations in the BAX paper (Equation 5 in Neiswanger et al 2021) conditions only on the \"execution path\", which in our setting is the augmented data set.<\/AC38> In contrast, <AC39>the probability density of the observations in our work (Equation 6) conditions on both the \"execution path\" and the optimality condition $f(x) \\preceq Y^*$.<\/AC39> <AC40>We have now included this point in the related work section and cited Neiswanger et al (2021).<\/AC40>\n\n- Q4 (independent models): <AC41>We accept the criticism that the different objectives are modelled as independent.<\/AC41> <AC42>The probability density in Figure 3 conditions on the points, data, and the optimality condition.<\/AC42> <AC43>The latter causes the correlations<\/AC43> and <AC44>this can also be seen in the results in Prop. 2.<\/AC44>\n- Q5 (batch lower bound): <AC45>In general, the optimizer of a lower bound might not be an optimizer of the original quantity.<\/AC45> <AC46>Batch size experiments can be very expensive<\/AC46> and <AC47>the lower bound approximations are necessary from a practical point of view.<\/AC47> <AC48>We agree that the estimation error and role of batch size should be investigated further.<\/AC48> <AC49>This is part of current work that look into this in more detail and use also ideas from stochastic control and dynamic programming.<\/AC49>\n\n- Q6 (single-objective): <AC50>We found the vector optimization setting to be more interesting and challenging<\/AC50> because <AC51>we also have to consider the multi-objective trade-off.<\/AC51> <AC52>In preliminary investigations to single-objective optimization, we noticed little difference between the many different acquisition functions for single-objective BO.<\/AC52> <AC53>The acquisition functions mainly differ in how they balance the exploration-exploitation trade-off.<\/AC53> <AC54>This was the motivation of the contour plots in Appendix H.<\/AC54>\n\n- Q7 (invariance): <AC55>In addition to introducing JES a general aim in the paper is to highlight how information theoretic criteria can be improved and what benefits they provide compared to other approaches.<\/AC55> As such <AC56>we believe it is worth including here.<\/AC56>\n\n- Q10a (nadir points): <AC57>This point is correct<\/AC57> and <AC58>we clarified this in the revised main text.<\/AC58> <AC59>The reference point in the evaluation for the experiments did indeed use a reference point that is slightly worse than the nadir for the whole function (not just the Pareto front).<\/AC59>\n\n- Q10b (error bars): Thank you for the suggestion, <AC60>we have now restructured the plots to focus solely on the lower bound estimate<\/AC60> and <AC61>have modified the figures to include error bars.<\/AC61>\n\n- Q11 (noiseless): <AC62>Noiseless results were similar to what is presented in the paper<\/AC62> and hence <AC63>we did not include them.<\/AC63>\n\n- Q12 (incorporating preferences): <AC64>We would not go as far as suggesting that this is drawback for entropy based methods (or any method)<\/AC64>, simply because <AC65>not all methods are designed to do this.<\/AC65> <AC66>If this is of interest all methods should be modified and extended for such a scenario.<\/AC66> For example, <AC67>to extend entropy based methods we could redefine the optimal front as one which is Pareto optimal and dominates a specified reference point.<\/AC67> <AC68>Computationally, this modification will result in different bounds for the box-decomposition for MES and JES.<\/AC68>\n\n- Q13 (warm start): <AC69>We have not tried this form of initialisation near the Pareto frontier.<\/AC69> <AC70>This is an interesting suggestion<\/AC70> and <AC71>we believe this could improve the efficiency of all methods.<\/AC71> <AC72>Better understanding how to effectively solve the inner optimization problem in BO is an interesting line of inquiry which we leave for future work.<\/AC72> Some interesting references we are aware of include Gramacy et al. (2021) and Grosnit et al. (2021) - Are we Forgetting about Compositional Optimisers in Bayesian Optimisation.\n\nMinor points:\n\n<AC73>We agree with most points<\/AC73> and <AC74>have taken onboard the reviewer suggestions.<\/AC74> <AC75>Regarding input or output dimension, the answer is both are challenging for random scalarization.<\/AC75> <AC76>In the work by Paria et al (2020), they proved a cumulative Bayes regret for an acquisition strategy based random scalarization, which depended on both the input dimension and number of objectives.<\/AC76> <AC77>We have rephrased accordingly.<\/AC77> <AC78>Regarding gradients as the reviewer hints it is the form the expression rather than analytical tractability per se.<\/AC78> <AC79>We have also rephrased this accordingly.<\/AC79>\n Global/general Response:\n```\nWe thank all the reviewers for their comments and the effort to assess our paper. <AC80>In our revised manuscript, we have addressed the most common and important points<\/AC80>:\n\n- <AC81>We have clarified that the modification to the noiseless conditional entropy estimate was meant as an ad hoc adjustment to account for the amount of exploration when there is observation noise.<\/AC81> As <AC82>this result caused some confusion<\/AC82>, <AC83>we have relegated it to Appendix D in favour of emphasizing our main result in Prop. 2 (previously Prop. 3), which gives a more principled and better performing estimate.<\/AC83>\n\n- <AC84>We have further emphasised the connection to existing work in the main text.<\/AC84>\n\n- <AC85>We have provided error bars in the plots.<\/AC85>\n\n- <AC86>We have added an in-sample standard hypervolume comparison (Appendix J.4) as requested by one of the reviewers.<\/AC86>\n\n- <AC87>We have augmented the discussion of the experiments with additional points raised by the reviewers.<\/AC87>\n\n- <AC88>We have sorted all typos and minor errors.<\/AC88>\n\nBelow we provide a point-by-point response to each reviewer separately.\n```"}, {"message_id": "Reviewer_QtD3 · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: response\nThanks to the authors for the thorough response!\n\n> W1 (in sample results):\n\n Thanks for adding these\n\n> W2 (error bars):\n\nThanks for adding these. Unfortunately, <AC1>it shows that in general on the test problems considered, JES is not statistically significantly better than other methods---even with 100 replicates and on a log scale.<\/AC1> Furthermore, since <AC2>not clearly faster than alternative approaches that are competitive w.r.t. to hypervolume<\/AC2>, <AC3>it is not clear why one should use JES<\/AC3>\n\n> W3 (computation cost): Our approaches, MES-LB and JES-LB results in competitive wall times with other competing methods even without using parallelization, which could improve the run time further.\n\n<AC4>It is worth noting that NEHVI for example is much faster on a GPU than a CPU (and measurements in this paper are made on a single CPU_<\/AC4>, so <AC5>while runtime of MES-LB/JES-LB might be improved by exploiting parallelism, the same is true of alternative approaches.<\/AC5>\n\n> W4 (many approximations):\n\nThanks for reducing the number of methods in the plots. <AC6>They are much clearer.<\/AC6>\n\n> W5 (weighting the hypervolume):\n\n<AC7>I agree that alternative evaluation metrics are interesting to consider<\/AC7>, but <AC8>including such a discussion in the main text strikes me as out of place---especially considering that no alternative metric is used for evaluation in the main text.<\/AC8>\n\n> Q4 (independent models):\n\nMakes sense. <AC9>Figure 3 seems out of place of place to me though<\/AC9> because <AC10>it is never even discussed in the paper<\/AC10>\n\n> Q5 (batch lower bound): … We agree that the estimation error and role of batch size should be investigated further.\n\n Thanks for confirming this. Unfortunately, <AC11>this reaffirms my concerns about the critical potential failure modes of the batch approximation.<\/AC11>\n\n<AC12>I have increased the confidence of my review<\/AC12>, but <AC13>I will leave my score as is.<\/AC13> <AC14>The lack of statistically significant improvement in any test problem *even on a log scale with 100 replicates* makes it clear that the method does not offer a significant improvement in optimization performance.<\/AC14> Since <AC15>it isn't faster than alternatives<\/AC15>, <AC16>the question is when should this method be used.<\/AC16> Furthermore, <AC17>it is surprising to jump to the multi-objective setting with JES rather than the single objective setting<\/AC17>---\"In preliminary investigations to single-objective optimization, we noticed little difference between the many different acquisition functions for single-objective BO.\"---given that <AC18>there are not significant differences in the multi-objective setting.<\/AC18>\n\n<AC19>The response to my critique about the suboptimal batch formulation confirmed my concern that the estimation error can be quite large and is not captured in their sub-modularity argument<\/AC19>, <AC20>which makes the batch formulation and sub-modularity argument not very confidence inspiring.<\/AC20>"}, {"message_id": "Reviewer_QtD3 · id_turno 4", "turn": 3, "id_turno": 4, "speaker": "author", "text": "Title: Author response\nHi authors,\n\n<AC1>QtD3 and WzLK raise some important points with respect to statistical significance of the results with respect to alternative methods.<\/AC1> <AC2>Your work is notable in its extensive evaluation of high-quality implementations of entropy-based methods for MOBO.<\/AC2> However, <AC3>some of the evaluation is less transparent due to seemingly arbitrary choices of noise and parallaelism.<\/AC3> <AC4>Plots that are devised to more directly quantify how well the AFs can handle increasingly higher levels of parallelism or noise are important for understanding the tradeoffs between different methods.<\/AC4> For example, <AC5>in the qNEHVI paper, the authors consider final log HV regret as a function of batch size (Fig 4) and noise (Fig 14).<\/AC5> <AC6>Something similar could be helpful here.<\/AC6> <AC7>It is not necessary for JES (or the other ES) methods to strictly dominate any other methods<\/AC7>, but <AC8>it is important to investigate and clearly state when there are and are not practically significant differences between methods.<\/AC8> <AC9>How do you plan to address these concerns?<\/AC9>"}, {"message_id": "Reviewer_QtD3 · id_turno 5", "turn": 4, "id_turno": 5, "speaker": "reviewer", "text": "Title: Response\nThank you for the replies.\n\n- R1 (batch acquisition function): <AC1>The lower bound batch acquisition function and its approximation are principled acquisition functions<\/AC1> because <AC2>they can be written as determinantal point processes (DPPs) (Kulesza et al 2012).<\/AC2> <AC3>This property was derived and used in the proof of submodularity.<\/AC3> <AC4>As discussed in the BO literature (references below), batch acquisition functions based on DPPs are powerful<\/AC4> because <AC5>they can promote diverse batches in high-quality regions.<\/AC5> <AC6>The trade-off between diversity and quality (Section 3.1 in Kulesza et al 2012) is evident in the form of the DPP kernel, Km_{i,j} = q_i q_j A_{i, j} (line 821), where q_i = exp(zeta_i/M) can be interpreted as the quality of item i, whilst A_{i,j} corresponds to a notion of similiarity.<\/AC6> <AC7>The Monte Carlo error arises in estimating the expectation in zeta_i (equation 31)<\/AC7> and <AC8>it contributes only to the relative quality assigned to each point in the batch.<\/AC8> <AC9>The optimal batch for the approximation might differ slightly due to the error present in the quality term<\/AC9>, but <AC10>the diversity of the batch will still be high because of the matrix A.<\/AC10> <AC11>The sequential greedy optimization of this acquisition function is arguably necessary<\/AC11> because <AC12>maximizing the original expression is known to be NP-hard (Ko et al. 1995).<\/AC12>\n\n  - Ko et al. (1995) - An exact algorithm for maximum entropy sampling.\n\n  - Contal et al. (2013) - Parallel Gaussian Process Optimization with Upper Confidence Bound and Pure Exploration\n\n  - Kathuria et al. (2016) - Batched Gaussian Process Bandit Optimization via Determinantal Point Processes\n\n  - Wang et al. (2017) - Batched High-dimensional Bayesian Optimization via Structural Kernel Learning\n\n- R2 (more experiments): <AC13>We are conducting more experiments similar to the ones listed in order to demonstrate the performance trade-off with different amount of noise and batch sizes.<\/AC13> <AC14>As the wall-time plots might suggest, our ability to generate these results within the rebuttal period are limited.<\/AC14>"}, {"message_id": "Reviewer_QtD3 · id_turno 6", "turn": 5, "id_turno": 6, "speaker": "author", "text": "Title: Follow-up\nMy recommendations to the authors are:\n1) <AC1>Make clear up front about the sources of error in the batch acquisition function: the potential of error from the lower bound (this error relative to true batch acquisition function seems possibly quite large), MC error and submodularity error (the latter two really only apply to approximating the lower bound).<\/AC1>\n2) <AC2>Draw a clearer boundary between the previous work and the new contributions.<\/AC2> <AC3>Currently, a careful read is required to distinguish between the two in the manuscript's current form.<\/AC3>\n3) <AC4>Move the weighted hypervolume indicator to the appendix or include d_GHV results in the main text.<\/AC4> <AC5>Currently, the weighted hypervolume discussion seems out of place.<\/AC5>\n4) <AC6>I second the AC that more comprehensive noise and batch experiments are warranted.<\/AC6>"}, {"message_id": "Reviewer_QtD3 · id_turno 7", "turn": 6, "id_turno": 7, "speaker": "reviewer", "text": "I am delighted to have engaged in the above conversation with the author, <AC1>which has certainly made the work more robust.<\/AC1>"}]}, {"i": 3, "name": "Reviewer_WzLK", "rating": [7, 7], "messages": [{"message_id": "Reviewer_WzLK · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper proposes a new information-based acquisition function for multi-objective Bayesian optimization that combines the approaches from the known PES and MES acquisition functions.<\/AC1> <AC2>The authors derive various approximations to efficiently compute this acquisition function<\/AC2> and <AC3>provide a comparison of their performance characteristics against a number of baselines.<\/AC3>\n\nstrengths_and_weaknesses: # Strengths:\n- <AC4>The paper is well written, in particular Section 2 provides a nice buildup of background to understand JES in relation to (P)ES and MES.<\/AC4>\n- <AC5>The motivation for studying the new acquisition function and the theoretical contributions (in terms of JES and the various approximations) are solid<\/AC5>; <AC6>I view them primarily as well crafted technical work on top of a large body of existing literature in the field rather than a surprising or particularly novel set of contributions (which is not a bad thing).<\/AC6>\n- <AC7>The main strength of the paper beyond this solid execution is that it provides a comprehensive comparison and ablation studies of various state-of-the art acquisition functions.<\/AC7>\n- <AC8>The authors also provide a full implementation of the methods in a popular and maintained python library for Bayesian Optimization.<\/AC8> <AC9>This in itself is a significant contribution to the community, which can now easily use not just JES but also the other implemented baselines (without trying to get an unmaintained library such as spearmint running in a modern software environment...).<\/AC9>\n- <AC10>Pointing out the potential issues with HV w.r.t. rescaling objectives is valuable<\/AC10>, and <AC11>the fact that JES is invariant to that is nice and useful (though not surprising as one would expect that from an information-based acquisition function).<\/AC11>\n- <AC12>The supplementary material is very comprehensive and goes into lots of detail.<\/AC12> <AC13>This is very useful to the reader.<\/AC13> For instance, <AC14>I found the illustrations of the acquisition function in the contour plots instructive.<\/AC14>\n\n# Weaknesses:\n- <AC15>One shortcoming of the work is this that there aren't any variance estimates of the performance of the different algorithms in the empirical evaluation.<\/AC15> <AC16>The checklist states that \"We do not include the error bars directly on the plots because it made it difficult to visually compare between the different algorithms.\"<\/AC16>, but <AC17>as a reader I would have hoped to see a more thorough analysis of this in the supplementary material.<\/AC17> <AC18>The quantile versions of the plots are useful to some extent<\/AC18>, and <AC19>by comparing the performance of the suggested methods across the detailed results of the benchmarks the reader can get a sense that the proposed algorithms may indeed improve over existing methods.<\/AC19> However, <AC20>this is a lot of work to require from the reader<\/AC20>, and <AC21>I would ask the authors to add a more comprehensive discussion to help practitioners understand in which the proposed methods are most useful and computationally feasible.<\/AC21>\n- <AC22>The information gain estimates rely crucially on the assumption that the different objective functions are modeled by independent GPs.<\/AC22> <AC23>If the objectives are correlated, then this assumption could result in poor performance.<\/AC23> <AC24>Other approaches, such as Monte-Carlo based EHVI methods are not subject to these limitations<\/AC24> since <AC25>their methodology applies in the same fashion to multi-output GPs.<\/AC25> <AC26>In fact, as they are based on MC sampling from the model's posterior, such methods are also compatible with other probabilistic models<\/AC26>, <AC27>which is not the case for the approach proposed in this paper.<\/AC27>\n- Overall, <AC28>I found the experimental section of the paper in the main text too brief to be able to get a good sense for the empirical performance of the JES approach in comparison to the baselines (both in terms of sample efficiency and computational footprint).<\/AC28> <AC29>I would suggest the authors move some of the mathy and notation-heavy details of Section 3 (e.g. Proposition 3) to the appendix, potentially streamline the exposition in other parts of the paper, and include additional results / discussion of the empirical performance in the main text.<\/AC29>\nquestions: - l34: \" The main drawback of these approaches is that the performance of these methods are biased towards a single scalar utility criterion, which can be inadequate to assess the multi-objective aspects of the problem\". <AC30>I don't really understand this point<\/AC30>; <AC31>after all, the scalar utility is defined specifically in order to capture the multi-objective aspects.<\/AC31> <AC32>In a sense your formulation is no different in that ultimately you optimize a scalar function, the information gain.<\/AC32> <AC33>Can you please clarify?<\/AC33>\n- l38: <AC34>This sentence makes it seem as if other papers do not consider a \"probabilistic perspective\", which of course they do (this is BO after all).<\/AC34>\n- l156: <AC35>what does \"cancelling out\" mean here?<\/AC35> <AC36>JES is computed on the covariance using the augmented set of observations<\/AC36> so <AC37>there shouldn't be any cancelling in the strict sense.<\/AC37> <AC38>Please clarify.<\/AC38>\n\nNits / Typos:\n- l28/29: <AC39>it enables -> they enable<\/AC39>\n- l47: <AC40>set-up -> set up<\/AC40>\n- l89: \"and a property of the probabilistic model.\" <- <AC41>not sure what is meant by this, please clarify<\/AC41>\n\nlimitations: Yes."}, {"message_id": "Reviewer_WzLK · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To WzLK\n- W1 (error bars): <AC1>We agree that this was an omission from our part<\/AC1>, <AC2>we have now restructured the plots and included error bars in all the figures.<\/AC2> <AC3>We also included some more discussion in the experiments section to guide practitioners.<\/AC3>\n\n- W2 (independent models): <AC4>Regarding independence and GP modelling, this is a valid point and we accept this criticism.<\/AC4> <AC5>Our main focus here was on improving the acquisition<\/AC5> and hence <AC6>chose this standard setting.<\/AC6> <AC7>As the reviewer points out, further work is needed to adapt our methodology as well as other competing methods based on GPs for the correlated case.<\/AC7>\n\n- W3 (discussion): <AC8>We also agree with the reviewer that more details were needed in the experiment section.<\/AC8> <AC9>We have now moved a proposition to the Appendix, which allowed us to augment and improve the discussion of the main results and findings.<\/AC9>\n\n- Q1 (scalar utility): <AC10>Multi-objective optimization algorithms are usually assessed using performance metrics defined over the space of subsets of vectors.<\/AC10> <AC11>One acquisition strategy is to directly optimize the performance metric directly e.g. the hypervolume.<\/AC11> <AC12>An algorithm that does this will likely perform well under this specific performance metric<\/AC12>, but <AC13>may not appear to do well under another performance metric, which might assess other features of the Pareto front.<\/AC13> <AC14>We believe that working to improve the quality of a posterior distribution is more convenient and sidesteps these issues.<\/AC14> <AC15>We also tried to include different measures of performance to emphasize this.<\/AC15> <AC16>We agree that this statement was confusing<\/AC16> and <AC17>have now rephrased this accordingly.<\/AC17>\n\n- Q2 (probabilistic perspective): <AC18>We agree and have removed the phrase.<\/AC18>\n\n- Q3 (cancellation): <AC19>This is a fair point.<\/AC19> <AC20>It is correct the cancellation only occurs when computing the MES-0 estimate.<\/AC20> <AC21>As discussed in another review, this is an ad hoc modification in order to maintain the exploration-exploitation trade-off.<\/AC21> <AC22>We have now relegated this result and discussion to the Appendix D<\/AC22> as <AC23>it caused confusion and drew attention away from the main results.<\/AC23>\n\n- Q4 (property of the model): <AC24>We meant to say any function of the model f, for example the argmax(f) or max(f) in the case of PES and MES.<\/AC24> <AC25>We have now rephrased this.<\/AC25>\n\nTypos:\n\nThanks for spotting the typos, <AC26>they have now been sorted.<\/AC26>\n Global/general Response:\n```\nWe thank all the reviewers for their comments and the effort to assess our paper. <AC27>In our revised manuscript, we have addressed the most common and important points<\/AC27>:\n\n- <AC28>We have clarified that the modification to the noiseless conditional entropy estimate was meant as an ad hoc adjustment to account for the amount of exploration when there is observation noise.<\/AC28> As <AC29>this result caused some confusion<\/AC29>, <AC30>we have relegated it to Appendix D in favour of emphasizing our main result in Prop. 2 (previously Prop. 3), which gives a more principled and better performing estimate.<\/AC30>\n\n- <AC31>We have further emphasised the connection to existing work in the main text.<\/AC31>\n\n- <AC32>We have provided error bars in the plots.<\/AC32>\n\n- <AC33>We have added an in-sample standard hypervolume comparison (Appendix J.4) as requested by one of the reviewers.<\/AC33>\n\n- <AC34>We have augmented the discussion of the experiments with additional points raised by the reviewers.<\/AC34>\n\n- <AC35>We have sorted all typos and minor errors.<\/AC35>\n\nBelow we provide a point-by-point response to each reviewer separately.\n```"}, {"message_id": "Reviewer_WzLK · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thank you for your response\nThanks for the response and for making the editorial changes and adding the variance to the plots. Unfortunately, <AC1>in a lot of these examples it's hard to discern the performance of at least some of the methods given the relatively high variance.<\/AC1> <AC2>It would be good to consider evaluations that make the performance differences more clear.<\/AC2> <AC3>I never considered the performance of the method a particularly compelling aspect of the paper<\/AC3>, but <AC4>the paper does have other sufficiently many other strengths<\/AC4> and so <AC5>I am sticking with my score.<\/AC5>"}]}, {"i": 4, "name": "Reviewer_XDbZ", "rating": [null, 7], "messages": [{"message_id": "Reviewer_XDbZ · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>In this paper, a Bayesian optimization algorithm using Joint Entropy Search (JES), a new entropy search type acquisition function, is proposed to efficiently estimate the Pareto solution set for multi-objective optimization problems.<\/AC1> <AC2>JES is defined as the mutual information between the pair of optimal solution set and the optimal value set, (X^*, Y^*) and the new query point (x, y).<\/AC2> <AC3>While PES and MES, the main conventional entropy search type acquisition functions, focus only on the marginal distribution of the optimal solution and optimal value, respectively, JES determines the next acquisition point by considering their joint distribution.<\/AC3>\n\n<AC4>JES can be expressed as the difference of two differential entropies as in other entropy search type acquisition functions.<\/AC4> <AC5>For its optimization, the authors proposed a method to approximate the expected value of entropy for the pair (X^*, Y^*) of the optimal solution set and the optimal value set that appears in the second term of the JES acquisition function.<\/AC5> <AC6>Specifically, when there is no observation noise, entropy can be calculated analytically<\/AC6> since <AC7>the argument distribution is a multivariate truncated normal distribution<\/AC7>, and <AC8>when there are observation error, the entropy of the multivariate normal distribution that bounds it from above can be used as an approximation.<\/AC8> <AC9>Specifically, when there is no observation noise, entropy can be calculated analytically<\/AC9> since <AC10>the argument distribution is a multivariate truncated normal distribution.<\/AC10> <AC11>When there are observation errors, a multivariate normal distribution whose 1st and 2nd moments are equivalent to the argument distribution can be used as an approximation.<\/AC11> This is because <AC12>the entropy of latter distribution is bounded above by the entropy of former one.<\/AC12>\n\n<AC13>The proposed method, the JES acquisition function, is also extended to the batch optimization setting.<\/AC13> <AC14>Specifically, the authors proposed a method in which the entropy of the joint distribution for the batch points is bounded from above by the sum of entropies for each point, and the latter is used to select each point independently.<\/AC14>\n\n<AC15>In the experiments, the proposed method is compared with existing multiobjective Bayesian optimization methods for different optimization problems with 2-, 3-, and 4-objectives, using the difference of hypervolumes as an evaluation criteria.<\/AC15>\nstrengths_and_weaknesses: Strengths\n\n- <AC16>The proposed new entropy-search type acquisition function, JES, considers the joint distribution of optimal position x^* and optimal value y^*<\/AC16>, and <AC17>is expected to provide more information about the optimal solution than PES, which considers only the former, or MES, which considers only the latter.<\/AC17>\n\n- <AC18>Different computation methods have been proposed for the entropy of the second term in JES, with and without noise.<\/AC18> <AC19>Both are derived in an analytic form<\/AC19>, and <AC20>the advantage is that costly numerical computations can be avoided.<\/AC20>\n\n- <AC21>As a method for obtaining batch points, the joint conditional distribution for a batch is upper bounded by the sum of the conditional distributions for each point, avoiding the intractable computations of the former.<\/AC21> <AC22>With respect to the goodness of this upper bound, the authors show that by showing the submodularity of the acquisition function, an iterative method of sequential acquisition at each point achieves a regret upper bound of e^-1.<\/AC22>\n\n- <AC23>While the hypervolume of the Pareto set (e.g., its expected reduction), which is often used as an acquisition function in multi-objective optimization, is not invariant with respect to monotonic transformations of the output, the proposed method, JES, is shown to be invariant to the same transformation.<\/AC23>\n\nWeakness\n\n- <AC24>The assumption is made in Lemma 1 that the true Pareto optimal value set Y^* is a finite set<\/AC24>, <AC25>which appears to be a strong condition<\/AC25> given that <AC26>in general there are an infinite number of Pareto solutions.<\/AC26>\n\n- <AC27>The computations of the conditional distribution for the Pareto set and the computations for acquiring batch points are each broken down into a computations for each point<\/AC27>, <AC28>which is expected to become a computationally expensive method when the number of elements in the Pareto solution set increases as iteration progresses.<\/AC28>\nquestions: - <AC29>As pointed out in Weakness, the assumption that Y^* is a finite set, as placed in Lemma 1, seems to be a strong one<\/AC29>; <AC30>it seems to be the key lemma for the approximate computation of the JES acquisition function<\/AC30>, but <AC31>is it not an issue?<\/AC31>\n\n- As pointed out in weakness, since <AC32>the proposed method decomposes all computations into point-by-point computations<\/AC32>, <AC33>I think that it needs to be carefully evaluated in terms of computational cost compared to existing methods.<\/AC33> <AC34>Have you done any comparison of actual computational costs?<\/AC34>\nlimitations: <AC35>The authors adequately addressed the limitations and potential negative societal impact of their work.<\/AC35>"}, {"message_id": "Reviewer_XDbZ · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To XDbZ\n- <AC1>It unavoidable that numerically the Pareto frontier approximation will be be constructed on a finite set of points.<\/AC1> <AC2>This is a standard assumption in the literature<\/AC2> and <AC3>we believe is also sensible given the interest here is on approximations with finite number of observations.<\/AC3> In addition, <AC4>in Appendix J.3 our sensitivity analysis suggests that there is no visible improvement as the number of points approximating the Pareto frontier increase beyond a moderate number of points (around 10 points for ZDT2 with 2 objectives on 6 dimensions).<\/AC4>\n\n- <AC5>Regarding computational cost increase w.r.t number of points, this increases moderately when computations are performed in sequence on one processor (Figure 15).<\/AC5> <AC6>Notably, some of these calculations can benefit from parallelization in order to get a speed-up.<\/AC6>\n Global/general Response:\n```\nWe thank all the reviewers for their comments and the effort to assess our paper. <AC7>In our revised manuscript, we have addressed the most common and important points<\/AC7>:\n\n- <AC8>We have clarified that the modification to the noiseless conditional entropy estimate was meant as an ad hoc adjustment to account for the amount of exploration when there is observation noise.<\/AC8> As <AC9>this result caused some confusion<\/AC9>, <AC10>we have relegated it to Appendix D in favour of emphasizing our main result in Prop. 2 (previously Prop. 3), which gives a more principled and better performing estimate.<\/AC10>\n\n- <AC11>We have further emphasised the connection to existing work in the main text.<\/AC11>\n\n- <AC12>We have provided error bars in the plots.<\/AC12>\n\n- <AC13>We have added an in-sample standard hypervolume comparison (Appendix J.4) as requested by one of the reviewers.<\/AC13>\n\n- <AC14>We have augmented the discussion of the experiments with additional points raised by the reviewers.<\/AC14>\n\n- <AC15>We have sorted all typos and minor errors.<\/AC15>\n\nBelow we provide a point-by-point response to each reviewer separately.\n```"}, {"message_id": "Reviewer_XDbZ · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thank you for your response\nThank you for your detailed answer to my questions.\n<AC1>My concern was whether the assumption that Y is a finite set affect the practical performances<\/AC1>, but <AC2>I was convinced that experiments have already confirmed that this is not the case in practice.<\/AC2>\n<AC3>After reconsidering the comments I have received, together with the comments of the other reviewers, I would like to increase the score by one.<\/AC3>"}]}, {"i": 5, "name": "Reviewer_Z8pJ", "rating": [6, 6], "messages": [{"message_id": "Reviewer_Z8pJ · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>A new acquisition function for Bayesian Optimization (JES) is proposed in this paper.<\/AC1> <AC2>It considers the joint information gain for the optimal set of X and Y.<\/AC2> <AC3>Several analytical approximations to the acquisition function are also introduced.<\/AC3>\nstrengths_and_weaknesses: Strength: <AC4>A new information-theoretic acquisition function for Bayesian Optimization is presented<\/AC4>, and <AC5>approximation methods are also discussed and analyzed in this paper.<\/AC5>\n\nWeakness: <AC6>It is not quite clear why this new method is superior to the existing methods (for example PES and MES as mentioned in the paper) with respect to its cost-performance trade-off.<\/AC6>\nquestions: - <AC7>It is not quite clear from the paper why this new method is superior to the existing methods (for example PES and MES as mentioned in the paper) with respect to its cost-performance trade-off.<\/AC7> <AC8>The amount of work involved in using this new acquisition function may be large, especially compared to MES.<\/AC8>\n- <AC9>Maybe it is good to identify certain specific settings or scenarios where this joint information gain acquisition function has an advantage over both PES and MES.<\/AC9>\n- <AC10>For motivation and illustration purposes, maybe in the introduction, some small examples on a small instance can be worked out where this new method can be easily compared with PES and MES.<\/AC10> <AC11>In this way, this method can be better motivated.<\/AC11>\n- <AC12>The approximation methods can achieve different accuracy levels using a different number of samples<\/AC12>, <AC13>if possible, some discussion or guidance on that will be helpful in that section.<\/AC13>\nlimitations: Not applicable."}, {"message_id": "Reviewer_Z8pJ · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To Z8pJ\n- W1 and Q1a (why JES): <AC1>In general, the best acquisition function is dependent on both the problem and the decision maker's goal.<\/AC1> <AC2>We recommend using JES when the goal is to obtain a good posterior distribution over the optimal points.<\/AC2> <AC3>The experiments indicate that JES is indeed a good choice when that is the goal.<\/AC3>\n\n- Q1b (JES vs MES): <AC4>Our main result concerning the lower bound conditional entropy estimate (Prop. 2) benefits both the MES and JES acquisition function.<\/AC4> <AC5>The cost of JES is indeed slightly greater than the MES because of the conditioning step in Algorithm 1<\/AC5>, but <AC6>in turn leads to a strategy that queries points which are more informative for both the optimal inputs and outputs.<\/AC6>\n\n- Q1c (cost performance trade-off): <AC7>Investigating the cost-performance trade-off in multi-objective Bayesian optimization is certainly an interesting research question that we are also looking in to.<\/AC7> <AC8>As Section 4 suggest, it is unclear how to define performance from the get-go<\/AC8> and <AC9>this choice will naturally have an effect on any analysis we conduct to compare between cost and performance.<\/AC9>\n\n- Q2 (example): <AC10>Our initial investigation into this resulted in the contour plots in Appendix H.<\/AC10> <AC11>We observed that JES strikes a different balance on the exploration-exploitation trade-off compared to the PES and MES.<\/AC11> <AC12>For a single-objective problem, where the posterior mean is bi-modal, the JES opts for one mode whilst the PES and MES opts for the other.<\/AC12> <AC13>For this particular set up, the mode that JES picks is marginally better.<\/AC13>\n\n- Q3 (motivation): <AC14>This is a very good suggestion<\/AC14> and <AC15>is something we tried to accomplish as we discussed above.<\/AC15> <AC16>In the end, we opted for Figure 1, which we believe is sufficient as an initial way to motivate the difference between the acquisition functions.<\/AC16>\n\n- Q4 (approximation): <AC17>We observed very little difference when increasing the number of samples in Appendix J.3.<\/AC17> <AC18>Our results indicate that setting the number of Monte Carlo samples moderately to 10 seems to work well.<\/AC18> <AC19>We observed that increasing the number of Pareto optimal points tended to result in an improvement in performance (up to a certain point) at the expense of computational cost<\/AC19>, <AC20>we also set this to 10 as a compromise.<\/AC20> <AC21>Developing theoretical results in order to justify these choices, such as Theorem 4.1 in Takeno et al. (2021), is something we are also looking into.<\/AC21>\n Global/general Response:\n```\nWe thank all the reviewers for their comments and the effort to assess our paper. <AC22>In our revised manuscript, we have addressed the most common and important points<\/AC22>:\n\n- <AC23>We have clarified that the modification to the noiseless conditional entropy estimate was meant as an ad hoc adjustment to account for the amount of exploration when there is observation noise.<\/AC23> As <AC24>this result caused some confusion<\/AC24>, <AC25>we have relegated it to Appendix D in favour of emphasizing our main result in Prop. 2 (previously Prop. 3), which gives a more principled and better performing estimate.<\/AC25>\n\n- <AC26>We have further emphasised the connection to existing work in the main text.<\/AC26>\n\n- <AC27>We have provided error bars in the plots.<\/AC27>\n\n- <AC28>We have added an in-sample standard hypervolume comparison (Appendix J.4) as requested by one of the reviewers.<\/AC28>\n\n- <AC29>We have augmented the discussion of the experiments with additional points raised by the reviewers.<\/AC29>\n\n- <AC30>We have sorted all typos and minor errors.<\/AC30>\n\nBelow we provide a point-by-point response to each reviewer separately.\n```"}, {"message_id": "Reviewer_Z8pJ · id_turno 3", "turn": 2, "id_turno": 3, "speaker": "reviewer", "text": "Title: Thanks for the response\nThanks for the detailed response from the authors! <AC1>There seems to be some work needed to be done for the comparison and making a more compelling case for this method<\/AC1>, so <AC2>I am sticking with the score.<\/AC2>"}]}, {"i": 6, "name": "Reviewer_ucDe", "rating": [7, 7], "messages": [{"message_id": "Reviewer_ucDe · id_turno 1", "turn": 0, "id_turno": 1, "speaker": "reviewer", "text": "summary: <AC1>The paper proposes a new information gain acquisition function for multi-objective Bayesian optimization.<\/AC1> <AC2>The method selects the input that maximizes the joint information gain about both input and output space.<\/AC2> <AC3>The paper provides several approximations of the acquisition function using lower bound and assumptions about the observed variance.<\/AC3> <AC4>The method is extended to batch selection accompanied by a submodularity study.<\/AC4> <AC5>The paper provides an analysis of the sensitivity of the hypervolume performance metric to functions transformations.<\/AC5>\nstrengths_and_weaknesses: Strengths:\n+ <AC6>The paper is technically rich<\/AC6> and <AC7>provides an extensive study of the problem space with several approximations and derivations<\/AC7>\n+ <AC8>The idea of the use of joint information gain is novel and interesting.<\/AC8>\n+ <AC9>The extension to batch setting seems naïve<\/AC9> however, <AC10>the discussion of submodularity of the acquisition function is interesting<\/AC10>\n+ <AC11>The paper provides a thorough cost analysis in terms of analytical complexity and wall clock time of optimization<\/AC11>\n\nWeaknesses:\n+ <AC12>Some design choices made in the approximation are not justified and seem ad hoc, including the cancellation of variance effect in the first approximation and choice of noise in experiments.<\/AC12>\n+ <AC13>Many parts of the derivation in the main paper and the appendix are inspired by [50] and [68].<\/AC13> However, <AC14>this does not seem to be properly acknowledged in the paper.<\/AC14>\n+ <AC15>The paper has a significant presentation issue.<\/AC15> <AC16>In general, the derivations are very hard to follow, both in the main paper and the appendix.<\/AC16> <AC17>This is not due to the extensive mathematical formulation of the acquisition function but rather to the lack of smoothness in the writing and the assumption that the reader can easily follow all the equations and substitutions.<\/AC17> I provide more details in the questions box.\n+ <AC18>The experimental setup has several weaknesses<\/AC18> that I discuss more in detail in the questions and comments box\n+ <AC19>The writing of the paper assumes the reader is familiar with previous work on Information-theoretic acquisition functions, which is not necessarily true.<\/AC19> <AC20>Several steps of the algorithm are not described thoroughly<\/AC20> and <AC21>have confusing notations.<\/AC21>\n+ <AC22>The paper uses “incorrect” acronyms to refer to previous work.<\/AC22> <AC23>This is problematic<\/AC23> because <AC24>the acronyms used in this paper are usually used to refer to different algorithms in SOO.<\/AC24> For example, <AC25>MES and PES are usually used to refer to a single objective acquisition function.<\/AC25> <AC26>In MO, they are referred to as PESMO and MESMO.<\/AC26> <AC27>The EHVI is usually used to refer to the sequential EHI method.<\/AC27> <AC28>The method discussed in this paper is the recently developed batch approach qEHVI and qNEHVI.<\/AC28>\n\nquestions: Approximations\n+ <AC29>How is the 0 variance assumption made, and what are the consequences of this on the selections made by the acquisition function?<\/AC29> <AC30>Canceling the effect of the predictive variances can lead to more exploitation in the acquisition function.<\/AC30> <AC31>It seems to be a little ad hoc just to add an additional term to cancel the variance effect.<\/AC31> <AC32>The transition is not explained well or justified.<\/AC32>\n\nWriting and presentation: suggestions for readability enhancement:\n+ <AC33>Several equations and inequalities are written in the text without any numbering and then used in the derivation without a referral.<\/AC33>\n+ <AC34>I suggest adding all the equalities/inequalities and definitions of variables used in separately numbered equations.<\/AC34> <AC35>I am aware of the space constraint<\/AC35>, but <AC36>several definitions can fit in one line<\/AC36>, and <AC37>white space reduction can also be used.<\/AC37>\n+ <AC38>Adding the propositions/lemmas written in the main paper near their corresponding proofs in the appendix would make it easier to follow the derivations.<\/AC38> <AC39>The reader won’t need to jump back and forth between the main paper and the appendix.<\/AC39>\n+ <AC40>The connections and substitutions used in the derivations should be detailed, at least in the appendix.<\/AC40>\n+ <AC41>f(x) <= Y* is a notation used repeatedly in the paper.<\/AC41> However, <AC42>the relation between two Pareto fronts is not always quantified as higher or equal and would depend on the tradeoff between several functions.<\/AC42> <AC43>A more rigorous notation should be used.<\/AC43>\n+ <AC44>The confusion between SO and MO surfaces in the names used for algorithms and in the notation used in the paper.<\/AC44> For example, <AC45>in algorithm 1, line 3 can be confused as a single objective sampling or sampling from a single multi-task GP while each of the objectives is sampled separately.<\/AC45>\n\nExperiments:\n+ <AC46>Only batch sizes of 1 and 8 are used.<\/AC46> <AC47>Typically batch BO papers include extensive experiments on different batch sizes<\/AC47>\n+ <AC48>More synthetic experiments can be useful to show the behavior of the algorithm when the number of functions and number of dimensions is varied<\/AC48>\n+ <AC49>The noise choice for each experiment is different.<\/AC49> <AC50>How is this choice made?<\/AC50>\n+ <AC51>Figure 13 does not easily provide the needed information.<\/AC51> <AC52>It would be more informative to plot all the algorithms using the same number of samples in the same figure and have different figures for different numbers of samples<\/AC52>\n+ <AC53>Some relevant and important baselines were not cited or compared to: Diversity-Guided Multi-Objective Bayesian Optimization With Batch Evaluations, Neurips 2020<\/AC53>\n+ <AC54>The standard errors are not plotted.<\/AC54> <AC55>The use of quantiles is unconventional<\/AC55> and <AC56>do not substitute or provide the same interpretation as the error.<\/AC56> <AC57>A light-colored error plot can still be readable.<\/AC57>\n+ <AC58>The performance improvement is minor<\/AC58>, and <AC59>the baselines sometimes work better.<\/AC59>\n+ <AC60>In the Penicillin experiment, the hypervolume progress seems unstable for all algorithms<\/AC60>; <AC61>what is causing the fluctuation, and how is this interpreted?<\/AC61>\n+ <AC62>Figure 1 provides an analysis based on single objective optimization, which does not necessarily hold in the multi-objective case.<\/AC62> <AC63>This figure is not discussed or analyzed anywhere in the text.<\/AC63> <AC64>The same issue applies to Figures 6, 7, and 10.<\/AC64> <AC65>I suggest removing these studies.<\/AC65> <AC66>They are not relevant<\/AC66>, and <AC67>they add to the confusion between SO and MO.<\/AC67>\n+ <AC68>The discussion on the sensitivity of the hypervolume as a metric is insightful.<\/AC68> However, <AC69>it is important to note that it is a common practice to fit the Gaussian processes to normalized data<\/AC69>, and therefore <AC70>the scale issues between the objectives become less problematic.<\/AC70> Additionally, <AC71>several other distance-based metrics overcome some of the weaknesses of HV when comparing equivalent Pareto fronts.<\/AC71> Therefore, <AC72>evaluating the performance using more than one metric is encouraged.<\/AC72>\n\nTypos:\n+ <AC73>Typo in line 186 “because the cost of evaluating”<\/AC73>\n+ <AC74>The structure of the sentence in line 176,177 is incorrect<\/AC74>\n\nlimitations: <AC75>The paper discussed some of the work's limitations.<\/AC75>"}, {"message_id": "Reviewer_ucDe · id_turno 2", "turn": 1, "id_turno": 2, "speaker": "author", "text": "Title: To ucDe\n- W1 (some ad hoc design choices): <AC1>This is indeed an ad hoc approximation<\/AC1> and <AC2>is meant to provide more intuition.<\/AC2> <AC3>This should have been better clarified in the text to avoid any confusion.<\/AC3> <AC4>We moved this result to Appendix D and added a further discussion<\/AC4>, which we will briefly summarise here. <AC5>In the zero observation noise setting, the JES-0 acquisition function can be written as $\\mathbb{E}[-\\log(W)]$ + other terms, where as a reminder $W = p(y \\preceq Y^* | D_{n*})$ i.e. the probability that y is dominated by the sample Pareto front Y* conditioned on the augmented data set.<\/AC5> <AC6>The expectation here is over the distribution of optimal inputs and outputs.<\/AC6> <AC7>The first term $\\mathbb{E}[-\\log(W)]$ can be interpreted as the exploitation term<\/AC7> because <AC8>it computes the expectation of the negative log-probability of being dominated by the front.<\/AC8> <AC9>The other terms can be interpreted as an exploration term.<\/AC9> <AC10>The ad hoc correction can be viewed as a way to maintain the right amount of exploration even in the presence of noise.<\/AC10> <AC11>This correction demonstrates decent numerical results that are in-line with the other approximations.<\/AC11> <AC12>The contour plots in Appendix G demonstrates that this approximation is close for a single-objective example where the noise in this experiments is set to around 5\\%.<\/AC12>\n\n- W2 (reference to prior work): <AC13>This is true, our analytical computations makes use and extends the results in these works.<\/AC13> <AC14>We have now further emphasized this in the main text<\/AC14> and <AC15>have also included mention in the contributions section.<\/AC15>\n\n- W3 (presentation): <AC16>Based on feedback from the reviewer we have updated the proofs with background notation and numbering where necessary.<\/AC16> <AC17>We have included the statement of the result before the proofs to improve the reader experience.<\/AC17> <AC18>We also used color-coded references and links throughout the document for ease of navigation.<\/AC18>\n\n- W4 (experiments): Please see below.\n\n- W5 (familiarity with information-theoretic acquisitions): <AC19>We agree that there is limited discussion on information theoretic acquisition functions<\/AC19>, but <AC20>at the same time this is a very well studied topic in Machine Learning as well as traditional Statistics and experimental design.<\/AC20> <AC21>For the notation, we tried to compromise between being close to previous works, readability and smooth exposition.<\/AC21> <AC22>For the algorithm we present standard mathematical pseudo-code<\/AC22> and <AC23>will make Python code available.<\/AC23>\n\n- W6 (acronyms use): <AC24>We agree that we deviated from using PESMO, MESMO etc and opted for notation such as PES, MES for simplicity.<\/AC24> <AC25>We have now added a mention at the end of section 2 to alert the reader on this.<\/AC25>\n\nApproximations\n\n- Q1 (dealing with 0 variance assumptions): This has been discussed in W1 above.\n\nWriting and presentation\n\n- Q1-4: <AC26>We have followed most suggestions from the reviewer<\/AC26> - thanks for the feedback. <AC27>In the Appendix we have added the statements proposition and lemmas before the proof and repeated the necessary equations with numbers.<\/AC27>\n\n- Q5 ($f(x) \\preceq Y^*$ notation): <AC28>We have included a definition on the partial ordering relation on sets in the paragraph on Pareto domination in Section 2.<\/AC28>\n\n- Q6 (pseudo-code): <AC29>The algorithm is valid for both the single-objective and multi-objective setting<\/AC29> as <AC30>$f$ can be a random vector-valued function with M components.<\/AC30> <AC31>This is registered at the beginning of Section 2.<\/AC31>\n\nExperiments\n\n- Q1 (batch sizes): <AC32>This is a fair point.<\/AC32> <AC33>We note that the batch case was meant as an extension<\/AC33> and <AC34>had we had more time would have tested additional batch sizes.<\/AC34>\n\n- Q2 (experiments): <AC35>We believe we have a variety of cases with different dimensions and number of objective.<\/AC35> <AC36>More synthetic examples would indeed be useful<\/AC36> but <AC37>we preferred to focus more on standard benchmarks and more challenging problems.<\/AC37>\n\n- Q3 (noise choice for different examples): <AC38>The choice was based on what noise level we felt could potentially be more realistic in practice based on the context of the application.<\/AC38> <AC39>In numerical work not presented we did experiment with different noise levels<\/AC39> and <AC40>the results were rather similar.<\/AC40>\n\n- Q4 (on Figure 13): <AC41>The point here is all methods perform very similarly to the hypervolume criterion even when the number of Monte Carlo samples S varies<\/AC41> and <AC42>believe both ways of plotting will achieve this.<\/AC42> <AC43>Here we were more interested to check how each method performs with S separately.<\/AC43> <AC44>Since all plots are in the same scale so we believe that comparisons between methods are also possible here<\/AC44> but <AC45>differences are marginal.<\/AC45>\n- Q5 (Reference Konakovic Lukovic et al. 2020): Many thanks for pointing this out, <AC46>we have now added this reference.<\/AC46> <AC47>All the algorithms used in our comparison were implemented using the same set of python libraries for both the modelling and acquisition.<\/AC47> <AC48>The DGEMO implementation uses different dependencies<\/AC48>, <AC49>which we believe will result in an unfair comparison.<\/AC49> Nevertheless, <AC50>a recent benchmark by Daulton et al (2021) showed that DGEMO has comparable or weaker performance on the standard hypervolume compared to qNEHVI and qNParEGO, which we did compare with.<\/AC50>\n\n- Q6 (error bars): <AC51>We have now restructured the plots and added error bars everywhere.<\/AC51>\n\n- Q7 (performance): <AC52>In the many of the test cases our method was among the best performers in terms of the standard hypervolume.<\/AC52> <AC53>The few cases where this did not occur (e.g. Penicillin example) was when specific parts of the Pareto frontier were isolated.<\/AC53> <AC54>The improvements the method offers are indeed marginal<\/AC54>, but <AC55>this is over many methods and on a variety of problems that had received significant attention in the past.<\/AC55>\n\n- Q8 (Penicillin): <AC56>The Penicillin objective function is obtained by solving a set of differential equations using a discretization scheme.<\/AC56> As a result, <AC57>the change in the hypervolume of the proposed points varies in a noisy manner.<\/AC57>\n\n- Q9 (si
